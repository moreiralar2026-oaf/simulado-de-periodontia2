abetes Mellitus (A e B) são fatores de risco e modificadores importantes da progressão da doença, mas não são o principal fator etiológico iniciador da inflamação.\n- Trauma oclusal (D) e fatores genéticos (E) podem ser contribuintes ou moduladores, mas o biofilme é o agente primário.\nDica: A compreensão de que o biofilme é o principal fator etiológico é fundamental para toda a periodontia, pois direciona as estratégias de prevenção e tratamento para o controle mecânico e químico da placa bacteriana."}, {"enunciado": "10. Por que o tabagismo é considerado um modificador de Grau C na classificação de periodontite, de acordo com o texto?", "alternativas": {"A": "Porque aumenta a profundidade de sondagem.", "B": "Porque causa recessão gengival.", "C": "Porque compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque leva à perda de dentes.", "E": "Porque dificulta a realização da higiene oral."}, "gabarito": "C", "comentario": "O texto explica: \"Q8. Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\"\n- As alternativas A, B, D e E descrevem consequências ou associações do tabagismo com a doença periodontal, mas não explicam o mecanismo pelo qual ele modifica o Grau da doença. O impacto na resposta imune, na progressão da destruição e na resposta ao tratamento é o cerne da classificação como Grau C.\nDica: Fatores de risco como tabagismo e diabetes são cruciais na classificação de periodontite, especialmente no Grau. Entender os mecanismos biológicos pelos quais esses fatores afetam a doença é importante para um diagnóstico preciso e um plano de tratamento eficaz."}, {"enunciado": "1. De acordo com o texto, qual é a principal diferença entre Gengivite e Periodontite, conforme a classificação atual?", "alternativas": {"A": "A gengivite apresenta sangramento à sondagem, enquanto a periodontite não.", "B": "A periodontite é uma inflamação restrita à gengiva, enquanto a gengivite envolve perda óssea.", "C": "A periodontite é reversível, enquanto a gengivite não.", "D": "A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite, ausentes na gengivite.", "E": "A gengivite sempre apresenta PS > 3 mm, enquanto a periodontite sempre apresenta PS ≤ 3 mm."}, "gabarito": "D", "comentario": "A questão Q2 do \"Quiz de Verificação\" no texto afirma claramente que a principal diferença entre gengivite e periodontite é \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" As demais alternativas apresentam informações incorretas ou incompletas sobre a distinção entre as duas condições."}, {"enunciado": "2. Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e com DM tipo 2 controlado (HbA1c 6,5%), apresenta gengiva edemaciada, sangramento à sondagem generalizado, PS de 4–5 mm em vários sítios, NIC de 3–4 mm em 40% dos sítios, perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário) e mobilidade Grau 1 em incisivos inferiores. Segundo o texto, qual seria o diagnóstico mais adequado para este paciente?", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada.", "B": "Periodontite Estágio II, Grau B, Generalizada.", "C": "Periodontite Estágio III, Grau C, Generalizada.", "D": "Periodontite Estágio IV, Grau C, Generalizada.", "E": "Periodontite Estágio I, Grau A, Localizada."}, "gabarito": "B", "comentario": "Este caso clínico é idêntico ao \"Caso 2\" apresentado no texto. O diagnóstico fornecido para este caso é \"Periodontite Estágio II, Grau B, Generalizada\". O Estágio II é justificado pela perda de inserção clínica (NIC 3-4 mm) e perda óssea no terço coronário. O Grau B é justificado pelo tabagismo moderado (5 cigarros/dia) e DM controlado, que não chegam a caracterizar um Grau C (que seria para tabagismo ≥ 10 cigarros/dia ou DM descompensado). A periodontite é generalizada devido ao acometimento em 40% dos sítios."}, {"enunciado": "3. Qual é o ângulo recomendado da cureta em relação à superfície radicular durante o movimento de raspagem para uma remoção eficaz do cálculo e prevenção de trauma, conforme o texto?", "alternativas": {"A": "Menor que 45°.", "B": "Entre 45° e 60°.", "C": "Entre 70° e 80°.", "D": "Maior que 90°.", "E": "Qualquer ângulo, desde que o instrumento esteja afiado."}, "gabarito": "C", "comentario": "A questão Q7 do \"Quiz de Verificação\" no texto afirma que o ângulo recomendado da cureta durante o movimento de raspagem é \"70° a 80° entre a face interna da lâmina e a superfície radicular.\" O texto também alerta que \"< 45° = raspagem ineficaz (desliza sem cortar)\" e \"> 90° = trauma tecidual.\""}, {"enunciado": "4. De acordo com o \"Glossário Essencial de Periodontia\", o que define o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "A distância em mm da margem gengival até o fundo da bolsa/sulco.", "B": "A distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco.", "C": "?", "D": "O deslocamento apical da margem gengival em relação à JEC.", "E": "A profundidade horizontal da furca em dentes multirradiculares."}, "gabarito": "B", "comentario": "No \"Glossário Essencial de Periodontia\", a definição de NIC é: \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" As outras alternativas descrevem PS (A), SS (C), Recessão Gengival (D) e Furca (E)."}, {"enunciado": "5. Um paciente com 60 anos, DM tipo 2 descompensado (HbA1c 9%) e tabagista (20 cigarros/dia há 40 anos), apresenta perda de 6 dentes por doença periodontal, PS ≥ 6 mm em múltiplos sítios, NIC ≥ 5 mm em 80% dos sítios, perda óssea radiográfica avançada (além do 1/3 médio) e disfunção mastigatória (colapso de mordida). Qual o diagnóstico de Estágio e Grau mais provável, de acordo com o texto?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada.", "B": "Periodontite Estágio III, Grau C, Generalizada.", "C": "Periodontite Estágio IV, Grau C, Generalizada.", "D": "Periodontite Estágio I, Grau A, Generalizada.", "E": "Gengivite induzida por biofilme, generalizada."}, "gabarito": "C", "comentario": "Este caso é o \"Caso 3\" do texto. O diagnóstico fornecido é \"Periodontite Estágio IV, Grau C, Generalizada.\" O Estágio IV é justificado pela perda de dentes, perda óssea avançada, NIC ≥ 5 mm e, crucialmente, a presença de disfunção mastigatória (colapso de mordida). O Grau C é determinado pelo DM descompensado (HbA1c 9%) e tabagismo pesado (20 cigarros/dia há 40 anos), ambos fatores que aceleram a progressão da doença."}, {"enunciado": "6. Conforme o texto, quais são os dois eixos da classificação de periodontite de 2018?", "alternativas": {"A": "Gravidade e Reversibilidade.", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Localizada e Generalizada.", "D": "Inflamação e Destruição.", "E": "Presença de cálculo e profundidade de sondagem."}, "gabarito": "B", "comentario": "A questão Q3 do \"Quiz de Verificação\" no texto responde diretamente a esta pergunta: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\""}, {"enunciado": "7. Qual sonda é especificamente utilizada para detectar envolvimento de furca e como são classificadas as furcas, segundo o texto?", "alternativas": {"A": "Sonda Carolina do Norte; Classe I (< 3 mm), Classe II (≥ 3 mm, passante), Classe III (passante, túnel).", "B": "Sonda Williams; Classe I (< 3 mm), Classe II (≥ 3 mm, não passante), Classe III (passante, túnel).", "C": "Sonda Nabers; Classe I (< 3 mm), Classe II (≥ 3 mm, mas não passante), Classe III (passante, tunnel).", "D": "Sonda Goldman-Fox; Classe I (profunda), Classe II (média), Classe III (superficial).", "E": "Sonda Michigan O; Classe I (não visível), Classe II (parcialmente visível), Classe III (totalmente visível)."}, "gabarito": "C", "comentario": "A questão Q5 do \"Quiz de Verificação\" no texto aborda este tópico: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\""}, {"enunciado": "8. Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. De acordo com o texto, qual é o Estágio correto para este paciente?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Estágio indeterminado, faltam dados."}, "gabarito": "C", "comentario": "A questão Q6 do \"Quiz de Verificação\" no texto descreve exatamente este cenário e fornece a resposta: \"Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "9. Por que o tabagismo, especialmente em ≥ 10 cigarros/dia, é considerado um modificador de Grau C na classificação da periodontite de 2018, de acordo com o texto?", "alternativas": {"A": "Porque aumenta a produção de saliva, diluindo os agentes antimicrobianos.", "B": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "C": "Porque o tabagismo causa diretamente a formação de cálculo supragengival.", "D": "Porque eleva o risco de cárie radicular, contribuindo indiretamente para a perda óssea.", "E": "Porque o tabagismo está associado a uma menor incidência de sangramento gengival, mascarando a inflamação."}, "gabarito": "B", "comentario": "A questão Q8 do \"Quiz de Verificação\" no texto explica claramente: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" As outras alternativas são incorretas ou não justificam o Grau C."}, {"enunciado": "10. Qual a importância da afiação das curetas e foices na remoção do cálculo, conforme o texto?", "alternativas": {"A": "Instrumentos cegos removem o cálculo de forma mais suave, evitando dor.", "B": "Instrumentos afiados escorregam menos e polêm o cálculo, facilitando a adesão do biofilme.", "C": "A afiação é importante apenas para evitar o desgaste prematuro do instrumento.", "D": "Instrumentos cegos escorregam e polêm o cálculo, não o removem, enquanto os afiados removem de forma eficaz e sem trauma.", "E": "A afiação influencia apenas a estética do procedimento, não a eficácia da remoção."}, "gabarito": "D", "comentario": "Na seção \"7.2 Manutenção dos Instrumentos\", o texto afirma: \"Afiação: Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" Esta frase resume a importância da afiação e descreve o problema dos instrumentos cegos."}, {"enunciado": "1. De acordo com o texto, qual é a principal diferença entre gengivite e periodontite?", "alternativas": {"A": "A periodontite apresenta sangramento gengival, enquanto a gengivite não.", "B": "A gengivite é uma inflamação que sempre leva à perda óssea, enquanto a periodontite não.", "C": "A periodontite é caracterizada pela presença de perda de inserção clínica (NIC) e perda óssea radiográfica, ausentes na gengivite.", "D": "A gengivite afeta apenas a gengiva inserida, enquanto a periodontite afeta a gengiva livre.", "E": "A periodontite é reversível com a remoção do biofilme, enquanto a gengivite não."}, "gabarito": "C", "comentario": "O texto afirma explicitamente que a principal diferença entre gengivite e periodontite é \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" As demais alternativas apresentam informações incorretas ou incompletas sobre a distinção entre as duas condições. A gengivite é reversível, ao contrário da periodontite, que causa perda de suporte irreversível."}, {"enunciado": "2. Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e com DM tipo 2 controlado (HbA1c 6,5%), apresenta gengiva edemaciada, sangramento à sondagem generalizado, PS 4–5 mm em vários sítios e NIC 3–4 mm em 40% dos sítios. Além disso, há perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário) e mobilidade Grau 1 em incisivos inferiores. Com base no texto, qual o diagnóstico e o prognóstico esperados para este paciente?", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada, com prognóstico excelente.", "B": "Periodontite Estágio II, Grau B, Generalizada, com prognóstico bom.", "C": "Periodontite Estágio III, Grau C, Generalizada, com prognóstico reservado.", "D": "Periodontite Estágio IV, Grau C, Generalizada, com prognóstico reservado.", "E": "Periodontite Estágio I, Grau A, Localizada, com prognóstico excelente."}, "gabarito": "B", "comentario": "O \"Caso 2\" descrito no texto corresponde exatamente a essa situação. O paciente apresenta Periodontite Estágio II (pelas medidas de PS e NIC, e perda óssea no 1/3 coronário), Grau B (tabagismo de 5 cigarros/dia e DM controlado, que se encaixam em Grau B, não C, que seria para tabagismo ≥ 10 cigarros/dia ou DM descompensado). O prognóstico para este caso é classificado como \"Bom, com controle da progressão e adesão à manutenção\"."}, {"enunciado": "3. Qual é o ângulo recomendado da cureta durante o movimento de raspagem para garantir a eficácia e evitar trauma tecidual, conforme descrito no texto?", "alternativas": {"A": "Menor que 45°.", "B": "Entre 45° e 60°.", "C": "Entre 70° e 80°.", "D": "Maior que 90°.", "E": "Qualquer ângulo é aceitável, desde que o cálculo seja removido."}, "gabarito": "C", "comentario": "O texto afirma: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" A alternativa C reflete precisamente essa recomendação."}, {"enunciado": "4. De acordo com o glossário, o Nível de Inserção Clínica (NIC) é a distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Qual é a principal função do NIC na avaliação periodontal?", "alternativas": {"A": "Indicar a presença de sangramento gengival.", "B": "Medir a profundidade da bolsa gengival.", "C": "é a distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Qual é a principal função do NIC na avaliação periodontal?", "D": "Determinar a mobilidade dentária.", "E": "Avaliar a quantidade de biofilme supragengival."}, "gabarito": "C", "comentario": "O glossário define NIC como \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" As outras opções descrevem outros parâmetros periodontais ou usos incorretos do NIC. O NIC é um marcador crucial da destruição tecidual e perda de inserção, sendo mais fidedigno que a Profundidade de Sondagem (PS) isoladamente, pois considera a posição da JEC."}, {"enunciado": "5. Um paciente com histórico de DM tipo 2 descompensado (HbA1c 9%) e tabagismo (20 cigarros/dia há 40 anos) apresenta perda de 6 dentes por doença periodontal, PS ≥ 6 mm em múltiplos sítios, NIC ≥ 5 mm em 80% dos sítios, perda óssea radiográfica avançada e disfunção mastigatória (colapso de mordida). Qual o diagnóstico de periodontite mais provável para este paciente, considerando a classificação de 2018?", "alternativas": {"A": "Gengivite induzida por biofilme.", "B": "Periodontite Estágio II, Grau B, Generalizada.", "C": "Periodontite Estágio III, Grau C, Generalizada.", "D": "Periodontite Estágio IV, Grau C, Generalizada.", "E": "Periodontite Estágio I, Grau A, Localizada."}, "gabarito": "D", "comentario": "Este cenário corresponde ao \"Caso 3\" do texto: \"Periodontite Estágio IV, Grau C, Generalizada\". O Estágio IV é indicado pela perda de dentes devido à doença periodontal, perda óssea radiográfica avançada, NIC ≥ 5 mm e disfunção mastigatória (colapso de mordida). O Grau C é justificado pelo tabagismo pesado (20 cigarros/dia) e DM descompensado (HbA1c 9%), que são fatores de risco que aceleram a progressão da doença."}, {"enunciado": "6. Qual das seguintes afirmações sobre a manutenção de instrumentos de raspagem está CORRETA, conforme o texto?", "alternativas": {"A": "Instrumentos cegos são preferíveis, pois causam menos trauma aos tecidos moles.", "B": "A afiação das curetas é opcional e não influencia a eficácia da remoção de cálculo.", "C": "A esterilização deve seguir rigorosamente os protocolos para evitar contaminação cruzada.", "D": "Foices são utilizadas apenas para remoção de cálculo subgengival.", "E": "A limpeza e desinfecção são suficientes, a esterilização em autoclave não é obrigatória para instrumentos periodontais."}, "gabarito": "C", "comentario": "O texto na seção \"7.2 Manutenção dos Instrumentos\" afirma: \"Afiação: Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem. Esterilização: Seguir rigorosamente os protocolos de limpeza, desinfecção e esterilização (autoclave) para evitar contaminação cruzada.\" Portanto, a alternativa C é a única que está de acordo com as informações fornecidas."}, {"enunciado": "7. O texto menciona que o GRAU na classificação de periodontite de 2018 descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Quais são os dois principais fatores que baseiam a determinação do Grau?", "alternativas": {"A": "Profundidade de sondagem e sangramento à sondagem.", "B": "Evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou fatores de risco modificadores (tabagismo, DM).", "C": "Nível de inserção clínica e perda óssea radiográfica.", "D": "Mobilidade dentária e envolvimento de furca.", "E": "Idade do paciente e histórico familiar de doença periodontal."}, "gabarito": "B", "comentario": "O texto afirma: \"O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM).\" A alternativa B resume esses dois pilares para a classificação do Grau."}, {"enunciado": "8. Qual sonda é especificamente utilizada para detectar envolvimento de furca e como são classificadas as furcas, de acordo com o texto?", "alternativas": {"A": "Sonda Carolina do Norte; Classe I (< 3 mm), Classe II (≥ 3 mm), Classe III (passante).", "B": "Sonda WHO; Classe I (não passante), Classe II (parcialmente passante), Classe III (totalmente passante).", "C": "Sonda Nabers; Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante), Classe III (passante, tunnel).", "D": "Sonda Williams; Classe I (até 1/3), Classe II (até 2/3), Classe III (totalmente envolvida).", "E": "Sonda Periodontal Padrão; Classe I (superficial), Classe II (média), Classe III (profunda)."}, "gabarito": "C", "comentario": "O texto no quiz (Q5) pergunta: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\" A alternativa C reproduz fielmente essa informação."}, {"enunciado": "9. Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio e mobilidade grau 2 em 3 dentes. Contudo, NÃO há perda dentária e NEM colapso de mordida. Com base no quiz do texto, qual o Estágio correto para este caso?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Gengivite."}, "gabarito": "C", "comentario": "O quiz (Q6) do texto descreve exatamente este cenário: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "Um paciente de 25 anos, sexo feminino, apresenta queixa de sangramento gengival ao escovar. O exame clínico revela gengiva edemaciada, eritematosa, com sangramento à sondagem generalizado (> 30% dos sítios). A profundidade de sondagem (PS) é ≤ 3 mm em todos os dentes e não há nível de inserção clínica (NIC) ausente. Radiograficamente, não há perda óssea. Qual o diagnóstico periodontal mais adequado para este caso?", "alternativas": {"A": "Periodontite Estágio I, Grau A, Generalizada.", "B": "Gengivite induzida por biofilme, generalizada.", "C": "ausente. Radiograficamente, não há perda óssea. Qual o diagnóstico periodontal mais adequado para este caso?", "D": "Periodontite Estágio IV, Grau C, Generalizada.", "E": "Periodontite associada a doença sistêmica."}, "gabarito": "B", "comentario": "A questão descreve um caso clássico de Gengivite induzida por biofilme. Os principais indicativos são: sangramento gengival, gengiva edemaciada e eritematosa, PS ≤ 3 mm e ausência de NIC e perda óssea radiográfica. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte periodontal, e é reversível. As alternativas A, C e D são incorretas porque envolvem o diagnóstico de periodontite, que se caracteriza pela presença de perda de inserção clínica (NIC) e/ou perda óssea radiográfica, ausentes neste caso. A alternativa E não se aplica, pois não há indícios de doença sistêmica como fator etiológico principal."}, {"enunciado": "De acordo com a classificação de periodontite de 2018, quais são os dois eixos principais que definem o diagnóstico da doença?", "alternativas": {"A": "Gravidade da inflamação e extensão da doença.", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Tipo de biofilme predominante e resposta imune do hospedeiro.", "D": "Presença de recessão gengival e profundidade das bolsas periodontais.", "E": "Idade do paciente e histórico familiar de doença periodontal."}, "gabarito": "B", "comentario": "O texto especifica claramente que \"Os dois eixos da classificação de periodontite de 2018 são Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco)\". Esta é a base da nova classificação. As outras alternativas descrevem características da doença periodontal, mas não os eixos fundamentais da classificação de 2018."}, {"enunciado": "Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e com diabetes mellitus tipo 2 controlado (HbA1c 6,5%), apresenta gengiva edemaciada e sangramento à sondagem generalizado. As profundidades de sondagem (PS) variam de 4-5 mm em vários sítios, e o nível de inserção clínica (NIC) é de 3-4 mm em 40% dos sítios. Há perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário) e mobilidade Grau 1 em incisivos inferiores. Qual o diagnóstico completo para este paciente, utilizando a classificação de 2018?", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada.", "B": "Periodontite Estágio I, Grau A, Localizada.", "C": "é de 3-4 mm em 40% dos sítios. Há perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário) e mobilidade Grau 1 em incisivos inferiores. Qual o diagnóstico completo para este paciente, utilizando a classificação de 2018?", "D": "Periodontite Estágio III, Grau C, Generalizada.", "E": "Periodontite Estágio IV, Grau C, Generalizada."}, "gabarito": "C", "comentario": "Analisando o caso:\n- **Periodontite**: Presença de NIC (3-4 mm) e perda óssea radiográfica.\n- **Estágio**: PS de 4-5 mm e NIC de 3-4 mm, além de perda óssea no 1/3 coronário, indicam Estágio II (NIC 3-4 mm, perda óssea no terço coronário). Estágio I seria NIC 1-2 mm. Estágios III e IV teriam NIC ≥ 5 mm e perda óssea mais avançada.\n- **Grau**: O paciente é tabagista (5 cigarros/dia) e diabético com DM controlado (HbA1c 6,5%). O tabagismo abaixo de 10 cigarros/dia e DM controlado são fatores que classificam o Grau como B. Tabagismo ≥ 10 cigarros/dia ou DM descompensado classificariam como Grau C.\n- **Extensão**: \"Sangramento à sondagem generalizado\" e \"PS 4-5 mm em vários sítios\" e \"NIC 3-4 mm em 40% dos sítios\" caracterizam a doença como Generalizada (≥ 30% dos sítios afetados).\nPortanto, o diagnóstico é Periodontite Estágio II, Grau B, Generalizada."}, {"enunciado": "Sobre a manutenção dos instrumentos periodontais, o texto ressalta a importância da afiação das curetas e foices. Qual a principal razão para manter esses instrumentos sempre afiados?", "alternativas": {"A": "Para prolongar a vida útil do instrumento, evitando a necessidade de substituição frequente.", "B": "Para reduzir o tempo de esterilização na autoclave, pois instrumentos afiados aquecem mais rápido.", "C": "Para remover o cálculo de forma eficaz e sem causar trauma, pois instrumentos cegos escorregam e polêm o cálculo.", "D": "Para diminuir o risco de contaminação cruzada, uma vez que superfícies afiadas são menos propensas ao acúmulo de biofilme.", "E": "Para melhorar a estética do instrumental, conferindo um aspecto mais profissional ao consultório."}, "gabarito": "C", "comentario": "O texto afirma explicitamente: \"Afiação: Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" As outras alternativas não correspondem à justificativa apresentada no texto para a afiação dos instrumentos."}, {"enunciado": "Qual é o ângulo recomendado da cureta em relação à superfície radicular durante o movimento de raspagem para uma remoção eficaz e segura do cálculo?", "alternativas": {"A": "Menor que 45°.", "B": "Entre 70° e 80°.", "C": "Exatamente 90°.", "D": "Maior que 90°.", "E": "O ângulo não é relevante, desde que haja pressão suficiente."}, "gabarito": "B", "comentario": "O texto informa que \"O ângulo recomendado da cureta durante o movimento de raspagem é de 70° a 80° entre a face interna da lâmina e a superfície radicular.\" Adicionalmente, explica as consequências de ângulos inadequados: \"< 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\""}, {"enunciado": "Um paciente de 60 anos, com história de DM tipo 2 descompensado (HbA1c 9%) e tabagismo (20 cigarros/dia há 40 anos), apresenta perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida). O exame clínico revela gengiva retraída, sangramento à sondagem, PS ≥ 6 mm em múltiplos sítios e NIC ≥ 5 mm em 80% dos sítios. Há perda óssea radiográfica avançada (além do 1/3 médio). Qual o diagnóstico de Estágio e Grau para este paciente?", "alternativas": {"A": "Estágio I, Grau A.", "B": "Estágio II, Grau B.", "C": "Estágio III, Grau C.", "D": "Estágio IV, Grau C.", "E": "Estágio IV, Grau A."}, "gabarito": "D", "comentario": "Analisando o caso:\n- **Estágio**: Presença de PS ≥ 6 mm, NIC ≥ 5 mm em 80% dos sítios, perda óssea avançada (além do 1/3 médio), perda de 6 dentes por DP e disfunção mastigatória (colapso de mordida) são critérios para Estágio IV. O Estágio IV é definido pela gravidade da perda de inserção, perda de dentes e, crucialmente, pela complexidade e disfunção mastigatória.\n- **Grau**: A combinação de DM tipo 2 descompensado (HbA1c 9%) e tabagismo pesado (20 cigarros/dia) são fortes indicadores de progressão rápida e alta complexidade, classificando o Grau como C. O texto menciona que tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C, e DM descompensado também é um fator para Grau C.\nPortanto, o diagnóstico é Periodontite Estágio IV, Grau C, Generalizada (embora a generalização não seja pedida no gabarito, os múltiplos sítios e 80% de sítios afetados indicam essa extensão)."}, {"enunciado": "Qual das seguintes afirmações descreve corretamente a principal diferença entre gengivite e periodontite?", "alternativas": {"A": "A gengivite envolve a presença de recessão gengival, enquanto a periodontite não.", "B": "A periodontite é caracterizada pela presença de perda de inserção clínica (NIC) e perda óssea radiográfica, enquanto a gengivite é uma inflamação restrita à gengiva, sem perda de suporte.", "C": "e perda óssea radiográfica, enquanto a gengivite é uma inflamação restrita à gengiva, sem perda de suporte.", "D": "A periodontite é reversível com a remoção do biofilme, enquanto a gengivite não.", "E": "A gengivite afeta apenas dentes anteriores, enquanto a periodontite afeta dentes posteriores."}, "gabarito": "B", "comentario": "O texto, na seção \"Quiz de Verificação\", responde diretamente a esta pergunta: \"Q2. Qual a principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" As outras alternativas estão incorretas ou não representam a principal diferença."}, {"enunciado": "O que define o \"Grau\" na classificação de periodontite de 2018?", "alternativas": {"A": "A gravidade da doença com base na profundidade de sondagem e nível de inserção clínica.", "B": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseando-se em evidência direta de progressão ou fatores de risco modificadores.", "C": "O número de dentes perdidos devido à doença periodontal.", "D": "A presença ou ausência de envolvimento de furca.", "E": "A extensão da doença (localizada ou generalizada)."}, "gabarito": "B", "comentario": "O texto, na seção \"Quiz de Verificação\", detalha a definição do Grau: \"Q4. O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\" As outras alternativas descrevem aspectos do Estágio ou outras características da doença, mas não o Grau."}, {"enunciado": "Qual sonda é especificamente utilizada para detectar o envolvimento de furca em dentes multirradiculares?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda Nabers.", "D": "Sonda Goldman-Fox.", "E": "Sonda PCP-15."}, "gabarito": "C", "comentario": "O texto, na seção \"Quiz de Verificação\", afirma: \"Q5. Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\" As outras sondas listadas são sondas periodontais comuns para medição de profundidade de sondagem e NIC, mas não são as específicas para furca."}, {"enunciado": "O que representa o Nível de Inserção Clínica (NIC) em Periodontia e qual sua importância?", "alternativas": {"A": "A distância da margem gengival até o fundo da bolsa, sendo o principal indicador de inflamação.", "B": "A distância da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco, sendo a medida de referência para quantificar a perda de suporte periodontal.", "C": "em Periodontia e qual sua importância?", "D": "O grau de mobilidade dentária, indicando a estabilidade do dente no alvéolo.", "E": "A distância da margem gengival até a JEC, indicando a presença de recessão gengival."}, "gabarito": "B", "comentario": "O \"Glossário Essencial de Periodontia\" define NIC como: \"NIC — Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" As outras alternativas descrevem outros parâmetros periodontais ou definições incorretas. O NIC é crucial por ser uma medida fixa e confiável da perda de suporte, independentemente da posição da margem gengival (que pode variar com hiperplasia ou recessão)."}, {"enunciado": "1. De acordo com a Apostila de Periodontia, o periodonto é dividido em duas grandes unidades funcionais. Qual das alternativas a seguir apresenta corretamente os componentes do periodonto de proteção?", "alternativas": {"A": "Cemento radicular, ligamento periodontal e osso alveolar.", "B": "Gengiva livre, gengiva inserida e osso alveolar.", "C": "Gengiva livre, gengiva inserida e gengiva interdental.", "D": "Ligamento periodontal, gengiva interdental e cemento radicular.", "E": "Osso alveolar, gengiva inserida e gengiva livre."}, "gabarito": "C", "comentario": "O texto claramente divide o periodonto em \"Periodonto de Proteção\" e \"Periodonto de Sustentação\". Na seção \"1.1 Divisões Funcionais\", o periodonto de proteção é listado como Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As demais alternativas misturam componentes das duas divisões funcionais ou omitem partes do periodonto de proteção.\nDica: Memorizar a função de cada divisão ajuda a fixar seus componentes. O periodonto de proteção atua como barreira, enquanto o de sustentação ancora o dente."}, {"enunciado": "2. Um paciente apresenta gengiva com cor rosa-coral, consistência firme, contorno festonado e sulco gengival de 2 mm. O sangramento à sondagem ocorre em 8% dos sítios. Não há perda de inserção clínica nem perda óssea radiográfica. Com base nesses dados, qual o diagnóstico mais adequado segundo a Apostila de Periodontia?", "alternativas": {"A": "Gengivite induzida por biofilme.", "B": "Periodontite Estágio I.", "C": "Saúde Periodontal.", "D": "Doença Necrosante.", "E": "Periodontite Estágio II."}, "gabarito": "C", "comentario": "A seção \"2.1 Sequência Lógica de Progressão\" descreve a Saúde Periodontal como: \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" Os dados do paciente (sulco de 2 mm, SS em 8% dos sítios, sem perda de inserção ou óssea) se encaixam perfeitamente na definição de Saúde Periodontal. A gengivite exige SS em ≥ 10% dos sítios. Periodontite envolve perda de inserção e perda óssea. Doenças necrosantes têm características mais severas.\nDica: Fique atento aos critérios quantitativos (percentual de sangramento, profundidade de sulco/bolsa, etc.) para diferenciar saúde de doença."}, {"enunciado": "3. Qual dos marcos anatômicos cruciais é utilizado como ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar.", "B": "Fundo da Bolsa.", "C": "?", "D": "Junção Esmalte-Cemento (JEC).", "E": "Margem Gengival."}, "gabarito": "D", "comentario": "A tabela \"1.2 Marcos Anatômicos Cruciais para o Diagnóstico\" lista a \"Junção Esmalte-Cemento\" (JEC) como a definição para \"Ponto de referência para medir o NIC\". A crista alveolar é relevante para a perda óssea, o fundo da bolsa para a profundidade de sondagem e a furca para seu envolvimento. A margem gengival é um ponto de referência variável, não fixo, para o NIC.\nDica: A JEC é um ponto de referência estável no dente, por isso é ideal para medir a perda de inserção tecidual ao longo do tempo."}, {"enunciado": "4. Segundo a Classificação 2018 para periodontite, o que o \"Grau\" da doença descreve?", "alternativas": {"A": "A gravidade da destruição tecidual já ocorrida.", "B": "A complexidade do tratamento necessário.", "C": "A velocidade de progressão e os fatores de risco que a modificam.", "D": "O número de dentes perdidos devido à periodontite.", "E": "A localização da doença (localizada ou generalizada)."}, "gabarito": "C", "comentario": "A seção \"3.1 A Lógica da Classificação\" afirma que o ESTÁGIO \"Descreve a gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário\", enquanto o GRAU \"Descreve a velocidade de progressão e os fatores de risco que podem modificar essa velocidade (tabagismo, diabetes)\".\nDica: Lembre-se da analogia \"Grau = O Velocímetro da Doença\" para fixar que ele se refere à velocidade de progressão."}, {"enunciado": "5. Um paciente apresenta perda de inserção clínica (NIC) de 5 mm, perda óssea radiográfica além do terço médio da raiz, profundidade de sondagem (PS) de 6 mm e envolvimento de furca Classe II. Ele não apresenta disfunção mastigatória. De acordo com a Classificação 2018, qual o Estágio da Periodontite desse paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 5 mm, perda óssea radiográfica além do terço médio da raiz, profundidade de sondagem (PS) de 6 mm e envolvimento de furca Classe II. Ele não apresenta disfunção mastigatória. De acordo com a Classificação 2018, qual o Estágio da Periodontite desse paciente?", "D": "Estágio IV", "E": "Não é possível determinar o Estágio sem o Grau."}, "gabarito": "C", "comentario": "A tabela \"3.3 Tabela de Sinais Clínicos por Estágio\" indica que o Estágio III é caracterizado por NIC ≥ 5 mm, perda óssea além do 1/3 médio e PS ≥ 6 mm. O envolvimento de furca Classe II/III também se encaixa no Estágio III. A ausência de disfunção mastigatória é crucial, pois se houvesse, seria Estágio IV, independentemente do NIC, conforme o \"Macete\" fornecido.\nDica: Preste atenção aos critérios mais severos. Se qualquer um dos critérios para um estágio mais avançado for atingido, a doença é classificada naquele estágio, desde que os critérios para o estágio seguinte não sejam preenchidos (como a disfunção mastigatória para o Estágio IV)."}, {"enunciado": "6. Qual o principal diferencial crítico entre Gengivite e Periodontite, segundo o texto?", "alternativas": {"A": "A presença de sangramento à sondagem.", "B": "A profundidade de sondagem aumentada.", "C": "A presença de perda de inserção clínica e perda óssea radiográfica.", "D": "A reversibilidade total com higiene oral.", "E": "A cor e o contorno da gengiva."}, "gabarito": "C", "comentario": "A seção \"2.2 Diferencial Crítico: Gengivite × Periodontite\" apresenta uma tabela. Para \"Perda de Inserção (NIC)\", a Gengivite é \"Ausente\" e a Periodontite é \"Presente (≥ 1 mm)\". Para \"Perda Óssea Radiográfica\", a Gengivite é \"Ausente\" e a Periodontite é \"Presente\". O texto ainda reforça no final da seção: \"ERRO FREQUENTE: Confundir profundidade de sondagem aumentada com perda de inserção. Sem perda de NIC confirmada radiograficamente, o diagnóstico é GENGIVITE, não periodontite.\" Sangramento à sondagem está presente em ambas. Profundidade de sondagem aumentada sem NIC é gengivite. Reversibilidade total é da gengivite. Cor e contorno indicam inflamação, mas não diferenciam as duas.\nDica: O NIC e a perda óssea radiográfica são os \"marcadores ouro\" para diferenciar periodontite de gengivite."}, {"enunciado": "7. Sobre a sonda periodontal Carolina do Norte (UNC 15), qual sua principal característica e indicação, conforme o texto?", "alternativas": {"A": "Esfera na ponta, usada para triagem epidemiológica (CPITN).", "B": "Curva, sem marcações agudas, usada para avaliação de furca.", "C": "Milimetrada a cada mm, total 15 mm, usada para medir PS e NIC.", "D": "Milimetrada a cada 3 mm, usada para avaliação de mobilidade.", "E": "Reta e sem marcações, usada para remoção de cálculos."}, "gabarito": "C", "comentario": "A tabela \"5.1 Sondas Periodontais: Quando Usar Cada Uma?\" descreve a \"Carolina do Norte (UNC 15)\" como \"Milimetrada a cada mm, total 15 mm\" e sua \"Indicação Principal\" é \"Medição de PS e NIC — padrão clínico\". As outras alternativas descrevem outras sondas (OMS, Nabers) ou características incorretas.\nDica: Associe cada sonda à sua função principal. A UNC 15 é a sonda de referência para o diagnóstico periodontal detalhado."}, {"enunciado": "8. Qual a cureta Gracey correta para raspagem das faces DISTAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A seção \"5.2 Curetas Gracey: Mapa de Uso\" e o \"ERRO CLÁSSICO\" destacam que a \"Gracey 13/14\" é a indicada para \"Posteriores\" nas \"Faces DISTAIS\". O macete \"13/14 → Distal\" reforça essa informação. As outras curetas Gracey listadas são para outras regiões ou faces.\nDica: O macete \"M de 11 = Mesial\" (Gracey 11/12) e \"D de 14 = Distal\" (Gracey 13/14) é excelente para lembrar a função das curetas de posteriores."}, {"enunciado": "9. Durante a técnica de Raspagem e Alisamento Radicular (RAR), qual a angulação ideal da lâmina da cureta em relação à superfície radicular ao atingir o fundo da bolsa?", "alternativas": {"A": "0° (fechado)", "B": "Entre 15° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90°"}, "gabarito": "D", "comentario": "Na seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\", no passo \"2. Posicionamento\", é indicado: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\" A angulação de 0° é para a adaptação e inserção.\nDica: Entender que a angulação correta é um equilíbrio entre eficácia de raspagem e prevenção de trauma é fundamental."}, {"enunciado": "10. Segundo a Apostila, qual a pressão de sondagem recomendada para o periograma completo?", "alternativas": {"A": "0,10 N", "B": "0,25 N", "C": "0,50 N", "D": "1,00 N", "E": "2,00 N"}, "gabarito": "B", "comentario": "Na seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", no item \"4. Periograma Completo (Sondagem Periodontal)\", é explicitamente mencionado: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\"\nDica: Valores numéricos específicos como este são frequentemente cobrados em concursos, pois indicam conhecimento técnico preciso."}, {"enunciado": "11. Qual das seguintes condições NÃO é considerada um fator de risco para a periodontite, de acordo com as informações sobre o Grau da Classificação 2018?", "alternativas": {"A": "Tabagismo ≥ 10 cigarros/dia.", "B": "Diabetes Mellitus descompensado (HbA1c < 7%).", "C": "Perda óssea > 2 mm/ano.", "D": "Tabagismo < 10 cigarros/dia.", "E": "Diabetes Mellitus descompensado (HbA1c ≥ 7%)."}, "gabarito": "B", "comentario": "Na seção \"3.2 Analogias para Memorizar\", sob \"Grau = 'O Velocímetro da Doença'\", o Grau B (progressão moderada) menciona \"Pode haver tabagismo < 10 cigarros/dia ou HbA1c < 7%\". O Grau C (progressão rápida) menciona \"Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" Portanto, HbA1c < 7% é um fator de risco, mas para um Grau B, não sendo considerado \"descompensado\" no contexto de Grau C. HbA1c < 7% é um indicativo de controle, não descompensação.\nDica: Observe a diferença sutil nos percentuais e nos termos \"compensado\" vs. \"descompensado\" para o diabetes."}, {"enunciado": "12. Um paciente apresenta periodontite com NIC ≥ 5 mm e perda óssea radiográfica além do terço médio. Durante o exame, o dentista observa colapso de mordida e migrações dentárias, caracterizando disfunção mastigatória. De acordo com o \"Macete\" da Apostila, qual o Estágio da Periodontite deste paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar o Estágio apenas com essas informações."}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"3.3 Tabela de Sinais Clínicos por Estágio\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" A presença de disfunção mastigatória é o critério definidor do Estágio IV.\nDica: Fique atento aos \"macetes\" e \"dicas de prova\", pois eles geralmente apontam para pontos cruciais e diferenciadores no diagnóstico."}, {"enunciado": "13. Qual o objetivo da Raspagem e Alisamento Radicular (RAR), conforme descrito no texto?", "alternativas": {"A": "Remover apenas o biofilme supragengival.", "B": "Alisar a superfície radicular para facilitar a adesão bacteriana.", "C": "Remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular.", "D": "Promover o crescimento de novo cemento radicular.", "E": "Realizar a remoção de tecido gengival inflamado."}, "gabarito": "C", "comentario": "A seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\" afirma que a RAR tem \"dois objetivos complementares: remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\".\nDica: A RAR não visa apenas remover o que está \"grudado\" (cálculo e biofilme), mas também a tornar a superfície desfavorável à recolonização bacteriana, o que é essencial para o sucesso do tratamento."}, {"enunciado": "14. Qual a função principal do ligamento periodontal (LP)?", "alternativas": {"A": "Barreira física contra micro-organismos.", "B": "Ancorar o dente ao osso e absorver forças mastigatórias.", "C": "Renovar constantemente a gengiva.", "D": "Promover o pontilhado na superfície gengival.", "E": "Formar o cemento radicular."}, "gabarito": "B", "comentario": "Na seção \"1.1 Divisões Funcionais\", sob \"Periodonto de Sustentação\", a função do ligamento periodontal (LP) é descrita como: \"ancorar o dente ao osso e absorver forças mastigatórias.\" As outras opções descrevem funções de outras estruturas do periodonto ou são incorretas.\nDica: Lembre-se que o LP é um tecido conjuntivo fibroso que conecta o cemento radicular ao osso alveolar, fundamental para a estabilidade do dente e sua capacidade de suportar cargas."}, {"enunciado": "15. De acordo com o texto, qual é a Regra de Ouro para o diagnóstico de periodontite?", "alternativas": {"A": "A presença de sangramento à sondagem em mais de 10% dos sítios.", "B": "A identificação de sulco gengival maior que 3 mm.", "C": "A confirmação de PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.", "D": "A detecção de halitose e dor intensa.", "E": "A presença de edema e eritema gengival."}, "gabarito": "C", "comentario": "A seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\" finaliza com a \"Regra de ouro\": \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\nDica: Essa \"Regra de Ouro\" é um ponto crítico para evitar diagnósticos errados, especialmente a confusão entre gengivite e periodontite."}, {"enunciado": "16. Qual o objetivo da comunicação com o paciente, segundo a Apostila, e qual a analogia utilizada para explicar o sangramento gengival?", "alternativas": {"A": "Apenas explicar a causa da doença; analogia do \"filme esbranquiçado\".", "B": "Obter adesão ao tratamento; analogia da \"mão que sangra ao lavar\".", "C": "Informar sobre os custos do tratamento; analogia do \"telhado da casa\".", "D": "Explicar a anatomia do periodonto; analogia do \"poste fincado no chão\".", "E": "Apenas motivar para a higiene oral; analogia do \"carro de corrida\"."}, "gabarito": "B", "comentario": "A seção \"6. Comunicação com o Paciente\" inicia afirmando que \"A adesão ao tratamento depende diretamente da qualidade da comunicação\". No subtítulo \"Por que a gengiva sangra?\", a analogia utilizada é: \"Pense assim: se sua mão sangrasse toda vez que você a lavasse, você se preocuparia, certo? O sangramento é um sinal de que as gengivas estão inflamadas — é o corpo pedindo socorro.\"\nDica: A comunicação eficaz é um pilar do sucesso terapêutico, e o uso de analogias simples e impactantes ajuda o paciente a compreender a gravidade e a importância do tratamento."}, {"enunciado": "17. Qual das seguintes curetas manuais é indicada para remoção de cálculo supragengival volumoso antes da Raspagem e Alisamento Radicular (RAR)?", "alternativas": {"A": "Cureta Gracey 13/14.", "B": "Sonda Nabers.", "C": "Cureta McCall 13/14 (universal).", "D": "Sonda Carolina do Norte (UNC 15).", "E": "Cureta Gracey 11/12."}, "gabarito": "C", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", é mencionado: \"McCall 13/14 e 17/18: Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\" As Gracey são para RAR subgengival, e as sondas são para diagnóstico.\nDica: Instrumentos universais como a McCall são ótimos para a fase inicial do debridamento, lidando com depósitos maiores antes de refinar com as curetas Gracey."}, {"enunciado": "18. Em um periograma completo, quais sítios devem ser coletados por dente?", "alternativas": {"A": "Apenas vestibular e lingual.", "B": "Mesial, distal e oclusal.", "C": "MV, V, DV, DP, P, MP (Mesio-Vestibular, Vestibular, Disto-Vestibular, Disto-Palatino/Lingual, Palatino/Lingual, Mesio-Palatino/Lingual).", "D": "Apenas os sítios que sangram à sondagem.", "E": "Apenas os sítios com profundidade de sondagem maior que 3 mm."}, "gabarito": "C", "comentario": "A seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", no item \"4. Periograma Completo (Sondagem Periodontal)\", especifica: \"Colete em 6 sítios por dente (MV, V, DV, DP, P, MP)\".\nDica: A coleta em 6 sítios é o padrão ouro para um exame periodontal completo, garantindo que todas as superfícies importantes sejam avaliadas."}, {"enunciado": "19. Segundo o texto, qual a importância clínica da Crista Alveolar como marco anatômico?", "alternativas": {"A": "Ponto de referência para medir o NIC.", "B": "Limite apical da bolsa/sulco.", "C": "Sua reabsorção indica doença periodontal.", "D": "Bifurcação/trifurcação das raízes.", "E": "Ponto distal da medida de PS."}, "gabarito": "C", "comentario": "A tabela \"1.2 Marcos Anatômicos Cruciais para o Diagnóstico\" define a Crista Alveolar como a \"Borda superior do osso alveolar\" e sua \"Importância Clínica\" é: \"Normalmente 1–2 mm apical à JEC; sua reabsorção indica doença\".\nDica: A crista alveolar é o osso que suporta o dente, e sua perda é um sinal inequívoco de destruição periodontal."}, {"enunciado": "20. Qual a principal vantagem do uso do ultrassom (piezoelétrico/magnetoestritivo) em comparação com a instrumentação manual, conforme mencionado na Apostila?", "alternativas": {"A": "Feedback tátil aprimorado.", "B": "Menor aquecimento da superfície radicular.", "C": "Maior eficácia em bolsas rasas.", "D": "Menos fadiga do operador.", "E": "Não requer irrigação."}, "gabarito": "D", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", sobre o Ultrassom, é mencionado: \"Complementar ao manual. Eficaz em bolsas profundas. Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\"\nDica: Embora o ultrassom seja um excelente complemento, é importante lembrar de suas limitações, como o feedback tátil reduzido, que pode levar a um alisamento radicular menos preciso se não for complementado pela instrumentação manual."}, {"enunciado": "A posição correta do paciente para facilitar o acesso à boca durante procedimentos periodontais inclui:", "alternativas": {"A": "Pernas cruzadas e ombros tensos.", "B": "Cabeça inclinada para trás e pés suspensos.", "C": "Posição ereta, ombros relaxados e pés apoiados no chão.", "D": "Paciente totalmente deitado e braços cruzados.", "E": "Paciente sentado com as costas curvadas."}, "gabarito": "C", "comentario": "A alternativa C descreve a posição ideal do paciente, que facilita o trabalho do profissional e proporciona conforto ao paciente. Manter uma postura ereta, ombros relaxados e pés apoiados no chão contribui para a estabilidade e o acesso adequado à cavidade oral. As outras alternativas descrevem posições inadequadas que dificultam o acesso e podem causar desconforto."}, {"enunciado": "Qual a importância da afiação das curetas e foices na Periodontia?", "alternativas": {"A": "Instrumentos cegos removem o cálculo de forma mais eficaz.", "B": "Instrumentos afiados polêm o cálculo sem removê-lo.", "C": "Instrumentos afiados removem o cálculo eficazmente e minimizam o trauma.", "D": "A afiação é importante apenas para instrumentos cirúrgicos.", "E": "Instrumentos cegos previnem o escorregamento na superfície dental."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto afirma que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" A afiação adequada é crucial para a eficácia do tratamento e para a segurança do paciente."}, {"enunciado": "Um paciente de 25 anos, sexo feminino, apresenta sangramento gengival ao escovar, gengiva edemaciada e eritematosa, sangramento à sondagem generalizado (> 30% dos sítios), PS ≤ 3 mm em todos os dentes e NIC ausente. Ausência de perda óssea radiográfica. Qual o diagnóstico e prognóstico provável?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada; Prognóstico Reservado.", "B": "Gengivite induzida por biofilme, generalizada; Prognóstico Excelente.", "C": "Periodontite Estágio IV, Grau C, Generalizada; Prognóstico Bom.", "D": "Periodontite agressiva localizada; Prognóstico Ruim.", "E": "Periodontite crônica localizada; Prognóstico Reservado."}, "gabarito": "B", "comentario": "O caso clínico 1 descreve exatamente essa situação. A ausência de NIC e perda óssea radiográfica, juntamente com a inflamação gengival, são características de gengivite. O prognóstico é excelente, pois a gengivite é reversível com o controle do biofilme."}, {"enunciado": "Qual a principal diferença entre gengivite e periodontite, de acordo com o texto?", "alternativas": {"A": "A gengivite apresenta perda óssea, enquanto a periodontite não.", "B": "A periodontite é uma inflamação restrita à gengiva, enquanto a gengivite afeta o osso.", "C": "A periodontite envolve perda de inserção clínica (NIC) e perda óssea radiográfica, enquanto a gengivite não.", "D": "A gengivite é sempre dolorosa, e a periodontite é assintomática.", "E": "Ambas são reversíveis com higiene oral adequada."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q2) responde diretamente a esta questão: \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\""}, {"enunciado": "Quais são os dois eixos da classificação de periodontite de 2018?", "alternativas": {"A": "Gravidade e Reversibilidade.", "B": "Localização e Etiologia.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Idade e Histórico médico.", "E": "Tipo de biofilme e Resposta inflamatória."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q3) informa que os dois eixos da classificação de periodontite de 2018 são \"Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco)\"."}, {"enunciado": "O que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A extensão da perda óssea radiográfica.", "B": "O número de dentes perdidos devido à doença periodontal.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência de progressão ou fatores de risco modificadores.", "D": "A profundidade de sondagem e a presença de sangramento.", "E": "A presença de mobilidade dental."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q4) detalha que o Grau \"descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\""}, {"enunciado": "Qual sonda é utilizada especificamente para detectar envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda Nabers.", "D": "Sonda Perio.", "E": "Sonda PCP15."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q5) afirma que a \"Sonda Nabers\" é a utilizada para detectar envolvimento de furca. Sua curvatura é projetada para acessar o espaço interradicular."}, {"enunciado": "Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio da periodontite?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Estágio Indefinido."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q6) aborda um caso muito similar: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "Qual o ângulo recomendado da cureta durante o movimento de raspagem?", "alternativas": {"A": "Menor que 45°.", "B": "Exatamente 90°.", "C": "Entre 70° e 80°.", "D": "Maior que 90°.", "E": "Qualquer ângulo é aceitável, desde que o cálculo seja removido."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q7) especifica que o ângulo recomendado é \"70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\""}, {"enunciado": "Por que o tabagismo é um modificador de Grau C na classificação de periodontite?", "alternativas": {"A": "O tabaco causa recessão gengival.", "B": "O tabaco aumenta a formação de cálculo.", "C": "O tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "O tabaco altera a cor da gengiva, dificultando o diagnóstico.", "E": "O tabaco provoca mobilidade dental diretamente."}, "gabarito": "C", "comentario": "O Quiz de Verificação (Q8) explica que \"O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\""}, {"enunciado": "De acordo com o glossário, o que é o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "A distância da margem gengival até o fundo da bolsa/sulco.", "B": "A distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco.", "C": "?", "D": "A quantidade de osso alveolar remanescente.", "E": "A distância da cúspide até a JEC."}, "gabarito": "B", "comentario": "O glossário define NIC como: \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\""}, {"enunciado": "Qual a definição de Sangramento à Sondagem (SS) e qual sua importância como indicador?", "alternativas": {"A": "Sangramento que ocorre apenas após 5 segundos da sondagem, indicando saúde gengival.", "B": "Sangramento que ocorre até 30 segundos após a sondagem, indicando inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.", "C": "Sangramento espontâneo, sem sondagem, indicando periodontite avançada.", "D": "Qualquer sangramento durante a escovação, indicando recessão gengival.", "E": "Sangramento que ocorre apenas em dentes com mobilidade, indicando trauma."}, "gabarito": "B", "comentario": "O glossário define SS como: \"Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\""}, {"enunciado": "O que caracteriza uma Bolsa Periodontal, conforme o glossário?", "alternativas": {"A": "Um aprofundamento fisiológico do sulco gengival (até 3 mm).", "B": "Um aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "C": "Uma área de inflamação restrita à margem gengival.", "D": "Uma lesão de cárie subgengival.", "E": "Uma recessão gengival com exposição radicular."}, "gabarito": "B", "comentario": "O glossário define Bolsa Periodontal como: \"Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\""}, {"enunciado": "Um paciente apresenta movimentação horizontal de um dente de 1,5 mm. De acordo com o glossário, qual o Grau de Mobilidade Dental?", "alternativas": {"A": "Grau 0.", "B": "Grau 1.", "C": "Grau 2.", "D": "Grau 3.", "E": "Grau 4."}, "gabarito": "C", "comentario": "O glossário define Mobilidade Dental: \"Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\" Portanto, 1,5 mm é Grau 2."}, {"enunciado": "Qual a descrição correta de uma furca Classe III?", "alternativas": {"A": "Menos de 3 mm de profundidade horizontal.", "B": "Maior ou igual a 3 mm de profundidade horizontal, mas não passante.", "C": "Passante (\"túnel\").", "D": "Apenas visível radiograficamente.", "E": "Não é classificada em graus."}, "gabarito": "C", "comentario": "O glossário descreve as Furcas: \"Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\""}, {"enunciado": "A Terapia Periodontal Não Cirúrgica (TPNC) é composta por quais procedimentos da fase I?", "alternativas": {"A": "Cirurgias periodontais e reabilitação protética.", "B": "Apenas Raspagem e Alisamento Radicular (RAR).", "C": "é composta por quais procedimentos da fase I?", "D": "Extrações dentárias e implantes.", "E": "Somente profilaxia e aplicação de flúor."}, "gabarito": "C", "comentario": "O glossário define TPNC como: \"Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\""}, {"enunciado": "No Caso 2, o paciente é tabagista (5 cigarros/dia há 10 anos) e tem DM tipo 2 controlado (HbA1c 6,5%). Com base nessas informações e na classificação de Grau, o que esses fatores indicam?", "alternativas": {"A": "O tabagismo indica um Grau A (lenta progressão) e o DM um Grau C.", "B": "Ambos os fatores são de risco, mas não alteram o Grau.", "C": "O tabagismo (5 cigarros/dia) e o DM controlado são fatores que podem influenciar, mas não necessariamente levam a um Grau C, conforme o critério de 10 cigarros/dia para Grau C.", "D": "O tabagismo e o DM controlado automaticamente classificam a periodontite como Grau C.", "E": "Apenas o DM controlado é relevante para o Grau, e ele indica um Grau A."}, "gabarito": "C", "comentario": "O texto afirma no Quiz (Q8) que \"Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C\". Neste caso, o paciente fuma 5 cigarros/dia, o que o colocaria em Grau B. O DM tipo 2 controlado (HbA1c 6,5%) também é um fator de risco, mas não o suficiente para Grau C se bem controlado. Portanto, o tabagismo (5 cigarros/dia) e o DM controlado são fatores de risco, mas não atingem o limiar para Grau C explicitamente mencionado no texto para o tabagismo. O caso 2 é diagnosticado como Grau B, o que é consistente com o tabagismo moderado e DM controlado."}, {"enunciado": "No Caso 3, a paciente apresenta Periodontite Estágio IV, Grau C, Generalizada. Qual dos fatores abaixo contribui para a classificação como Grau C?", "alternativas": {"A": "Gengiva retraída.", "B": "PS ≥ 6 mm em múltiplos sítios.", "C": "DM tipo 2 descompensado (HbA1c 9%) e tabagismo (20 cigarros/dia há 40 anos).", "D": "Perda de 6 dentes por doença periodontal.", "E": "Disfunção mastigatória."}, "gabarito": "C", "comentario": "O Quiz (Q8) explica que o tabagismo (≥ 10 cigarros/dia) é um modificador de Grau C. O DM descompensado também é um fator de risco que acelera a progressão. Ambos contribuem para a classificação de Grau C. A perda de dentes e a disfunção mastigatória são critérios para o Estágio IV, não para o Grau C."}, {"enunciado": "A iluminação e o campo de visão adequados são essenciais em Periodontia. Para isso, o texto recomenda:", "alternativas": {"A": "Apenas luz ambiente, para evitar ofuscamento.", "B": "Uso de refletor e, se possível, lupas de aumento, com campo de visão direto ou indireto e sem sombras.", "C": "Apenas iluminação indireta, com uso exclusivo de espelho.", "D": "Campo de visão restrito ao dente a ser tratado, sem necessidade de visão geral.", "E": "Iluminação com luz UV para identificar biofilme."}, "gabarito": "B", "comentario": "O texto na seção \"Iluminação e Campo de Visão\" afirma: \"Use refletor e, se possível, lupas de aumento. O campo de visão deve ser direto ou indireto (com espelho) e sem sombras.\""}, {"enunciado": "Qual é o principal fator etiológico da gengivite e periodontite, de acordo com o glossário?", "alternativas": {"A": "Trauma oclusal.", "B": "Estresse.", "C": "Biofilme (Placa Dental).", "D": "Deficiências nutricionais.", "E": "Fatores genéticos."}, "gabarito": "C", "comentario": "O glossário define Biofilme (Placa Dental) como: \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\""}, {"enunciado": "De acordo com o texto, o periodonto é dividido em duas grandes unidades funcionais. Assinale a alternativa que apresenta corretamente essas duas divisões e suas respectivas funções.", "alternativas": {"A": "Periodonto de Proteção (ancorar o dente) e Periodonto de Sustentação (barreira física e imunológica).", "B": "Periodonto Marginal (absorver forças mastigatórias) e Periodonto Profundo (proteger contra microrganismos).", "C": "Periodonto de Proteção (barreira física e imunológica) e Periodonto de Sustentação (ancorar o dente e absorver forças mastigatórias).", "D": "Gengiva (ancorar o dente) e Ligamento Periodontal (barreira física e imunológica).", "E": "Cemento Radicular (barreira física) e Osso Alveolar (absorver forças mastigatórias)."}, "gabarito": "C", "comentario": "O texto claramente divide o periodonto em \"Periodonto de Proteção\" e \"Periodonto de Sustentação\". O Periodonto de Proteção tem como função principal a \"barreira física e imunológica contra micro-organismos\", enquanto o Periodonto de Sustentação tem a função de \"ancorar o dente ao osso e absorver forças mastigatórias\". As demais alternativas invertem as funções ou apresentam divisões incorretas.\nDica: Memorize as duas grandes divisões funcionais do periodonto e suas funções primárias, além dos tecidos que compõem cada uma."}, {"enunciado": "Um paciente apresenta sangramento à sondagem em 15% dos sítios, edema e eritema gengival, mas sem evidência de perda de inserção clínica (NIC) ou perda óssea radiográfica. De acordo com o texto, qual o diagnóstico mais provável para este paciente?", "alternativas": {"A": "Saúde Periodontal", "B": "Periodontite Estágio I", "C": "ou perda óssea radiográfica. De acordo com o texto, qual o diagnóstico mais provável para este paciente?", "D": "Doença Necrosante", "E": "Periodontite Estágio IV"}, "gabarito": "C", "comentario": "O texto define Gengivite Induzida por Biofilme como \"inflamação restrita à gengiva marginal. Presença de SS (≥ 10% dos sítios), edema e eritema. Ausência de perda de inserção (NIC) ou perda óssea radiográfica. REVERSÍVEL com remoção do biofilme.\" Os dados do caso clínico se encaixam perfeitamente nesta descrição. A Saúde Periodontal não apresenta sangramento ≥ 10% dos sítios. Periodontite e Doenças Necrosantes envolvem perda de inserção e/ou perda óssea.\nDica: O diferencial crucial entre gengivite e periodontite é a presença ou ausência de perda de inserção clínica e perda óssea radiográfica. Gengivite é sempre reversível com a remoção do biofilme."}, {"enunciado": "Qual dos seguintes marcos anatômicos é utilizado como ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Furca", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "A tabela \"Marcos Anatômicos Cruciais para o Diagnóstico\" na seção 1.2 do texto especifica que a Junção Esmalte-Cemento (JEC) é o \"Ponto de referência para medir o NIC\". As outras opções são marcos importantes, mas não o ponto de referência direto para o NIC.\nDica: A JEC é um ponto fixo no dente, o que a torna um excelente ponto de referência para medir a perda ou ganho de inserção tecidual ao longo do tempo, fundamental para o diagnóstico e monitoramento da doença periodontal."}, {"enunciado": "A nova classificação de doenças periodontais (2018) organiza a periodontite em dois eixos independentes e complementares. Quais são esses eixos e o que eles descrevem?", "alternativas": {"A": "Tipo (crônica ou agressiva) e Localização (localizada ou generalizada).", "B": "Estágio (gravidade e complexidade do tratamento) e Grau (velocidade de progressão e fatores de risco).", "C": "Severidade (leve, moderada, grave) e Atividade (ativa ou quiescente).", "D": "Extensão (número de dentes afetados) e Etiologia (induzida por biofilme ou não induzida).", "E": "Profundidade de Sondagem (sulco ou bolsa) e Perda Óssea (horizontal ou vertical)."}, "gabarito": "B", "comentario": "O texto, na seção 3.1, afirma que a nova classificação \"organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) – Descreve a gravidade... e a complexidade do tratamento necessário. GRAU (A, B, C) – Descreve a velocidade de progressão e os fatores de risco...\". As demais alternativas referem-se a classificações antigas, características da doença, ou não são os eixos principais da classificação de 2018.\nDica: Entender a diferença entre Estágio e Grau é fundamental para a nova classificação. O Estágio olha para o passado (dano já causado e complexidade do reparo), enquanto o Grau olha para o presente e futuro (taxa de progressão e risco)."}, {"enunciado": "Um paciente apresenta Nível de Inserção Clínica (NIC) de 5 mm, Profundidade de Sondagem (PS) de 6 mm e envolvimento de furca Classe II. De acordo com a tabela de sinais clínicos por estágio do texto, qual o estágio da doença periodontal deste paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 5 mm, Profundidade de Sondagem (PS) de 6 mm e envolvimento de furca Classe II. De acordo com a tabela de sinais clínicos por estágio do texto, qual o estágio da doença periodontal deste paciente?", "D": "Estágio IV", "E": "Não é possível determinar com os dados fornecidos."}, "gabarito": "C", "comentario": "Conforme a tabela \"Tabela de Sinais Clínicos por Estágio\" na seção 3.3, um NIC ≥ 5 mm, PS ≥ 6 mm e envolvimento de furca Classe II/III são características do Estágio III. O Estágio IV também tem NIC ≥ 5 mm e PS ≥ 6 mm, mas é obrigatoriamente acompanhado de disfunção mastigatória, que não foi mencionada no enunciado.\nDica: A disfunção mastigatória é o \"macete\" para identificar o Estágio IV. Na ausência dessa informação, e com os outros critérios, Estágio III é o mais provável."}, {"enunciado": "Qual das seguintes sondas periodontais é a \"padrão clínico\" para medição de PS e NIC, segundo o texto?", "alternativas": {"A": "Sonda OMS (WHO / CPITN)", "B": "Sonda Nabers", "C": "Sonda Carolina do Norte (UNC 15)", "D": "Sonda Goldman-Fox", "E": "Sonda Williams"}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" na seção 5.1 especifica que a Sonda Carolina do Norte (UNC 15) é a \"padrão clínico\" para \"Medição de PS e NIC\". As outras sondas têm indicações diferentes (OMS para triagem epidemiológica, Nabers para furca).\nDica: Conhecer as características e indicações de cada tipo de sonda é essencial para a prática clínica e para concursos. A UNC 15 é milimetrada a cada mm, o que permite medições precisas."}, {"enunciado": "Um dentista está realizando uma Raspagem e Alisamento Radicular (RAR) em uma face distal de um molar inferior. De acordo com o \"Macete\" e a tabela de \"Curetas Gracey: Mapa de Uso\" do texto, qual cureta Gracey ele deve utilizar?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "O \"Macete\" na seção 5.2 afirma: \"ERRO CLÁSSICO: Usar Gracey 11/12 para raspar faces distais de molares. A cureta correta para DISTAIS de posteriores é sempre a 13/14.\" A tabela também correlaciona \"13/14\" com \"Posteriores\" e \"Faces DISTAIS\".\nDica: As curetas Gracey são área-específicas. O macete \"M de 11 = Mesial\" e \"D de 14 = Distal\" ajuda a lembrar para posteriores. Para anteriores e pré-molares, as 5/6 são as mais versáteis."}, {"enunciado": "Durante a técnica de Raspagem e Alisamento Radicular (RAR), qual o ângulo correto da lâmina da cureta em relação à superfície radicular após atingir o fundo da bolsa?", "alternativas": {"A": "0° (fechado)", "B": "Entre 10° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90°"}, "gabarito": "D", "comentario": "A seção 5.3, item 2 \"Posicionamento\", descreve: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: O ângulo de trabalho é crucial para a eficácia da raspagem e para evitar danos. Um ângulo muito fechado não remove o cálculo; um ângulo muito aberto pode machucar o tecido mole e desgastar excessivamente a raiz."}, {"enunciado": "Qual das seguintes afirmações sobre a Periodontite, de acordo com o texto, está INCORRETA?", "alternativas": {"A": "É caracterizada por perda de inserção clínica e perda óssea radiográfica.", "B": "Sua progressão é sempre rápida e agressiva.", "C": "Pode levar à formação de bolsa periodontal.", "D": "É uma inflamação crônica.", "E": "Sua progressão é variável, podendo ser classificada em Graus A, B ou C."}, "gabarito": "B", "comentario": "A seção \"Periodontite (Estágios I–IV)\" afirma que a \"Progressão variável (Graus A, B ou C)\". A afirmação B contradiz diretamente essa informação, pois a progressão não é \"sempre rápida e agressiva\", mas sim variável. As demais alternativas estão corretas de acordo com a descrição da periodontite.\nDica: A variabilidade da progressão da periodontite é um conceito central da nova classificação, sendo o Grau o eixo que avalia essa característica."}, {"enunciado": "Qual das seguintes condições, quando presente, obrigatoriamente classifica a periodontite como Estágio IV, independentemente de outros parâmetros de NIC ou PS?", "alternativas": {"A": "Envolvimento de Furca Classe III", "B": "Defeitos Ósseos Verticais ≥ 3 mm", "C": "Perda de 4 dentes devido à periodontite", "D": "Disfunção Mastigatória", "E": "Perda Óssea além do 1/3 médio"}, "gabarito": "D", "comentario": "O \"Macete\" na seção 3.3 é explícito: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Embora as outras opções possam estar presentes no Estágio IV, a disfunção mastigatória é o critério obrigatório e decisivo para este estágio.\nDica: A disfunção mastigatória indica um comprometimento funcional tão severo que, por si só, já coloca o caso no Estágio mais avançado da doença."}, {"enunciado": "Em um exame clínico periodontal, o registro do Índice de Placa Visível (O'Leary ou simplificado) e do Índice de Sangramento à Sondagem (ISS) tem como objetivos principais, de acordo com o texto:", "alternativas": {"A": "Determinar o estágio e o grau da periodontite.", "B": "Avaliar a mobilidade dental e o envolvimento de furca.", "C": "Motivar o paciente e estabelecer o baseline para monitoramento.", "D": "Identificar lesões suspeitas de câncer oral.", "E": "Medir a profundidade de sondagem e o nível de inserção clínica."}, "gabarito": "C", "comentario": "A seção 4, item 3 \"Índices de Biofilme e Sangramento Gengival\", afirma: \"Esses dados motivam o paciente e estabelecem o baseline para monitoramento.\" As outras alternativas são objetivos de outras etapas do exame clínico ou de outros exames.\nDica: A motivação do paciente e o monitoramento da higiene são aspectos cruciais para o sucesso do tratamento periodontal. Os índices de placa e sangramento são ferramentas objetivas para isso."}, {"enunciado": "Qual a principal diferença entre a Profundidade de Sondagem (PS) aumentada e a Perda de Inserção Clínica (NIC) para o diagnóstico de periodontite, conforme destacado no texto?", "alternativas": {"A": "PS aumentada indica sempre periodontite, enquanto NIC aumentada indica gengivite.", "B": "PS aumentada é reversível, enquanto NIC aumentada não é.", "C": "para o diagnóstico de periodontite, conforme destacado no texto?", "D": "PS aumentada pode ser devido à hiperplasia gengival, enquanto NIC aumentada representa perda de suporte ósseo.", "E": "Apenas a PS aumentada é confirmada radiograficamente."}, "gabarito": "D", "comentario": "O \"ERRO FREQUENTE\" na seção 2.2 alerta: \"Confundir profundidade de sondagem aumentada com perda de inserção. Sem perda de NIC confirmada radiograficamente, o diagnóstico é GENGIVITE, não periodontite.\" A tabela na mesma seção mostra que na gengivite a PS pode estar aumentada (devido a edema/hiperplasia), mas a NIC está ausente, enquanto na periodontite a NIC está presente, indicando a perda de suporte.\nDica: A PS mede a profundidade do sulco/bolsa, que pode ser afetada pela inflamação gengival (gengivite). A NIC, por outro lado, mede a destruição dos tecidos de suporte (osso e ligamento periodontal), sendo o marcador definitivo da periodontite."}, {"enunciado": "Um paciente apresenta periodontite com perda óssea radiográfica que não evidencia progressão nos últimos 5 anos e não possui fatores de risco como tabagismo ou diabetes. De acordo com a classificação de 2018, qual o Grau da periodontite deste paciente?", "alternativas": {"A": "Grau A (Pedestre)", "B": "Grau B (Carro na cidade)", "C": "Grau C (Carro de corrida)", "D": "Grau D", "E": "Não é possível determinar o Grau."}, "gabarito": "A", "comentario": "A seção 3.2, \"Grau = 'O Velocímetro da Doença'\", descreve o Grau A (Pedestre) como \"Sem evidência de progressão nos últimos 5 anos. Sem fatores de risco.\" Esta descrição se encaixa perfeitamente no caso apresentado.\nDica: O Grau é determinado pela evidência de progressão passada e pela presença e controle de fatores de risco sistêmicos e comportamentais."}, {"enunciado": "Qual das seguintes afirmativas sobre o exame radiográfico em Periodontia está INCORRETA, segundo o texto?", "alternativas": {"A": "Radiografias periapicais são consideradas o padrão ouro para avaliação periodontal.", "B": "O nível da crista alveolar normal é de 1–2 mm apical à JEC.", "C": "Radiografias panorâmicas são ineficazes para triagem ou avaliação periodontal.", "D": "O exame radiográfico permite avaliar o padrão da perda óssea (horizontal ou vertical).", "E": "O alargamento do espaço do ligamento periodontal pode ser observado."}, "gabarito": "C", "comentario": "A seção 4, item 5 \"Exame Radiográfico\", afirma: \"Rx periapicais (padrão ouro) ou panorâmico como triagem.\" A alternativa C afirma que panorâmicas são
