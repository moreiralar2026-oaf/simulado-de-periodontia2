\"ineficazes\", o que contradiz o texto que as considera úteis para triagem.\nDica: Embora as periapicais sejam superiores para detalhes do osso alveolar e JEC, a panorâmica pode ser útil como ferramenta de triagem inicial para identificar áreas com perda óssea generalizada."}, {"enunciado": "Qual a principal função do Periodonto de Sustentação?", "alternativas": {"A": "Produzir saliva e manter a umidade bucal.", "B": "Formar uma barreira física e imunológica contra microrganismos.", "C": "Ancorar o dente ao osso e absorver forças mastigatórias.", "D": "Proteger a raiz do dente de cáries.", "E": "Promover a regeneração do esmalte dentário."}, "gabarito": "C", "comentario": "A seção 1.1, \"Divisões Funcionais\", descreve a função do Periodonto de Sustentação como \"ancorar o dente ao osso e absorver forças mastigatórias.\" A alternativa B descreve a função do Periodonto de Proteção. As outras alternativas não estão relacionadas às funções do periodonto de sustentação.\nDica: O periodonto de sustentação é composto por cemento radicular, ligamento periodontal e osso alveolar, que trabalham em conjunto para manter o dente firmemente no alvéolo e dissipar as forças oclusais."}, {"enunciado": "Ao explicar a causa da doença periodontal a um paciente, qual analogia o texto sugere para descrever o biofilme e sua ação?", "alternativas": {"A": "Comparar o biofilme a uma \"casca de laranja\" na gengiva.", "B": "Descrever o biofilme como \"postes fincados no chão\".", "C": "Comparar o biofilme a um \"filme esbranquiçado que se forma nos dentes\" e as bactérias a uma \"ferida que nunca cicatriza\".", "D": "Utilizar a analogia de \"arrumar o telhado da casa\".", "E": "Explicar que o biofilme é como um \"carro de corrida\" que avança rapidamente."}, "gabarito": "C", "comentario": "A seção 6, \"Comunicação com o Paciente\", no subtítulo \"Explicando a causa da doença\", sugere: \"Você já reparou naquele filme esbranquiçado que se forma nos dentes quando não escovamos? Chamamos de biofilme. Ele contém milhões de bactérias. Quando ficam tempo demais no mesmo lugar, essas bactérias irritam a gengiva e causam inflamação — é como uma ferida que nunca cicatriza enquanto a causa não é removida.\"\nDica: Utilizar analogias simples e do cotidiano do paciente melhora significativamente a compreensão e a adesão ao tratamento."}, {"enunciado": "A comunicação com o paciente é fundamental para a adesão ao tratamento. O texto enfatiza que o tratamento clínico representa apenas 50% do sucesso. Qual é a outra metade?", "alternativas": {"A": "O uso de equipamentos de alta tecnologia.", "B": "A habilidade do cirurgião-dentista.", "C": "A higiene oral domiciliar do paciente.", "D": "O custo acessível do tratamento.", "E": "A prescrição de medicamentos eficazes."}, "gabarito": "C", "comentario": "A introdução da seção 6, \"Comunicação com o Paciente\", afirma: \"Lembre-se: o tratamento clínico representa apenas 50% do sucesso — a outra metade é a higiene oral domiciliar do paciente\".\nDica: Essa frase sublinha a importância da educação e motivação do paciente para o autocuidado, que é tão ou mais importante que os procedimentos realizados em consultório."}, {"enunciado": "Qual das seguintes características está associada à saúde periodontal, de acordo com o texto?", "alternativas": {"A": "Gengiva com sangramento à sondagem em ≥ 10% dos sítios.", "B": "Sulco gengival > 3 mm.", "C": "Presença de perda de inserção clínica.", "D": "Gengiva cor rosa-coral, firme, contorno festonado.", "E": "Perda óssea radiográfica leve."}, "gabarito": "D", "comentario": "A seção 2.1, \"Saúde Periodontal\", descreve: \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" A alternativa D é a única que se alinha totalmente com essa descrição.\nDica: Os sinais de saúde periodontal são o oposto dos sinais de inflamação. Conhecer esses parâmetros é o ponto de partida para o diagnóstico de qualquer condição periodontal."}, {"enunciado": "De acordo com o texto, qual é a pressão de sondagem recomendada para o periograma completo?", "alternativas": {"A": "0,10 N (≈ 10 g)", "B": "0,25 N (≈ 25 g)", "C": "0,50 N (≈ 50 g)", "D": "1,00 N (≈ 100 g)", "E": "A pressão varia de acordo com o tipo de sonda."}, "gabarito": "B", "comentario": "A seção 4, item 4 \"Periograma Completo (Sondagem Periodontal)\", especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\"\nDica: A padronização da pressão de sondagem é crucial para a reprodutibilidade das medidas e para evitar trauma tecidual ou subestimar a profundidade da bolsa."}, {"enunciado": "Qual tipo de instrumento é eficaz em bolsas profundas, tem a vantagem de gerar menos fadiga ao operador, mas apresenta como limitação um feedback tátil reduzido?", "alternativas": {"A": "Curetas Gracey", "B": "Curetas universais (McCall)", "C": "Foices periodontais", "D": "Ultrassom (Piezoelétrico/Magnetoestritivo)", "E": "Sondas periodontais"}, "gabarito": "D", "comentario": "A seção 5.4, \"Outros Instrumentos Importantes\", descreve o Ultrassom: \"Complementar ao manual. Eficaz em bolsas profundas. Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\"\nDica: O ultrassom é um excelente complemento à instrumentação manual, especialmente em casos de cálculo mais tenaz ou em bolsas de difícil acesso para curetas manuais, mas a sensibilidade tátil do operador é importante para discernir entre cálculo e estrutura dentária."}, {"enunciado": "1. De acordo com o texto, qual a posição correta do paciente para facilitar o acesso à boca durante o procedimento periodontal?", "alternativas": {"A": "Decúbito lateral, com a cabeça virada para o operador.", "B": "Sentado, com a cabeça inclinada para trás e os braços cruzados.", "C": "Em pé, com o pescoço esticado.", "D": "Sentado, com as costas eretas, ombros relaxados e pés apoiados no chão.", "E": "Deitado em posição supina, com travesseiro sob a cabeça."}, "gabarito": "D", "comentario": "O texto afirma explicitamente que \"O paciente deve estar em posição que facilite o acesso à boca\", e a descrição dessa posição correta é \"ereta, ombros relaxados e pés apoiados no chão\". As outras alternativas descrevem posições inadequadas ou que não são mencionadas como ideais para o acesso. A ergonomia é fundamental na prática odontológica para o conforto do paciente e do profissional, além de otimizar o campo de visão e acesso."}, {"enunciado": "2. A manutenção adequada dos instrumentais é crucial em Periodontia. Segundo o texto, qual a principal razão para se manter as curetas e foices afiadas?", "alternativas": {"A": "Para prolongar a vida útil do instrumental.", "B": "Para reduzir o risco de contaminação cruzada.", "C": "Para remover o cálculo de forma eficaz e sem causar trauma.", "D": "Para facilitar o processo de esterilização.", "E": "Para melhorar a estética do instrumental."}, "gabarito": "C", "comentario": "O texto enfatiza que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" As demais opções não são as razões primárias para a afiação, embora a eficácia indiretamente possa impactar outros aspectos. Instrumentos afiados garantem procedimentos mais rápidos, menos dolorosos e com menor chance de dano tecidual."}, {"enunciado": "3. Qual a principal diferença entre gengivite e periodontite, de acordo com o quiz de verificação?", "alternativas": {"A": "A periodontite apresenta dor intensa, enquanto a gengivite não.", "B": "A gengivite é sempre generalizada e a periodontite é localizada.", "C": "A periodontite envolve a presença de perda de inserção clínica (NIC) e perda óssea radiográfica, enquanto a gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.", "D": "A gengivite é causada por bactérias e a periodontite por vírus.", "E": "A periodontite só ocorre em pacientes idosos."}, "gabarito": "C", "comentario": "A questão Q2 do quiz de verificação responde diretamente: \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" Esta é a distinção patológica fundamental entre as duas condições. A dor, localização, etiologia específica ou idade não são os critérios diferenciais primários conforme o texto."}, {"enunciado": "4. Um paciente apresenta gengiva edemaciada, eritematosa e sangramento à sondagem generalizado, com PS ≤ 3 mm em todos os dentes e NIC ausente. Não há perda óssea radiográfica. Qual o diagnóstico, segundo os casos clínicos apresentados?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada.", "B": "Gengivite induzida por biofilme, generalizada.", "C": "Periodontite Estágio IV, Grau C, Generalizada.", "D": "Saúde periodontal.", "E": "Periodontite Estágio I, Grau A, Localizada."}, "gabarito": "B", "comentario": "O \"Caso 1: Gengivite Induzida por Biofilme\" descreve exatamente essa situação: \"Gengiva edemaciada, eritematosa, sangramento à sondagem generalizado (> 30% dos sítios). PS ≤ 3 mm em todos os dentes. NIC ausente. Ausência de perda óssea radiográfica.\" A ausência de NIC e perda óssea é crucial para diferenciar gengivite de periodontite."}, {"enunciado": "5. Quais são os dois eixos da classificação de periodontite de 2018, conforme o quiz de verificação?", "alternativas": {"A": "Profundidade de sondagem e nível de inserção clínica.", "B": "Localização e extensão.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Idade do paciente e tipo de micro-organismo.", "E": "Presença de sangramento e mobilidade dental."}, "gabarito": "C", "comentario": "A questão Q3 do quiz de verificação afirma: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\" É fundamental conhecer esses dois eixos para a correta classificação da periodontite."}, {"enunciado": "6. O que define o GRAU na classificação de periodontite de 2018, segundo o texto?", "alternativas": {"A": "A quantidade de dentes perdidos devido à doença periodontal.", "B": "A presença de lesões de furca.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência direta de progressão ou fatores de risco modificadores (tabagismo, DM).", "D": "A profundidade das bolsas periodontais.", "E": "A extensão da perda óssea radiográfica."}, "gabarito": "C", "comentario": "A questão Q4 do quiz de verificação explica detalhadamente: \"O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\" As outras opções são critérios para o Estágio ou características da doença, mas não definem o Grau."}, {"enunciado": "7. Qual sonda é utilizada especificamente para detectar envolvimento de furca, e como são classificadas as furcas, segundo o glossário e o quiz?", "alternativas": {"A": "Sonda milimetrada periodontal; Classe 0, I, II, III.", "B": "Sonda Nabers; Classe I (< 3 mm), Classe II (≥ 3 mm mas não passante), Classe III (passante).", "C": "Sonda exploradora; Classes A, B, C.", "D": "Sonda WHO; Grau 1, 2, 3.", "E": "Sonda manual; Sem classificação específica."}, "gabarito": "B", "comentario": "A questão Q5 do quiz e o glossário mencionam: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\" A Sonda Nabers é característica para essa avaliação."}, {"enunciado": "8. Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio da periodontite, de acordo com o quiz de verificação?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Estágio V."}, "gabarito": "C", "comentario": "A questão Q6 do quiz de verificação aborda este cenário: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\" A ausência de disfunção mastigatória é o fator chave que impede a classificação como Estágio IV."}, {"enunciado": "9. Qual o ângulo recomendado da cureta durante o movimento de raspagem, conforme o quiz de verificação?", "alternativas": {"A": "30° a 45°.", "B": "45° a 60°.", "C": "70° a 80°.", "D": "90° a 100°.", "E": "Qualquer ângulo, desde que a remoção seja eficaz."}, "gabarito": "C", "comentario": "A questão Q7 do quiz de verificação estabelece: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" Este ângulo é crucial para a eficácia da raspagem e para evitar danos."}, {"enunciado": "10. Por que o tabagismo é um modificador de Grau C na classificação de periodontite, de acordo com o texto?", "alternativas": {"A": "Porque o tabaco causa recessão gengival.", "B": "Porque o tabaco aumenta o risco de cáries.", "C": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento, classificando tabagistas ≥ 10 cigarros/dia como Grau C.", "D": "Porque o tabaco provoca halitose.", "E": "Porque o tabaco altera a cor dos dentes."}, "gabarito": "C", "comentario": "A questão Q8 do quiz de verificação explica: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" As outras opções são efeitos do tabaco, mas não a razão pela qual classifica a periodontite como Grau C."}, {"enunciado": "11. Qual o significado da sigla NIC no glossário essencial de Periodontia?", "alternativas": {"A": "Nível de Inflamação Crônica.", "B": "Nível de Infecção por Cárie.", "C": "Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco.", "D": "Nódulo de Infiltração Comum.", "E": "Nomenclatura Internacional de Cimentos."}, "gabarito": "C", "comentario": "O glossário define NIC como \"Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" O NIC é uma medida fundamental para o diagnóstico e monitoramento da periodontite."}, {"enunciado": "12. O que é Profundidade de Sondagem (PS) e como ela difere do Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "PS é a distância da JEC ao fundo da bolsa, e NIC é da margem gengival ao fundo da bolsa.", "B": "PS e NIC são sinônimos e representam a mesma medida.", "C": "?", "D": "PS mede a profundidade da lesão de furca, enquanto NIC mede a mobilidade dental.", "E": "PS é a profundidade de sangramento e NIC é a profundidade de cálculo."}, "gabarito": "C", "comentario": "O glossário explica: \"PS — Profundidade de Sondagem: Distância em mm da margem gengival até o fundo da bolsa/sulco. Difere do NIC quando há recessão ou hiperplasia gengival.\" O NIC usa a JEC como referência fixa, enquanto o PS usa a margem gengival, que pode variar devido a recessão ou edema/hiperplasia."}, {"enunciado": "13. Segundo o glossário, qual o melhor indicador de saúde gengival?", "alternativas": {"A": "A ausência de dor.", "B": "A presença de SS (Sangramento à Sondagem).", "C": "A ausência de SS (Sangramento à Sondagem).", "D": "A cor rosa pálida da gengiva.", "E": "A ausência de cálculo."}, "gabarito": "C", "comentario": "O glossário afirma: \"SS — Sangramento à Sondagem: Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\" Embora a cor rosa pálida e ausência de cálculo sejam sinais de saúde, a ausência de sangramento à sondagem é o indicador mais confiável de ausência de inflamação."}, {"enunciado": "14. Um paciente tabagista (20 cigarros/dia há 40 anos) e com DM tipo 2 descompensado (HbA1c 9%) apresenta PS ≥ 6 mm em múltiplos sítios, NIC ≥ 5 mm em 80% dos sítios, perda óssea radiográfica avançada, perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida). Qual o diagnóstico de Estágio e Grau, conforme os casos clínicos?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada.", "B": "Gengivite induzida por biofilme, generalizada.", "C": "Periodontite Estágio IV, Grau C, Generalizada.", "D": "Periodontite Estágio III, Grau B, Generalizada.", "E": "Periodontite Estágio I, Grau A, Localizada."}, "gabarito": "C", "comentario": "O \"Caso 3: Periodontite Estágio IV, Grau C, Generalizada\" descreve exatamente essa situação. Os critérios de Estágio IV (perda de dentes por DP, disfunção mastigatória, perda óssea avançada) e Grau C (tabagismo pesado e DM descompensado) estão presentes."}, {"enunciado": "15. O que significa a sigla RAR na terapia periodontal não cirúrgica?", "alternativas": {"A": "Reconstrução Alveolar Rápida.", "B": "Raspagem e Alisamento Radicular.", "C": "Restauração de Área Retraída.", "D": "Remoção de Abcesso Radicular.", "E": "Reabilitação Articular e Radicular."}, "gabarito": "B", "comentario": "O glossário define: \"RAR — Raspagem e Alisamento Radicular: Procedimento mecânico de remoção de cálculo e biofilme subgengival com alisamento da superfície radicular. Principal terapia da fase I (TPNC).\" É um dos pilares do tratamento periodontal não cirúrgico."}, {"enunciado": "16. Qual a definição de Bolsa Periodontal, segundo o glossário?", "alternativas": {"A": "Qualquer aprofundamento do sulco gengival.", "B": "Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "C": "Uma área de acúmulo de biofilme na superfície coronária.", "D": "Uma região de inflamação gengival sem perda óssea.", "E": "Um espaço entre a gengiva e o dente que mede menos de 3 mm."}, "gabarito": "B", "comentario": "O glossário esclarece: \"Bolsa Periodontal: Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\" A migração apical do epitélio juncional e a perda de inserção são características patognomônicas da bolsa periodontal verdadeira, diferenciando-a de um sulco gengival aprofundado por hiperplasia (pseudobolsa)."}, {"enunciado": "17. Qual a definição de Recessão Gengival, de acordo com o glossário?", "alternativas": {"A": "Crescimento excessivo da gengiva.", "B": "Inflamação da gengiva sem sangramento.", "C": "Deslocamento apical da margem gengival em relação à JEC, expondo a superfície radicular.", "D": "Sangramento espontâneo da gengiva.", "E": "Acúmulo de cálculo supragengival."}, "gabarito": "C", "comentario": "O glossário define: \"Recessão Gengival: Deslocamento apical da margem gengival em relação à JEC, expondo a superfície radicular.\" É uma condição comum que pode causar sensibilidade e problemas estéticos."}, {"enunciado": "18. Qual o prognóstico do \"Caso 1: Gengivite Induzida por Biofilme\"?", "alternativas": {"A": "Reservado, exigindo manejo multidisciplinar.", "B": "Razoável, com controle da progressão.", "C": "Excelente, com reversão completa se houver adesão à higiene.", "D": "Bom, mas com alto risco de recidiva.", "E": "Inalterado, pois a gengivite não tem cura."}, "gabarito": "C", "comentario": "O texto descreve o prognóstico para o Caso 1 como \"Excelente, com reversão completa se houver adesão à higiene.\" A gengivite, sendo uma inflamação reversível sem perda de suporte, tem um prognóstico muito favorável com o tratamento adequado e boa higiene."}, {"enunciado": "19. Um paciente com Periodontite Estágio II, Grau B, Generalizada, é tabagista (5 cigarros/dia há 10 anos) e tem DM tipo 2 controlado (HbA1c 6,5%). O Plano de Tratamento inicial inclui IHO e controle do tabagismo e DM. Qual outro procedimento é fundamental para o tratamento deste caso, conforme o texto?", "alternativas": {"A": "Cirurgia periodontal para enxerto ósseo.", "B": "Extração dos dentes com mobilidade.", "C": "TPNC (RAR).", "D": "Terapia a laser.", "E": "Uso de antibióticos sistêmicos por longo período."}, "gabarito": "C", "comentario": "O \"Caso 2: Periodontite Estágio II, Grau B, Generalizada\" descreve o plano de tratamento como \"IHO, controle do tabagismo e DM, TPNC (RAR). Reavaliação em 4–8 semanas.\" A Terapia Periodontal Não Cirúrgica (TPNC), que inclui a Raspagem e Alisamento Radicular (RAR), é a primeira linha de tratamento para todos os estágios da periodontite."}, {"enunciado": "20. O que é o Biofilme (Placa Dental) e qual sua importância em Periodontia, segundo o glossário?", "alternativas": {"A": "Uma camada protetora natural dos dentes.", "B": "Um depósito mineralizado inerte.", "C": "Uma comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular, sendo o principal fator etiológico da gengivite e periodontite.", "D": "Um pigmento extrínseco que mancha os dentes.", "E": "Um tipo de tecido mole que reveste a gengiva."}, "gabarito": "C", "comentario": "O glossário define: \"Biofilme (Placa Dental): Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\" Esta é a definição mais precisa e enfatiza seu papel crucial na etiologia das doenças periodontais."}, {"enunciado": "1. De acordo com a Apostila de Periodontia, qual das seguintes estruturas faz parte do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular", "B": "Ligamento periodontal", "C": "Osso alveolar", "D": "Gengiva inserida", "E": "Fibras de Sharpey"}, "gabarito": "D", "comentario": "O texto divide o periodonto em duas grandes unidades funcionais: Periodonto de Proteção e Periodonto de Sustentação. O Periodonto de Proteção é composto por gengiva livre (marginal), gengiva inserida (ceratinizada) e gengiva interdental (papila). As demais alternativas (cemento radicular, ligamento periodontal, osso alveolar e fibras de Sharpey) são componentes do Periodonto de Sustentação. É fundamental que o cirurgião-dentista conheça a anatomia periodontal para um correto diagnóstico e planejamento de tratamento."}, {"enunciado": "2. Qual dos marcos anatômicos cruciais para o diagnóstico é definido como o ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Junção Esmalte-Cemento (JEC)", "E": "Margem Gengival"}, "gabarito": "D", "comentario": "O texto afirma explicitamente que a Junção Esmalte-Cemento (JEC) é o \"ponto de referência para medir o NIC\". A Crista Alveolar e o Fundo da Bolsa são importantes para outras medidas e avaliações, mas não são o ponto de referência direto para o NIC. A Furca é a região de bifurcação/trifurcação das raízes. A Margem Gengival é um ponto de referência para a medida da recessão ou hiperplasia, mas não para o NIC em si, que é a distância da JEC ao fundo da bolsa."}, {"enunciado": "3. Em caso de saúde periodontal, qual a profundidade máxima esperada para o sulco gengival e o percentual de sítios com sangramento à sondagem (SS)?", "alternativas": {"A": "Sulco gengival ≤ 3 mm e SS em ≥ 10% dos sítios", "B": "Sulco gengival ≥ 4 mm e SS em < 10% dos sítios", "C": "Sulco gengival ≤ 3 mm e SS em < 10% dos sítios", "D": "Sulco gengival ≥ 3 mm e SS em ≥ 10% dos sítios", "E": "Sulco gengival ≤ 2 mm e SS em < 5% dos sítios"}, "gabarito": "C", "comentario": "A seção \"Saúde Periodontal\" descreve que a gengiva saudável possui \"Sulco gengival ≤ 3 mm\" e \"Sangramento à sondagem (SS) em < 10% dos sítios\". As outras opções apresentam valores incorretos para a definição de saúde periodontal conforme o texto. A capacidade de diferenciar saúde de doença é o primeiro passo para um diagnóstico preciso."}, {"enunciado": "4. Qual é o diferencial crítico que permite distinguir a gengivite da periodontite, de acordo com o texto?", "alternativas": {"A": "Presença de sangramento à sondagem", "B": "Profundidade de sondagem aumentada", "C": "Presença de perda de inserção (NIC) e perda óssea radiográfica", "D": "Reversibilidade total com remoção de biofilme", "E": "Edema e eritema gengival"}, "gabarito": "C", "comentario": "O quadro \"Diferencial Crítico: Gengivite × Periodontite\" destaca que a periodontite apresenta \"Presente (≥ 1 mm)\" para Perda de Inserção (NIC) e \"Presente\" para Perda Óssea Radiográfica, enquanto a gengivite é \"Ausente\" para ambos. O texto ainda reforça: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.\" Sangramento, profundidade de sondagem aumentada (sem NIC confirmado) e inflamação são características que podem estar presentes em ambas, mas a perda de inserção e óssea são distintivas da periodontite."}, {"enunciado": "5. A nova classificação de doenças periodontais (2018) organiza a periodontite em dois eixos principais. Quais são eles e o que descrevem?", "alternativas": {"A": "Crônica e Agressiva, descrevendo a etiologia e a severidade.", "B": "Estágio e Grau, descrevendo a gravidade/complexidade e a velocidade de progressão/fatores de risco.", "C": "Localizada e Generalizada, descrevendo a extensão e a distribuição.", "D": "Gengivite e Periodontite, descrevendo a inflamação e a destruição tecidual.", "E": "Leve e Moderada, descrevendo a extensão do dano e o prognóstico."}, "gabarito": "B", "comentario": "A seção \"3. Classificação 2018: Estágios e Graus\" afirma que a nova classificação \"abandona os termos 'crônica' e 'agressiva' e organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV)\" que \"Descreve a gravidade... e a complexidade do tratamento\" e \"GRAU (A, B, C)\" que \"Descreve a velocidade de progressão e os fatores de risco\"."}, {"enunciado": "6. Um paciente apresenta Nível de Inserção Clínica (NIC) de 3-4 mm, profundidade de sondagem (PS) ≤ 5 mm e perda óssea radiográfica de 15-30% (1/3 coronário). Qual o estágio da periodontite, de acordo com a Classificação 2018?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 3-4 mm, profundidade de sondagem (PS) ≤ 5 mm e perda óssea radiográfica de 15-30% (1/3 coronário). Qual o estágio da periodontite, de acordo com a Classificação 2018?", "D": "Estágio IV", "E": "Gengivite"}, "gabarito": "B", "comentario": "Consultando a \"Tabela de Sinais Clínicos por Estágio\", encontramos que para o Estágio II, o NIC é de 3–4 mm, a Perda Óssea (RX) é de 15–30% (1/3 coronário) e a Profundidade de Sondagem (PS) é ≤ 5 mm. Essas características correspondem exatamente ao cenário descrito na questão."}, {"enunciado": "7. Qual Grau de periodontite é caracterizado por progressão rápida, tabagismo ≥ 10 cigarros/dia ou DM descompensado, e perda óssea > 2 mm/ano?", "alternativas": {"A": "Grau A (Pedestre)", "B": "Grau B (Carro na cidade)", "C": "Grau C (Carro de corrida)", "D": "Grau D (Avião supersônico)", "E": "Grau E (Foguete)"}, "gabarito": "C", "comentario": "A seção \"Grau = 'O Velocímetro da Doença'\" descreve o \"Grau C (Carro de corrida)\" como tendo \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" As outras opções são fictícias ou representam outros graus de progressão."}, {"enunciado": "8. Um paciente apresenta NIC ≥ 5 mm, perda de 5 dentes e disfunção mastigatória severa. Qual o estágio da periodontite, independentemente da extensão da perda óssea?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar sem a perda óssea radiográfica."}, "gabarito": "D", "comentario": "O \"Macete\" ao final da seção 3.3 afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" A perda de 5 dentes também é um indicativo do Estágio IV (≥ 5 dentes perdidos)."}, {"enunciado": "9. Qual a sequência correta do Fluxo do Exame Clínico (Diagnóstico Passo a Passo) em Periodontia, conforme apresentado no texto?", "alternativas": {"A": "Periograma Completo, Exame Radiográfico, Anamnese, Índices de Biofilme, Diagnóstico.", "B": "Anamnese, Exame Extraoral/Intraoral, Índices de Biofilme, Periograma Completo, Exame Radiográfico, Diagnóstico.", "C": "Exame Radiográfico, Anamnese, Periograma Completo, Índices de Biofilme, Diagnóstico.", "D": "Anamnese, Periograma Completo, Exame Extraoral/Intraoral, Índices de Biofilme, Exame Radiográfico, Diagnóstico.", "E": "Índices de Biofilme, Periograma Completo, Anamnese, Exame Radiográfico, Diagnóstico."}, "gabarito": "B", "comentario": "A seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\" lista as etapas na seguinte ordem: 1. Anamnese Médica e Odontológica; 2. Exame Extraoral e Intraoral; 3. Índices de Biofilme e Sangramento Gengival; 4. Periograma Completo (Sondagem Periodontal); 5. Exame Radiográfico; 6. Diagnóstico e Plano de Tratamento."}, {"enunciado": "10. Qual a pressão de sondagem recomendada durante a coleta do periograma completo?", "alternativas": {"A": "0,5 N (≈ 50 g)", "B": "0,1 N (≈ 10 g)", "C": "0,25 N (≈ 25 g)", "D": "1 N (≈ 100 g)", "E": "0,75 N (≈ 75 g)"}, "gabarito": "C", "comentario": "Na seção \"Periograma Completo (Sondagem Periodontal)\", o texto especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g)\". Esta pressão é crucial para obter medidas consistentes e não traumáticas."}, {"enunciado": "11. Qual tipo de sonda periodontal é a \"padrão clínico\" para medição de PS e NIC, sendo milimetrada a cada milímetro até 15 mm?", "alternativas": {"A": "Sonda OMS (WHO / CPITN)", "B": "Sonda Nabers", "C": "Sonda Carolina do Norte (UNC 15)", "D": "Sonda Goldman-Fox", "E": "Sonda Williams"}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" indica que a \"Carolina do Norte (UNC 15)\" é \"Milimetrada a cada mm, total 15 mm\" e sua \"Indicação Principal\" é \"Medição de PS e NIC — padrão clínico\". A sonda OMS é para triagem epidemiológica, e a Nabers para avaliação de furca."}, {"enunciado": "12. Para a raspagem das faces distais de dentes posteriores, qual cureta Gracey é a mais indicada, de acordo com o texto?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A seção \"Curetas Gracey: Mapa de Uso\" e o \"ERRO CLÁSSICO\" destacam que a Gracey 13/14 é a correta para \"Faces DISTAIS\" de dentes posteriores. A Gracey 11/12 é para faces mesiais de posteriores. O macete \"13/14 → Distal\" reforça esta informação."}, {"enunciado": "13. Durante a técnica de Raspagem e Alisamento Radicular (RAR), qual o ângulo ideal da lâmina da cureta em relação à superfície radicular, após a inserção no sulco/bolsa?", "alternativas": {"A": "0° (paralela ao eixo do dente)", "B": "Entre 20° e 30°", "C": "Entre 70° e 80°", "D": "90°", "E": "Acima de 90°"}, "gabarito": "C", "comentario": "Na etapa 2 (\"Posicionamento\") da \"Técnica de Raspagem e Alisamento Radicular (RAR)\", o texto orienta: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular.\" Adverte que \"Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\""}, {"enunciado": "14. Qual a função do dedo anelar (fulcro) durante a instrumentação manual com curetas?", "alternativas": {"A": "Guiar o movimento da cureta em direção ao fundo da bolsa.", "B": "Aplicar a força necessária para a remoção do cálculo.", "C": "Proteger a língua e as bochechas do paciente.", "D": "Fornecer apoio firme para movimentos controlados e reduzir o risco de escorregamento.", "E": "Manter a ponta ativa da cureta sempre fechada."}, "gabarito": "D", "comentario": "A etapa 3 (\"Apoio Digital\") da \"Técnica de Raspagem e Alisamento Radicular (RAR)\" explica: \"Use o dedo anelar (fulcro) em dentes vizinhos ou na própria arcada. Apoio firme = movimentos controlados = menor risco de escorregamento.\" O fulcro é essencial para a estabilidade e segurança do operador e do paciente."}, {"enunciado": "15. Um dos objetivos da Raspagem e Alisamento Radicular (RAR) é alisar a superfície radicular. Qual o propósito principal desse alisamento?", "alternativas": {"A": "Aumentar a sensibilidade dentinária para indicar o sucesso do tratamento.", "B": "Facilitar a re-adesão bacteriana para futuros estudos.", "C": "Dificultar a re-adesão bacteriana e o acúmulo de biofilme.", "D": "Promover a formação de novo cemento radicular.", "E": "Remover o esmalte remanescente na raiz."}, "gabarito": "C", "comentario": "O texto afirma que a RAR tem como objetivos: \"remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\". Uma superfície lisa é menos retentiva para o biofilme."}, {"enunciado": "16. Qual tipo de cureta é descrita como \"universal\", atuando em todas as faces, principalmente supragengival, e ideal para remoção de cálculo supragengival volumoso antes da RAR?", "alternativas": {"A": "Gracey 11/12", "B": "Gracey 13/14", "C": "McCall 13/14 e 17/18", "D": "Foice McCall 11/12", "E": "Hollenback"}, "gabarito": "C", "comentario": "A seção \"5.4 Outros Instrumentos Importantes\" descreve: \"McCall 13/14 e 17/18: Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\" As curetas Gracey são área-específicas, e a Foice McCall 11/12 é para interproximais de posteriores."}, {"enunciado": "17. Qual a principal vantagem do uso do ultrassom (piezoelétrico/magnetoestritivo) como complemento à instrumentação manual?", "alternativas": {"A": "Feedback tátil aprimorado.", "B": "Maior custo-benefício em relação aos instrumentos manuais.", "C": "Menos fadiga do operador.", "D": "Capacidade de remover cálculos subgengivais em bolsas rasas.", "E": "Eliminação total da necessidade de instrumentação manual."}, "gabarito": "C", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", o texto menciona o Ultrassom e suas características: \"Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\" Ele é um complemento, não um substituto total, e é eficaz em bolsas profundas, não apenas rasas."}, {"enunciado": "18. Ao explicar a causa da doença periodontal ao paciente, o texto sugere uma analogia. Qual analogia é utilizada para o biofilme e sua ação?", "alternativas": {"A": "Um alicerce cedendo.", "B": "Um telhado sendo arrumado.", "C": "Um filme esbranquiçado nos dentes que irrita a gengiva, como uma ferida que não cicatriza.", "D": "Uma calha entupida.", "E": "Um carro em alta velocidade."}, "gabarito": "C", "comentario": "Na seção \"6. Comunicação com o Paciente\", sob o tópico \"Explicando a causa da doença\", o texto sugere: \"Você já reparou naquele filme esbranquiçado que se forma nos dentes quando não escovamos? Chamamos de biofilme... é como uma ferida que nunca cicatriza enquanto a causa não é removida.\" As outras analogias são usadas para outros conceitos (perda óssea, manutenção, grau da doença)."}, {"enunciado": "19. Para explicar ao paciente por que a gengiva sangra, o texto utiliza uma analogia com qual parte do corpo?", "alternativas": {"A": "O pé, que sangra ao caminhar.", "B": "A mão, que sangra ao lavar.", "C": "O nariz, que sangra ao assoar.", "D": "O olho, que sangra ao esfregar.", "E": "A orelha, que sangra ao limpar."}, "gabarito": "B", "comentario": "Na seção \"6. Comunicação com o Paciente\", sob o tópico \"Por que a gengiva sangra?\", o texto propõe: \"Pense assim: se sua mão sangrasse toda vez que você a lavasse, você se preocuparia, certo?\" Esta analogia visa ilustrar que o sangramento gengival não é normal."}, {"enunciado": "20. Qual a importância da postura correta durante a prática clínica, conforme a seção \"Ergonomia na Clínica\"?", "alternativas": {"A": "Aumentar a velocidade do atendimento.", "B": "Reduzir o custo dos equipamentos.", "C": "Evitar lesões por esforço repetitivo (LER) e melhorar a visibilidade.", "D": "Diminuir o tempo de esterilização dos instrumentos.", "E": "Melhorar a comunicação com o paciente."}, "gabarito": "C", "comentario": "A seção \"7.1 Ergonomia na Clínica\" afirma que a \"Postura correta: Evita lesões por esforço repetitivo (LER) e melhora a visibilidade.\" Ergonomia é fundamental para a saúde a longo prazo do profissional e para a qualidade do trabalho."}, {"enunciado": "1. Qual a posição ideal do paciente para facilitar o acesso à boca durante procedimentos odontológicos, conforme o texto?", "alternativas": {"A": "Deitado de lado, com a cabeça apoiada.", "B": "Sentado com as costas curvadas e a cabeça inclinada para trás.", "C": "Em pé, com o pescoço estendido.", "D": "Pés apoiados no chão, ereto e ombros relaxados.", "E": "Semi-sentado, com os braços cruzados."}, "gabarito": "D", "comentario": "O texto afirma explicitamente que \"O paciente deve estar em posição que facilite o acesso à boca\" e descreve essa posição como \"ereta, ombros relaxados e pés apoiados no chão\". As outras opções descrevem posições que dificultariam o acesso ou seriam desconfortáveis.\nDICA: A ergonomia é fundamental na prática odontológica para a saúde do profissional e o conforto e segurança do paciente."}, {"enunciado": "2. De acordo com o texto, qual a principal razão para manter as curetas e foices afiadas?", "alternativas": {"A": "Para reduzir o tempo de esterilização dos instrumentos.", "B": "Para evitar que os instrumentos enferrujem.", "C": "Para remover o cálculo de forma eficaz e sem causar trauma.", "D": "Para facilitar a identificação do tipo de instrumento.", "E": "Para aumentar a durabilidade do fio da lâmina."}, "gabarito": "C", "comentario": "O texto afirma que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" As outras opções não refletem o motivo principal da afiação no contexto da remoção de cálculo.\nDICA: Instrumentos afiados são mais eficientes, reduzem a força necessária para o procedimento, minimizam o risco de trauma ao paciente e diminuem a fadiga do operador."}, {"enunciado": "3. No Caso Clínico 1 (Gengivite Induzida por Biofilme), qual o principal achado clínico que indica que a condição é reversível e sem perda de suporte periodontal?", "alternativas": {"A": "Sangramento gengival ao escovar.", "B": "Gengiva edemaciada e eritematosa.", "C": "PS ≤ 3 mm em todos os dentes e NIC ausente.", "D": "Ausência de perda óssea radiográfica.", "E": "Queixa de sangramento gengival ao escovar."}, "gabarito": "C", "comentario": "O texto define gengivite como \"uma inflamação restrita à gengiva, sem perda de suporte, e é reversível\". A presença de PS ≤ 3 mm e NIC ausente (Nível de Inserção Clínica) são os indicadores cruciais de que não houve perda de suporte periodontal, diferenciando-a da periodontite. O sangramento, edema e eritema são sinais de inflamação, mas não definem a ausência de perda de suporte. A ausência de perda óssea radiográfica também é um bom indicador, mas a ausência de NIC é a mais direta para a definição de gengivite.\nDICA: A ausência de perda de inserção clínica é o principal critério diferencial entre gengivite e periodontite."}, {"enunciado": "4. Qual o prognóstico para o Caso Clínico 1 (Gengivite Induzida por Biofilme)?", "alternativas": {"A": "Reservado, com necessidade de tratamento complexo.", "B": "Bom, com controle da progressão.", "C": "Excelente, com reversão completa se houver adesão à higiene.", "D": "Ruim, devido ao sangramento generalizado.", "E": "Incerto, dependendo da resposta medicamentosa."}, "gabarito": "C", "comentario": "O texto claramente afirma que o prognóstico para a Gengivite Induzida por Biofilme é \"Excelente, com reversão completa se houver adesão à higiene\". Gengivite é uma condição reversível com o controle do biofilme.\nDICA: A reversibilidade da gengivite é um conceito fundamental em Periodontia, destacando a importância da higiene oral e da remoção do biofilme."}, {"enunciado": "5. No Caso Clínico 2 (Periodontite Estágio II, Grau B, Generalizada), quais fatores de risco modificadores são mencionados no histórico do paciente?", "alternativas": {"A": "Idade e sexo.", "B": "Consumo excessivo de álcool e estresse.", "C": "Tabagismo e Diabetes Mellitus tipo 2.", "D": "Hipertensão e obesidade.", "E": "Histórico familiar de doença periodontal."}, "gabarito": "C", "comentario": "O \"Histórico\" do paciente no Caso 2 menciona: \"Tabagista (5 cigarros/dia há 10 anos). DM tipo 2 controlado (HbA1c 6,5%).\" Estes são os fatores de risco modificadores listados.\nDICA: O controle de fatores de risco sistêmicos e comportamentais é crucial para o sucesso do tratamento periodontal, especialmente em casos de periodontite."}, {"enunciado": "6. A principal diferença entre gengivite e periodontite, de acordo com o quiz, reside na presença de quê?", "alternativas": {"A": "Sangramento à sondagem.", "B": "Edema e eritema gengival.", "C": "Perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Acúmulo de biofilme.", "E": "Dor espontânea."}, "gabarito": "C", "comentario": "A Q2 do quiz pergunta \"Qual a principal diferença entre gengivite e periodontite?\" e a resposta fornecida é \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\"\nDICA: Este é um conceito básico e essencial para o diagnóstico diferencial em Periodontia. Memorize os critérios que distinguem as duas condições."}, {"enunciado": "7. Quais são os dois eixos da classificação de periodontite de 2018?", "alternativas": {"A": "Aguda e Crônica.", "B": "Localizada e Generalizada.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Leve e Severa.", "E": "Recorrente e Refratária."}, "gabarito": "C", "comentario": "A Q3 do quiz pergunta \"Quais são os dois eixos da classificação de periodontite de 2018?\" e a resposta é \"Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\"\nDICA: A classificação de 2018 é a mais atual e é fundamental para o diagnóstico e plano de tratamento. Entender o que cada eixo representa é crucial."}, {"enunciado": "8. O que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A extensão da doença (localizada ou generalizada).", "B": "A presença de bolsas periodontais.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência de progressão ou fatores de risco modificadores.", "D": "A quantidade de perda óssea radiográfica.", "E": "A presença de mobilidade dentária."}, "gabarito": "C", "comentario": "A Q4 do quiz explica que \"O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\"\nDICA: O Grau é dinâmico e pode mudar ao longo do tempo, especialmente com o controle dos fatores de risco."}, {"enunciado": "9. Qual sonda é especificamente utilizada para detectar envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda Nabers.", "D": "Sonda Goldman-Fox.", "E": "Sonda PCP-15."}, "gabarito": "C", "comentario": "A Q5 do quiz pergunta \"Qual sonda é utilizada especificamente para detectar envolvimento de furca?\" e a resposta é \"Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\"\nDICA: A sonda Nabers é facilmente reconhecível por sua ponta curva, projetada para explorar as áreas de furca em dentes multirradiculares."}, {"enunciado": "10. Conforme o texto, um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida, é diagnosticado com qual Estágio de Periodontite?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Gengivite."}, "gabarito": "C", "comentario": "A Q6 do quiz apresenta este cenário e a resposta é \"Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\"\nDICA: A presença de disfunção mastigatória (colapso de mordida, migração patológica, perda de dentes de suporte) é o que diferencia o Estágio III do Estágio IV, mesmo com alta gravidade da perda de inserção e óssea."}, {"enunciado": "11. Qual o ângulo recomendado da cureta durante o movimento de raspagem para ser eficaz e não traumático?", "alternativas": {"A": "Menor que 45°.", "B": "Exatamente 90°.", "C": "Entre 70° e 80° entre a face interna da lâmina e a superfície radicular.", "D": "Maior que 90°.", "E": "Qualquer ângulo, desde que haja pressão suficiente."}, "gabarito": "C", "comentario": "A Q7 do quiz pergunta \"Qual o ângulo recomendado da cureta durante o movimento de raspagem?\" e a resposta é \"70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\"\nDICA: O ângulo de trabalho correto é fundamental para a eficácia da raspagem e para evitar danos à superfície radicular e aos tecidos moles."}, {"enunciado": "12. Por que o tabagismo é considerado um modificador de Grau C na classificação de periodontite, de acordo com o texto?", "alternativas": {"A": "Porque ele causa manchas nos dentes.", "B": "Porque ele afeta a estética do sorriso.", "C": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque ele aumenta a sensibilidade dentinária.", "E": "Porque ele dificulta a remoção do biofilme."}, "gabarito": "C", "comentario": "A Q8 do quiz explica: \"Por que o tabagismo é um modificador de Grau C? O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófils, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\"\nDICA: O tabagismo é um dos fatores de risco mais importantes e impactantes na progressão e no prognóstico da doença periodontal. O controle desse hábito é essencial para o sucesso terapêutico."}, {"enunciado": "13. O que o termo \"NIC\" representa no glossário de Periodontia?", "alternativas": {"A": "Nível de Inflamação Crônica.", "B": "Número de Inserções Coroárias.", "C": "Nível de Inserção Clínica.", "D": "Necessidade de Instrumentação Cirúrgica.", "E": "Nova Inserção Conjuntiva."}, "gabarito": "C", "comentario": "O glossário define NIC como \"Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\"\nDICA: O NIC é a medida mais confiável para avaliar a perda de suporte periodontal, pois utiliza a JEC como um ponto de referência fixo, ao contrário da Profundidade de Sondagem (PS) que pode ser influenciada pela posição da margem gengival."}, {"enunciado": "14. Qual a definição de \"Bolsa Periodontal\" apresentada no glossário?", "alternativas": {"A": "Inflamação generalizada da gengiva.", "B": "Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "C": "Recessão gengival com exposição da raiz.", "D": "Acúmulo de cálculo supragengival.", "E": "Sangramento gengival espontâneo."}, "gabarito": "B", "comentario": "O glossário define \"Bolsa Periodontal\" como \"Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\"\nDICA: A migração apical do epitélio juncional e a perda de inserção são as características patognomônicas da bolsa periodontal, diferenciando-a de um sulco gengival aprofundado por hiperplasia inflamatória."}, {"enunciado": "15. O que a \"Ausência de SS\" (Sangramento à Sondagem) indica, conforme o glossário?", "alternativas": {"A": "Presença de doença periodontal avançada.", "B": "Inflamação ativa da gengiva.", "C": "O melhor indicador de saúde gengival.", "D": "Necessidade de cirurgia periodontal.", "E": "Presença de biofilme maduro."}, "gabarito": "C", "comentario": "O glossário afirma que \"Ausência de SS é o melhor indicador de saúde gengival.\" O sangramento à sondagem, por outro lado, indica inflamação ativa.\nDICA: A ausência de sangramento à sondagem é um sinal crucial de estabilidade periodontal e sucesso do tratamento."}, {"enunciado": "16. No Caso Clínico 3 (Periodontite Estágio IV, Grau C, Generalizada), qual o status de controle do Diabetes Mellitus (DM) tipo 2 do paciente?", "alternativas": {"A": "Controlado, com HbA1c 6,5%.", "B": "Descompensado, com HbA1c 9%.", "C": "Sem informações sobre o controle do DM.", "D": "Recém-diagnosticado.", "E": "Em remissão."}, "gabarito": "B", "comentario": "O \"Histórico\" do paciente no Caso 3 menciona: \"DM tipo 2 descompensado (HbA1c 9%).\" No Caso 2, o DM era controlado (HbA1c 6,5%), o que permite a comparação.\nDICA: O controle glicêmico é um fator crítico na progressão e resposta ao tratamento da periodontite, especialmente em pacientes diabéticos. HbA1c acima de 7% geralmente indica controle inadequado."}, {"enunciado": "17. Qual a definição de \"TPNC\" no glossário de Periodontia?", "alternativas": {"A": "Terapia de Preparo Não Cirúrgico.", "B": "Terapia Periodontal Não Cirúrgica.", "C": "Tratamento Preventivo e Controle.", "D": "Terapia Pós-Cirúrgica.", "E": "Terapia de Placa Não Controlada."}, "gabarito": "B", "comentario": "O glossário define TPNC como \"Terapia Periodontal Não Cirúrgica: Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\"\nDICA: A TPNC é a base do tratamento periodontal e deve ser realizada em todos os pacientes com periodontite, independentemente do estágio."}, {"enunciado": "18. Em relação à mobilidade dentária, qual a classificação para um dente que apresenta movimento horizontal maior que 1 mm, mas sem movimento vertical?", "alternativas": {"A": "Grau 0.", "B": "Grau 1.", "C": "Grau 2.", "D": "Grau 3.", "E": "Grau 4."}, "gabarito": "C", "comentario": "O glossário define \"Mobilidade Dental\" como: \"Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\" Portanto, movimento horizontal maior que 1 mm corresponde ao Grau 2.\nDICA: A avaliação da mobilidade é importante para o diagnóstico, planejamento do tratamento e prognóstico de dentes periodonticamente comprometidos."}, {"enunciado": "19. No contexto de iluminação e campo de visão, o texto recomenda o uso de qual equipamento além do refletor, se possível?", "alternativas": {"A": "Câmera intraoral.", "B": "Laser de diodo.", "C": "Lupas de aumento.", "D": "Radiografia periapical.", "E": "Fibras ópticas."}, "gabarito": "C", "comentario": "O texto, na seção \"Iluminação e Campo de Visão\", afirma: \"Use refletor e, se possível, lupas de aumento.\"\nDICA: O uso de lupas de aumento melhora significativamente a acuidade visual, permitindo a detecção de detalhes e a realização de procedimentos mais precisos, especialmente em áreas subgengivais."}, {"enunciado": "20. Qual a classificação de furca para uma condição em que a sonda Nabers é passante (\"tunnel\")?", "alternativas": {"A": "Classe I.", "B": "Classe II.", "C": "Classe III.", "D": "Classe IV.", "E": "Classe V."}, "gabarito": "C", "comentario": "O glossário, sob o item \"Furca\", descreve as classificações: \"Classe I: < 3 mm de profundidade horizontal. Classe II: ≥ 3 mm mas não passante. Classe III: passante, tunnel.\"\nDICA: O envolvimento de furca é um fator prognóstico importante para dentes multirradiculares, e sua classificação correta é essencial para o plano de tratamento e a expectativa de sucesso."}, {"enunciado": "A principal diferença entre gengivite e periodontite, de acordo com o texto, reside na presença de qual característica?", "alternativas": {"A": "Sangramento à sondagem.", "B": "Edema e eritema gengival.", "C": "Perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Presença de biofilme dental.", "E": "Dor espontânea."}, "gabarito": "C", "comentario": "O texto afirma explicitamente na Q2 do \"Quiz de Verificação\" que \"A principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\". As outras opções são características que podem estar presentes em ambas as condições (sangramento, edema, eritema, biofilme) ou não são critérios definidores da diferença (dor).\nDICA: Lembre-se que a perda de inserção clínica (NIC) é o marcador chave para diferenciar a gengivite (inflamação reversível sem perda de suporte) da periodontite (doença destrutiva com perda de suporte)."}, {"enunciado": "Qual dos seguintes fatores é um modificador de Grau C na classificação de periodontite de 2018, conforme o texto?", "alternativas": {"A": "Diabetes Mellitus tipo 2 controlado (HbA1c 6,5%).", "B": "Tabagismo de 5 cigarros/dia há 10 anos.", "C": "Tabagismo de 20 cigarros/dia há 40 anos.", "D": "Mobilidade Grau 1 em incisivos inferiores.", "E": "Perda óssea radiográfica horizontal em 20% dos dentes."}, "gabarito": "C", "comentario": "O texto, na Q8 do \"Quiz de Verificação\", menciona que \"Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C\". A opção C (20 cigarros/dia há 40 anos) se encaixa nesse critério. As outras opções, embora sejam fatores de risco ou características da doença, não são especificamente indicadas como modificadores de Grau C no texto (DM controlado é Grau B, 5 cigarros/dia é Grau B).\nDICA: Para concursos, é fundamental memorizar os critérios para cada Grau (A, B, C), especialmente os relacionados a tabagismo e Diabetes Mellitus. Tabagismo pesado (≥10 cigarros/dia) e DM descompensado são classicamente associados ao Grau C."}, {"enunciado": "Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio de periodontite, de acordo com o texto?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar com as informações."}, "gabarito": "C", "comentario": "A Q6 do \"Quiz de Verificação\" descreve exatamente este cenário e conclui: \"Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\"\nDICA: A distinção entre Estágio III e Estágio IV é crucial e baseia-se na presença de disfunção mastigatória (colapso de mordida, perda de múltiplos dentes, etc.). Se não há disfunção, mesmo com grande destruição, o máximo é Estágio III."}, {"enunciado": "Qual o ângulo recomendado entre a face interna da lâmina da cureta e a superfície radicular durante o movimento de raspagem, conforme o texto?", "alternativas": {"A": "30° a 40°", "B": "45° a 50°", "C": "60° a 65°", "D": "70° a 80°", "E": "90° a 95°"}, "gabarito": "D", "comentario": "O texto, na Q7 do \"Quiz de Verificação\", afirma que \"O ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular.\" Também explica as consequências de ângulos inadequados.\nDICA: A angulação correta dos instrumentos é fundamental para a eficácia do procedimento e para evitar trauma aos tecidos. Ângulos muito fechados (\"deslizam\") ou muito abertos (\"traumatizam\") são ineficazes e prejudiciais."}, {"enunciado": "Qual sonda é especificamente utilizada para detectar envolvimento de furca, e como são classificadas as classes de furca, segundo o texto?", "alternativas": {"A": "Sonda Carolina; Classe I (< 3 mm), Classe II (≥ 3 mm, não passante), Classe III (passante).", "B": "Sonda Periodontal Milimetrada; Classe I (< 3 mm), Classe II (≥ 3 mm, não passante), Classe III (passante).", "C": "Sonda Nabers; Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante), Classe III (passante, tunnel).", "D": "Sonda WHO; Classe I (< 3 mm), Classe II (≥ 3 mm, não passante), Classe III (passante).", "E": "Sonda Williams; Classe I (< 3 mm de profundidade), Classe II (≥ 3 mm, não passante), Classe III (passante)."}, "gabarito": "C", "comentario": "A Q5 do \"Quiz de Verificação\" responde diretamente a esta questão: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\"\nDICA: A Sonda Nabers é a única com curvatura apropriada para acessar as furcas e é um instrumento essencial no exame periodontal de dentes multirradiculares. Conhecer as classificações de furca é igualmente importante."}, {"enunciado": "De acordo com o \"Glossário Essencial de Periodontia\", o que a ausência de sangramento à sondagem indica?", "alternativas": {"A": "Inflamação ativa.", "B": "Necessidade de raspagem e alisamento radicular.", "C": "O melhor indicador de saúde gengival.", "D": "Presença de bolsa periodontal.", "E": "Perda de inserção clínica."}, "gabarito": "C", "comentario": "O glossário define \"SS — Sangramento à Sondagem\" e afirma: \"Ausência de SS é o melhor indicador de saúde gengival.\" As outras opções estão incorretas, pois sangramento à sondagem indica inflamação ativa, e a ausência é o oposto.\nDICA: A ausência de sangramento à sondagem é um dos parâmetros mais confiáveis para determinar a estabilidade e a saúde periodontal. Sua presença indica inflamação."}, {"enunciado": "Qual das seguintes afirmações sobre a Periodontite Estágio IV, Grau C, Generalizada, conforme o Caso 3, está correta?", "alternativas": {"A": "O prognóstico é excelente, com reversão completa.", "B": "O paciente apresenta controle rigoroso de DM e tabagismo.", "C": "O plano de tratamento inclui apenas instrução de higiene oral e raspagem supragengival.", "D": "É caracterizada por disfunção mastigatória (colapso de mordida) e perda de múltiplos dentes por doença periodontal.", "E": "A perda óssea radiográfica é horizontal em 20% dos dentes (1/3 coronário)."}, "gabarito": "D", "comentario": "O Caso 3 descreve a paciente com \"Queixa: perda de dentes, dificuldade para mastigar.\" e no exame clínico \"Perda de 6 dentes por doença periodontal. Disfunção mastigatória (colapso de mordida).\" Isso se alinha com a descrição do Estágio IV (Q6). As outras opções estão incorretas: o prognóstico é reservado; o DM está descompensado e tabagismo é intenso; o plano de tratamento é complexo, incluindo TPNC, cirurgias e reabilitação protética; e a perda óssea é avançada, não apenas em 1/3 coronário.\nDICA: Atente-se aos detalhes dos casos clínicos para correlacionar as características com os estágios e graus. A disfunção mastigatória é um indicador chave do Estágio IV."}, {"enunciado": "De acordo com o texto, quais são os dois eixos da classificação de periodontite de 2018?", "alternativas": {"A": "Gravidade e Recorrência.", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Tipo (crônica ou agressiva) e Localização (localizada ou generalizada).", "D": "Profundidade de Sondagem e Nível de Inserção Clínica.", "E": "Etiologia (induzida por biofilme ou não induzida por biofilme)."}, "gabarito": "B", "comentario": "A Q3 do \"Quiz de Verificação\" afirma claramente: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\"\nDICA: A classificação de 2018 é um marco na Periodontia. É fundamental conhecer seus dois eixos principais (Estágio e Grau) e o que cada um deles avalia."}, {"enunciado": "Qual é a definição de Nível de Inserção Clínica (NIC), conforme o \"Glossário Essencial de Periodontia\"?", "alternativas": {"A": "Distância em mm da margem gengival até o fundo da bolsa/sulco.", "B": "Sangramento que ocorre até 30 segundos após a sondagem.", "C": ", conforme o \"Glossário Essencial de Periodontia\"?", "D": "Deslocamento apical da margem gengival em relação à JEC.", "E": "Aprofundamento patológico do sulco gengival (> 3 mm)."}, "gabarito": "C", "comentario": "O glossário define \"NIC — Nível de Inserção Clínica\" como \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" As outras opções correspondem a outras definições do glossário (PS, SS, Recessão Gengival, Bolsa Periodontal).\nDICA: O NIC é a medida mais precisa da perda de suporte periodontal, pois utiliza a JEC como referência fixa, ao contrário da Profundidade de Sondagem (PS) que varia com a posição da margem gengival."}, {"enunciado": "Para que curetas e foices removam o cálculo de forma eficaz e sem causar trauma, qual condição é essencial, conforme o texto?", "alternativas": {"A": "Estarem esterilizadas.", "B": "Possuírem cabos ergonômicos.", "C": "Estarem sempre afiadas.", "D": "Serem de aço inoxidável.", "E": "Utilizarem pontas ultrassônicas."}, "gabarito": "C", "comentario": "Na seção \"7.2 Manutenção dos Instrumentos\", o texto afirma: \"Afiação: Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\"\nDICA: A afiação correta dos instrumentos manuais é um pilar da terapia periodontal. Instrumentos cegos não apenas são ineficazes, mas também podem causar mais danos e desconforto ao paciente."}, {"enunciado": "No Caso 2 (Periodontite Estágio II, Grau B, Generalizada), qual foi o fator de risco que contribuiu para a classificação de Grau B?", "alternativas": {"A": "Mobilidade Grau 1 em incisivos inferiores.", "B": "Diabetes Mellitus tipo 2 controlado (HbA1c 6,5%).", "C": "Perda óssea radiográfica horizontal em 20% dos dentes.", "D": "Tabagismo (5 cigarros/dia há 10 anos).", "E": "Sangramento à sondagem generalizado."}, "gabarito": "B", "comentario": "No Caso 2, o paciente tem \"Histórico: Tabagista (5 cigarros/dia há 10 anos). DM tipo 2 controlado (HbA1c 6,5%).\". O texto, na Q4, define Grau B como \"moderada\" e na Q8, embora fale de Grau C para tabagismo ≥ 10 cigarros/dia, o tabagismo de 5 cigarros/dia e o DM controlado são fatores que justificam um Grau B quando não há evidência de progressão rápida. O DM controlado (HbA1c 6,5%) é um modificador de Grau B, enquanto o tabagismo de 5 cigarros/dia também se encaixa no Grau B. No entanto, entre as opções, o DM controlado é explicitamente citado como um fator modulador.\nDICA: O texto indica que o Grau B é para progressão moderada e fatores de risco modificadores. O tabagismo de 5 cigarros/dia e o DM controlado são exemplos clássicos de fatores que levam ao Grau B."}, {"enunciado": "O que caracteriza a Terapia Periodontal Não Cirúrgica (TPNC), de acordo com o \"Glossário Essencial de Periodontia\"?", "alternativas": {"A": "Exclusivamente cirurgias periodontais.", "B": "Apenas instrução de higiene oral e controle de fatores de risco.", "C": ", de acordo com o \"Glossário Essencial de Periodontia\"?", "D": "Reabilitação protética complexa.", "E": "Somente raspagem supragengival e profilaxia."}, "gabarito": "C", "comentario": "O glossário define \"TPNC — Terapia Periodontal Não Cirúrgica\" como \"Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\"\nDICA: A TPNC é a base do tratamento periodontal e inclui uma abordagem abrangente que vai além da simples remoção de cálculo, englobando a educação do paciente e o controle de fatores sistêmicos."}, {"enunciado": "Qual a posição correta do paciente para facilitar o acesso à boca, conforme as orientações iniciais do texto?", "alternativas": {"A": "Deitado com a cabeça para trás.", "B": "Sentado, ereto, ombros relaxados e pés apoiados no chão.", "C": "Deitado de lado, com a cabeça apoiada.", "D": "Em pé, com inclinação para frente.", "E": "Sentado, com a cabeça inclinada para o lado."}, "gabarito": "B", "comentario": "No início do texto, sob o título \"Posicionamento do Paciente\", é descrito: \"ereta, ombros relaxados e pés apoiados no chão. O paciente deve estar em posição que facilite o acesso à boca.\"\nDICA: O posicionamento adequado do paciente é fundamental para a ergonomia do profissional e para o acesso e visibilidade do campo operatório, contribuindo para a eficácia e segurança do tratamento."}, {"enunciado": "No contexto da iluminação e campo de visão, o que é recomendado para o exame periodontal?", "alternativas": {"A": "Apenas refletor, evitando lupas.", "B": "Campo de visão indireto exclusivamente.", "C": "Uso de refletor e, se possível, lupas de aumento, com campo de visão direto ou indireto e sem sombras.", "D": "Iluminação ambiente apenas, para não ofuscar o paciente.", "E": "Campo de visão com sombras para realçar os detalhes."}, "gabarito": "C", "comentario": "Na seção \"Iluminação e Campo de Visão\", o texto orienta: \"Use refletor e, se possível, lupas de aumento. O campo de visão deve ser direto ou indireto (com espelho) e sem sombras.\"\nDICA: Uma boa iluminação e ampliação são cruciais para a detecção de cálculos, biofilme e outras alterações periodontais, garantindo um exame minucioso e um tratamento eficaz."}, {"enunciado": "Qual é a definição de \"Bolsa Periodontal\" de acordo com o \"Glossário Essencial de Periodontia\"?", "alternativas": {"A": "Deslocamento apical da margem gengival em relação à JEC.", "B": "Distância em mm da margem gengival até o fundo da bolsa/sulco.", "C": "Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "D": "Região de divisão das raízes em dentes multirradiculares.", "E": "Sangramento que ocorre até 30 segundos após a sondagem."}, "gabarito": "C", "comentario": "O glossário define \"Bolsa Periodontal\" como \"Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\" As outras opções definem recessão gengival, profundidade de sondagem, furca e sangramento à sondagem, respectivamente.\nDICA: A bolsa periodontal é o sinal clínico mais evidente da periodontite ativa, refletindo a destruição dos tecidos de suporte e a migração apical do epitélio juncional."}, {"enunciado": "No caso de Gengivite Induzida por Biofilme (Caso 1), qual o prognóstico esperado, com adesão à higiene?", "alternativas": {"A": "Reservado, exige manejo multidisciplinar.", "B": "Bom, com controle da progressão.", "C": "Excelente, com reversão completa.", "D": "Incerto, dependendo de cirurgias.", "E": "Ruim, devido à perda óssea."}, "gabarito": "C", "comentario": "No \"Caso 1: Gengivite Induzida por Biofilme\", o texto afirma: \"Prognóstico: Excelente, com reversão completa se houver adesão à higiene.\"\nDICA: A gengivite é uma condição reversível, e o prognóstico é geralmente excelente quando o paciente adere a uma boa higiene oral e ao tratamento proposto."}, {"enunciado": "Qual dos seguintes itens NÃO faz parte do Periodonto de Proteção, de acordo com a Q1 do \"Quiz de Verificação\"?", "alternativas": {"A": "Gengiva livre.", "B": "Gengiva inserida.", "C": "Gengiva interdental.", "D": "Cemento.", "E": "Todas as opções fazem parte do Periodonto de Proteção."}, "gabarito": "D", "comentario": "A Q1 do \"Quiz de Verificação\" lista: \"Periodonto de Proteção (gengiva livre, inserida, interdental) e Periodonto de Sustentação (cemento, ligamento periodontal, osso alveolar).\" O cemento é listado como parte do Periodonto de Sustentação, não de Proteção.\nDICA: Conhecer a divisão funcional do periodonto (proteção e sustentação) e os componentes de cada um é fundamental para a compreensão da anatomia e patologia periodontal."}, {"enunciado": "Um paciente com Periodontite Estágio II, Grau B, Generalizada (Caso 2) apresenta qual condição sistêmica controlada e qual hábito de risco, conforme o texto?", "alternativas": {"A": "Hipertensão controlada e alcoolismo.", "B": "Diabetes Mellitus tipo 2 controlado e tabagismo.", "C": "Doença cardíaca e tabagismo intenso.", "D": "Artrite reumatoide e estresse.", "E": "Doença renal crônica e dieta inadequada."}, "gabarito": "B", "comentario": "No \"Caso 2: Periodontite Estágio II, Grau B, Generalizada\", o histórico do paciente é: \"Tabagista (5 cigarros/dia há 10 anos). DM tipo 2 controlado (HbA1c 6,5%).\"\nDICA: É importante correlacionar as condições sistêmicas e hábitos de risco com o diagnóstico periodontal, pois eles são fatores modificadores do grau da doença e influenciam o plano de tratamento."}, {"enunciado": "O que é definido como \"Biofilme (Placa Dental)\" no \"Glossário Essencial de Periodontia\"?", "alternativas": {"A": "Depósitos minerais endurecidos na superfície dental.", "B": "Sangramento que ocorre à sondagem.", "C": "Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular.", "D": "Deslocamento apical da margem gengival.", "E": "Perda de inserção clínica."}, "gabarito": "C", "comentario": "O glossário define \"Biofilme (Placa Dental)\" como \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\"\nDICA: O biofilme é o principal agente etiológico das doenças periodontais. Compreender sua natureza e a importância de seu controle é essencial."}, {"enunciado": "Qual a principal característica que diferencia o Estágio IV do Estágio III na classificação de periodontite de 2018, de acordo com a Q6 do \"Quiz de Verificação\"?", "alternativas": {"A": "Apenas a quantidade de perda óssea radiográfica.", "B": "A presença de mobilidade dentária.", "C": "A presença de disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares).", "D": "A profundidade de sondagem.", "E": "O número de dentes afetados."}, "gabarito": "C", "comentario": "A Q6 do \"Quiz de Verificação\" afirma categoricamente: \"O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui [no exemplo dado], mesmo com a gravidade, o diagnóstico é Estágio III.\"\nDICA: Esta é uma das distinções mais importantes na nova classificação. A complexidade do Estágio IV não se resume apenas à perda tecidual, mas ao impacto funcional e reabilitador da doença."}, {"enunciado": "De acordo com a seção \"Anatomia do Periodonto\", qual das estruturas listadas faz parte do periodonto de proteção?", "alternativas": {"A": "Cemento radicular", "B": "Osso alveolar", "C": "Ligamento periodontal", "D": "Gengiva inserida", "E": "Fibras de Sharpey"}, "gabarito": "D", "comentario": "O texto divide o periodonto em duas grandes unidades funcionais: Periodonto de Proteção e Periodonto de Sustentação. O Periodonto de Proteção é composto pela gengiva livre (marginal), gengiva inserida (ceratinizada) e gengiva interdental (papila). As demais alternativas (cemento radicular, osso alveolar, ligamento periodontal e fibras de Sharpey) são componentes do Periodonto de Sustentação.\nDica: Memorize as divisões funcionais do periodonto e seus componentes, pois é um tema fundamental e frequentemente cobrado em concursos."}, {"enunciado": "Na seção \"Marcos Anatômicos Cruciais para o Diagnóstico\", qual estrutura é definida como o ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Bifurcação/trifurcação das raízes", "E": "Ligamento Periodontal"}, "gabarito": "C", "comentario": "O texto afirma explicitamente que a Junção Esmalte-Cemento (JEC) é o \"Ponto de referência para medir o NIC\". A Crista Alveolar indica a borda superior do osso alveolar, o Fundo da Bolsa é o ponto distal da medida de PS, e a Furca é a bifurcação/trifurcação das raízes.\nDica: A JEC é um marco anatômico crucial para o diagnóstico periodontal, especialmente para determinar a perda de inserção, que é o principal diferencial entre gengivite e periodontite."}, {"enunciado": "Conforme a \"Sequência Lógica de Progressão\" da doença periodontal, qual das seguintes características é REVERSÍVEL com a remoção do biofilme?", "alternativas": {"A": "Perda de inserção clínica na periodontite.", "B": "Perda óssea radiográfica na periodontite.", "C": "Inflamação restrita à gengiva marginal na gengivite.", "D": "Necrose de papilas nas doenças necrosantes.", "E": "Formação de bolsa periodontal."}, "gabarito": "C", "comentario": "O texto descreve a Gengivite Induzida por Biofilme como uma \"Inflamação restrita à gengiva marginal\" e afirma que é \"REVERSÍVEL com remoção do biofilme\". A periodontite, por outro lado, envolve perda de inserção e perda óssea, que não são reversíveis, embora a progressão possa ser controlada. Doenças necrosantes são formas graves que não são simplesmente reversíveis com remoção de biofilme, requerendo tratamento de urgência.\nDica: A reversibilidade da gengivite é um conceito-chave na periodontia e uma distinção fundamental em relação à periodontite."}, {"enunciado": "Qual é o diferencial crítico, segundo o texto, que permite diferenciar Gengivite de Periodontite?", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Profundidade de sondagem aumentada.", "C": "Presença de perda de inserção (NIC).", "D": "Cor rosa-coral da gengiva.", "E": "Edema e eritema gengival."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" destaca que a \"Perda de Inserção (NIC)\" é \"Ausente\" na gengivite e \"Presente (≥ 1 mm)\" na periodontite. O texto ainda reforça com um \"ERRO FREQUENTE\" que é confundir profundidade de sondagem aumentada com perda de inserção, e que \"Sem perda de NIC confirmada radiograficamente, o diagnóstico é GENGIVITE, não periodontite.\"\nDica: A perda de inserção clínica (NIC) é o marcador definitivo da periodontite, diferenciando-a da gengivite."}, {"enunciado": "A Nova Classificação (2018) da periodontite organiza a doença em dois eixos independentes e complementares. Quais são esses eixos?", "alternativas": {"A": "Crônica e Agressiva.", "B": "Localizada e Generalizada.", "C": "Estágio e Grau.", "D": "Gengivite e Periodontite.", "E": "Severidade e Extensão."}, "gabarito": "C", "comentario": "O texto afirma que \"A nova classificação (Tonetti, Greenwell & Kornman, 2018) abandona os termos 'crônica' e 'agressiva' e organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) e GRAU (A, B, C)\".\nDica: É crucial entender que a classificação de 2018 substituiu as antigas denominações e utiliza Estágio (gravidade e complexidade) e Grau (progressão e fatores de risco)."}, {"enunciado": "Na analogia \"Estágio = A Extensão do Estrago\", um paciente com \"NIC ≥ 5 mm\" e sem disfunção mastigatória se enquadraria em qual estágio?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar sem a PS."}, "gabarito": "C", "comentario": "A tabela \"Tabela de Sinais Clínicos por Estágio\" informa que o Estágio III apresenta \"NIC (perda de inserção) ≥ 5 mm\". O Estágio IV também tem NIC ≥ 5 mm, mas é obrigatoriamente acompanhado de disfunção mastigatória, que a questão explicitamente exclui (\"sem disfunção mastigatória\").\nDica: Preste atenção aos detalhes das características de cada estágio, especialmente os critérios limítrofes e as condições obrigatórias (como a disfunção mastigatória no Estágio IV)."}, {"enunciado": "Qual dos seguintes critérios, quando presente, OBRIGATORIAMENTE classifica a periodontite como Estágio IV, independentemente de outros achados?", "alternativas": {"A": "Perda óssea de 15-30%.", "B": "Presença de envolvimento de furca Classe I.", "C": "Profundidade de sondagem de 5 mm.", "D": "Disfunção mastigatória.", "E": "Perda de até 4 dentes."}, "gabarito": "D", "comentario": "O \"Macete\" no final da seção 3.3 é claro: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\"\nDica: Os \"macetes\" e \"dicas de prova\" no texto são pontos importantes que podem ser cobrados diretamente em questões, pois destacam informações cruciais para o diagnóstico."}, {"enunciado": "Um paciente com periodontite que apresenta tabagismo de 15 cigarros/dia e perda óssea > 2 mm/ano seria classificado em qual Grau?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Não é possível determinar sem o Estágio.", "E": "Grau B ou C, dependendo da HbA1c."}, "gabarito": "C", "comentario": "Na seção \"Grau = O Velocímetro da Doença\", o Grau C é descrito como \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" As condições descritas na questão (tabagismo de 15 cigarros/dia e perda óssea > 2 mm/ano) se encaixam perfeitamente na descrição do Grau C.\nDica: Lembre-se que o Grau reflete a velocidade de progressão e a influência de fatores de risco como tabagismo e diabetes."}, {"enunciado": "Qual é a pressão de sondagem recomendada para a realização do periograma completo, conforme o texto?", "alternativas": {"A": "0,5 N (≈ 50 g)", "B": "0,25 N (≈ 25 g)", "C": "1,0 N (≈ 100 g)", "D": "0,1 N (≈ 10 g)", "E": "A pressão varia de acordo com o sítio."}, "gabarito": "B", "comentario": "Na seção \"Periograma Completo (Sondagem Periodontal)\", o texto especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\"\nDica: A pressão de sondagem é um detalhe técnico importante para a padronização e confiabilidade do exame periodontal."}, {"enunciado": "Qual é a \"regra de ouro\" para o diagnóstico de periodontite, conforme destacado na seção \"Diagnóstico\"?", "alternativas": {"A": "Identificar sangramento à sondagem em mais de 10% dos sítios.", "B": "Medir profundidade de sondagem igual ou superior a 4 mm.", "C": "Confirmar perda de inserção clínica (NIC) com suporte radiográfico.", "D": "Avaliar a presença de edema e eritema gengival.", "E": "Excluir a presença de hiperplasia gengival."}, "gabarito": "C", "comentario": "A \"Regra de ouro\" é apresentada no final da seção 4: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\nDica: Esta é uma das informações mais importantes p
