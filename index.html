ara o diagnóstico correto e diferencial da periodontite, evitando erros comuns."}, {"enunciado": "Das sondas periodontais citadas, qual é a indicada para triagem epidemiológica, utilizando o índice CPITN?", "alternativas": {"A": "Carolina do Norte (UNC 15)", "B": "Nabers", "C": "OMS (WHO / CPITN)", "D": "Williams", "E": "Goldman-Fox"}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" indica a sonda \"OMS (WHO / CPITN)\" como tendo a \"Indicação Principal: Triagem epidemiológica (CPITN)\".\nDica: Conhecer as sondas e suas indicações específicas é fundamental para a prática clínica e para provas de concurso."}, {"enunciado": "Qual cureta Gracey é a correta para raspagem das faces DISTAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A seção \"Curetas Gracey: Mapa de Uso\" afirma: \"13/14 → Posteriores / Faces DISTAIS\". O texto ainda adiciona um \"ERRO CLÁSSICO\" sobre usar a 11/12 para distais de molares, reforçando que a 13/14 é a correta.\nDica: As curetas Gracey são área-específicas. Memorizar os pares e suas respectivas regiões e faces de atuação é crucial. O macete \"M de 11 = Mesial\" e \"D de 14 = Distal\" é muito útil."}, {"enunciado": "Durante a Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual é o ângulo ideal da lâmina em relação à superfície radicular para uma raspagem eficaz e sem trauma?", "alternativas": {"A": "0° (fechado)", "B": "15° a 30°", "C": "45° a 60°", "D": "70° a 80°", "E": "90°"}, "gabarito": "D", "comentario": "Na seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\", no item \"2. Posicionamento\", é indicado: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: O ângulo de trabalho é um dos pilares da técnica de instrumentação manual, garantindo eficácia e segurança."}, {"enunciado": "Qual é a principal limitação do uso do ultrassom (piezoelétrico/magnetoestritivo) em comparação com a instrumentação manual, conforme o texto?", "alternativas": {"A": "Maior fadiga do operador.", "B": "Eficácia reduzida em bolsas profundas.", "C": "Feedback tátil reduzido.", "D": "Maior risco de trauma tecidual.", "E": "Dificuldade de acesso em áreas interproximais."}, "gabarito": "C", "comentario": "Na seção \"Outros Instrumentos Importantes\", sobre o Ultrassom, é mencionado: \"Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\"\nDica: Conheça as vantagens e desvantagens de cada tipo de instrumento para poder escolher o mais adequado para cada situação clínica."}, {"enunciado": "De acordo com o texto, qual é a função das curetas McCall 13/14 e 17/18?", "alternativas": {"A": "Avaliação de furca.", "B": "Raspar faces mesiais de posteriores.", "C": "Remover cálculo subgengival em bolsas profundas.", "D": "Instrumentação supra-gengival e remoção de cálculo volumoso.", "E": "Alisamento radicular em superfícies distais."}, "gabarito": "D", "comentario": "Na seção \"Outros Instrumentos Importantes\", as McCall 13/14 e 17/18 são descritas como \"Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\"\nDica: As curetas universais são geralmente usadas para o cálculo supragengival e remoção inicial de grandes depósitos, antes da instrumentação mais fina com curetas Gracey."}, {"enunciado": "O texto utiliza uma analogia para explicar a perda óssea ao paciente. Qual é essa analogia?", "alternativas": {"A": "O telhado da casa que precisa de manutenção.", "B": "Um carro que avança rapidamente.", "C": "Uma pequena rachadura na parede.", "D": "Um filme esbranquiçado nos dentes.", "E": "Postes fincados no chão que perdem seu alicerce."}, "gabarito": "E", "comentario": "Na seção \"Explicando perda óssea\", o texto utiliza a analogia: \"Os seus dentes ficam presos no osso da mandíbula como se fossem postes fincados no chão. Esse osso é o alicerce do dente... É como se a terra em volta do poste fosse cedendo.\"\nDica: As analogias são ferramentas poderosas na comunicação com o paciente e podem ser cobradas para avaliar a compreensão do profissional sobre a explicação de conceitos complexos."}, {"enunciado": "Qual é a principal mensagem que o profissional deve transmitir ao paciente para explicar por que a gengiva sangra?", "alternativas": {"A": "Que o sangramento é normal após a escovação intensa.", "B": "Que o sangramento indica a presença de um biofilme que irrita a gengiva.", "C": "Que o corpo está pedindo socorro devido à inflamação.", "D": "Que o problema é irreversível e o dente será perdido.", "E": "Que a causa é exclusivamente genética."}, "gabarito": "C", "comentario": "Na seção \"Por que a gengiva sangra?\", o texto explica: \"O sangramento é um sinal de que as gengivas estão inflamadas — é o corpo pedindo socorro. A boa notícia é que, com higiene correta, isso melhora rapidamente.\" Embora a presença de biofilme (alternativa B) seja a causa, a explicação focada na mensagem para o paciente é a do \"corpo pedindo socorro\".\nDica: A comunicação eficaz envolve não apenas a causa, mas também a implicação para a saúde e a possibilidade de melhora."}, {"enunciado": "Qual dos seguintes medicamentos é citado no texto como podendo causar hiperplasia gengival?", "alternativas": {"A": "Fenitoína", "B": "Ciclosporina", "C": "Nifedipina", "D": "Todos os anteriores", "E": "Nenhuma das anteriores"}, "gabarito": "D", "comentario": "Na seção \"Anamnese Médica e Odontológica\", o texto lista: \"medicamentos (nifedipina → hiperplasia; fenitoína; ciclosporina)\". Portanto, todos os três podem causar hiperplasia gengival.\nDica: É importante conhecer os medicamentos que podem ter efeitos adversos na saúde periodontal, pois isso impacta diretamente o diagnóstico e o plano de tratamento."}, {"enunciado": "Segundo o texto, após a Realização da Raspagem e Alisamento Radicular (RAR), como se confirma se o alisamento foi adequado?", "alternativas": {"A": "Pela ausência total de sangramento à sondagem.", "B": "Pelo desaparecimento da mobilidade dental.", "C": "Pela superfície lisa ao toque da sonda periodontal.", "D": "Pela redução da profundidade de sondagem para ≤ 3 mm.", "E": "Pela mudança da cor da gengiva para rosa-coral."}, "gabarito": "C", "comentario": "No item \"5. Confirmação\" da seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\", é indicado: \"Passe a sonda periodontia após RAR: superfície lisa ao toque = alisamento adequado. Repita se sentir irregularidades.\"\nDica: O feedback tátil é um dos principais indicadores da eficácia da instrumentação manual."}, {"enunciado": "Qual é a principal função do ligamento periodontal, conforme descrito na seção \"Anatomia do Periodonto\"?", "alternativas": {"A": "Formar uma barreira física e imunológica contra microrganismos.", "B": "Ancorar o dente ao osso e absorver forças mastigatórias.", "C": "Proteger a raiz do dente de sensibilidade.", "D": "Estimular a formação de novo cemento radicular.", "E": "Manter a estabilidade da gengiva inserida."}, "gabarito": "B", "comentario": "Na subseção \"Periodonto de Sustentação\", o texto descreve a função do Ligamento Periodontal (LP): \"Função: ancorar o dente ao osso e absorver forças mastigatórias.\" As demais alternativas descrevem funções de outras estruturas ou não são a principal função do LP.\nDica: Entender a função de cada componente do periodonto é fundamental para compreender a patologia e o tratamento periodontal."}, {"enunciado": "A posição ideal do paciente durante um procedimento periodontal deve facilitar o acesso à boca e garantir o conforto do profissional. Além disso, a iluminação e o campo de visão são cruciais. Qual das alternativas a seguir descreve corretamente as características de uma iluminação e campo de visão adequados?", "alternativas": {"A": "O refletor pode ser usado, mas lupas de aumento são opcionais e não essenciais.", "B": "O campo de visão deve ser preferencialmente indireto, utilizando apenas o espelho.", "C": "A iluminação deve ser forte o suficiente para eliminar todas as sombras, e o campo de visão direto ou indireto.", "D": "A iluminação deve ser ajustada para evitar o ofuscamento do paciente, mesmo que isso comprometa o campo de visão.", "E": "Lupas de aumento são indicadas apenas para casos de periodontite avançada, não sendo necessárias para gengivite."}, "gabarito": "C", "comentario": "A alternativa C está correta, pois o texto afirma que \"Use refletor e, se possível, lupas de aumento. O campo de visão deve ser direto ou indireto (com espelho) e sem sombras.\" A eliminação de sombras é fundamental para a visualização clara do campo operatório.\nA) Incorreta. O texto sugere o uso de lupas de aumento, indicando sua importância, não apenas como opcionais.\nB) Incorreta. O campo de visão pode ser direto OU indireto, não preferencialmente apenas indireto.\nD) Incorreta. O objetivo é uma iluminação adequada que garanta o campo de visão sem ofuscar o paciente, mas a prioridade é a visibilidade do campo.\nE) Incorreta. Lupas de aumento auxiliam na visualização de detalhes, sendo úteis em qualquer procedimento que exija precisão, não se restringindo a casos avançados.\nDica: A ergonomia e a visibilidade são pilares para a execução de procedimentos odontológicos com segurança e eficácia."}, {"enunciado": "A manutenção dos instrumentos periodontais é um aspecto crítico para o sucesso do tratamento e a segurança do paciente. Em relação à afiação de curetas e foices, qual a principal razão pela qual instrumentos cegos são prejudiciais?", "alternativas": {"A": "Eles aumentam o tempo de procedimento, mas não comprometem a remoção do cálculo.", "B": "Eles escorregam, polêm o cálculo em vez de removê-lo, e podem causar trauma.", "C": "Eles exigem maior força de aplicação, o que pode levar à fadiga do operador.", "D": "Eles necessitam de esterilização mais frequente para compensar a perda de eficácia.", "E": "Eles causam um maior sangramento gengival devido à pressão inadequada exercida."}, "gabarito": "B", "comentario": "A alternativa B está correta. O texto afirma que \"Instrumentos cegos escorregam e polêm o cálculo, não o removem\", e o objetivo da afiação é \"remover o cálculo de forma eficaz e sem causar trauma\". Instrumentos cegos não removem o cálculo de forma eficiente e podem traumatizar os tecidos.\nA) Incorreta. Eles comprometem sim a remoção do cálculo, além de aumentar o tempo.\nC) Incorreta. Embora a fadiga possa ser uma consequência, a principal razão é a ineficácia e o trauma.\nD) Incorreta. A frequência de esterilização é padronizada e não se altera pela afiação do instrumento.\nE) Incorreta. O sangramento excessivo geralmente está associado à inflamação e à técnica inadequada, não diretamente à cegueira do instrumento de forma primária.\nDica: A afiação correta de instrumentos é um pilar da terapia periodontal mecânica. Instrumentos afiados aumentam a eficiência, reduzem o trauma e diminuem o desconforto do paciente."}, {"enunciado": "Um paciente de 25 anos, sexo feminino, apresenta queixa de sangramento gengival ao escovar. No exame clínico, observa-se gengiva edemaciada, eritematosa e sangramento à sondagem generalizado (> 30% dos sítios). Todas as profundidades de sondagem (PS) são ≤ 3 mm, o Nível de Inserção Clínica (NIC) está ausente e não há perda óssea radiográfica. Qual o diagnóstico e o prognóstico esperados para este caso?", "alternativas": {"A": "Periodontite Estágio I, Grau A, localizada; prognóstico bom.", "B": "Gengivite induzida por biofilme, generalizada; prognóstico excelente.", "C": "está ausente e não há perda óssea radiográfica. Qual o diagnóstico e o prognóstico esperados para este caso?", "D": "Gengivite associada a trauma por escovação; prognóstico variável.", "E": "Periodontite agressiva, generalizada; prognóstico ruim."}, "gabarito": "B", "comentario": "A alternativa B está correta. O texto descreve o Caso 1 com exatamente essas características: \"Gengiva edemaciada, eritematosa, sangramento à sondagem generalizado (> 30% dos sítios). PS ≤ 3 mm em todos os dentes. NIC ausente. Ausência de perda óssea radiográfica.\" O diagnóstico é \"Gengivite induzida por biofilme, generalizada\" e o prognóstico é \"Excelente, com reversão completa se houver adesão à higiene\".\nA) Incorreta. Não há perda de inserção clínica nem perda óssea, o que exclui o diagnóstico de periodontite.\nC) Incorreta. As PS e a ausência de NIC não se encaixam neste diagnóstico.\nD) Incorreta. Embora haja sangramento, a descrição clínica se encaixa perfeitamente na gengivite induzida por biofilme.\nE) Incorreta. Não há sinais de periodontite nem de agressividade.\nDica: A ausência de NIC e perda óssea radiográfica são os principais diferenciadores entre gengivite e periodontite."}, {"enunciado": "Um paciente de 40 anos, sexo masculino, tabagista (5 cigarros/dia há 10 anos) e com DM tipo 2 controlado (HbA1c 6,5%), apresenta dentes \"moles\" e sangramento. O exame clínico revela gengiva edemaciada, sangramento à sondagem generalizado, PS de 4–5 mm em vários sítios, NIC de 3–4 mm em 40% dos sítios e perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário). Há mobilidade Grau 1 em incisivos inferiores. Qual o diagnóstico e o Grau da doença, de acordo com a classificação de 2018?", "alternativas": {"A": "Periodontite Estágio I, Grau A, Generalizada.", "B": "Periodontite Estágio II, Grau B, Generalizada.", "C": "Periodontite Estágio III, Grau C, Localizada.", "D": "Periodontite Estágio II, Grau C, Generalizada.", "E": "Gengivite associada a fatores sistêmicos."}, "gabarito": "B", "comentario": "A alternativa B está correta. O Caso 2 no texto corresponde a essa descrição. \"PS 4–5 mm em vários sítios. NIC 3–4 mm em 40% dos sítios. Perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário). Mobilidade Grau 1 em incisivos inferiores.\" Isso indica Estágio II (perda de inserção clínica de 3-4 mm, perda óssea no 1/3 coronário, sem perda dentária significativa por periodontite). O tabagismo de 5 cigarros/dia por 10 anos e DM tipo 2 controlado (HbA1c 6,5%) se enquadram no Grau B (tabagismo < 10 cigarros/dia e DM controlado). A generalização (>30% dos sítios afetados) também está presente.\nA) Incorreta. O NIC de 3-4 mm e a perda óssea já caracterizam Estágio II.\nC) Incorreta. O NIC não é tão avançado para Estágio III, e o tabagismo de 5 cigarros/dia não é Grau C (que seria para ≥ 10 cigarros/dia). A doença é generalizada.\nD) Incorreta. O tabagismo de 5 cigarros/dia não classifica como Grau C; seria Grau B.\nE) Incorreta. Há perda de inserção clínica e perda óssea, caracterizando periodontite.\nDica: É fundamental diferenciar os critérios de Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco) na classificação de periodontite de 2018. O tabagismo é um fator de risco importante para o Grau."}, {"enunciado": "Um paciente de 60 anos, sexo feminino, refere perda de dentes e dificuldade para mastigar. Seu histórico inclui DM tipo 2 descompensado (HbA1c 9%) e tabagismo (20 cigarros/dia há 40 anos). O exame clínico revela gengiva retraída, sangramento à sondagem, PS ≥ 6 mm em múltiplos sítios, NIC ≥ 5 mm em 80% dos sítios, perda óssea radiográfica avançada (além do 1/3 médio), perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida). Qual o diagnóstico completo de acordo com a classificação de periodontite de 2018?", "alternativas": {"A": "Periodontite Estágio III, Grau B, Generalizada.", "B": "Periodontite Estágio IV, Grau B, Generalizada.", "C": "Periodontite Estágio III, Grau C, Generalizada.", "D": "Periodontite Estágio IV, Grau C, Generalizada.", "E": "Periodontite Estágio II, Grau C, Localizada."}, "gabarito": "D", "comentario": "A alternativa D está correta. O Caso 3 no texto corresponde a essa descrição. As características de perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida) são cruciais para classificar como Estágio IV. A perda óssea avançada e NIC ≥ 5 mm também reforçam a gravidade. Em relação ao Grau, o tabagismo de 20 cigarros/dia e o DM tipo 2 descompensado (HbA1c 9%) são fatores que classificam como Grau C (velocidade de progressão rápida). A doença é generalizada.\nA) Incorreta. A perda de dentes por periodontite e o colapso de mordida indicam Estágio IV, não Estágio III.\nB) Incorreta. O tabagismo de 20 cigarros/dia e DM descompensado caracterizam Grau C, não Grau B.\nC) Incorreta. A perda de dentes por periodontite e o colapso de mordida indicam Estágio IV, não Estágio III.\nE) Incorreta. As PS e NIC são muito avançadas para Estágio II, e a doença é generalizada.\nDica: O Estágio IV é caracterizado pela perda dentária por periodontite e/ou disfunção mastigatória severa (colapso de mordida, migrações patológicas). Fatores de risco como tabagismo pesado e DM descompensado elevam o Grau para C."}, {"enunciado": "Qual é a principal diferença entre gengivite e periodontite, de acordo com o texto e o conhecimento em Periodontia?", "alternativas": {"A": "A gengivite é sempre localizada, enquanto a periodontite é sempre generalizada.", "B": "A gengivite é uma inflamação que não causa sangramento, diferente da periodontite.", "C": "A periodontite é caracterizada pela presença de perda de inserção clínica (NIC) e perda óssea radiográfica, enquanto a gengivite é uma inflamação restrita à gengiva sem perda de suporte.", "D": "A gengivite é reversível com higiene adequada, mas a periodontite não é.", "E": "A periodontite afeta apenas o periodonto de sustentação, enquanto a gengivite afeta o periodonto de proteção."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto afirma explicitamente na Q2: \"Qual a principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\"\nA) Incorreta. Ambas podem ser localizadas ou generalizadas.\nB) Incorreta. O sangramento é um sinal clássico de inflamação em ambas as condições.\nD) Incorreta. Embora a gengivite seja reversível, a periodontite pode ser controlada e ter sua progressão interrompida, mas a perda de inserção não é totalmente reversível.\nE) Incorreta. Ambas afetam o periodonto de proteção inicialmente, mas a periodontite progride para o de sustentação.\nDica: A perda de inserção clínica (NIC) e a perda óssea radiográfica são os marcadores-chave para diferenciar periodontite de gengivite."}, {"enunciado": "A classificação de periodontite de 2018 utiliza dois eixos principais para descrever a doença. Quais são esses dois eixos?", "alternativas": {"A": "Gravidade da inflamação e extensão da doença.", "B": "Profundidade de sondagem e nível de inserção clínica.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Localizada ou Generalizada e Crônica ou Agressiva.", "E": "Resposta ao tratamento e prognóstico a longo prazo."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q3, pergunta: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\"\nA) Incorreta. Embora sejam características da doença, não são os nomes dos eixos da classificação.\nB) Incorreta. São parâmetros clínicos usados para determinar o estágio e o grau, mas não os eixos em si.\nD) Incorreta. \"Localizada ou Generalizada\" é uma extensão da doença, e a classificação de 2018 substituiu os termos \"Crônica\" e \"Agressiva\".\nE) Incorreta. São resultados ou considerações, não os eixos da classificação.\nDica: A compreensão dos eixos Estágio e Grau é fundamental para aplicar corretamente a classificação de 2018."}, {"enunciado": "O que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A extensão da perda de inserção clínica e a quantidade de perda óssea radiográfica.", "B": "A presença de fatores de complexidade como mobilidade dentária e envolvimento de furca.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência direta de progressão ou fatores de risco modificadores como tabagismo e DM.", "D": "O número de dentes perdidos devido à doença periodontal e a presença de disfunção mastigatória.", "E": "A presença de sangramento à sondagem em mais de 30% dos sítios."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q4, pergunta: \"O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\"\nA) Incorreta. Estes são critérios para o Estágio.\nB) Incorreta. Estes são fatores de complexidade que influenciam o Estágio.\nD) Incorreta. Estes são critérios para o Estágio IV.\nE) Incorreta. O sangramento à sondagem indica inflamação, mas não define o Grau.\nDica: Lembre-se que o Grau é dinâmico e considera a biologia da doença e a resposta do hospedeiro, modulada por fatores de risco."}, {"enunciado": "Qual sonda é utilizada especificamente para detectar o envolvimento de furca e como são classificadas as furcas?", "alternativas": {"A": "Sonda Carolina do Norte; Classe I (< 3 mm), Classe II (≥ 3 mm), Classe III (passante).", "B": "Sonda Nabers; Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante), Classe III (passante).", "C": "Sonda OMS; Grau 1 (até 1 mm), Grau 2 (> 1 mm), Grau 3 (em todas as direções).", "D": "Sonda periodontal padrão; Classe A (lenta), Classe B (moderada), Classe C (rápida).", "E": "Sonda de Williams; Estágio I, Estágio II, Estágio III, Estágio IV."}, "gabarito": "B", "comentario": "A alternativa B está correta. O texto, na Q5, pergunta: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\"\nA) Incorreta. A Sonda Carolina do Norte é uma sonda periodontal padrão, não específica para furca.\nC) Incorreta. A Sonda OMS é para triagem, e os graus referem-se à mobilidade, não à furca.\nD) Incorreta. A classificação A, B, C refere-se ao Grau de periodontite, não à furca.\nE) Incorreta. A Sonda de Williams é uma sonda periodontal padrão, e os estágios são da periodontite.\nDica: A sonda Nabers é um instrumento essencial para o diagnóstico em dentes multirradiculares. A classificação da furca é importante para o plano de tratamento e prognóstico."}, {"enunciado": "Um paciente apresenta Nível de Inserção Clínica (NIC) de 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária por doença periodontal e SEM colapso de mordida. Qual o Estágio da periodontite, de acordo com a classificação de 2018?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária por doença periodontal e SEM colapso de mordida. Qual o Estágio da periodontite, de acordo com a classificação de 2018?", "D": "Estágio IV", "E": "Estágio indeterminado"}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q6, apresenta um cenário muito similar: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\"\nA) Incorreta. NIC de 6 mm e perda óssea avançada são incompatíveis com Estágio I.\nB) Incorreta. NIC de 6 mm e perda óssea avançada são incompatíveis com Estágio II.\nD) Incorreta. A ausência de perda dentária por periodontite e colapso de mordida impede a classificação como Estágio IV.\nE) Incorreta. Os dados são suficientes para a classificação.\nDica: A distinção entre Estágio III e Estágio IV é crucial e frequentemente reside na presença de perda dentária por periodontite e/ou sinais de disfunção mastigatória severa."}, {"enunciado": "Qual o ângulo recomendado da cureta durante o movimento de raspagem para remover o cálculo de forma eficaz e sem causar trauma?", "alternativas": {"A": "Menos de 45° entre a face interna da lâmina e a superfície radicular.", "B": "Exatamente 90° entre a face interna da lâmina e a superfície radicular.", "C": "Entre 70° e 80° entre a face interna da lâmina e a superfície radicular.", "D": "Entre 45° e 60° entre a face interna da lâmina e a superfície radicular.", "E": "O ângulo não é relevante, desde que a pressão seja adequada."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q7, pergunta: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\"\nA) Incorreta. Ângulos < 45° resultam em raspagem ineficaz.\nB) Incorreta. Ângulos > 90° causam trauma tecidual.\nD) Incorreta. Este intervalo não é o ideal para a raspagem.\nE) Incorreta. O ângulo é extremamente relevante para a eficácia e segurança do procedimento.\nDica: Dominar o ângulo de trabalho da cureta é essencial para a terapia periodontal mecânica. Um ângulo incorreto pode levar à remoção incompleta do cálculo ou ao trauma dos tecidos radiculares e gengivais."}, {"enunciado": "Por que o tabagismo é considerado um modificador de Grau C na classificação de periodontite de 2018, especialmente em casos de consumo significativo?", "alternativas": {"A": "Porque o tabaco causa diretamente a perda óssea, independentemente da presença de biofilme.", "B": "Porque o tabaco aumenta a proliferação bacteriana no sulco gengival, tornando o biofilme mais agressivo.", "C": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque o tabaco altera a cor da gengiva, dificultando o diagnóstico visual.", "E": "Porque o tabaco induz a formação de bolsas periodontais mais profundas rapidamente."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q8, pergunta: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\"\nA) Incorreta. O tabaco é um fator de risco que modula a resposta do hospedeiro, mas a periodontite é induzida por biofilme.\nB) Incorreta. Embora possa haver alterações na microbiologia, o principal impacto do tabaco é na resposta do hospedeiro.\nD) Incorreta. A alteração de cor é um efeito, mas não a razão para ser um modificador de Grau C.\nE) Incorreta. O tabaco acelera a progressão da doença, o que pode levar a bolsas mais profundas, mas a razão primária é a imunossupressão e a alteração da resposta tecidual.\nDica: O tabagismo é um dos fatores de risco mais impactantes na periodontite, influenciando não apenas a progressão da doença, mas também a resposta ao tratamento."}, {"enunciado": "De acordo com o glossário, o que é o Nível de Inserção Clínica (NIC) e qual a sua importância?", "alternativas": {"A": "É a distância da margem gengival até o fundo da bolsa/sulco, indicando a profundidade da inflamação.", "B": "É a distância da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco, sendo uma medida de referência para quantificar a perda de suporte periodontal.", "C": "e qual a sua importância?", "D": "É a distância entre a JEC e a margem gengival, indicando a quantidade de recessão.", "E": "É a medida da mobilidade dentária em milímetros."}, "gabarito": "B", "comentario": "A alternativa B está correta. O glossário define NIC como: \"NIC — Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\"\nA) Incorreta. Esta é a definição de Profundidade de Sondagem (PS).\nC) Incorreta. Embora a recessão influencie, o NIC é a medida da JEC ao fundo da bolsa, independentemente da recessão.\nD) Incorreta. Esta é a medida da recessão gengival.\nE) Incorreta. O NIC não tem relação com a mobilidade dentária.\nDica: O NIC é a medida mais fidedigna da perda de suporte periodontal, pois utiliza um ponto fixo (JEC) como referência, diferentemente da PS que varia com a posição da margem gengival."}, {"enunciado": "Em relação à Profundidade de Sondagem (PS) e ao Nível de Inserção Clínica (NIC), qual afirmação está correta?", "alternativas": {"A": "A PS é a medida mais precisa da perda de suporte periodontal, pois é um ponto fixo.", "B": "O NIC difere da PS apenas quando há hiperplasia gengival.", "C": ", qual afirmação está correta?", "D": "O NIC é sempre igual à PS em uma gengiva saudável.", "E": "A PS e o NIC são sinônimos e podem ser usados indistintamente."}, "gabarito": "C", "comentario": "A alternativa C está correta. O glossário define PS como: \"PS — Profundidade de Sondagem: Distância em mm da margem gengival até o fundo da bolsa/sulco. Difere do NIC quando há recessão ou hiperplasia gengival.\"\nA) Incorreta. O NIC é a medida mais precisa da perda de suporte, pois a JEC é um ponto fixo. A PS varia com a margem gengival.\nB) Incorreta. Difere tanto em casos de recessão quanto de hiperplasia.\nD) Incorreta. Em uma gengiva saudável, a margem gengival está ligeiramente coronal à JEC, então a PS seria 1-3 mm e o NIC seria 0 (considerando a JEC como 0).\nE) Incorreta. São medidas distintas com propósitos e pontos de referência diferentes.\nDica: Compreender a diferença entre PS e NIC é fundamental para o diagnóstico e monitoramento da doença periodontal. A PS mede a profundidade do sulco/bolsa, enquanto o NIC mede a perda de inserção tecidual."}, {"enunciado": "O Sangramento à Sondagem (SS) é um importante indicador no exame periodontal. O que a ausência de Sangramento à Sondagem (SS) indica?", "alternativas": {"A": "A ausência de cálculo subgengival.", "B": "A presença de gengivite crônica.", "C": "O melhor indicador de saúde gengival.", "D": "A necessidade de tratamento cirúrgico.", "E": "A presença de periodontite em remissão."}, "gabarito": "C", "comentario": "A alternativa C está correta. O glossário define SS como: \"SS — Sangramento à Sondagem: Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\"\nA) Incorreta. Pode haver cálculo sem sangramento, especialmente se a inflamação estiver controlada ou o paciente for tabagista.\nB) Incorreta. A ausência de SS indica saúde, não gengivite.\nD) Incorreta. Não há relação direta com a necessidade de cirurgia.\nE) Incorreta. A ausência de SS é um indicador de saúde ou estabilidade, não necessariamente de periodontite em remissão, que ainda pode ter sequelas da doença.\nDica: A ausência de sangramento à sondagem é um sinal crucial de estabilidade periodontal e saúde gengival. É um objetivo primário da terapia periodontal."}, {"enunciado": "A Terapia Periodontal Não Cirúrgica (TPNC) é a primeira linha de tratamento para todos os estágios da periodontite. Qual dos procedimentos a seguir NÃO faz parte da TPNC, conforme descrito no texto?", "alternativas": {"A": "Instrução de Higiene Oral (IHO).", "B": "Controle de fatores de risco (como tabagismo e DM).", "C": "é a primeira linha de tratamento para todos os estágios da periodontite. Qual dos procedimentos a seguir NÃO faz parte da TPNC, conforme descrito no texto?", "D": "Cirurgias periodontais.", "E": "Reavaliação."}, "gabarito": "D", "comentario": "A alternativa D está correta. O glossário define TPNC como: \"TPNC — Terapia Periodontal Não Cirúrgica: Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\" Cirurgias periodontais são procedimentos cirúrgicos, não fazem parte da terapia não cirúrgica.\nA) Incorreta. IHO é um componente essencial da TPNC.\nB) Incorreta. O controle de fatores de risco é crucial na TPNC.\nC) Incorreta. RAR é o principal procedimento mecânico da TPNC.\nE) Incorreta. A reavaliação é uma etapa fundamental para monitorar a resposta ao tratamento.\nDica: A TPNC é a base do tratamento periodontal, visando o controle da infecção e da inflamação antes de considerar intervenções mais complexas."}, {"enunciado": "O periodonto é dividido em duas principais divisões funcionais. Quais são elas?", "alternativas": {"A": "Gengiva livre e gengiva inserida.", "B": "Cemento e ligamento periodontal.", "C": "Periodonto de Proteção e Periodonto de Sustentação.", "D": "Gengiva e osso alveolar.", "E": "Epitélio juncional e epitélio sulcular."}, "gabarito": "C", "comentario": "A alternativa C está correta. O texto, na Q1, pergunta: \"Quais são as duas principais divisões funcionais do periodonto? ✔ Periodonto de Proteção (gengiva livre, inserida, interdental) e Periodonto de Sustentação (cemento, ligamento periodontal, osso alveolar).\"\nA) Incorreta. São partes do periodonto de proteção.\nB) Incorreta. São partes do periodonto de sustentação.\nD) Incorreta. São componentes do periodonto, mas não as duas divisões funcionais principais.\nE) Incorreta. São estruturas epiteliais da gengiva.\nDica: Entender a divisão funcional do periodonto ajuda a compreender a patogênese da doença periodontal e a função de cada componente."}, {"enunciado": "De acordo com o glossário, o que caracteriza a Mobilidade Dental Grau 3?", "alternativas": {"A": "Movimento horizontal até 1 mm.", "B": "Movimento horizontal maior que 1 mm.", "C": "Movimento em todas as direções, incluindo vertical (axial).", "D": "Movimento apenas na direção vestíbulo-lingual.", "E": "Ausência total de movimento."}, "gabarito": "C", "comentario": "A alternativa C está correta. O glossário define Mobilidade Dental como: \"Mobilidade Dental: Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\"\nA) Incorreta. Esta é a definição de Grau 1.\nB) Incorreta. Esta é a definição de Grau 2.\nD) Incorreta. O Grau 3 envolve todas as direções.\nE) Incorreta. A ausência de movimento é a condição fisiológica.\nDica: A avaliação da mobilidade dentária é um parâmetro importante no diagnóstico periodontal e na determinação do prognóstico dentário."}, {"enunciado": "A Junção Esmalte-Cemento (JEC) é um ponto anatômico de grande relevância em periodontia. Qual a sua principal função como ponto de referência?", "alternativas": {"A": "Indica a presença de biofilme na superfície radicular.", "B": "É o limite entre a gengiva livre e a gengiva inserida.", "C": "é um ponto anatômico de grande relevância em periodontia. Qual a sua principal função como ponto de referência?", "D": "Delimita a profundidade da bolsa periodontal.", "E": "Determina a localização da furca em dentes multirradiculares."}, "gabarito": "C", "comentario": "A alternativa C está correta. O glossário define JEC como: \"JEC — Junção Esmalte-Cemento: Limite anatômico entre esmalte coronário e cemento radicular. Ponto de referência fixo para mensuração do NIC.\"\nA) Incorreta. A JEC não indica a presença de biofilme.\nB) Incorreta. O limite entre gengiva livre e inserida é a linha mucogengival.\nD) Incorreta. A JEC é um ponto de referência para a perda de inserção, não para a profundidade da bolsa em si.\nE) Incorreta. A furca é a região de divisão das raízes, sem relação direta com a JEC.\nDica: A JEC é um marco anatômico estável, crucial para a avaliação da perda de inserção e para a diferenciação entre recessão gengival e perda de inserção verdadeira."}, {"enunciado": "A Recessão Gengival é uma condição comum e relevante. Como o texto a descreve?", "alternativas": {"A": "Aprofundamento patológico do sulco gengival devido à migração apical do epitélio juncional.", "B": "Deslocamento apical da margem gengival em relação à Junção Esmalte-Cemento (JEC), expondo a superfície radicular.", "C": ", expondo a superfície radicular.", "D": "Perda óssea radiográfica que expõe as raízes dos dentes.", "E": "Aumento do volume gengival devido a fatores inflamatórios."}, "gabarito": "B", "comentario": "A alternativa B está correta. O glossário define Recessão Gengival como: \"Recessão Gengival: Deslocamento apical da margem gengival em relação à JEC, expondo a superfície radicular.\"\nA) Incorreta. Esta é a definição de bolsa periodontal.\nC) Incorreta. Esta é uma descrição de gengivite ou inflamação.\nD) Incorreta. A recessão é o deslocamento do tecido mole, não a perda óssea em si, embora muitas vezes estejam associadas.\nE) Incorreta. Esta é a definição de hiperplasia gengival.\nDica: A recessão gengival é uma sequela comum da doença periodontal ou de fatores traumáticos, e sua mensuração é essencial para o plano de tratamento e prognóstico."}, {"enunciado": "De acordo com a \"Apostila de Periodontia\", qual das alternativas apresenta corretamente os componentes do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular, ligamento periodontal e gengiva inserida.", "B": "Gengiva livre, gengiva inserida e osso alveolar.", "C": "Gengiva livre, gengiva interdental e ligamento periodontal.", "D": "Gengiva livre, gengiva inserida e gengiva interdental.", "E": "Osso alveolar, gengiva interdental e cemento radicular."}, "gabarito": "D", "comentario": "O texto define o Periodonto de Proteção como sendo composto pela gengiva livre (marginal), gengiva inserida (ceratinizada) e gengiva interdental (papila). Sua função principal é atuar como barreira física e imunológica. As demais alternativas incluem componentes do periodonto de sustentação (cemento radicular, ligamento periodontal, osso alveolar) ou excluem partes do periodonto de proteção.\nDica: Memorizar as divisões funcionais do periodonto (proteção e sustentação) e seus respectivos componentes é fundamental para o diagnóstico e compreensão das doenças periodontais."}, {"enunciado": "Ainda sobre a anatomia do periodonto, qual a importância clínica da Junção Esmalte-Cemento (JEC) para o diagnóstico periodontal?", "alternativas": {"A": "Indica o nível da crista alveolar.", "B": "É o ponto de referência para medir o Nível de Inserção Clínica (NIC).", "C": "para o diagnóstico periodontal?", "D": "Determina a presença de envolvimento de furca.", "E": "É o limite apical da bolsa/sulco."}, "gabarito": "B", "comentario": "O texto destaca a JEC como um \"Ponto de referência para medir o NIC\" na tabela de \"Marcos Anatômicos Cruciais para o Diagnóstico\". As outras alternativas descrevem a importância clínica de outras estruturas, como a crista alveolar (nível ósseo), o fundo da bolsa (ponto distal da medida de PS), ou o envolvimento de furca (sonda Nabers).\nDica: A JEC é um marco anatômico estável e, por isso, é crucial para a avaliação da perda de inserção, que é o principal indicador de periodontite."}, {"enunciado": "Um paciente apresenta gengiva com cor rosa-coral, consistência firme, contorno festonado, sulco gengival de 2 mm e sangramento à sondagem em 5% dos sítios. De acordo com a \"Apostila de Periodontia\", qual o diagnóstico mais provável para este paciente?", "alternativas": {"A": "Gengivite Induzida por Biofilme.", "B": "Periodontite Estágio I.", "C": "Saúde Periodontal.", "D": "Doença Necrosante.", "E": "Periodontite Estágio IV."}, "gabarito": "C", "comentario": "O texto define \"Saúde Periodontal\" como: \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" As características do paciente se encaixam perfeitamente nesta descrição. Gengivite teria sangramento em ≥ 10% dos sítios. Periodontite envolveria perda de inserção e óssea. Doenças necrosantes têm características clínicas mais graves e específicas (necrose, dor intensa).\nDica: Prestar atenção aos critérios quantitativos (percentual de sangramento, profundidade de sondagem) é essencial para diferenciar saúde de gengivite."}, {"enunciado": "Qual é o critério diferencial crítico que, quando presente, confirma o diagnóstico de Periodontite e a distingue da Gengivite, segundo a \"Apostila de Periodontia\"?", "alternativas": {"A": "Profundidade de Sondagem aumentada (≥ 4 mm).", "B": "Presença de sangramento à sondagem.", "C": "Perda de Inserção Clínica (NIC) presente.", "D": "Edema e eritema gengival.", "E": "Reversibilidade total do quadro com remoção de biofilme."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" aponta a \"Perda de Inserção (NIC)\" como \"Ausente\" na gengivite e \"Presente (≥ 1 mm)\" na periodontite. O texto ainda reforça na \"Regra de ouro\" que \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.\" Profundidade de sondagem aumentada pode ocorrer na gengivite por hiperplasia, e o sangramento, edema e eritema são comuns em ambas as condições inflamatórias. Reversibilidade total é característica da gengivite.\nDica: A perda de inserção clínica (NIC) é o divisor de águas entre gengivite e periodontite. É o sinal mais importante de destruição dos tecidos de suporte."}, {"enunciado": "A nova Classificação de Doenças Periodontais (2018) organiza a periodontite em dois eixos independentes e complementares. Quais são esses eixos e o que eles descrevem?", "alternativas": {"A": "Extensão (localizada/generalizada) e Atividade (ativa/inativa).", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Tipo (crônica/agressiva) e Subtipo (localizada/generalizada).", "D": "Severidade (leve/moderada/grave) e Prognóstico (bom/reservado/ruim).", "E": "Fatores Predisponentes (genéticos/ambientais) e Fatores Modificadores (sistêmicos/locais)."}, "gabarito": "B", "comentario": "O texto afirma: \"A nova classificação (Tonetti, Greenwell & Kornman, 2018) abandona os termos \"crônica\" e \"agressiva\" e organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) – Descreve a gravidade (...) e a complexidade do tratamento necessário. GRAU (A, B, C) – Descreve a velocidade de progressão e os fatores de risco (...)\". As demais alternativas remetem a classificações antigas ou a conceitos que não são os eixos principais da classificação de 2018.\nDica: É crucial entender a lógica por trás da classificação de 2018, pois ela direciona o plano de tratamento e o prognóstico da doença."}, {"enunciado": "Um paciente apresenta Nível de Inserção Clínica (NIC) de 4 mm, Profundidade de Sondagem (PS) de 5 mm e perda óssea radiográfica correspondente a 25% do comprimento radicular (1/3 coronário). De acordo com a \"Tabela de Sinais Clínicos por Estágio\" da Apostila, qual o Estágio da Periodontite deste paciente?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "de 4 mm, Profundidade de Sondagem (PS) de 5 mm e perda óssea radiográfica correspondente a 25% do comprimento radicular (1/3 coronário). De acordo com a \"Tabela de Sinais Clínicos por Estágio\" da Apostila, qual o Estágio da Periodontite deste paciente?", "D": "Estágio IV.", "E": "Não é possível determinar sem o envolvimento de furca."}, "gabarito": "B", "comentario": "De acordo com a tabela, para o Estágio II, os critérios são: NIC de 3–4 mm, PS ≤ 5 mm e Perda Óssea (RX) de 15–30% (1/3 coronário). Os dados do paciente (NIC 4 mm, PS 5 mm, perda óssea 25%) se encaixam perfeitamente nos critérios do Estágio II. Estágio I tem NIC 1-2mm e PS ≤ 4mm. Estágios III e IV têm NIC ≥ 5mm.\nDica: A memorização dos critérios de NIC, PS e perda óssea por estágio é fundamental para a correta classificação."}, {"enunciado": "Qual das seguintes condições, quando presente, automaticamente classifica a periodontite como Estágio IV, independentemente de outros parâmetros, segundo a \"Apostila de Periodontia\"?", "alternativas": {"A": "Perda de 4 dentes devido à periodontite.", "B": "Envolvimento de furca Classe II.", "C": "Defeitos ósseos verticais ≥ 3 mm.", "D": "Disfunção mastigatória (colapso de mordida, migrações).", "E": "Profundidade de sondagem ≥ 6 mm."}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"Tabela de Sinais Clínicos por Estágio\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" As outras opções são características que podem estar presentes em Estágios III ou IV, mas não são o critério \"obrigatório\" que define o Estágio IV por si só, como a disfunção mastigatória.\nDica: A disfunção mastigatória é um indicador de grande complexidade e severidade, justificando o Estágio IV."}, {"enunciado": "Um paciente com periodontite apresenta histórico de tabagismo de 15 cigarros por dia e um histórico de perda óssea de 3 mm no último ano. Com base nos critérios da \"Apostila de Periodontia\" para o Grau da Periodontite, qual seria a classificação para este paciente?", "alternativas": {"A": "Grau A.", "B": "Grau B.", "C": "Grau C.", "D": "Não é possível determinar sem o Estágio.", "E": "Grau indeterminado."}, "gabarito": "C", "comentario": "O texto define o Grau C como \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" O paciente fuma 15 cigarros/dia (≥ 10 cig/dia) e tem perda óssea de 3 mm/ano (> 2 mm/ano), o que o enquadra no Grau C. Grau A é para progressão lenta ou sem fatores de risco. Grau B é para progressão moderada ou tabagismo < 10 cig/dia.\nDica: Os fatores de risco como tabagismo e diabetes, juntamente com a taxa de perda óssea, são cruciais para determinar o Grau da periodontite."}, {"enunciado": "Qual é a sequência correta das etapas do Exame Clínico (Diagnóstico Passo a Passo) para um paciente periodontal, conforme descrito na \"Apostila de Periodontia\"?", "alternativas": {"A": "Exame Radiográfico, Anamnese, Periograma Completo, Índices de Biofilme.", "B": "Anamnese, Exame Extraoral/Intraoral, Índices de Biofilme/Sangramento Gengival, Periograma Completo, Exame Radiográfico, Diagnóstico e Plano de Tratamento.", "C": "Periograma Completo, Exame Radiográfico, Anamnese, Diagnóstico.", "D": "Índices de Biofilme, Periograma Completo, Exame Radiográfico, Anamnese.", "E": "Exame Extraoral/Intraoral, Periograma Completo, Anamnese, Exame Radiográfico."}, "gabarito": "B", "comentario": "A seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\" lista as etapas na seguinte ordem: 1. Anamnese Médica e Odontológica; 2. Exame Extraoral e Intraoral; 3. Índices de Biofilme e Sangramento Gengival; 4. Periograma Completo; 5. Exame Radiográfico; 6. Diagnóstico e Plano de Tratamento.\nDica: Seguir uma sequência lógica e padronizada no exame clínico garante a coleta de todos os dados necessários para um diagnóstico preciso e um plano de tratamento eficaz."}, {"enunciado": "Durante a realização de um periograma completo, qual a pressão de sondagem recomendada pela \"Apostila de Periodontia\"?", "alternativas": {"A": "0,1 N (aproximadamente 10 g).", "B": "0,25 N (aproximadamente 25 g).", "C": "0,5 N (aproximadamente 50 g).", "D": "1,0 N (aproximadamente 100 g).", "E": "A pressão varia de acordo com a inflamação do tecido."}, "gabarito": "B", "comentario": "Na seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", item 4 (Periograma Completo), a apostila especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\" Manter uma pressão padronizada é crucial para a reprodutibilidade e acurácia das medições.\nDica: Uma pressão excessiva pode levar a uma superestimação da profundidade de sondagem, enquanto uma pressão insuficiente pode subestimá-la, comprometendo o diagnóstico."}, {"enunciado": "Qual sonda periodontal é especificamente indicada para a avaliação de envolvimento de furca, de acordo com a \"Apostila de Periodontia\"?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15).", "B": "Sonda OMS (WHO / CPITN).", "C": "Sonda Nabers.", "D": "Sonda Williams.", "E": "Sonda Goldman-Fox."}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" indica a \"Sonda Nabers\" como tendo a \"Indicação Principal: Avaliação de furca (Classes I, II, III)\". A UNC 15 é para medição de PS e NIC, e a OMS para triagem epidemiológica.\nDica: A sonda Nabers possui uma ponta curva que facilita o acesso às áreas de furca em dentes multirradiculares."}, {"enunciado": "Uma cureta Gracey 11/12 é utilizada para a raspagem de quais faces dos dentes posteriores, conforme o \"Mapa de Uso\" da Apostila?", "alternativas": {"A": "Todas as faces (livres).", "B": "Vestibular e lingual/palatina.", "C": "Faces MESIAIS.", "D": "Faces DISTAIS.", "E": "Faces cervicais."}, "gabarito": "C", "comentario": "O \"Mapa de Uso\" das Curetas Gracey especifica a 11/12 para \"Posteriores\" e \"Faces MESIAIS\", com o macete \"11/12 → Mesial\" (M de 11 = Mesial). O \"Erro Clássico\" ainda reforça que a 11/12 não deve ser usada para distais de molares.\nDica: As curetas Gracey são área-específicas, e o uso correto evita trauma e garante uma raspagem eficaz. Memorizar o macete \"M de 11 = Mesial\" e \"D de 14 = Distal\" ajuda muito."}, {"enunciado": "Durante a técnica de Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual é o ângulo ideal de angulação da lâmina em relação à superfície radicular, após atingir o fundo da bolsa?", "alternativas": {"A": "0° (fechado).", "B": "Abaixo de 45°.", "C": "Entre 70° e 80°.", "D": "Acima de 90°.", "E": "O ângulo não é relevante, apenas a pressão."}, "gabarito": "C", "comentario": "No item \"2. Posicionamento\" da seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\", a apostila orienta: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: O ângulo de trabalho é crítico para a eficácia da remoção do cálculo e para evitar danos ao cemento e tecidos moles."}, {"enunciado": "Qual é o principal objetivo da Raspagem e Alisamento Radicular (RAR), de acordo com o texto?", "alternativas": {"A": "Apenas remover o biofilme supragengival.", "B": "Eliminar a sensibilidade dentinária.", "C": "Remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular.", "D": "Promover a formação de um novo ligamento periodontal.", "E": "Induzir a formação de novo osso alveolar."}, "gabarito": "C", "comentario": "O texto afirma: \"A RAR tem dois objetivos complementares: remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\". As demais alternativas não representam o objetivo primário da RAR ou descrevem resultados que não são esperados diretamente da RAR.\nDica: A RAR é a base da terapia periodontal não cirúrgica, visando a remoção dos fatores etiológicos da doença."}, {"enunciado": "Segundo a \"Apostila de Periodontia\", qual a principal vantagem do uso do ultrassom (piezoelétrico/magnetoestritivo) na terapia periodontal, em comparação com a instrumentação manual?", "alternativas": {"A": "Maior feedback tátil.", "B": "Menor fadiga do operador.", "C": "Maior eficácia em cálculos supragengivais.", "D": "Menor ruído durante o procedimento.", "E": "Maior controle sobre a remoção de tecido mole."}, "gabarito": "B", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", sobre o ultrassom, o texto menciona: \"Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\"\nDica: Embora o ultrassom seja um excelente complemento, a limitação do feedback tátil ressalta a importância da instrumentação manual para o alisamento radicular fino e áreas de difícil acesso."}, {"enunciado": "Ao explicar a importância da manutenção periodontal ao paciente, qual analogia é utilizada na \"Apostila de Periodontia\" para ilustrar que o tratamento clínico é como arrumar o telhado, mas a manutenção é crucial para evitar que os problemas retornem?", "alternativas": {"A": "Comparar os dentes a postes fincados no chão.", "B": "Comparar o sangramento gengival a uma mão que sangra ao lavar.", "C": "Comparar o tratamento a arrumar o telhado da casa, e a manutenção a limpar as calhas e cuidar do jardim.", "D": "Comparar o biofilme a um filme esbranquiçado nos dentes.", "E": "Comparar a infecção periodontal a uma ferida que nunca cicatriza."}, "gabarito": "C", "comentario": "Na seção \"6. Comunicação com o Paciente\", item \"Explicando a importância da manutenção\", a apostila utiliza a analogia: \"O tratamento que fazemos aqui na clínica é como arrumar o telhado da casa. Mas se você não continuar limpando as calhas e cuidando do jardim, os problemas podem voltar.\"\nDica: Utilizar analogias simples e claras é uma ferramenta poderosa para engajar o paciente e aumentar sua adesão ao tratamento e às medidas de higiene."}, {"enunciado": "A \"Apostila de Periodontia\" destaca que a gengiva saudável NÃO sangra ao escovar. Qual é a analogia utilizada para explicar ao paciente que o sangramento gengival é um sinal de inflamação e um \"pedido de socorro\" do corpo?", "alternativas": {"A": "O biofilme como um filme esbranquiçado nos dentes.", "B": "Os dentes como postes fincados no chão.", "C": "O sangramento como se a mão sangrasse toda vez que fosse lavada.", "D": "A infecção corroendo o alicerce do dente.", "E": "O tratamento como arrumar o telhado da casa."}, "gabarito": "C", "comentario": "Na seção \"6. Comunicação com o Paciente\", item \"Por que a gengiva sangra?\", a apostila utiliza a analogia: \"Pense assim: se sua mão sangrasse toda vez que você a lavasse, você se preocuparia, certo? O sangramento é um sinal de que as gengivas estão inflamadas — é o corpo pedindo socorro.\"\nDica: Analogias com situações cotidianas ajudam o paciente a compreender a gravidade e a importância dos sinais clínicos, como o sangramento."}, {"enunciado": "Qual é a principal função do Periodonto de Sustentação, conforme descrito na \"Apostila de Periodontia\"?", "alternativas": {"A": "Atuar como barreira física e imunológica contra micro-organismos.", "B": "Ancorar o dente ao osso e absorver forças mastigatórias.", "C": "Proteger a raiz do dente de cáries.", "D": "Produzir saliva para umedecer a boca.", "E": "Regular a temperatura da cavidade oral."}, "gabarito": "B", "comentario": "Na seção \"1.1 Divisões Funcionais\", a apostila descreve a \"Função\" do Periodonto de Sustentação como: \"ancorar o dente ao osso e absorver forças mastigatórias.\" A alternativa A descreve a função do periodonto de proteção. As demais não são funções do periodonto de sustentação.\nDica: Entender as funções de cada parte do periodonto ajuda a compreender as consequências da doença periodontal."}, {"enunciado": "O que o \"Macete\" da seção \"Tabela de Sinais Clínicos por Estágio\" da \"Apostila de Periodontia\" indica sobre o diagnóstico do Estágio IV da Periodontite?", "alternativas": {"A": "Que a perda óssea radiográfica é sempre além do 1/3 médio.", "B": "Que a presença de envolvimento de furca Classe III é um critério obrigatório.", "C": "Que se o paciente tem disfunção mastigatória, o Estágio é SEMPRE IV, independente do NIC.", "D": "Que a perda de 5 ou mais dentes é o principal indicador.", "E": "Que a PS deve ser obrigatoriamente maior ou igual a 6 mm."}, "gabarito": "C", "comentario": "O \"Macete\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Este macete enfatiza a importância da disfunção mastigatória como um critério decisivo para o Estágio IV.\nDica: Critérios de diagnóstico que \"anulam\" ou \"antecipam\" outros são importantes para a prática clínica e para questões de concurso."}, {"enunciado": "A \"Regra de ouro\" do Fluxo do Exame Clínico (Diagnóstico Passo a Passo) alerta sobre um erro frequente no diagnóstico de periodontite. Qual é esse alerta?", "alternativas": {"A": "NUNCA atribuir o diagnóstico de periodontite sem confirmar sangramento à sondagem.", "B": "NUNCA atribuir o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.", "C": "com suporte radiográfico.", "D": "NUNCA atribuir o diagnóstico de periodontite sem a presença de mobilidade dental.", "E": "NUNCA atribuir o diagnóstico de periodontite sem a análise de exames laboratoriais."}, "gabarito": "B", "comentario": "A \"Regra de ouro\" estabelece: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\" Este é um ponto crucial para evitar diagnósticos errôneos de periodontite quando se trata apenas de gengivite com pseudobolsa, por exemplo.\nDica: A confirmação radiográfica da perda óssea, correlacionada ao NIC, é indispensável para um diagnóstico preciso de periodontite."}, {"enunciado": "A posição correta do paciente durante o exame periodontal e procedimentos deve facilitar o acesso à boca. Além disso, qual é a postura recomendada para o profissional?", "alternativas": {"A": "Costas curvadas, ombros tensos e pés cruzados.", "B": "Inclinado para frente, com os braços estendidos e pescoço flexionado.", "C": "Posição ereta, ombros relaxados e pés apoiados no chão.", "D": "Sentado de forma relaxada, sem preocupação com a postura.", "E": "Em pé, movimentando-se constantemente ao redor do paciente."}, "gabarito": "C", "comentario": "O texto afirma explicitamente que o profissional deve manter uma \"posição ereta, ombros relaxados e pés apoiados no chão\". Esta postura é fundamental para a ergonomia, prevenindo dores e lesões musculoesqueléticas durante longos períodos de trabalho e garantindo um campo de visão adequado e acesso confortável à boca do paciente. As outras alternativas descrevem posturas incorretas e prejudiciais à saúde do profissional."}, {"enunciado": "Para a remoção eficaz do cálculo e prevenção de trauma durante a raspagem, qual é a condição essencial dos instrumentos manuais, como curetas e foices?", "alternativas": {"A": "Devem ser esterilizados imediatamente antes do uso.", "B": "Devem ser descartáveis para cada paciente.", "C": "Devem estar sempre afiados.", "D": "Devem ter cabos ergonômicos para melhor empunhadura.", "E": "Devem ser de aço inoxidável de alta qualidade."}, "gabarito": "C", "comentario": "O texto enfatiza que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" A afiação correta é crucial para a eficácia e segurança do procedimento. Embora esterilização seja fundamental para controle de infecção e cabos ergonômicos melhorem o conforto, a afiação é a característica diretamente relacionada à remoção de cálculo e prevenção de trauma mecânico."}, {"enunciado": "Um paciente de 25 anos apresenta sangramento gengival generalizado à sondagem, gengiva edemaciada e eritematosa. A profundidade de sondagem (PS) é ≤ 3 mm em todos os dentes e o nível de inserção clínica (NIC) está ausente, assim como perda óssea radiográfica. Qual o diagnóstico mais provável e o prognóstico, de acordo com o texto?", "alternativas": {"A": "Periodontite Estágio I, Grau A, localizada; Prognóstico bom.", "B": "Gengivite induzida por biofilme, generalizada; Prognóstico excelente.", "C": "está ausente, assim como perda óssea radiográfica. Qual o diagnóstico mais provável e o prognóstico, de acordo com o texto?", "D": "Gengivite medicamentosa; Prognóstico reservado.", "E": "Periodontite Estágio III, Grau C, generalizada; Prognóstico ruim."}, "gabarito": "B", "comentario": "O \"Caso 1\" do texto descreve exatamente este cenário: \"Gengiva edemaciada, eritematosa, sangramento à sondagem generalizado (> 30% dos sítios). PS ≤ 3 mm em todos os dentes. NIC ausente. Ausência de perda óssea radiográfica.\" O diagnóstico dado é \"Gengivite induzida por biofilme, generalizada\" e o prognóstico é \"Excelente, com reversão completa se houver adesão à higiene.\" A ausência de NIC e perda óssea radiográfica descarta qualquer forma de periodontite."}, {"enunciado": "A principal diferença entre gengivite e periodontite, de acordo com o quiz do texto, reside em qual característica?", "alternativas": {"A": "A cor da gengiva e a presença de edema.", "B": "A presença de sangramento à sondagem.", "C": "A extensão da inflamação na boca.", "D": "A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite.", "E": "A resposta ao tratamento com higiene oral."}, "gabarito": "D", "comentario": "A Q2 do quiz do texto afirma: \"Qual a principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" Esta é a distinção fundamental entre as duas condições. Sangramento, cor e edema são características da inflamação que podem estar presentes em ambas, mas a perda de suporte é exclusiva da periodontite."}, {"enunciado": "Quais são os dois eixos que compõem a classificação de periodontite de 2018?", "alternativas": {"A": "Localização e Severidade.", "B": "Etiologia e Fatores de Risco.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Tipo de Osso e Tipo de Cárie.", "E": "Presença de Biofilme e Inflamação Gengival."}, "gabarito": "C", "comentario": "A Q3 do quiz do texto pergunta: \"Quais são os dois eixos da classificação de periodontite de 2018?\" e a resposta é: \"✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\" Esta é a base da classificação atual."}, {"enunciado": "Um paciente tabagista (5 cigarros/dia há 10 anos) e diabético tipo 2 controlado (HbA1c 6,5%) apresenta profundidade de sondagem (PS) de 4-5 mm em vários sítios, NIC de 3-4 mm em 40% dos sítios e perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário). O diagnóstico, conforme o texto, seria:", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada.", "B": "Periodontite Estágio I, Grau A, localizada.", "C": "Periodontite Estágio II, Grau B, generalizada.", "D": "Periodontite Estágio III, Grau C, generalizada.", "E": "Periodontite Estágio IV, Grau C, generalizada."}, "gabarito": "C", "comentario": "O \"Caso 2\" do texto descreve este paciente. As características (PS 4-5mm, NIC 3-4mm, perda óssea no 1/3 coronário, mobilidade Grau 1) se encaixam no Estágio II. O tabagismo leve (5 cigarros/dia) e DM controlado (HbA1c 6,5%) o classificam como Grau B (conforme a Q8, tabagistas ≥ 10 cigarros/dia são Grau C). A generalização (>30% dos sítios afetados) complementa o diagnóstico de \"Periodontite Estágio II, Grau B, Generalizada\"."}, {"enunciado": "Qual sonda é utilizada especificamente para detectar envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda CP12.", "D": "Sonda Nabers.", "E": "Sonda Goldman-Fox."}, "gabarito": "D", "comentario": "A Q5 do quiz do texto pergunta: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca?\" e a resposta é: \"✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\" As outras sondas são geralmente utilizadas para medição de profundidade de sondagem e NIC em superfícies planas ou proximais."}, {"enunciado": "Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes. No entanto, NÃO há perda dentária por doença periodontal e NÃO há colapso de mordida. Qual o Estágio da periodontite, de acordo com o texto?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Não é possível determinar sem o Grau."}, "gabarito": "C", "comentario": "A Q6 do quiz do texto aborda exatamente esta situação: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "Qual é o ângulo recomendado da cureta entre a face interna da lâmina e a superfície radicular durante o movimento de raspagem?", "alternativas": {"A": "Menor que 45°.", "B": "Exatamente 90°.", "C": "Entre 70° e 80°.", "D": "Entre 45° e 60°.", "E": "Maior que 90°."}, "gabarito": "C", "comentario": "A Q7 do quiz do texto afirma: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" Este ângulo é crucial para a eficácia da remoção de cálculo e para evitar danos à superfície radicular."}, {"enunciado": "Por que o tabagismo é considerado um fator que pode classificar a periodontite como Grau C?", "alternativas": {"A": "Porque aumenta a deposição de cálculo e biofilme.", "B": "Porque causa recessão gengival e manchas nos dentes.", "C": "Porque compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque leva à perda de dentes rapidamente.", "E": "Porque interfere na cicatrização de feridas em geral."}, "gabarito": "C", "comentario": "A Q8 do quiz do texto explica: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" As outras opções são efeitos do tabagismo, mas a razão principal para a classificação de Grau C é o impacto na progressão da doença e na resposta ao tratamento."}, {"enunciado": "Qual das opções abaixo NÃO é uma característica da Periodontite Estágio IV, Grau C, Generalizada, conforme o \"Caso 3\" do texto?", "alternativas": {"A": "Perda de dentes por doença periodontal.", "B": "Disfunção mastigatória (colapso de mordida).", "C": "NIC ≥ 5 mm em 80% dos sítios.", "D": "Perda óssea radiográfica avançada (além do 1/3 médio).", "E": "Controle rigoroso do DM e tabagismo como único tratamento."}, "gabarito": "E", "comentario": "O \"Caso 3\" descreve um paciente com Periodontite Estágio IV, Grau C, Generalizada, com \"perda de 6 dentes por doença periodontal\", \"Disfunção mastigatória (colapso de mordida)\", \"NIC ≥ 5 mm em 80% dos sítios\" e \"Perda óssea radiográfica avançada (além do 1/3 médio)\". O plano de tratamento inclui \"IHO, controle rigoroso do DM e tabagismo, TPNC (RAR), cirurgias periodontais (se indicadas), reabilitação protética complexa\". Portanto, \"Controle rigoroso do DM e tabagismo como único tratamento\" está incorreto, pois o plano é muito mais abrangente e multidisciplinar."}, {"enunciado": "O que o termo \"NIC\" representa em Periodontia e qual sua importância?", "alternativas": {"A": "Nível Inflamatório Crônico; indica a intensidade da inflamação gengival.", "B": "Número de Infecções Cariosas; quantifica a presença de cáries.", "C": "Nível de Inserção Clínica; distância da JEC ao fundo da bolsa/sulco, medida de perda de suporte.", "D": "Nível de Inflamação Celular; avalia a resposta imunológica do paciente.", "E": "Nível de Intervenção Cirúrgica; indica a necessidade de cirurgia periodontal."}, "gabarito": "C", "comentario": "O glossário define NIC como \"Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" É uma medida crucial para o diagnóstico e monitoramento da periodontite."}, {"enunciado": "Qual é o principal fator etiológico da gengivite e periodontite, de acordo com o glossário?", "alternativas": {"A": "Trauma oclusal.", "B": "Estresse.", "C": "Biofilme (Placa Dental).", "D": "Deficiências nutricionais.", "E": "Fatores genéticos."}, "gabarito": "C", "comentario": "O glossário afirma que o \"Biofilme (Placa Dental)\" é a \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\" Embora outros fatores possam modificar a doença, o biofilme é o iniciador e mantenedor principal."}, {"enunciado": "A Profundidade de Sondagem (PS) difere do Nível de Inserção Clínica (NIC) em qual situação?", "alternativas": {"A": "Quando a gengiva está saudável e não há inflamação.", "B": "Quando há presença de cálculo supragengival.", "C": "em qual situação?", "D": "Quando a sonda é inserida com pouca pressão.", "E": "Quando o paciente é fumante."}, "gabarito": "C", "comentario": "O glossário explica: \"PS — Profundidade de Sondagem: Distância em mm da margem gengival até o fundo da bolsa/sulco. Difere do NIC quando há recessão ou hiperplasia gengival.\" Isso ocorre porque a margem gengival (ponto de referência para PS) pode variar em sua posição em relação à JEC (ponto de referência para NIC)."}, {"enunciado": "A ausência de qual sinal clínico é considerada o melhor indicador de saúde gengival?", "alternativas": {"A": "Ausência de edema.", "B": "Ausência de eritema.", "C": "Ausência de dor.", "D": "Ausência de sangramento à sondagem (SS).", "E": "Ausência de cálculo."}, "gabarito": "D", "comentario": "O glossário define SS como \"Sangramento à Sondagem: Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\" Embora os outros sinais também indiquem saúde, a ausência de sangramento é o critério mais confiável de estabilidade periodontal."}, {"enunciado": "O que caracteriza uma Bolsa Periodontal, conforme o glossário?", "alternativas": {"A": "Um aprofundamento do sulco gengival devido à recessão.", "B": "Um sulco gengival com profundidade menor que 3 mm.", "C": "Apenas a presença de sangramento à sondagem.", "D": "Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "E": "Uma área de acúmulo de biofilme supragengival."}, "gabarito": "D", "comentario": "O glossário define \"Bolsa Periodontal\" como: \"Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\" É importante notar que a perda de inserção e a migração apical do epitélio juncional são os elementos patológicos chave que a distinguem de um sulco gengival profundo, mas saudável."}, {"enunciado": "Em relação à mobilidade dental, qual é a classificação para um dente que apresenta movimento em todas as direções, incluindo o vertical (axial)?", "alternativas": {"A": "Grau 0.", "B": "Grau 1.", "C": "Grau 2.", "D": "Grau 3.", "E": "Não é considerada mobilidade patológica."}, "gabarito": "D", "comentario": "O glossário descreve \"Mobilidade Dental\" como: \"Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\""}, {"enunciado": "Qual é o principal procedimento da Terapia Periodontal Não Cirúrgica (TPNC) e qual sua função?", "alternativas": {"A": "Plástica gengival, para corrigir defeitos estéticos.", "B": "Enxerto ósseo, para reconstruir o osso alveolar perdido.", "C": "e qual sua função?", "D": "Curetagem gengival, para remover o tecido mole inflamado.", "E": "Gengivectomia, para reduzir a profundidade de bolsas."}, "gabarito": "C", "comentario": "O glossário define \"RAR — Raspagem e Alisamento Radicular\" como o \"Procedimento mecânico de remoção de cálculo e biofilme subgengival com alisamento da superfície radicular. Principal terapia da fase I (TPNC).\" A TPNC é a primeira linha de tratamento para todos os estágios da periodontite."}, {"enunciado": "O Estágio da periodontite (I–IV) descreve qual aspecto da doença, de acordo com a classificação de 2018?", "alternativas": {"A": "A velocidade de progressão e a resposta ao tratamento.", "B": "A etiologia e os fatores de risco associados.", "C": "A gravidade e a complexidade da doença.", "D": "A presença ou ausência de dor.", "E": "A quantidade de biofilme presente."}, "gabarito": "C", "comentario": "O glossário define \"Estágio (I–IV)\" como o \"Eixo da classificação 2018 que descreve a gravidade e complexidade da periodontite baseado em NIC, perda óssea, perda dentária e fatores de complexidade.\" O Grau, por sua vez, descreve a velocidade de progressão."}, {"enunciado": "A Junção Esmalte-Cemento (JEC) é um ponto de referência fixo essencial para a mensuração de qual parâmetro periodontal?", "alternativas": {"A": "Profundidade de Sondagem (PS).", "B": "Sangramento à Sondagem (SS).", "C": "é um ponto de referência fixo essencial para a mensuração de qual parâmetro periodontal?", "D": "Mobilidade Dental.", "E": "Envolvimento de furca."}, "gabarito": "C", "comentario": "O glossário afirma: \"JEC — Junção Esmalte-Cemento: Limite anatômico entre esmalte coronário e cemento radicular. Ponto de referência fixo para mensuração do NIC.\" A PS é medida da margem gengival, que não é fixa, enquanto o NIC utiliza a JEC como referência estável para avaliar a perda de inserção."}, {"enunciado": "1. De acordo com o texto, o periodonto é dividido em duas grandes unidades funcionais. Assinale a alternativa que apresenta corretamente os componentes do Periodonto de Proteção:", "alternativas": {"A": "Cemento radicular, ligamento periodontal e osso alveolar.", "B": "Gengiva livre, gengiva inserida e ligamento periodontal.", "C": "Gengiva livre, gengiva inserida e gengiva interdental.", "D": "Gengiva interdental, cemento radicular e osso alveolar.", "E": "Gengiva inserida, osso alveolar e ligamento periodontal."}, "gabarito": "C", "comentario": "O texto na seção \"1.1 Divisões Funcionais\" claramente estabelece que o Periodonto de Proteção é composto pela Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As outras alternativas misturam componentes do periodonto de proteção com os de sustentação ou omitem partes essenciais do periodonto de proteção.\nDica: Memorize as divisões e seus componentes para não confundir as funções e localizações."}, {"enunciado": "2. Qual dos seguintes marcos anatômicos é utilizado como ponto de referência para medir o Nível de Inserção Clínica (NIC), conforme descrito no texto?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": ", conforme descrito no texto?", "D": "Furca", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "Na seção \"1.2 Marcos Anatômicos Cruciais para o Diagnóstico\", a JEC é definida como o \"Ponto de referência para medir o NIC\". A Crista Alveolar indica reabsorção óssea, o Fundo da Bolsa é o ponto distal da medida de PS, e a Furca é avaliada com sonda Nabers. A margem gengival é um ponto variável e não o ponto fixo para o NIC.\nDica: A JEC é um marco anatômico estável e fundamental na periodontia para avaliar a perda de inserção, diferentemente da margem gengival que pode variar com inflamação ou recessão."}, {"enunciado": "3. Um paciente apresenta gengiva com cor rosa-coral, consistência firme, contorno festonado, sulco gengival ≤ 3 mm e sangramento à sondagem em menos de 10% dos sítios. Com base nesses achados, qual o diagnóstico mais provável de acordo com o texto?", "alternativas": {"A": "Gengivite Induzida por Biofilme", "B": "Periodontite Estágio I", "C": "Saúde Periodontal", "D": "Doença Necrosante", "E": "Periodontite Estágio IV"}, "gabarito": "C", "comentario": "A seção \"2.1 Sequência Lógica de Progressão\" descreve a \"Saúde Periodontal\" com exatamente essas características: \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" As outras opções indicam algum nível de doença ou progressão.\nDica: Atente-se aos detalhes dos índices de sangramento e profundidade de sondagem para diferenciar saúde de gengivite."}, {"enunciado": "4. Qual é o critério diferencial crucial entre Gengivite e Periodontite, segundo o texto, que torna a Gengivite reversível e a Periodontite apenas controlável em sua progressão?", "alternativas": {"A": "Profundidade de sondagem", "B": "Presença de sangramento à sondagem", "C": "Ausência ou presença de perda de inserção (NIC) e perda óssea radiográfica", "D": "Edema e eritema gengival", "E": "Presença de biofilme"}, "gabarito": "C", "comentario": "A tabela \"2.2 Diferencial Crítico: Gengivite × Periodontite\" destaca que a Perda de Inserção (NIC) e a Perda Óssea Radiográfica estão \"Ausentes\" na Gengivite e \"Presentes\" na Periodontite. O texto também reforça: \"REVERSÍVEL com remoção do biofilme\" para gengivite e \"Parcial (controle da progressão)\" para periodontite. O \"ERRO FREQUENTE\" também enfatiza a importância da perda de NIC e radiográfica.\nDica: A perda de inserção clínica e óssea radiográfica são os marcadores definitivos para diferenciar gengivite de periodontite."}, {"enunciado": "5. A nova classificação de doenças periodontais (2018) abandona os termos \"crônica\" e \"agressiva\". Quais são os dois eixos independentes e complementares que organizam a periodontite nesta nova classificação?", "alternativas": {"A": "Extensão e Distribuição", "B": "Gravidade e Complexidade", "C": "Estágio e Grau", "D": "Tipo e Severidade", "E": "Atividade e Destruição"}, "gabarito": "C", "comentario": "A seção \"3.1 A Lógica da Classificação\" afirma que a nova classificação \"organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) e GRAU (A, B, C)\". As outras alternativas não correspondem à terminologia da classificação de 2018.\nDica: Compreender que Estágio avalia a destruição passada e complexidade do tratamento, enquanto Grau avalia a velocidade de progressão e risco."}, {"enunciado": "6. Um paciente apresenta perda de inserção clínica (NIC) de 3-4 mm, profundidade de sondagem (PS) de ≤ 5 mm e perda óssea radiográfica de 15-30% (1/3 coronário). De acordo com a Classificação de 2018, em qual estágio de periodontite esse paciente se enquadra?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 3-4 mm, profundidade de sondagem (PS) de ≤ 5 mm e perda óssea radiográfica de 15-30% (1/3 coronário). De acordo com a Classificação de 2018, em qual estágio de periodontite esse paciente se enquadra?", "D": "Estágio IV", "E": "Não é possível determinar o estágio apenas com esses dados."}, "gabarito": "B", "comentario": "A tabela \"3.3 Tabela de Sinais Clínicos por Estágio\" mostra que o Estágio II é caracterizado por NIC de 3-4 mm, PS ≤ 5 mm e Perda Óssea de 15-30% (1/3 coronário).\nDica: Utilize a tabela de sinais clínicos como um guia rápido para a determinação do estágio."}, {"enunciado": "7. Qual é o principal fator que, se presente, obrigatoriamente classifica a periodontite como Estágio IV, independentemente de outros parâmetros de NIC ou PS, conforme o \"Macete\" fornecido no texto?", "alternativas": {"A": "Perda óssea além do 1/3 médio.", "B": "E
