rucial para a eficácia e segurança do procedimento."}, {"enunciado": "Um paciente apresenta NIC = 6 mm, perda óssea radiográfica avançada (além do 1/3 médio), perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida). De acordo com o texto, qual o Estágio da periodontite?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Gengivite"}, "gabarito": "D", "comentario": "O texto, no item Q6, esclarece que \"O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares).\" O Caso 3 apresenta todos esses critérios (NIC ≥ 5 mm, perda óssea avançada, perda de 6 dentes e disfunção mastigatória - colapso de mordida), caracterizando um Estágio IV."}, {"enunciado": "Qual é a função da sonda Nabers, conforme descrito no texto?", "alternativas": {"A": "Medir a profundidade de sondagem em qualquer sítio.", "B": "Detectar o nível de inserção clínica.", "C": "Avaliar a mobilidade dentária.", "D": "Detectar envolvimento de furca.", "E": "Medir a recessão gengival."}, "gabarito": "D", "comentario": "O item Q5 no \"Quiz de Verificação\" pergunta: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca?\" e a resposta é \"✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\""}, {"enunciado": "Qual ângulo é recomendado entre a face interna da lâmina da cureta e a superfície radicular durante o movimento de raspagem?", "alternativas": {"A": "< 45°", "B": "45° a 60°", "C": "70° a 80°", "D": "80° a 90°", "E": "> 90°"}, "gabarito": "C", "comentario": "No item Q7, o texto especifica: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular.\" Também alerta que \"< 45° = raspagem ineficaz (desliza sem cortar)\" e \"> 90° = trauma tecidual\"."}, {"enunciado": "O que o termo \"TPNC\" significa na contextura de tratamento periodontal?", "alternativas": {"A": "Terapia de Perda Óssea Não Controlada.", "B": "Tratamento Periodontal Não Cirúrgico.", "C": "Terapêutica de Placa Não Contida.", "D": "Transplante Periodontal Não Convencional.", "E": "Terapia de Prevenção de Cáries."}, "gabarito": "B", "comentario": "No \"Glossário Essencial de Periodontia\", TPNC é definido como \"Terapia Periodontal Não Cirúrgica: Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\""}, {"enunciado": "No Caso 2, o paciente é um tabagista (5 cigarros/dia há 10 anos) e possui DM tipo 2 controlado (HbA1c 6,5%). Com base nessas informações e demais achados clínicos apresentados, a periodontite foi classificada como Estágio II, Grau B. Qual a justificativa para o Grau B?", "alternativas": {"A": "O tabagismo de 5 cigarros/dia é sempre Grau C.", "B": "O DM tipo 2 controlado (HbA1c 6,5%) é um fator de risco que, por si só, indica Grau B.", "C": "A ausência de progressão evidente ao longo do tempo e a presença de fatores de risco moderados (tabagismo < 10 cigarros/dia e DM controlado) sugerem Grau B.", "D": "A mobilidade Grau 1 em incisivos inferiores automaticamente classifica como Grau B.", "E": "A perda óssea radiográfica horizontal em 20% dos dentes indica Grau B."}, "gabarito": "C", "comentario": "O texto, no item Q4, explica que o Grau se baseia em \"evidência direta de progressão... ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\" O item Q8 menciona que \"Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" Como o paciente fuma 5 cigarros/dia, não atinge o critério para Grau C. O DM tipo 2 controlado (HbA1c 6,5%) é um risco, mas não descompensado. A combinação desses fatores de risco moderados, sem indicação de progressão rápida, leva ao Grau B."}, {"enunciado": "Qual dos seguintes achados clínicos NÃO é um critério para o diagnóstico de Gengivite induzida por biofilme, generalizada, conforme o Caso 1?", "alternativas": {"A": "Sangramento gengival ao escovar.", "B": "Gengiva edemaciada e eritematosa.", "C": "Sangramento à sondagem generalizado.", "D": "PS ≤ 3 mm em todos os dentes.", "E": "Perda óssea radiográfica avançada."}, "gabarito": "E", "comentario": "O Caso 1 descreve \"Ausência de perda óssea radiográfica\" e \"NIC ausente\" para a gengivite. A perda óssea radiográfica avançada é uma característica da periodontite, não da gengivite. As outras opções são características da gengivite apresentadas no caso."}, {"enunciado": "No contexto da classificação de periodontite de 2018, o que define o Estágio?", "alternativas": {"A": "A velocidade de progressão da doença e a resposta esperada ao tratamento.", "B": "A evidência direta de progressão (perda óssea/NIC ao longo do tempo).", "C": "A gravidade e complexidade da doença, baseadas em NIC, perda óssea, perda dentária e fatores de complexidade.", "D": "Os fatores de risco modificadores, como tabagismo e diabetes.", "E": "A presença ou ausência de envolvimento de furca."}, "gabarito": "C", "comentario": "O \"Glossário Essencial de Periodontia\" define \"Estágio (I–IV)\" como o \"Eixo da classificação 2018 que descreve a gravidade e complexidade da periodontite baseado em NIC, perda óssea, perda dentária e fatores de complexidade.\" A opção A descreve o Grau."}, {"enunciado": "Qual é a definição de \"Nível de Inserção Clínica (NIC)\"?", "alternativas": {"A": "Distância em mm da margem gengival até o fundo da bolsa/sulco.", "B": "Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco.", "C": "\"?", "D": "Deslocamento apical da margem gengival em relação à JEC.", "E": "Aprofundamento patológico do sulco gengival (> 3 mm)."}, "gabarito": "B", "comentario": "No \"Glossário Essencial de Periodontia\", NIC é definido como \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" A opção A descreve a Profundidade de Sondagem (PS)."}, {"enunciado": "A ausência de sangramento à sondagem é o melhor indicador de:", "alternativas": {"A": "Periodontite ativa.", "B": "Inflamação gengival severa.", "C": "Saúde gengival.", "D": "Recessão gengival.", "E": "Mobilidade dentária."}, "gabarito": "C", "comentario": "No \"Glossário Essencial de Periodontia\", SS (Sangramento à Sondagem) é descrito como: \"Ausência de SS é o melhor indicador de saúde gengival.\""}, {"enunciado": "Um paciente com Periodontite Estágio IV, Grau C, Generalizada, conforme o Caso 3, qual o prognóstico esperado?", "alternativas": {"A": "Excelente, com reversão completa.", "B": "Bom, com controle da progressão.", "C": "Reservado, exigindo manejo multidisciplinar e adesão máxima do paciente.", "D": "Inalterado, independentemente do tratamento.", "E": "Depende exclusivamente da idade do paciente."}, "gabarito": "C", "comentario": "O Caso 3, para Periodontite Estágio IV, Grau C, Generalizada, indica um \"Prognóstico: Reservado, exige manejo multidisciplinar e adesão máxima do paciente.\""}, {"enunciado": "Qual a classificação de uma furca que é ≥ 3 mm de profundidade horizontal, mas não passante?", "alternativas": {"A": "Classe I", "B": "Classe II", "C": "Classe III", "D": "Classe IV", "E": "Classe 0"}, "gabarito": "B", "comentario": "No \"Glossário Essencial de Periodontia\", Furca é classificada em: \"Classe I: < 3 mm. Classe II: ≥ 3 mm, não passante. Classe III: passante (\"túnel\").\""}, {"enunciado": "Qual é o ponto de referência anatômico fixo para a mensuração do Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Margem Gengival", "B": "Fundo da Bolsa Periodontal", "C": "?", "D": "Crista Óssea Alveolar", "E": "Papila Interdental"}, "gabarito": "C", "comentario": "O \"Glossário Essencial de Periodontia\" define JEC como: \"Limite anatômico entre esmalte coronário e cemento radicular. Ponto de referência fixo para mensuração do NIC.\""}, {"enunciado": "O que significa o termo \"Biofilme (Placa Dental)\"?", "alternativas": {"A": "Uma formação mineralizada na superfície dental.", "B": "Uma comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular.", "C": "Uma inflamação da gengiva causada por trauma.", "D": "A camada de cemento que recobre a raiz do dente.", "E": "O ligamento que conecta o dente ao osso alveolar."}, "gabarito": "B", "comentario": "No \"Glossário Essencial de Periodontia\", Biofilme (Placa Dental) é definido como: \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\""}, {"enunciado": "Qual das seguintes condições de mobilidade dental é definida como movimento horizontal > 1 mm?", "alternativas": {"A": "Grau 0", "B": "Grau 1", "C": "Grau 2", "D": "Grau 3", "E": "Grau 4"}, "gabarito": "C", "comentario": "No \"Glossário Essencial de Periodontia\", Mobilidade Dental é definida como: \"Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\""}, {"enunciado": "De acordo com o texto, qual a importância da esterilização dos instrumentos?", "alternativas": {"A": "Aumentar a vida útil dos instrumentos.", "B": "Manter a afiação dos instrumentos.", "C": "Evitar contaminação cruzada.", "D": "Melhorar a estética dos instrumentos.", "E": "Reduzir o tempo de tratamento."}, "gabarito": "C", "comentario": "No item \"7.2 Manutenção dos Instrumentos\", o texto afirma: \"Esterilização: Seguir rigorosamente os protocolos de limpeza, desinfecção e esterilização (autoclave) para evitar contaminação cruzada.\""}, {"enunciado": "Qual dos seguintes NÃO é um componente do Periodonto de Sustentação, conforme o texto?", "alternativas": {"A": "Cemento", "B": "Ligamento Periodontal", "C": "Osso Alveolar", "D": "Gengiva Livre", "E": "Todas as alternativas são componentes do periodonto de sustentação."}, "gabarito": "D", "comentario": "O item Q1 no \"Quiz de Verificação\" descreve as divisões funcionais do periodonto: \"✔ Periodonto de Proteção (gengiva livre, inserida, interdental) e Periodonto de Sustentação (cemento, ligamento periodontal, osso alveolar).\" A gengiva livre faz parte do periodonto de proteção."}, {"enunciado": "1. De acordo com a Apostila de Periodontia apresentada, o periodonto é dividido em duas grandes unidades funcionais. Qual das alternativas abaixo representa corretamente um componente do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular", "B": "Osso alveolar", "C": "Ligamento periodontal", "D": "Gengiva interdental", "E": "Fibras de Sharpey"}, "gabarito": "D", "comentario": "O texto afirma que o Periodonto de Proteção inclui a Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As demais alternativas (Cemento radicular, Osso alveolar, Ligamento periodontal e Fibras de Sharpey) são componentes do Periodonto de Sustentação. É fundamental distinguir essas duas divisões para entender a anatomia e as funções de cada parte do periodonto."}, {"enunciado": "2. A Apostila de Periodontia descreve marcos anatômicos cruciais para o diagnóstico periodontal. Qual estrutura é um ponto de referência essencial para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Bifurcação/trifurcação das raízes", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "O texto indica claramente que a Junção Esmalte-Cemento (JEC) é o \"Ponto de referência para medir o NIC\". As outras estruturas são importantes, mas para outras medições ou avaliações: a Crista Alveolar indica reabsorção óssea, o Fundo da Bolsa é o ponto distal da medida de PS, e a Furca é avaliada com sonda Nabers. A margem gengival é um ponto variável e não fixo para o NIC."}, {"enunciado": "3. Conforme a seção \"Saúde Periodontal e Níveis de Doença\", qual das seguintes características é um indicador de SAÚDE PERIODONTAL?", "alternativas": {"A": "Sulco gengival maior que 3 mm.", "B": "Sangramento à sondagem (SS) em 15% dos sítios.", "C": "Presença de perda de inserção clínica.", "D": "Gengiva com cor rosa-coral e consistência firme.", "E": "Perda óssea radiográfica."}, "gabarito": "D", "comentario": "O texto define Saúde Periodontal como: \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" A alternativa D é a única que se encaixa perfeitamente nesta descrição. As demais indicam alguma forma de doença periodontal."}, {"enunciado": "4. A diferenciação crítica entre Gengivite e Periodontite é um ponto abordado na apostila. Qual critério é fundamental para distinguir Gengivite de Periodontite, de acordo com o material?", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Profundidade de sondagem aumentada.", "C": "Perda de Inserção Clínica (NIC) presente.", "D": "Reversibilidade total com higiene oral.", "E": "Edema e eritema gengival."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" aponta a \"Perda de Inserção (NIC)\" como o critério decisivo. Na Gengivite, a NIC é ausente, enquanto na Periodontite, é presente (≥ 1 mm). O sangramento à sondagem, profundidade de sondagem e edema/eritema podem estar presentes em ambos, e a reversibilidade total é característica apenas da gengivite. O \"ERRO FREQUENTE\" destacado no texto reforça que a perda de NIC é o fator crucial."}, {"enunciado": "5. A nova Classificação de Doenças Periodontais (2018) organiza a periodontite em Estágios e Graus. O que o \"Estágio\" da doença descreve?", "alternativas": {"A": "A velocidade de progressão da doença.", "B": "Os fatores de risco que modificam a velocidade de progressão.", "C": "A gravidade da destruição já ocorrida e a complexidade do tratamento.", "D": "A resposta do paciente ao tratamento inicial.", "E": "A presença de tabagismo ou diabetes."}, "gabarito": "C", "comentario": "O texto explica que o ESTÁGIO \"Descreve a gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário\". Já o GRAU descreve a velocidade de progressão e os fatores de risco."}, {"enunciado": "6. De acordo com a analogia \"O Velocímetro da Doença\" para o Grau da periodontite, qual característica está associada ao Grau C?", "alternativas": {"A": "Sem evidência de progressão nos últimos 5 anos.", "B": "Tabagismo < 10 cigarros/dia ou HbA1c < 7%.", "C": "Progressão lenta da doença.", "D": "Progressão rápida, com tabagismo ≥ 10 cig/dia ou DM descompensado.", "E": "Perda óssea < 1 mm/ano."}, "gabarito": "D", "comentario": "O texto descreve o Grau C (Carro de corrida) como tendo \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano\". As outras opções são características de Grau A ou B."}, {"enunciado": "7. Um paciente apresenta perda de inserção clínica (NIC) de 5 mm, profundidade de sondagem (PS) de 7 mm, perda óssea radiográfica além do 1/3 médio da raiz e disfunção mastigatória significativa. De acordo com a Tabela de Sinais Clínicos por Estágio e o \"Macete\" fornecido, qual o Estágio da Periodontite para este paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 5 mm, profundidade de sondagem (PS) de 7 mm, perda óssea radiográfica além do 1/3 médio da raiz e disfunção mastigatória significativa. De acordo com a Tabela de Sinais Clínicos por Estágio e o \"Macete\" fornecido, qual o Estágio da Periodontite para este paciente?", "D": "Estágio IV", "E": "Não é possível determinar sem o Grau."}, "gabarito": "D", "comentario": "O \"Macete\" na apostila afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" A presença de disfunção mastigatória é um critério obrigatório e definidor para o Estágio IV, mesmo que outros parâmetros isolados pudessem indicar um estágio menor."}, {"enunciado": "8. No Fluxo do Exame Clínico, qual é o principal objetivo da Anamnese Médica e Odontológica?", "alternativas": {"A": "Realizar a sondagem periodontal completa.", "B": "Avaliar o nível da crista alveolar radiograficamente.", "C": "Interrogar sobre fatores de risco sistêmicos e hábitos que podem influenciar a doença periodontal.", "D": "Registrar o Índice de Placa Visível e o Índice de Sangramento à Sondagem.", "E": "Elaborar o plano de Terapia Periodontal Não Cirúrgica (TPNC)."}, "gabarito": "C", "comentario": "A seção \"Anamnese Médica e Odontológica\" descreve a necessidade de interrogar sobre \"DM (HbA1c), tabagismo (cig/dia × anos), medicamentos (...), histórico familiar de periodontite, gravidez, HIV\". Estes são todos fatores de risco sistêmicos e hábitos que influenciam a doença periodontal. As outras alternativas são etapas subsequentes do exame clínico."}, {"enunciado": "9. Durante o periograma completo, qual a pressão de sondagem recomendada para a coleta de dados de acordo com a apostila?", "alternativas": {"A": "0,5 N", "B": "0,25 N", "C": "1,0 N", "D": "25 kg", "E": "Variável, dependendo da inflamação."}, "gabarito": "B", "comentario": "A apostila especifica claramente: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g)\". É importante seguir essa padronização para obter resultados consistentes e evitar trauma aos tecidos."}, {"enunciado": "10. O \"Macete\" na seção sobre diagnóstico afirma uma regra de ouro crucial. Qual é essa regra?", "alternativas": {"A": "O diagnóstico de periodontite é confirmado pela profundidade de sondagem isolada.", "B": "A periodontite só pode ser diagnosticada após a remoção completa do biofilme.", "C": "NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.", "D": "A gengivite é sempre irreversível se não tratada precocemente.", "E": "O sangramento à sondagem é o único critério para diferenciar gengivite de periodontite."}, "gabarito": "C", "comentario": "O texto destaca a \"Regra de ouro: NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\" Esta é uma das informações mais importantes para evitar erros de diagnóstico."}, {"enunciado": "11. Em relação às Sondas Periodontais, qual é a principal indicação da Sonda OMS (WHO / CPITN)?", "alternativas": {"A": "Medição de PS e NIC com alta precisão.", "B": "Avaliação de furca em molares e pré-molares.", "C": "Triagem epidemiológica para o Índice Periodontal Comunitário (CPITN).", "D": "Identificação de cálculo subgengival.", "E": "Medição da junção esmalte-cemento."}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" indica que a Sonda OMS (WHO / CPITN) tem como \"Indicação Principal: Triagem epidemiológica (CPITN)\". A sonda Carolina do Norte (UNC 15) é para medição de PS e NIC, e a Nabers para avaliação de furca."}, {"enunciado": "12. As curetas Gracey são instrumentos área-específicos. Qual par de curetas Gracey é o correto para a raspagem das faces DISTAIS de dentes POSTERIORES?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "O \"Mapa de Uso\" das Curetas Gracey e o \"ERRO CLÁSSICO\" explicam que a Gracey 13/14 é para \"Posteriores - Faces DISTAIS\". A Gracey 11/12 é para faces MESIAIS de posteriores. A 5/6 é para anteriores e pré-molares e a 7/8 para vestibular e lingual/palatina de posteriores."}, {"enunciado": "13. Durante a técnica de Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual é o ângulo ideal da lâmina em relação à superfície radicular, após a inserção no sulco/bolsa?", "alternativas": {"A": "0° (fechado)", "B": "30° a 40°", "C": "45° a 60°", "D": "70° a 80°", "E": "90°"}, "gabarito": "D", "comentario": "Na etapa de \"Posicionamento\" da técnica de RAR, o texto instrui: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\""}, {"enunciado": "14. Qual a função principal da cureta universal (McCall 13/14 e 17/18) mencionada na apostila?", "alternativas": {"A": "Raspagem de faces mesiais de posteriores.", "B": "Avaliação de furcas.", "C": "Remoção de cálculo subgengival em bolsas profundas.", "D": "Remoção de cálculo supragengival volumoso antes da RAR.", "E": "Alisamento radicular fino em dentes anteriores."}, "gabarito": "D", "comentario": "O texto descreve a McCall 13/14 e 17/18 como \"Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\""}, {"enunciado": "15. A apostila enfatiza a importância da comunicação com o paciente. Qual analogia é utilizada para explicar a causa da doença periodontal?", "alternativas": {"A": "Os dentes são como postes fincados no chão.", "B": "A gengiva saudável NÃO sangra ao escovar.", "C": "O tratamento na clínica é como arrumar o telhado da casa.", "D": "O biofilme é como um filme esbranquiçado que irrita a gengiva.", "E": "A manutenção é como limpar as calhas e cuidar do jardim."}, "gabarito": "D", "comentario": "Na seção \"Comunicação com o Paciente\", para \"Explicando a causa da doença\", o texto utiliza: \"Você já reparou naquele filme esbranquiçado que se forma nos dentes quando não escovamos? Chamamos de biofilme. Ele contém milhões de bactérias. Quando ficam tempo demais no mesmo lugar, essas bactérias irritam a gengiva e causam inflamação...\""}, {"enunciado": "16. Para explicar ao paciente a importância da manutenção periodontal, qual analogia é sugerida no texto?", "alternativas": {"A": "A gengiva sangrando é o corpo pedindo socorro.", "B": "O osso é o alicerce do dente, como a terra em volta de um poste.", "C": "O tratamento na clínica é como arrumar o telhado da casa, e a manutenção é limpar as calhas e cuidar do jardim.", "D": "A periodontite é como uma rachadura na parede da casa.", "E": "A progressão da doença é como um carro de corrida."}, "gabarito": "C", "comentario": "Na seção \"Explicando a importância da manutenção\", a apostila sugere: \"O tratamento que fazemos aqui na clínica é como arrumar o telhado da casa. Mas se você não continuar limpando as calhas e cuidando do jardim, os problemas podem voltar.\""}, {"enunciado": "17. Qual é a principal vantagem do uso do ultrassom (Piezoelétrico/Magnetoestritivo) como complemento à instrumentação manual, segundo a apostila?", "alternativas": {"A": "Oferece feedback tátil superior ao manual.", "B": "É mais eficaz na remoção de cálculo supragengival.", "C": "Causa menos fadiga ao operador, especialmente em bolsas profundas.", "D": "É o único método capaz de alisar a superfície radicular.", "E": "Permite o uso de ângulos de lâmina mais agressivos."}, "gabarito": "C", "comentario": "A seção \"Outros Instrumentos Importantes\" menciona sobre o ultrassom: \"Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\" Ele é eficaz em bolsas profundas, mas a principal vantagem listada é a redução da fadiga."}, {"enunciado": "18. Em relação ao Periodonto de Sustentação, qual das seguintes funções é corretamente atribuída a ele no texto?", "alternativas": {"A": "Barreira física e imunológica contra micro-organismos.", "B": "Cor rosa-coral e consistência firme.", "C": "Ancorar o dente ao osso e absorver forças mastigatórias.", "D": "Superfície com pontilhado (\"casca de laranja\").", "E": "Gengiva ceratinizada."}, "gabarito": "C", "comentario": "O texto define a função do Periodonto de Sustentação como: \"ancorar o dente ao osso e absorver forças mastigatórias.\" As outras opções são características ou funções do Periodonto de Proteção ou de uma gengiva saudável."}, {"enunciado": "19. Um dos marcos anatômicos cruciais para o diagnóstico é a Crista Alveolar. O que sua reabsorção indica, de acordo com o texto?", "alternativas": {"A": "Perda de inserção clínica.", "B": "Sinal de saúde periodontal.", "C": "Doença periodontal.", "D": "Hiperplasia gengival.", "E": "Formação de sulco gengival profundo."}, "gabarito": "C", "comentario": "A tabela de \"Marcos Anatômicos Cruciais para o Diagnóstico\" descreve a Crista Alveolar e sua importância clínica: \"Normalmente 1–2 mm apical à JEC; sua reabsorção indica doença.\""}, {"enunciado": "20. Qual das seguintes características é um diferencial de Gengivite em relação à Periodontite, conforme a tabela \"Diferencial Crítico\"?", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Profundidade de Sondagem ≥ 4 mm.", "C": "Reversibilidade total (com Higiene Oral).", "D": "Perda óssea radiográfica presente.", "E": "Presença de perda de inserção clínica."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" na linha \"Reversibilidade\" indica \"Total (com HO)\" para Gengivite e \"Parcial (controle da progressão)\" para Periodontite. O sangramento à sondagem está presente em ambos. Profundidade de sondagem ≥ 4 mm, perda óssea e perda de inserção clínica são características da periodontite."}, {"enunciado": "A posição ideal do paciente durante um procedimento odontológico, conforme descrito no texto, visa facilitar o acesso à boca e garantir o conforto do profissional. Qual das seguintes opções descreve corretamente uma das características dessa posição?", "alternativas": {"A": "Joelhos do paciente elevados acima da linha dos ombros.", "B": "Pés do paciente suspensos sem apoio.", "C": "Ombros do paciente relaxados.", "D": "Coluna vertebral curvada para frente.", "E": "Cabeça do paciente voltada para o lado oposto ao operador."}, "gabarito": "C", "comentario": "O texto afirma explicitamente: \"ereta, ombros relaxados e pés apoiados no chão\". A posição correta do paciente é fundamental para a ergonomia do profissional e para a eficácia do tratamento. Ombros relaxados evitam tensões desnecessárias no pescoço e ombros do paciente, além de permitir uma melhor visualização e acesso. As demais alternativas descrevem posições inadequadas ou não mencionadas como ideais no texto. Dica: A ergonomia é crucial em odontologia para prevenir lesões musculoesqueléticas no profissional e proporcionar conforto ao paciente."}, {"enunciado": "A manutenção adequada dos instrumentos periodontais é crucial para a eficácia do tratamento e a segurança do paciente. Em relação à afiação das curetas, o texto destaca que:", "alternativas": {"A": "Instrumentos cegos removem o cálculo de forma mais suave, minimizando o trauma.", "B": "A afiação é importante apenas para instrumentos cirúrgicos, não para curetas.", "C": "Instrumentos cegos tendem a escorregar e polir o cálculo, em vez de removê-lo.", "D": "Curetas devem ser afiadas somente após cada ciclo de esterilização.", "E": "Curetas afiadas aumentam o risco de contaminação cruzada."}, "gabarito": "C", "comentario": "O texto claramente afirma: \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" A afiação correta garante que a lâmina do instrumento corte o cálculo, em vez de apenas deslizá-lo ou polí-lo, o que seria ineficaz. Instrumentos cegos exigem maior força, aumentando o risco de trauma ao tecido mole e fadiga do operador."}, {"enunciado": "No Caso 1, uma paciente de 25 anos apresenta sangramento gengival ao escovar, gengiva edemaciada e eritematosa, com sangramento à sondagem generalizado. A profundidade de sondagem (PS) é ≤ 3 mm em todos os dentes e não há perda de inserção clínica (NIC) nem perda óssea radiográfica. Qual o diagnóstico e o prognóstico, conforme o texto?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada; Prognóstico Reservado.", "B": "Gengivite induzida por biofilme, generalizada; Prognóstico Excelente.", "C": "nem perda óssea radiográfica. Qual o diagnóstico e o prognóstico, conforme o texto?", "D": "Gengivite crônica localizada; Prognóstico Bom.", "E": "Periodontite agressiva; Prognóstico Reservado."}, "gabarito": "B", "comentario": "O texto descreve o Caso 1 como \"Gengivite induzida por biofilme, generalizada\" e seu \"Prognóstico: Excelente, com reversão completa se houver adesão à higiene\". As características clínicas (gengiva edemaciada, eritematosa, sangramento à sondagem generalizado, PS ≤ 3 mm, NIC ausente, ausência de perda óssea) são clássicas de gengivite, uma inflamação reversível restrita aos tecidos moles. A ausência de NIC e perda óssea diferencia a gengivite da periodontite."}, {"enunciado": "Um paciente tabagista (5 cigarros/dia há 10 anos) e com DM tipo 2 controlado (HbA1c 6,5%) apresenta Periodontite Estágio II, Grau B, Generalizada. Qual o plano de tratamento inicial indicado pelo texto para este paciente?", "alternativas": {"A": "Apenas cirurgias periodontais e reabilitação protética.", "B": "IHO, controle do tabagismo e DM, TPNC (RAR).", "C": "Somente raspagem supragengival e profilaxia.", "D": "Extração dos dentes com mobilidade e próteses imediatas.", "E": "Terapia medicamentosa sistêmica exclusiva."}, "gabarito": "B", "comentario": "O Caso 2 corresponde a um paciente com Periodontite Estágio II, Grau B, Generalizada. O Plano de Tratamento descrito é: \"IHO, controle do tabagismo e DM, TPNC (RAR). Reavaliação em 4–8 semanas.\" A Terapia Periodontal Não Cirúrgica (TPNC), que inclui a Raspagem e Alisamento Radicular (RAR), é a primeira linha de tratamento para periodontite, complementada pelo controle dos fatores de risco sistêmicos e locais."}, {"enunciado": "De acordo com o Quiz de Verificação, qual é a principal diferença entre gengivite e periodontite?", "alternativas": {"A": "A periodontite sempre apresenta dor intensa, enquanto a gengivite não.", "B": "A gengivite é causada por bactérias, e a periodontite por vírus.", "C": "A periodontite envolve perda de inserção clínica (NIC) e perda óssea radiográfica, enquanto a gengivite é uma inflamação restrita à gengiva sem perda de suporte e reversível.", "D": "A gengivite afeta apenas dentes anteriores, e a periodontite, apenas posteriores.", "E": "A periodontite só ocorre em pacientes idosos, enquanto a gengivite pode ocorrer em qualquer idade."}, "gabarito": "C", "comentario": "A resposta Q2 do Quiz de Verificação afirma: \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" Esta é a distinção fundamental entre as duas condições. A perda de suporte periodontal (NIC e perda óssea) é o marco da periodontite."}, {"enunciado": "Qual é a função da sonda Nabers, conforme descrito no glossário ou quiz?", "alternativas": {"A": "Medir a profundidade de sondagem em dentes unirradiculares.", "B": "Avaliar a quantidade de biofilme supragengival.", "C": "Detectar o envolvimento de furca.", "D": "Medir o nível de inserção clínica (NIC) em todas as superfícies dentárias.", "E": "Realizar o alisamento radicular em áreas de difícil acesso."}, "gabarito": "C", "comentario": "A resposta Q5 do Quiz de Verificação especifica: \"Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\" O glossário também menciona as classes de furca. A sonda Nabers é projetada com uma ponta curva para acessar e avaliar a extensão da perda óssea na região de trifurcação ou bifurcação das raízes."}, {"enunciado": "Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade Grau 2 em 3 dentes, mas NÃO apresenta perda dentária nem colapso de mordida. De acordo com a classificação de periodontite de 2018, qual o Estágio correto para este paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Estágio Indeterminado"}, "gabarito": "C", "comentario": "A resposta Q6 do Quiz de Verificação aborda diretamente esta situação: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "Qual o ângulo recomendado entre a face interna da lâmina da cureta e a superfície radicular durante o movimento de raspagem, para uma remoção eficaz do cálculo e prevenção de trauma?", "alternativas": {"A": "Menor que 45°", "B": "Exatamente 90°", "C": "Entre 70° e 80°", "D": "Maior que 90°", "E": "Qualquer ângulo, desde que haja pressão."}, "gabarito": "C", "comentario": "A resposta Q7 do Quiz de Verificação informa: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" Este ângulo é crucial para garantir a ação de corte da cureta, permitindo a remoção do cálculo de forma eficiente e minimizando o dano ao cemento e tecidos moles."}, {"enunciado": "No Caso 3, uma paciente de 60 anos com histórico de DM tipo 2 descompensado (HbA1c 9%) e tabagismo intenso (20 cigarros/dia há 40 anos) apresenta Periodontite Estágio IV, Grau C, Generalizada. Qual é o prognóstico para este caso, conforme o texto?", "alternativas": {"A": "Excelente, com reversão completa.", "B": "Bom, com controle da progressão.", "C": "Reservado, exigindo manejo multidisciplinar e adesão máxima do paciente.", "D": "Inalterado, pois a idade é o fator principal.", "E": "Pior do que Periodontite Estágio II, Grau B, mas ainda considerado bom."}, "gabarito": "C", "comentario": "O Caso 3 é diagnosticado como Periodontite Estágio IV, Grau C, Generalizada. O texto indica: \"Prognóstico: Reservado, exige manejo multidisciplinar e adesão máxima do paciente.\" A gravidade (Estágio IV) e os fatores de risco (Grau C devido a DM descompensado e tabagismo intenso) contribuem para um prognóstico mais cauteloso."}, {"enunciado": "A classificação de periodontite de 2018 utiliza dois eixos principais para o diagnóstico. Quais são eles?", "alternativas": {"A": "Localização (anterior ou posterior) e Etiologia (bacteriana ou fúngica).", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Idade do paciente (jovem ou adulto) e Tipo de tratamento (cirúrgico ou não cirúrgico).", "D": "Presença de dor (aguda ou crônica) e Resposta inflamatória (localizada ou generalizada).", "E": "Quantidade de biofilme (leve ou severo) e Presença de sangramento (espontâneo ou à sondagem)."}, "gabarito": "B", "comentario": "A resposta Q3 do Quiz de Verificação especifica: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\" Esta é a base da classificação atual."}, {"enunciado": "De acordo com o glossário, o que significa a sigla NIC?", "alternativas": {"A": "Nível de Inflamação Crônica.", "B": "Necessidade de Intervenção Cirúrgica.", "C": "Nível de Inserção Clínica.", "D": "Nova Infecção por Contaminação.", "E": "Número de Incisivos Comprometidos."}, "gabarito": "C", "comentario": "O glossário define NIC como: \"NIC — Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" O NIC é um dos parâmetros mais importantes para o diagnóstico e monitoramento da periodontite, pois indica a perda real de suporte do dente."}, {"enunciado": "Por que o tabagismo, especialmente em alta intensidade (≥ 10 cigarros/dia), é considerado um modificador para o Grau C na classificação de periodontite de 2018?", "alternativas": {"A": "Porque o tabaco causa diretamente a formação de biofilme.", "B": "Porque o tabaco aumenta a vascularização gengival, acelerando a cicatrização.", "C": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque o tabaco previne o sangramento gengival, mascarando a doença.", "E": "Porque o tabaco não tem impacto significativo na progressão da doença periodontal."}, "gabarito": "C", "comentario": "A resposta Q8 do Quiz de Verificação explica detalhadamente: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\""}, {"enunciado": "O que o Sangramento à Sondagem (SS) indica, conforme o glossário?", "alternativas": {"A": "Presença de cálculo supragengival apenas.", "B": "Inflamação ativa.", "C": "Perda óssea avançada.", "D": "Necessidade imediata de extração dentária.", "E": "Ausência de biofilme."}, "gabarito": "B", "comentario": "O glossário define SS como: \"SS — Sangramento à Sondagem: Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\" O sangramento é um sinal clínico clássico de inflamação dos tecidos periodontais."}, {"enunciado": "Qual das seguintes opções descreve corretamente uma Bolsa Periodontal, de acordo com o glossário?", "alternativas": {"A": "Um aprofundamento fisiológico do sulco gengival, sem perda de inserção.", "B": "Uma área de recessão gengival com exposição radicular.", "C": "Um aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.", "D": "Uma lesão de cárie subgengival.", "E": "Um acúmulo de cálculo supragengival."}, "gabarito": "C", "comentario": "O glossário define Bolsa Periodontal como: \"Bolsa Periodontal: Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\" A presença de bolsa periodontal é um dos sinais clínicos da periodontite e indica destruição dos tecidos de suporte."}, {"enunciado": "Qual é o principal fator etiológico da gengivite e periodontite, de acordo com o glossário?", "alternativas": {"A": "Trauma oclusal.", "B": "Fatores genéticos.", "C": "Biofilme (Placa Dental).", "D": "Estresse psicológico.", "E": "Deficiências vitamínicas."}, "gabarito": "C", "comentario": "O glossário afirma: \"Biofilme (Placa Dental): Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\" Embora outros fatores possam modular a doença, o biofilme é o agente causal primário."}, {"enunciado": "O que diferencia o Periodonto de Proteção do Periodonto de Sustentação, conforme a Q1 do Quiz de Verificação?", "alternativas": {"A": "O Periodonto de Proteção é composto pelo ligamento periodontal e osso alveolar, enquanto o de Sustentação é a gengiva.", "B": "O Periodonto de Proteção inclui a gengiva livre, inserida e interdental, e o de Sustentação é formado pelo cemento, ligamento periodontal e osso alveolar.", "C": "O Periodonto de Proteção é responsável pela sensibilidade, e o de Sustentação pela mastigação.", "D": "O Periodonto de Proteção é afetado pela periodontite, e o de Sustentação pela gengivite.", "E": "Ambos são sinônimos e não possuem diferenças funcionais."}, "gabarito": "B", "comentario": "A resposta Q1 do Quiz de Verificação detalha: \"Quais são as duas principais divisões funcionais do periodonto? ✔ Periodonto de Proteção (gengiva livre, inserida, interdental) e Periodonto de Sustentação (cemento, ligamento periodontal, osso alveolar).\" Esta divisão é fundamental para entender a anatomia e fisiologia periodontal."}, {"enunciado": "No contexto da Periodontite Estágio IV, Grau C, Generalizada (Caso 3), qual dos seguintes fatores é um agravante significativo, contribuindo para o prognóstico reservado?", "alternativas": {"A": "Apenas a idade avançada da paciente.", "B": "Apenas a dificuldade para mastigar.", "C": "DM tipo 2 descompensado (HbA1c 9%) e tabagismo intenso (20 cigarros/dia há 40 anos).", "D": "A ausência de dor relatada.", "E": "A presença de gengiva retraída."}, "gabarito": "C", "comentario": "No Caso 3, os fatores sistêmicos e comportamentais como \"DM tipo 2 descompensado (HbA1c 9%)\" e \"Tabagista (20 cigarros/dia há 40 anos)\" são cruciais para classificar a doença como Grau C e para o prognóstico reservado. Esses fatores modificam a resposta do hospedeiro e a progressão da doença de forma significativa."}, {"enunciado": "Qual a principal característica que define o Grau na classificação de periodontite de 2018?", "alternativas": {"A": "A extensão da perda óssea radiográfica.", "B": "A presença de mobilidade dentária.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência direta de progressão ou fatores de risco modificadores.", "D": "O número de dentes perdidos devido à doença periodontal.", "E": "A profundidade de sondagem em múltiplos sítios."}, "gabarito": "C", "comentario": "A resposta Q4 do Quiz de Verificação explica: \"O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\""}, {"enunciado": "A Terapia Periodontal Não Cirúrgica (TPNC) é um conjunto de procedimentos da fase I. Qual das seguintes opções NÃO faz parte da TPNC, conforme o glossário?", "alternativas": {"A": "IHO (instrução de higiene oral).", "B": "Controle de fatores de risco.", "C": "é um conjunto de procedimentos da fase I. Qual das seguintes opções NÃO faz parte da TPNC, conforme o glossário?", "D": "Reavaliação.", "E": "Cirurgias periodontais avançadas."}, "gabarito": "E", "comentario": "O glossário define TPNC como: \"TPNC — Terapia Periodontal Não Cirúrgica: Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\" Cirurgias periodontais avançadas são geralmente consideradas parte da fase II do tratamento, se indicadas após a TPNC."}, {"enunciado": "De acordo com a seção \"Anatomia do Periodonto\", qual das estruturas abaixo NÃO pertence ao periodonto de proteção?", "alternativas": {"A": "Gengiva livre", "B": "Gengiva inserida", "C": "Cemento radicular", "D": "Gengiva interdental", "E": "Papila interdental"}, "gabarito": "C", "comentario": "O periodonto de proteção é composto pela gengiva livre (marginal), gengiva inserida (ceratinizada) e gengiva interdental (papila). O cemento radicular faz parte do periodonto de sustentação, juntamente com o ligamento periodontal e o osso alveolar. É fundamental diferenciar as estruturas de proteção e sustentação para compreender a função e a patologia periodontal."}, {"enunciado": "Um paciente apresenta sangramento à sondagem em 15% dos sítios, edema gengival, mas sem perda de inserção clínica (NIC) ou perda óssea radiográfica. Qual o diagnóstico mais provável, de acordo com a seção \"Saúde Periodontal e Níveis de Doença\"?", "alternativas": {"A": "Periodontite Estágio I", "B": "Gengivite Induzida por Biofilme", "C": "ou perda óssea radiográfica. Qual o diagnóstico mais provável, de acordo com a seção \"Saúde Periodontal e Níveis de Doença\"?", "D": "Doença Necrosante", "E": "Periodontite Estágio IV"}, "gabarito": "B", "comentario": "A gengivite induzida por biofilme é caracterizada por inflamação restrita à gengiva marginal, com presença de sangramento à sondagem (≥ 10% dos sítios), edema e eritema, mas sem perda de inserção clínica ou perda óssea radiográfica. É uma condição reversível com a remoção do biofilme. A ausência de perda de inserção clínica é o critério diferencial chave entre gengivite e periodontite."}, {"enunciado": "Qual dos marcos anatômicos cruciais é utilizado como ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Bifurcação das raízes", "E": "Ligamento Periodontal"}, "gabarito": "C", "comentario": "A Junção Esmalte-Cemento (JEC) é o ponto de referência estável para a medição do Nível de Inserção Clínica (NIC). O NIC é uma medida crucial no diagnóstico periodontal, pois indica a perda de suporte do dente. A crista alveolar e o fundo da bolsa são importantes para outras medições, mas não para o NIC em si."}, {"enunciado": "De acordo com a \"Dica de prova\" apresentada, como se calcula o Nível de Inserção Clínica (NIC) quando há hiperplasia gengival?", "alternativas": {"A": "NIC = PS + Recessão Gengival", "B": "NIC = PS - Hiperplasia Gengival", "C": "quando há hiperplasia gengival?", "D": "NIC = PS - Fundo da Bolsa", "E": "NIC = PS + Perda Óssea"}, "gabarito": "B", "comentario": "A dica de prova especifica que quando a gengiva migra coronalmente (hiperplasia), o NIC é calculado como Profundidade de Sondagem (PS) menos a hiperplasia gengival. Quando há recessão gengival, o NIC é PS mais a recessão. Essa é uma informação prática e comum em exames."}, {"enunciado": "Segundo a Nova Classificação (2018), qual dos seguintes critérios é fundamental para diferenciar Gengivite de Periodontite?", "alternativas": {"A": "Presença de sangramento à sondagem", "B": "Cor rosa-coral da gengiva", "C": "Perda de inserção clínica (NIC)", "D": "Profundidade de sondagem aumentada", "E": "Presença de biofilme"}, "gabarito": "C", "comentario": "O critério mais importante e definitivo para diferenciar gengivite de periodontite é a presença de perda de inserção clínica (NIC). A gengivite é uma inflamação restrita à gengiva sem perda de inserção, enquanto a periodontite envolve a destruição dos tecidos de suporte, resultando em perda de NIC e perda óssea radiográfica. Sangramento à sondagem e profundidade de sondagem aumentada podem estar presentes em ambas as condições."}, {"enunciado": "Um paciente apresenta perda de inserção clínica (NIC) de 3-4 mm, profundidade de sondagem (PS) de 5 mm, perda óssea radiográfica de 15-30% do terço coronário e nenhuma perda dentária. De acordo com a Classificação 2018, qual o Estágio da Periodontite?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 3-4 mm, profundidade de sondagem (PS) de 5 mm, perda óssea radiográfica de 15-30% do terço coronário e nenhuma perda dentária. De acordo com a Classificação 2018, qual o Estágio da Periodontite?", "D": "Estágio IV", "E": "Não se enquadra em nenhum estágio"}, "gabarito": "B", "comentario": "Conforme a tabela de sinais clínicos por estágio, o Estágio II é caracterizado por NIC de 3-4 mm, PS ≤ 5 mm, perda óssea de 15-30% (equivalente a 1/3 coronário) e nenhuma perda dentária. O Estágio I tem NIC menor (1-2 mm), Estágio III e IV têm NIC ≥ 5 mm e maior perda óssea/dentária."}, {"enunciado": "Qual é o principal critério que, se presente, obrigatoriamente classifica a periodontite como Estágio IV, independentemente de outros parâmetros como o NIC?", "alternativas": {"A": "Perda óssea de mais de 1/3 médio", "B": "Envolvimento de furca Classe II/III", "C": "Presença de defeitos ósseos verticais", "D": "Disfunção mastigatória", "E": "Perda de 5 ou mais dentes"}, "gabarito": "D", "comentario": "O \"Macete\" da apostila afirma claramente: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Este é um critério de suma importância para o diagnóstico do estágio mais avançado da doença."}, {"enunciado": "Qual dos seguintes itens NÃO é um objetivo da Raspagem e Alisamento Radicular (RAR)?", "alternativas": {"A": "Remover depósitos duros (cálculo).", "B": "Remover biofilme subgengival.", "C": "Alisar a superfície radicular para dificultar a re-adesão bacteriana.", "D": "Estimular a formação de novo cemento acelular.", "E": "Reduzir a inflamação e a profundidade de sondagem."}, "gabarito": "D", "comentario": "A RAR tem como objetivos remover cálculo e biofilme, alisar a superfície radicular e, consequentemente, reduzir a inflamação e a profundidade de sondagem. Estimular a formação de novo cemento acelular não é um objetivo direto da RAR; a regeneração tecidual é um processo mais complexo e nem sempre alcançado apenas com a RAR."}, {"enunciado": "Na técnica de Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual o ângulo ideal da lâmina em relação à superfície radicular para uma raspagem eficaz e sem trauma?", "alternativas": {"A": "0° (fechado)", "B": "Entre 45° e 60°", "C": "Entre 70° e 80°", "D": "90°", "E": "Acima de 90°"}, "gabarito": "C", "comentario": "A apostila especifica que, após a adaptação da cureta com ângulo de 0°, o posicionamento para a raspagem deve ser com a lâmina angulada entre 70° e 80° em relação à superfície radicular. Ângulos abaixo de 45° tornam a raspagem ineficaz, e acima de 90° causam trauma tecidual."}, {"enunciado": "Qual cureta Gracey é indicada para raspagem das faces DISTAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A apostila apresenta um \"Macete\" claro: \"13/14 → Distal\" (D de 14 = Distal). A Gracey 11/12 é para faces mesiais de posteriores. Conhecer a área de atuação de cada cureta Gracey é fundamental para uma instrumentação correta."}, {"enunciado": "Qual tipo de sonda periodontal é mais adequado para a triagem epidemiológica, como no índice CPITN?", "alternativas": {"A": "Carolina do Norte (UNC 15)", "B": "Nabers", "C": "OMS (WHO / CPITN)", "D": "Williams", "E": "Goldman-Fox"}, "gabarito": "C", "comentario": "A sonda OMS (WHO / CPITN), com sua esfera na ponta e marcações específicas (3,5-5,5-8,5-11,5 mm), é a indicada para triagem epidemiológica, conforme a tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" A sonda UNC 15 é o padrão clínico para medição de PS e NIC, e a Nabers para avaliação de furca."}, {"enunciado": "A Nova Classificação da Periodontite (2018) abandona quais termos e organiza a doença em quais dois eixos principais?", "alternativas": {"A": "Abandona \"refratária\" e \"recorrente\"; organiza em Crônica e Agressiva.", "B": "Abandona \"crônica\" e \"agressiva\"; organiza em Estágio e Grau.", "C": "Abandona \"localizada\" e \"generalizada\"; organiza em Gengivite e Periodontite.", "D": "Abandona \"severa\" e \"moderada\"; organiza em Níveis de Saúde e Doença.", "E": "Abandona \"juvenil\" e \"do adulto\"; organiza em Progressão Rápida e Lenta."}, "gabarito": "B", "comentario": "A seção \"A Lógica da Classificação\" afirma que a nova classificação abandona os termos \"crônica\" e \"agressiva\" e organiza a periodontite em dois eixos independentes e complementares: Estágio (I, II, III, IV) e Grau (A, B, C)."}, {"enunciado": "Qual é o objetivo principal do EIXO \"Estágio\" na Classificação da Periodontite (2018)?", "alternativas": {"A": "Descrever a velocidade de progressão da doença.", "B": "Identificar os fatores de risco que modificam a velocidade da doença.", "C": "Descrever a gravidade da destruição e a complexidade do tratamento.", "D": "Avaliar a resposta do paciente à terapia inicial.", "E": "Determinar a localização da doença (localizada ou generalizada)."}, "gabarito": "C", "comentario": "O Estágio descreve a gravidade da destruição já ocorrida (\"quanto de destruição já ocorreu\") e a complexidade do tratamento necessário. O Grau, por sua vez, descreve a velocidade de progressão e os fatores de risco."}, {"enunciado": "Um paciente com periodontite apresenta tabagismo de 15 cigarros/dia. De acordo com a classificação de Grau, qual seria o Grau mais provável para este paciente?", "alternativas": {"A": "Grau A (Pedestre)", "B": "Grau B (Carro na cidade)", "C": "Grau C (Carro de corrida)", "D": "Não pode ser determinado apenas com o tabagismo.", "E": "Grau indeterminado."}, "gabarito": "C", "comentario": "A tabela de \"Analogias para Memorizar\" do Grau indica que o Grau C (Carro de corrida) está associado a \"Tabagismo ≥ 10 cig/dia\" ou DM descompensado, indicando progressão rápida da doença. Tabagismo < 10 cig/dia está associado ao Grau B."}, {"enunciado": "Qual a pressão de sondagem recomendada para a realização do periograma completo?", "alternativas": {"A": "0,10 N", "B": "0,25 N", "C": "0,50 N", "D": "1,00 N", "E": "2,00 N"}, "gabarito": "B", "comentario": "A seção \"Periograma Completo (Sondagem Periodontal)\" especifica que a pressão de sondagem recomendada é de 0,25 N (aproximadamente 25 g). Uma pressão padronizada é essencial para a reprodutibilidade e acurácia das medições."}, {"enunciado": "Qual das seguintes estruturas pertence ao periodonto de sustentação?", "alternativas": {"A": "Gengiva livre", "B": "Gengiva interdental", "C": "Gengiva inserida", "D": "Ligamento periodontal", "E": "Papila"}, "gabarito": "D", "comentario": "O periodonto de sustentação é composto pelo cemento radicular, ligamento periodontal e osso alveolar. As outras opções (gengiva livre, interdental, inserida e papila) fazem parte do periodonto de proteção."}, {"enunciado": "No fluxo de exame clínico, qual etapa é essencial para \"motivar o paciente e estabelecer o baseline para monitoramento\"?", "alternativas": {"A": "Anamnese Médica e Odontológica", "B": "Exame Extraoral e Intraoral", "C": "Índices de Biofilme e Sangramento Gengival", "D": "Periograma Completo", "E": "Exame Radiográfico"}, "gabarito": "C", "comentario": "A seção \"Fluxo do Exame Clínico\" para a etapa 3 (Índices de Biofilme e Sangramento Gengival) afirma que \"Esses dados motivam o paciente e estabelecem o baseline para monitoramento.\" A visualização do sangramento e da placa ajuda o paciente a entender a necessidade de melhorar a higiene."}, {"enunciado": "A respeito da saúde periodontal, qual das afirmações abaixo está correta?", "alternativas": {"A": "O sangramento à sondagem em 20% dos sítios é compatível com saúde periodontal.", "B": "A saúde periodontal pode apresentar perda de inserção clínica de até 1 mm.", "C": "O sulco gengival em saúde periodontal deve ser maior que 3 mm.", "D": "A saúde periodontal é caracterizada por gengiva cor rosa-coral, firme e sem perda óssea.", "E": "A saúde periodontal é reversível com a remoção do biofilme."}, "gabarito": "D", "comentario": "A descrição de \"Saúde Periodontal\" na apostila indica gengiva cor rosa-coral, firme, contorno festonado, sulco gengival ≤ 3 mm, sangramento à sondagem em < 10% dos sítios, e sem perda de inserção nem perda óssea. A opção E descreve a reversibilidade da gengivite, não a saúde periodontal em si."}, {"enunciado": "Qual a principal limitação do uso do ultrassom (piezoelétrico/magnetoestritivo) em comparação com a instrumentação manual para a Raspagem e Alisamento Radicular?", "alternativas": {"A": "Menor eficácia na remoção de cálculo supragengival.", "B": "Maior fadiga do operador.", "C": "Feedback tátil reduzido.", "D": "Necessidade de maior tempo de trabalho.", "E": "Não é indicado para bolsas profundas."}, "gabarito": "C", "comentario": "A apostila, na seção \"Outros Instrumentos Importantes\", menciona que a \"Limitação: feedback tátil reduzido\" é uma desvantagem do ultrassom. Enquanto o ultrassom é eficaz e reduz a fadiga, a capacidade de sentir a superfície radicular é menor do que com instrumentos manuais, o que pode dificultar a detecção de pequenas irregularidades."}, {"enunciado": "A \"Regra de ouro\" do diagnóstico periodontal estabelece que:", "alternativas": {"A": "O diagnóstico de periodontite é feito apenas pela profundidade de sondagem.", "B": "Nunca se deve atribuir o diagnóstico de periodontite sem confirmar perda de inserção clínica (NIC) com suporte radiográfico.", "C": "com suporte radiográfico.", "D": "A periodontite pode ser diagnosticada apenas com base na anamnese do paciente.", "E": "A perda óssea radiográfica isolada é suficiente para o diagnóstico de periodontite, mesmo sem NIC."}, "gabarito": "B", "comentario": "A \"Regra de ouro\" da seção \"Fluxo do Exame Clínico\" é enfática: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\" Esta é uma dica crucial para evitar diagnósticos incorretos."}, {"enunciado": "A posição ideal do paciente para facilitar o acesso à boca durante procedimentos periodontais inclui:", "alternativas": {"A": "Pés suspensos e ombros elevados.", "B": "Pés apoiados no chão, ombros relaxados e postura ereta.", "C": "Pés cruzados e cabeça inclinada para trás.", "D": "Paciente totalmente deitado, sem apoio para os pés.", "E": "Paciente em pé, com o operador sentado."}, "gabarito": "B", "comentario": "A alternativa B descreve a posição ergonômica correta para o paciente, que otimiza o acesso do profissional e o conforto do paciente, conforme mencionado no início do texto. Manter os pés apoiados no chão, ombros relaxados e uma postura ereta são fundamentais para um bom campo operatório e para evitar tensões desnecessárias. As demais alternativas descrevem posições inadequadas ou desconfortáveis."}, {"enunciado": "Em relação à manutenção dos instrumentos periodontais, a afiação de curetas e foices é crucial porque:", "alternativas": {"A": "Instrumentos afiados removem o cálculo de forma mais eficaz e com maior risco de trauma.", "B": "Instrumentos cegos escorregam, polêm o cálculo e não o removem.", "C": "A afiação é importante apenas para instrumentos cirúrgicos, não para curetas.", "D": "Instrumentos afiados dispensam a necessidade de esterilização.", "E": "A afiação prolonga a vida útil do instrumento, independentemente de sua eficácia na remoção de cálculo."}, "gabarito": "B", "comentario": "O texto afirma explicitamente que \"Instrumentos cegos escorregam e polêm o cálculo, não o removem\", e que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma\". Portanto, a afiação garante a eficácia e segurança do procedimento. As outras alternativas estão incorretas ou contradizem o texto."}, {"enunciado": "Um paciente de 25 anos apresenta queixa de sangramento gengival ao escovar. No exame clínico, observa-se gengiva edemaciada, eritematosa, sangramento à sondagem generalizado (> 30% dos sítios), PS ≤ 3 mm e NIC ausente. Ausência de perda óssea radiográfica. Qual o diagnóstico mais provável?", "alternativas": {"A": "Periodontite Estágio I.", "B": "Gengivite induzida por biofilme, generalizada.", "C": "Periodontite Estágio II, Grau B.", "D": "Periodontite Estágio III, Grau C.", "E": "Gengivite necrotizante ulcerativa."}, "gabarito": "B", "comentario": "As características apresentadas (sangramento gengival, gengiva edemaciada e eritematosa, sangramento à sondagem generalizado, PS ≤ 3 mm, NIC ausente e ausência de perda óssea radiográfica) são classicamente descritas no texto para Gengivite induzida por biofilme, generalizada (Caso 1). A ausência de perda de inserção clínica (NIC) e perda óssea radiográfica diferencia a gengivite da periodontite."}, {"enunciado": "Qual é o prognóstico de um caso de Gengivite induzida por biofilme, generalizada, conforme descrito no texto?", "alternativas": {"A": "Reservado, exigindo manejo multidisciplinar.", "B": "Bom, com controle da progressão.", "C": "Excelente, com reversão completa se houver adesão à higiene.", "D": "Regular, com necessidade de cirurgias periodontais.", "E": "Incerto, dependendo exclusivamente de fatores sistêmicos."}, "gabarito": "C", "comentario": "Para o Caso 1, referente à Gengivite induzida por biofilme, generalizada, o texto indica um \"Prognóstico: Excelente, com reversão completa se houver adesão à higiene\". Isso reforça a natureza reversível da gengivite quando o fator etiológico (biofilme) é controlado."}, {"enunciado": "A principal diferença entre gengivite e periodontite, de acordo com o texto, é:", "alternativas": {"A": "A presença de sangramento à sondagem na periodontite.", "B": "A presença de dor na gengivite.", "C": "A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite.", "D": "A coloração da gengiva (vermelha na gengivite, azulada na periodontite).", "E": "A presença de halitose na gengivite."}, "gabarito": "C", "comentario": "A questão Q2 do Quiz de Verificação afirma: \"Qual a principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" Esta é a definição chave para diferenciar as duas condições."}, {"enunciado": "Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e DM tipo 2 controlado (HbA1c 6,5%), apresenta PS 4–5 mm em vários sítios, NIC 3–4 mm em 40% dos sítios e perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário). Qual o diagnóstico de periodontite, considerando a classificação de 2018?", "alternativas": {"A": "Periodontite Estágio I, Grau A, Localizada.", "B": "Periodontite Estágio II, Grau B, Generalizada.", "C": "Periodontite Estágio III, Grau C, Generalizada.", "D": "Periodontite Estágio IV, Grau B, Localizada.", "E": "Gengivite induzida por biofilme."}, "gabarito": "B", "comentario": "Este é o Caso 2 do texto. As características (PS 4-5 mm, NIC 3-4 mm em 40% dos sítios, perda óssea no 1/3 coronário) se encaixam no Estágio II. O fato de ser tabagista (5 cigarros/dia) e ter diabetes controlado (HbA1c 6,5%) o classifica como Grau B. A generalização (>30% dos sítios afetados, como indicado pelo \"vários sítios\" e \"40% dos sítios\" com NIC) completa o diagnóstico."}, {"enunciado": "De acordo com a classificação de periodontite de 2018, quais são os dois eixos principais?", "alternativas": {"A": "Severidade e Localização.", "B": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "C": "Idade e Histórico médico.", "D": "Tipo de micro-organismo e Resposta inflamatória.", "E": "Recessão gengival e Mobilidade dentária."}, "gabarito": "B", "comentario": "A questão Q3 do Quiz de Verificação aborda diretamente este ponto: \"Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\" É fundamental conhecer esses dois eixos para a correta classificação da doença."}, {"enunciado": "O que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A quantidade de perda dentária devido à periodontite.", "B": "A presença de disfunção mastigatória.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência de progressão ou fatores de risco modificadores (tabagismo, DM).", "D": "A profundidade de sondagem e o nível de inserção clínica.", "E": "A extensão da perda óssea radiográfica."}, "gabarito": "C", "comentario": "A questão Q4 do Quiz de Verificação explica detalhadamente o Grau: \"O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\""}, {"enunciado": "Qual sonda é utilizada especificamente para detectar envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda Nabers.", "D": "Sonda de Goldman-Fox.", "E": "Sonda PCP12."}, "gabarito": "C", "comentario": "A questão Q5 do Quiz de Verificação afirma: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\" A curvatura da sonda Nabers é projetada para acessar a região de furca em dentes multirradiculares."}, {"enunciado": "Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio correto para este paciente, de acordo com o texto?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Gengivite."}, "gabarito": "C", "comentario": "A questão Q6 do Quiz de Verificação descreve exatamente este cenário: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\""}, {"enunciado": "Qual o ângulo recomendado da cureta durante o movimento de raspagem para uma remoção eficaz do cálculo e sem trauma?", "alternativas": {"A": "< 45° entre a lâmina e a superfície radicular.", "B": "Entre 70° e 80° entre a face interna da lâmina e a superfície radicular.", "C": "> 90° entre a lâmina e a superfície radicular.", "D": "Qualquer ângulo, desde que a pressão seja adequada.", "E": "45° exatos para todas as superfícies."}, "gabarito": "B", "comentario": "A questão Q7 do Quiz de Verificação especifica: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" Este ângulo é crucial para a eficácia e segurança do procedimento."}, {"enunciado": "Por que o tabagismo é considerado um modificador de Grau C na classificação de periodontite de 2018, especialmente em altas doses?", "alternativas": {"A": "O tabaco aumenta a vascularização gengival, acelerando a cicatrização.", "B": "O tabaco melhora a resposta imune, aumentando a quimiotaxia de neutrófilos.", "C": "O tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.", "D": "O tabaco tem um efeito protetor contra a perda óssea.", "E": "O tabaco não tem impacto significativo na progressão da doença periodontal."}, "gabarito": "C", "comentario": "A questão Q8 do Quiz de Verificação explica: \"Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" O tabagismo é um dos fatores de risco mais deletérios para a periodontite."}, {"enunciado": "Qual dos seguintes termos descreve a distância em mm da junção esmalte-cemento (JEC) até o fundo da bolsa ou sulco e é a medida de referência para quantificar a perda de suporte periodontal?", "alternativas": {"A": "Profundidade de Sondagem (PS).", "B": "Sangramento à Sondagem (SS).", "C": "até o fundo da bolsa ou sulco e é a medida de referência para quantificar a perda de suporte periodontal?", "D": "Recessão Gengival.", "E": "Bolsas Periodontais."}, "gabarito": "C", "comentario": "O Glossário Essencial de Periodontia define NIC (Nível de Inserção Clínica) como: \"Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\""}, {"enunciado": "A ausência de Sangramento à Sondagem (SS) é considerada o melhor indicador de:", "alternativas": {"A": "Presença de bolsas periodontais profundas.", "B": "Inflamação ativa generalizada.", "C": "Saúde gengival.", "D": "Perda de inserção clínica avançada.", "E": "Necessidade de cirurgia periodontal."}, "gabarito": "C", "comentario": "O Glossário Essencial de Periodontia afirma sobre o SS: \"Ausência de SS é o melhor indicador de saúde gengival.\" O sangramento é um sinal clássico de inflamação."}, {"enunciado": "Um paciente de 60 anos, com DM tipo 2 descompensado (HbA1c 9%) e tabagista (20 cigarros/dia há 40 anos), apresenta PS ≥ 6 mm em múltiplos sítios, NIC ≥ 5 mm em 80% dos sítios, perda óssea radiográfica avançada, perda de 6 dentes por doença periodontal e disfunção mastigatória (colapso de mordida). Qual o diagnóstico de periodontite, de acordo com o texto?", "alternativas": {"A": "Periodontite Estágio II, Grau B, Generalizada.", "B": "Gengivite induzida por biofilme, generalizada.", "C": "Periodontite Estágio III, Grau B, Localizada.", "D": "Periodontite Estágio IV, Grau C, Generalizada.", "E": "Periodontite Estágio I, Grau A, Generalizada."}, "gabarito": "D", "comentario": "Este é o Caso 3 do texto. As características (PS ≥ 6 mm, NIC ≥ 5 mm em 80% dos sítios, perda óssea avançada, perda de 6 dentes por doença periodontal e disfunção mastigatória/colapso de mordida) são indicativas de Estágio IV. O DM descompensado (HbA1c 9%) e o tabagismo intenso (20 cigarros/dia) o classificam como Grau C. A ampla distribuição (\"múltiplos sítios\", \"80% dos sítios\") indica generalizada."}, {"enunciado": "Qual procedimento é descrito como a principal terapia da fase I (TPNC) e envolve a remoção de cálculo e biofilme subgengival com alisamento da superfície radicular?", "alternativas": {"A": "Cirurgia periodontal a retalho.", "B": "Gengivectomia.", "C": "e envolve a remoção de cálculo e biofilme subgengival com alisamento da superfície radicular?", "D": "Enxerto gengival.", "E": "Osteoplastia."}, "gabarito": "C", "comentario": "O Glossário Essencial de Periodontia define RAR (Raspagem e Alisamento Radicular) como: \"Procedimento mecânico de remoção de cálculo e biofilme subgengival com alisamento da superfície radicular. Principal terapia da fase I (TPNC).\""}, {"enunciado": "A Terapia Periodontal Não Cirúrgica (TPNC) é indicada para quais estágios da periodontite?", "alternativas": {"A": "Apenas para Estágio I.", "B": "Apenas para Estágio IV.", "C": "é indicada para quais estágios da periodontite?", "D": "Para todos os estágios como primeira linha de tratamento.", "E": "Apenas para casos de gengivite."}, "gabarito": "D", "comentario": "O Glossário Essencial de Periodontia descreve TPNC (Terapia Periodontal Não Cirúrgica) como: \"Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\""}, {"enunciado": "Qual das classificações de furca indica que a sonda Nabers é passante, ou seja, atravessa completamente o espaço interradicular?", "alternativas": {"A": "Classe I (< 3 mm de profundidade horizontal).", "B": "Classe II (≥ 3 mm mas não passante).", "C": "Classe III (passante, tunnel).", "D": "Classe 0 (sem envolvimento de furca).", "E": "Classe IV (somente em molares superiores)."}, "gabarito": "C", "comentario": "A questão Q5 do Quiz de Verificação, ao descrever a sonda Nabers, complementa: \"Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\""}, {"enunciado": "Qual das seguintes condições NÃO é um critério para classificar um caso de periodontite como Estágio IV, de acordo com o texto?", "alternativas": {"A": "Perda de dentes devido à doença periodontal.", "B": "Colapso de mordida.", "C": "NIC ≥ 5 mm em 80% dos sítios.", "D": "Perda óssea radiográfica avançada (além do 1/3 médio).", "E": "Sangramento à sondagem generalizado."}, "gabarito": "E", "comentario": "O Estágio IV é caracterizado pela gravidade e complexidade, incluindo perda de dentes, disfunção mastigatória (colapso de mordida), migrações, perda óssea avançada e NIC elevado. O sangramento à sondagem generalizado é um indicador de inflamação ativa e está presente em todos os estágios de periodontite e gengivite, mas não é um critério definidor exclusivo para o Estágio IV. O Caso 3 exemplifica bem as características do Estágio IV."}, {"enunciado": "O Biofilme (Placa Dental) é o principal fator etiológico de quais condições periodontais, conforme o glossário?", "alternativas": {"A": "Apenas gengivite.", "B": "Apenas periodontite.", "C": "Gengivite e periodontite.", "D": "Recessão gengival.", "E": "Mobilidade dental."}, "gabarito": "C", "comentario": "O Glossário Essencial de Periodontia define Biofilme (Placa Dental) como: \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\" É crucial entender que o biofilme é a causa primária de ambas as doenças."}];
    let currentIndex = 0;
    let score = 0;
    let answered = new Array(questions.length).fill(false);
    let userAnswers = new Array(questions.length).fill(null);

    const questionHeader = document.getElementById('question-header');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedback = document.getElementById('feedback');
    const feedbackMessage = document.getElementById('feedback-message');
    const comentarioText = document.getElementById('comentario-text');
    const currentQNum = document.getElementById('current-q-num');
    const totalQNum = document.getElementById('total-q-num');
    const scoreDisplay = document.getElementById('score');
    const progressBar = document.getElementById('progress-bar');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const checkBtn = document.getElementById('check-btn');

    totalQNum.textContent = questions.length;

    function loadQuestion(index) {
        const q = questions[index];
        questionHeader.textContent = `Questão #${index + 1}`;
        questionText.textContent = q.enunciado;
        currentQNum.textContent = index + 1;
        
        optionsContainer.innerHTML = '';
        for (const [letter, text] of Object.entries(q.alternativas)) {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerHTML = `<strong>${letter})</strong> ${text}`;
            div.dataset.letter = letter;
            
            if (!answered[index]) {
                div.onclick = () => selectOption(div);
            } else {
                if (letter === q.gabarito) div.classList.add('correct');
                if (letter === userAnswers[index] && letter !== q.gabarito) div.classList.add('incorrect');
                if (letter === userAnswers[index]) div.classList.add('selected');
            }
            
            optionsContainer.appendChild(div);
        }

        if (answered[index]) {
            showFeedback(index);
            checkBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        } else {
            feedback.classList.remove('show');
            checkBtn.style.display = 'block';
            nextBtn.style.display = 'none';
            checkBtn.disabled = true;
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === questions.length - 1;
        
        updateProgress();
    }

    function selectOption(element) {
        const options = optionsContainer.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
        userAnswers[currentIndex] = element.dataset.letter;
        checkBtn.disabled = false;
    }

    function checkAnswer() {
        const q = questions[currentIndex];
        const selectedLetter = userAnswers[currentIndex];
        answered[currentIndex] = true;

        if (selectedLetter === q.gabarito) {
            score++;
            scoreDisplay.textContent = score;
        }

        loadQuestion(currentIndex);
    }

    function showFeedback(index) {
        const q = questions[index];
        const selectedLetter = userAnswers[index];
        
        feedback.classList.add('show');
        if (selectedLetter === q.gabarito) {
            feedback.className = 'feedback show feedback-correct';
            feedbackMessage.textContent = 'Correto!';
        } else {
            feedback.className = 'feedback show feedback-incorrect';
            feedbackMessage.textContent = `Incorreto. A resposta certa é a letra ${q.gabarito}.`;
        }
        comentarioText.innerHTML = `<strong>Comentário:</strong><br>${q.comentario.replace(/\n/g, '<br>')}`;
    }

    function updateProgress() {
        const progress = ((currentIndex + 1) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
    }

    prevBtn.onclick = () => {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion(currentIndex);
        }
    };

    nextBtn.onclick = () => {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        }
    };

    checkBtn.onclick = checkAnswer;

    loadQuestion(currentIndex);
</script>
