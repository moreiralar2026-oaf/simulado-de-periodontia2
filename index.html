
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 800px; margin-top: 50px; margin-bottom: 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background-color: #007bff; color: white; border-radius: 15px 15px 0 0 !important; font-weight: bold; }
        .option { cursor: pointer; transition: background-color 0.2s; padding: 10px; border: 1px solid #dee2e6; border-radius: 8px; margin-bottom: 10px; }
        .option:hover { background-color: #e9ecef; }
        .option.selected { background-color: #007bff; color: white; border-color: #007bff; }
        .option.correct { background-color: #28a745 !important; color: white; border-color: #28a745; }
        .option.incorrect { background-color: #dc3545 !important; color: white; border-color: #dc3545; }
        .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; }
        .feedback.show { display: block; }
        .feedback-correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .progress { height: 10px; margin-bottom: 20px; }
        #stats { font-size: 0.9rem; color: #6c757d; }
        .btn-navigation { min-width: 100px; }
        .comentario-box { margin-top: 15px; font-size: 0.95rem; line-height: 1.6; border-left: 4px solid #007bff; padding-left: 15px; }
    </style>
</head>
<body>

<div class="container">

        <h1>Simulado de Periodontia</h1>

        <div id="stats">Questão <span id="current-q-num">1</span> de <span id="total-q-num">0</span> | Acertos: <span id="score">0</span></div>

    <div id="quiz-container">

            <div class="card-header" id="question-header">
                Questão #1
            </div>
            <div class="card-body">
                <p id="question-text" class="fw-bold mb-4"></p>
                <div id="options-container">
                    <!-- Alternativas serão inseridas aqui -->

                <div id="feedback" class="feedback">
                    <div id="feedback-message" class="fw-bold"></div>

            </div>
            <div class="card-footer d-flex justify-content-between">
                <button id="prev-btn" class="btn btn-outline-secondary btn-navigation" disabled>Anterior</button>
                <button id="check-btn" class="btn btn-primary btn-navigation">Verificar</button>
                <button id="next-btn" class="btn btn-outline-primary btn-navigation" style="display: none;">Próxima</button>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [{"enunciado": "De acordo com a \"Apostila de Periodontia\", o periodonto é dividido em duas grandes unidades funcionais. Qual das alternativas apresenta corretamente os componentes do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular, Ligamento periodontal e Gengiva inserida.", "B": "Gengiva livre, Gengiva interdental e Osso alveolar.", "C": "Gengiva livre, Gengiva inserida e Gengiva interdental.", "D": "Ligamento periodontal, Osso alveolar e Gengiva interdental.", "E": "Cemento radicular, Gengiva livre e Gengiva interdental."}, "gabarito": "C", "comentario": "O texto claramente divide o periodonto em \"Periodonto de Proteção\" e \"Periodonto de Sustentação\". Na seção 1.1, sob \"Periodonto de Proteção\", são listados: Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As outras alternativas incluem componentes do Periodonto de Sustentação (cemento radicular, ligamento periodontal, osso alveolar) ou misturam os componentes de forma incorreta. É crucial para o diagnóstico e tratamento periodontal conhecer a distinção entre esses dois grupos de tecidos e seus respectivos componentes."}, {"enunciado": "Um paciente apresenta sangramento à sondagem em 15% dos sítios, edema e eritema gengival, mas sem evidência de perda de inserção clínica (NIC) ou perda óssea radiográfica. De acordo com a sequência lógica de progressão da doença periodontal apresentada no texto, qual o diagnóstico mais provável?", "alternativas": {"A": "Saúde Periodontal", "B": "Gengivite Induzida por Biofilme", "C": "ou perda óssea radiográfica. De acordo com a sequência lógica de progressão da doença periodontal apresentada no texto, qual o diagnóstico mais provável?", "D": "Doença Necrosante", "E": "Periodontite Estágio II"}, "gabarito": "B", "comentario": "A seção \"2.1 Sequência Lógica de Progressão\" descreve a \"Gengivite Induzida por Biofilme\" como uma condição com inflamação restrita à gengiva marginal, presença de sangramento à sondagem (≥ 10% dos sítios), edema e eritema, e, crucialmente, \"Ausência de perda de inserção (NIC) ou perda óssea radiográfica\". A \"Saúde Periodontal\" teria sangramento em < 10% dos sítios. As \"Periodontites\" sempre envolvem perda de inserção e perda óssea. \"Doenças Necrosantes\" apresentam características mais graves como necrose de papilas e dor intensa. A ausência de NIC e perda óssea é o diferencial chave para a gengivite."}, {"enunciado": "A nova classificação de 2018 para periodontite organiza a doença em dois eixos independentes e complementares. Qual a função principal do \"Estágio\" dentro dessa classificação?", "alternativas": {"A": "Descrever a velocidade de progressão da doença.", "B": "Relacionar a doença com fatores de risco como tabagismo e diabetes.", "C": "Determinar a gravidade da destruição já ocorrida e a complexidade do tratamento.", "D": "Indicar a presença de sangramento à sondagem e a profundidade de bolsa.", "E": "Avaliar a reversibilidade da condição com a remoção do biofilme."}, "gabarito": "C", "comentario": "A seção \"3.1 A Lógica da Classificação\" afirma que o \"ESTÁGIO (I, II, III, IV)\" descreve \"a gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário\". As alternativas A e B descrevem a função do \"Grau\". As alternativas D e E referem-se a critérios diagnósticos gerais ou à reversibilidade da gengivite, não à função específica do estágio na classificação da periodontite. Entender a distinção entre Estágio e Grau é fundamental para aplicar corretamente a nova classificação."}, {"enunciado": "Um paciente com periodontite apresenta perda de inserção clínica (NIC) de 5 mm, perda óssea radiográfica além do 1/3 médio da raiz, profundidade de sondagem (PS) de 7 mm, e envolvimento de furca Classe II em múltiplos dentes. Além disso, o paciente demonstra disfunção mastigatória significativa devido à mobilidade e migração dos dentes. De acordo com a tabela de sinais clínicos por estágio, qual o Estágio correto para este paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 5 mm, perda óssea radiográfica além do 1/3 médio da raiz, profundidade de sondagem (PS) de 7 mm, e envolvimento de furca Classe II em múltiplos dentes. Além disso, o paciente demonstra disfunção mastigatória significativa devido à mobilidade e migração dos dentes. De acordo com a tabela de sinais clínicos por estágio, qual o Estágio correto para este paciente?", "D": "Estágio IV", "E": "Não é possível determinar sem o Grau."}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"3.3 Tabela de Sinais Clínicos por Estágio\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Embora os outros critérios (NIC ≥ 5mm, PS ≥ 6mm, envolvimento de furca) também apontem para estágios avançados (III ou IV), a presença de disfunção mastigatória é o fator determinante e obrigatório para o diagnóstico de Estágio IV, conforme o texto."}, {"enunciado": "Durante o periograma completo, qual a pressão de sondagem recomendada para a coleta de dados, conforme o texto?", "alternativas": {"A": "0,5 N (≈ 50 g)", "B": "0,25 N (≈ 25 g)", "C": "1,0 N (≈ 100 g)", "D": "0,1 N (≈ 10 g)", "E": "A pressão varia de acordo com a inflamação do tecido."}, "gabarito": "B", "comentario": "Na seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", item 4 (Periograma Completo), o texto especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g)\". Esta é uma informação padronizada e crucial para a reprodutibilidade e acurácia das medições de profundidade de sondagem e nível de inserção clínica, evitando falsos positivos ou negativos devido a pressão excessiva ou insuficiente."}, {"enunciado": "Qual das seguintes sondas periodontais é especificamente indicada para a avaliação de envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15)", "B": "Sonda OMS (WHO / CPITN)", "C": "Sonda Nabers", "D": "Sonda Williams", "E": "Sonda Goldman-Fox"}, "gabarito": "C", "comentario": "A seção \"5.1 Sondas Periodontais: Quando Usar Cada Uma?\" lista a \"Sonda Nabers\" com a indicação principal: \"Avaliação de furca (Classes I, II, III)\". As sondas Carolina do Norte e OMS são para medição de PS/NIC e triagem epidemiológica, respectivamente. Sondas Williams e Goldman-Fox não são mencionadas no texto, mas a Nabers é inequivocamente a sonda para furca."}, {"enunciado": "De acordo com o \"Mapa de Uso\" das curetas Gracey, qual par de curetas é o correto para raspar as faces MESIAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "C", "comentario": "Na seção \"5.2 Curetas Gracey: Mapa de Uso\", a tabela indica claramente para o par \"11/12\": \"Região: Posteriores\", \"Faces: MESIAIS\", e o macete \"11/12 → Mesial\" (M de 11 = Mesial). O texto também inclui um \"ERRO CLÁSSICO\" alertando para não usar 11/12 em faces distais. As outras curetas são para regiões diferentes ou para faces vestibulares/linguais/palatinas ou distais."}, {"enunciado": "Durante a técnica de Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual o ângulo ideal da lâmina em relação à superfície radicular para uma raspagem eficaz e sem trauma tecidual?", "alternativas": {"A": "0° (fechado)", "B": "Entre 15° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90° (perpendicular)"}, "gabarito": "D", "comentario": "Na seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\", item 2 (\"Posicionamento\"), o texto instrui: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\" É uma informação técnica precisa e fundamental para a execução correta da RAR."}, {"enunciado": "Segundo o texto, qual é a \"regra de ouro\" que o cirurgião-dentista deve seguir para não atribuir erroneamente o diagnóstico de periodontite?", "alternativas": {"A": "Realizar sempre um exame radiográfico panorâmico.", "B": "Confirmar a presença de sangramento à sondagem em mais de 30% dos sítios.", "C": "Não confundir profundidade de sondagem aumentada com perda de inserção clínica.", "D": "Nunca atribuir o diagnóstico sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.", "E": "Avaliar a presença de disfunção mastigatória antes de qualquer diagnóstico."}, "gabarito": "D", "comentario": "Na seção \"4. Fluxo do Exame Clínico\", após o item 6, há uma \"Regra de ouro:\" que afirma: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\" Esta regra é vital para diferenciar periodontite de gengivite e evitar diagnósticos equivocados. A alternativa C é um \"ERRO FREQUENTE\" mencionado no texto, mas a \"regra de ouro\" é mais abrangente e definitiva."}, {"enunciado": "Conforme a seção \"Comunicação com o Paciente\", ao explicar a importância da manutenção periodontal, qual analogia é utilizada pelo texto para ilustrar que o tratamento clínico é como \"arrumar o telhado da casa\"?", "alternativas": {"A": "O biofilme como um filme esbranquiçado nos dentes.", "B": "A gengiva sangrando como uma mão que sangra ao lavar.", "C": "Os dentes presos no osso como postes fincados no chão.", "D": "A manutenção como continuar limpando as calhas e cuidando do jardim.", "E": "A doença como uma ferida que nunca cicatriza."}, "gabarito": "D", "comentario": "Na seção \"6. Comunicação com o Paciente\", no subtítulo \"Explicando a importância da manutenção\", o texto diz: \"O tratamento que fazemos aqui na clínica é como arrumar o telhado da casa. Mas se você não continuar limpando as calhas e cuidando do jardim, os problemas podem voltar.\" A analogia completa conecta o \"arrumar o telhado\" (tratamento clínico) com a \"limpeza das calhas e cuidado do jardim\" (manutenção em casa e visitas regulares), que é a alternativa D. As outras alternativas são analogias utilizadas para explicar outros conceitos."}, {"enunciado": "Um paciente apresenta gengiva com coloração rosa-coral, consistência firme e contorno festonado. Durante a sondagem, o sulco gengival mede 2 mm e o sangramento à sondagem ocorre em menos de 10% dos sítios. Não há evidências de perda de inserção clínica (NIC) ou perda óssea radiográfica. Com base nesses achados, qual é o diagnóstico mais adequado?", "alternativas": {"A": "Gengivite induzida por biofilme", "B": "Periodontite Estágio I", "C": "ou perda óssea radiográfica. Com base nesses achados, qual é o diagnóstico mais adequado?", "D": "Doença Periodontal Necrosante", "E": "Periodontite Estágio II"}, "gabarito": "C", "comentario": "A descrição dos achados clínicos (gengiva rosa-coral, firme, contorno festonado, sulco gengival ≤ 3 mm, sangramento à sondagem em < 10% dos sítios, ausência de perda de inserção e perda óssea) corresponde exatamente à definição de \"Saúde Periodontal\" apresentada na seção 2.1 do texto.\nA) Gengivite induzida por biofilme envolve a presença de sangramento à sondagem em ≥ 10% dos sítios, edema e eritema, o que não se encaixa perfeitamente na descrição do paciente.\nB) Periodontite Estágio I e E) Periodontite Estágio II implicam em perda de inserção clínica e perda óssea radiográfica, que estão ausentes neste caso.\nD) Doença Periodontal Necrosante apresenta necrose de papilas, dor intensa e sangramento espontâneo, sintomas que não foram mencionados.\n**Dica para a prova:** Memorize os critérios chave para diferenciar saúde, gengivite e periodontite, especialmente a presença ou ausência de perda de inserção clínica e perda óssea. O sangramento à sondagem é um indicador importante de inflamação, mas sua extensão (percentual de sítios) ajuda a diferenciar saúde de gengivite."}, {"enunciado": "Em relação às divisões funcionais do periodonto, qual das alternativas abaixo apresenta corretamente os componentes do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular, ligamento periodontal, osso alveolar.", "B": "Gengiva livre, gengiva inserida, gengiva interdental.", "C": "Gengiva ceratinizada, ligamento periodontal, osso alveolar.", "D": "Gengiva marginal, cemento radicular, gengiva interdental.", "E": "Ligamento periodontal, gengiva inserida, osso alveolar."}, "gabarito": "B", "comentario": "De acordo com a seção 1.1 \"Divisões Funcionais\" do texto, o Periodonto de Proteção é composto pela Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila).\nA) e C) descrevem componentes do Periodonto de Sustentação (cemento, ligamento periodontal, osso alveolar), misturando-os ou não.\nD) mistura componentes de proteção (gengiva marginal, gengiva interdental) com um de sustentação (cemento radicular).\nE) mistura componentes de proteção (gengiva inserida) com os de sustentação (ligamento periodontal, osso alveolar).\n**Dica para a prova:** O Periodonto de Proteção atua como uma barreira física e imunológica, sendo a parte visível da gengiva. O Periodonto de Sustentação é responsável pela ancoragem do dente e absorção de forças mastigatórias, sendo os tecidos mais internos."}, {"enunciado": "Um estudante de odontologia está realizando um exame periodontal e observa que um paciente apresenta perda de inserção clínica (NIC) de 4 mm, profundidade de sondagem (PS) de 5 mm e perda óssea radiográfica que atinge o terço coronário do dente. Não há perda dentária e o envolvimento de furca é de Classe I. Considerando a Classificação 2018 da Periodontite, qual Estágio corresponde a essa descrição?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 4 mm, profundidade de sondagem (PS) de 5 mm e perda óssea radiográfica que atinge o terço coronário do dente. Não há perda dentária e o envolvimento de furca é de Classe I. Considerando a Classificação 2018 da Periodontite, qual Estágio corresponde a essa descrição?", "D": "Estágio IV", "E": "Não é possível determinar o estágio com os dados fornecidos."}, "gabarito": "B", "comentario": "Conforme a tabela \"Tabela de Sinais Clínicos por Estágio\" na seção 3.3 do texto:\n- NIC de 4 mm se encaixa no Estágio II (NIC 3–4 mm).\n- PS de 5 mm se encaixa no Estágio II (PS ≤ 5 mm).\n- Perda óssea no terço coronário (< 15% para Estágio I, 15-30% para Estágio II) é consistente com Estágio II.\n- Ausência de perda dentária e envolvimento de furca Classe I também são compatíveis com Estágio II.\nA) Estágio I teria NIC de 1-2 mm e PS ≤ 4 mm.\nC) Estágio III teria NIC ≥ 5 mm e PS ≥ 6 mm.\nD) Estágio IV teria NIC ≥ 5 mm, PS ≥ 6 mm e, obrigatoriamente, disfunção mastigatória, além de perda de mais dentes.\n**Dica para a prova:** A memorização dos critérios de NIC, PS e perda óssea para cada estágio é fundamental. Lembre-se que a \"perda óssea\" no texto se refere à porcentagem do comprimento radicular."}, {"enunciado": "Qual das seguintes sondas periodontais é especificamente indicada para a avaliação de envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15)", "B": "Sonda OMS (WHO / CPITN)", "C": "Sonda Nabers", "D": "Sonda Williams", "E": "Sonda periodontal padrão milimetrada"}, "gabarito": "C", "comentario": "A seção 5.1 \"Sondas Periodontais: Quando Usar Cada Una?\" do texto afirma claramente que a Sonda Nabers é \"Curva, sem marcações agudas\" e sua \"Indicação Principal\" é \"Avaliação de furca (Classes I, II, III)\".\nA) A Sonda Carolina do Norte (UNC 15) é utilizada para medição de PS e NIC (padrão clínico).\nB) A Sonda OMS (WHO / CPITN) é para triagem epidemiológica (CPITN).\nD) Sonda Williams não foi mencionada no texto, embora exista.\nE) Sonda periodontal padrão milimetrada é um termo genérico, mas o texto especifica a Nabers para furca.\n**Dica para a prova:** As sondas têm formatos e marcações específicas para suas funções. A sonda Nabers, com sua curvatura, é projetada para acessar as áreas de furca."}, {"enunciado": "A nova Classificação da Doença Periodontal de 2018 abandona os termos \"crônica\" e \"agressiva\" e organiza a periodontite em dois eixos independentes. Quais são esses eixos?", "alternativas": {"A": "Extensão e Severidade", "B": "Estágio e Progressão", "C": "Estágio e Grau", "D": "Tipo e Gravidade", "E": "Localização e Fatores de Risco"}, "gabarito": "C", "comentario": "A seção 3.1 \"A Lógica da Classificação\" do texto afirma: \"A nova classificação (Tonetti, Greenwell & Kornman, 2018) abandona os termos 'crônica' e 'agressiva' e organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) e GRAU (A, B, C)\".\nA) Extensão e Severidade são conceitos que fazem parte do Estágio, mas não são os eixos principais da classificação.\nB) Progressão é o que o Grau descreve, mas não é um dos eixos principais junto com \"Estágio\".\nD) Tipo e Gravidade são termos mais genéricos e não representam a nomenclatura específica da Classificação 2018.\nE) Localização e Fatores de Risco são considerações importantes, mas não são os dois eixos primários da classificação.\n**Dica para a prova:** Entender a essência do Estágio (gravidade e complexidade do tratamento) e do Grau (velocidade de progressão e fatores de risco modificadores) é crucial para aplicar corretamente a Classificação 2018."}, {"enunciado": "Durante a Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual o ângulo ideal da lâmina em relação à superfície radicular para uma raspagem eficaz e segura?", "alternativas": {"A": "0° (fechado)", "B": "Entre 20° e 30°", "C": "Entre 45° e 55°", "D": "Entre 70° e 80°", "E": "Acima de 90°"}, "gabarito": "D", "comentario": "A seção 5.3 \"Técnica de Raspagem e Alisamento Radicular (RAR)\", item 2 \"Posicionamento\", informa: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nA) 0° é o ângulo de adaptação ou inserção.\nB) e C) Ângulos abaixo de 45° resultam em raspagem ineficaz.\nE) Ângulos acima de 90° podem causar trauma tecidual.\n**Dica para a prova:** O ângulo de trabalho da cureta Gracey é fundamental para a eficácia da remoção do cálculo e para evitar danos à superfície radicular. Lembre-se da regra \"70-80\" para o ângulo de trabalho e \"0\" para inserção."}, {"enunciado": "Um paciente apresenta sangramento à sondagem em 15% dos sítios, edema gengival, mas sem evidência de perda de inserção clínica (NIC) ou perda óssea radiográfica. A profundidade de sondagem em todos os sítios é de 3 mm. Qual o diagnóstico diferencial correto e a característica principal que o diferencia da periodontite?", "alternativas": {"A": "Periodontite, diferenciada pela presença de sangramento.", "B": "Saúde Periodontal, diferenciada pela ausência de inflamação.", "C": "ou perda óssea radiográfica. A profundidade de sondagem em todos os sítios é de 3 mm. Qual o diagnóstico diferencial correto e a característica principal que o diferencia da periodontite?", "D": "Doença Periodontal Necrosante, diferenciada pela ausência de necrose.", "E": "Periodontite, diferenciada pela profundidade de sondagem."}, "gabarito": "C", "comentario": "A seção 2.2 \"Diferencial Crítico: Gengivite × Periodontite\" e a \"Regra de ouro\" na seção 4 enfatizam que a ausência de perda de inserção (NIC) e perda óssea radiográfica é o critério mais importante para diferenciar gengivite de periodontite. O paciente descrito tem sangramento e edema (inflamação), mas sem perda de inserção ou óssea, o que caracteriza Gengivite.\nA) A periodontite tem sangramento, mas a ausência de NIC e perda óssea é o que diferencia, não a presença de sangramento.\nB) Não é saúde periodontal devido ao sangramento em 15% dos sítios e edema.\nD) Não há sintomas de doença necrozante.\nE) A profundidade de sondagem sozinha pode ser enganosa; a perda de inserção é o diferencial crítico.\n**Dica para a prova:** O \"ERRO FREQUENTE\" e a \"Regra de ouro\" do texto são alertas cruciais: NUNCA diagnostique periodontite sem perda de inserção e perda óssea. A profundidade de sondagem aumentada sem NIC é apenas um sulco ou bolsa gengival, não uma bolsa periodontal com perda de inserção."}, {"enunciado": "Qual dos seguintes instrumentos é mais adequado para a remoção de cálculo supragengival volumoso em todas as faces dos dentes, especialmente antes da raspagem subgengival com curetas Gracey?", "alternativas": {"A": "Cureta Gracey 13/14", "B": "Sonda Nabers", "C": "Cureta Gracey 11/12", "D": "Foice McCall 11/12", "E": "Cureta Universal McCall 13/14"}, "gabarito": "E", "comentario": "A seção 5.4 \"Outros Instrumentos Importantes\" menciona: \"McCall 13/14 e 17/18: Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\"\nA) e C) As curetas Gracey são área-específicas e são primariamente para raspagem subgengival.\nB) Sonda Nabers é para avaliação de furca.\nD) A Foice McCall 11/12 é indicada para espaços interproximais de posteriores, não para cálculo supragengival volumoso em todas as faces.\n**Dica para a prova:** As curetas universais (como McCall) são mais versáteis para cálculo supragengival, enquanto as Gracey são mais específicas e delicadas para o ambiente subgengival."}, {"enunciado": "Um paciente tabagista (15 cigarros/dia) com diabetes descompensado (HbA1c > 7%) apresenta perda óssea radiográfica de 2 mm/ano nos últimos 5 anos. Na Classificação 2018, qual Grau de periodontite seria atribuído a este paciente?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Grau D", "E": "Não é possível determinar o grau apenas com esses dados."}, "gabarito": "C", "comentario": "A seção 3.2 \"Analogias para Memorizar\", item \"Grau = 'O Velocímetro da Doença'\", descreve o Grau C como: \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" O paciente descrito se encaixa perfeitamente nesses critérios.\nA) Grau A é para progressão lenta, sem fatores de risco.\nB) Grau B é para progressão moderada, com tabagismo < 10 cig/dia ou HbA1c < 7%.\nD) Não existe Grau D na Classificação 2018.\nE) Os dados fornecidos são suficientes e claros para a determinação do Grau.\n**Dica para a prova:** Os fatores de risco como tabagismo e diabetes, juntamente com a taxa de perda óssea, são determinantes para a classificação do Grau. Lembre-se dos valores de corte (10 cig/dia e HbA1c < 7%) para diferenciar os graus B e C."}, {"enunciado": "Qual dos seguintes marcos anatômicos é utilizado como ponto de referência crucial para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Furca", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "A seção 1.2 \"Marcos Anatômicos Cruciais para o Diagnóstico\" lista a \"JEC - Junção Esmalte-Cemento\" e sua \"Importância Clínica\" como \"Ponto de referência para medir o NIC\". A \"Dica de prova\" também reforça que NIC = PS + Recessão Gengival (quando há recessão) ou NIC = PS − Hiperplasia Gengival (quando a gengiva migra coronalmente), sempre considerando a JEC como o ponto fixo de referência.\nA) A Crista Alveolar é importante para avaliar a perda óssea radiográfica, mas não é o ponto de referência para o NIC.\nB) O Fundo da Bolsa é o limite apical da medida de PS, mas o NIC é medido da JEC ao fundo da bolsa.\nD) A Furca é a bifurcação/trifurcação das raízes.\nE) A Margem Gengival é o ponto de partida para a medição da Profundidade de Sondagem (PS) e da Recessão Gengival, mas não é o ponto fixo para o NIC.\n**Dica para a prova:** A JEC é o ponto fixo e estável para a medição do NIC, pois não se altera com a inflamação ou recessão gengival, ao contrário da margem gengival."}, {"enunciado": "Um paciente apresenta sangramento à sondagem em 15% dos sítios, edema e eritema gengival, mas sem evidências de perda de inserção clínica (NIC) ou perda óssea radiográfica. A profundidade de sondagem (PS) em todos os sítios é menor ou igual a 3 mm. De acordo com a seção \"Saúde Periodontal e Níveis de Doença\" e o \"Diferencial Crítico: Gengivite × Periodontite\" do texto, qual o diagnóstico mais apropriado para este caso?", "alternativas": {"A": "Periodontite Estágio I", "B": "Saúde Periodontal", "C": "ou perda óssea radiográfica. A profundidade de sondagem (PS) em todos os sítios é menor ou igual a 3 mm. De acordo com a seção \"Saúde Periodontal e Níveis de Doença\" e o \"Diferencial Crítico: Gengivite × Periodontite\" do texto, qual o diagnóstico mais apropriado para este caso?", "D": "Gengivite Induzida por Biofilme", "E": "Periodontite Estágio III"}, "gabarito": "D", "comentario": "A questão descreve um quadro clássico de Gengivite Induzida por Biofilme. O texto afirma que a gengivite é caracterizada por inflamação restrita à gengiva marginal, presença de sangramento à sondagem (≥ 10% dos sítios), edema e eritema, e, crucialmente, ausência de perda de inserção (NIC) ou perda óssea radiográfica. A profundidade de sondagem ≤ 3 mm também é compatível com gengivite (sulco gengival).\n\nAs outras alternativas estão incorretas porque:\n- A) Periodontite Estágio I, C) Doença Necrosante e E) Periodontite Estágio III envolvem perda de inserção clínica e/ou perda óssea radiográfica, o que não foi observado no caso.\n- B) Saúde Periodontal é descartada pela presença de sangramento à sondagem em 15% dos sítios, edema e eritema. O texto define saúde periodontal com sangramento à sondagem em < 10% dos sítios.\n\nDica relevante: O \"ERRO FREQUENTE\" destacado no texto para concursos é justamente confundir profundidade de sondagem aumentada com perda de inserção. A ausência de perda de NIC e perda óssea radiográfica é o divisor de águas entre gengivite e periodontite."}, {"enunciado": "De acordo com a \"Classificação 2018: Estágios e Graus\" apresentada no texto, um paciente com perda de inserção clínica (NIC) de 5 mm, perda óssea radiográfica além do terço médio da raiz, profundidade de sondagem (PS) de 6 mm, e que apresenta disfunção mastigatória, seria classificado em qual estágio de periodontite?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 5 mm, perda óssea radiográfica além do terço médio da raiz, profundidade de sondagem (PS) de 6 mm, e que apresenta disfunção mastigatória, seria classificado em qual estágio de periodontite?", "D": "Estágio IV", "E": "Não é possível determinar o estágio sem informações sobre o grau."}, "gabarito": "D", "comentario": "O texto detalha os critérios para a classificação dos estágios da periodontite. O \"Macete\" na página 5 é explícito: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Embora os outros critérios (NIC ≥ 5 mm, perda óssea além do 1/3 médio, PS ≥ 6 mm) sejam compatíveis com Estágio III e IV, a presença da disfunção mastigatória é o fator determinante para o Estágio IV.\n\nAs outras alternativas estão incorretas porque:\n- A) Estágio I e B) Estágio II seriam para casos com menos destruição e sem disfunção mastigatória.\n- C) Estágio III apresenta NIC ≥ 5 mm e PS ≥ 6 mm, mas a disfunção mastigatória é o critério que eleva o caso para Estágio IV.\n- E) O estágio pode ser determinado com as informações fornecidas, especialmente o critério de disfunção mastigatória.\n\nDica relevante: Memorizar os \"macetes\" e \"erros frequentes\" destacados no texto é crucial para responder questões de concurso. A disfunção mastigatória é um critério de \"peso\" que define o Estágio IV."}, {"enunciado": "Qual das seguintes afirmações sobre o periodonto de proteção, conforme descrito na seção \"1.1 Divisões Funcionais\" do texto, está CORRETA?", "alternativas": {"A": "Sua principal função é ancorar o dente ao osso e absorver forças mastigatórias.", "B": "É composto por cemento radicular, ligamento periodontal e osso alveolar.", "C": "Em pacientes saudáveis, apresenta cor rosa-coral, consistência firme e superfície com pontilhado (\"casca de laranja\").", "D": "Contém fibras colágenas (Sharpey) que unem cemento a osso.", "E": "É responsável pela renovação constante do ligamento periodontal através de fibroblastos."}, "gabarito": "C", "comentario": "O texto, na seção \"1.1 Divisões Funcionais\", descreve o periodonto de proteção como composto pela gengiva livre, inserida e interdental. Sua função é ser uma \"barreira física e imunológica contra micro-organismos\". Em pacientes saudáveis, suas características são \"cor rosa-coral, consistência firme, superfície com pontilhado ('casca de laranja')\".\n\nAs outras alternativas estão incorretas porque:\n- A) e B) Descrevem a função e os componentes do Periodonto de Sustentação, não do periodonto de proteção.\n- D) e E) Referem-se a características do Ligamento Periodontal, que faz parte do Periodonto de Sustentação.\n\nDica relevante: É fundamental diferenciar claramente as divisões funcionais do periodonto (proteção e sustentação), seus componentes e suas respectivas funções e características clínicas."}, {"enunciado": "Durante a instrumentação periodontal, o cirurgião-dentista precisa avaliar o envolvimento de furca em um molar. De acordo com a seção \"5.1 Sondas Periodontais: Quando Usar Cada Uma?\", qual sonda deve ser utilizada para esta finalidade?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15)", "B": "Sonda OMS (WHO / CPITN)", "C": "Sonda Nabers", "D": "Sonda exploradora", "E": "Sonda milimetrada comum"}, "gabarito": "C", "comentario": "A seção \"5.1 Sondas Periodontais: Quando Usar Cada Uma?\" especifica claramente que a Sonda Nabers, \"curva, sem marcações agudas\", tem como indicação principal a \"Avaliação de furca (Classes I, II, III)\".\n\nAs outras alternativas estão incorretas porque:\n- A) A Sonda Carolina do Norte (UNC 15) é indicada para medição de PS e NIC.\n- B) A Sonda OMS (WHO / CPITN) é para triagem epidemiológica.\n- D) e E) A sonda exploradora e a sonda milimetrada comum não são as ferramentas específicas e padronizadas para avaliação de furca, que requer um formato curvo para acessar a área.\n\nDica relevante: Conhecer as indicações específicas de cada tipo de sonda periodontal é essencial para a prática clínica e para concursos. A sonda Nabers é a única desenhada para a furca."}, {"enunciado": "Um paciente apresenta sangramento à sondagem, mas sem perda de inserção clínica (NIC) confirmada radiograficamente. A profundidade de sondagem (PS) em alguns sítios é de 4 mm. Qual o diagnóstico, segundo o \"ERRO FREQUENTE\" e o \"Diferencial Crítico\" da seção \"2.2 Diferencial Crítico: Gengivite × Periodontite\"?", "alternativas": {"A": "Periodontite Estágio I", "B": "Gengivite Induzida por Biofilme", "C": "confirmada radiograficamente. A profundidade de sondagem (PS) em alguns sítios é de 4 mm. Qual o diagnóstico, segundo o \"ERRO FREQUENTE\" e o \"Diferencial Crítico\" da seção \"2.2 Diferencial Crítico: Gengivite × Periodontite\"?", "D": "Saúde Periodontal", "E": "Periodontite com bolsa falsa"}, "gabarito": "B", "comentario": "O texto alerta para um \"ERRO FREQUENTE\": \"Confundir profundidade de sondagem aumentada com perda de inserção. Sem perda de NIC confirmada radiograficamente, o diagnóstico é GENGIVITE, não periodontite.\" Embora a PS de 4 mm possa sugerir uma bolsa, a ausência de perda de NIC e perda óssea radiográfica é o critério definidor de gengivite. A gengivite pode apresentar PS aumentada devido ao edema gengival, criando uma \"bolsa falsa\" ou pseudobolsa.\n\nAs outras alternativas estão incorretas porque:\n- A) e C) Periodontite (qualquer estágio) requer perda de inserção e/ou perda óssea.\n- D) Saúde Periodontal é descartada pela presença de sangramento à sondagem.\n- E) Embora o termo \"bolsa falsa\" possa descrever a situação de PS aumentada sem perda de inserção, o diagnóstico clínico abrangente, conforme o texto, é Gengivite Induzida por Biofilme.\n\nDica relevante: A distinção entre pseudobolsa (presente na gengivite) e bolsa periodontal verdadeira (presente na periodontite) é feita pela presença ou ausência de perda de inserção clínica e perda óssea radiográfica."}, {"enunciado": "Qual das seguintes curetas Gracey é a mais indicada para raspagem e alisamento radicular das faces MESIAIS de dentes posteriores, de acordo com o \"Mapa de Uso\" da seção \"5.2 Curetas Gracey\"?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "McCall 13/14"}, "gabarito": "C", "comentario": "A seção \"5.2 Curetas Gracey: Mapa de Uso\" fornece um macete claro: \"11/12 → Mesial\" (M de 11 = Mesial). A cureta Gracey 11/12 é especificamente projetada para faces MESIAIS de dentes posteriores.\n\nAs outras alternativas estão incorretas porque:\n- A) Gracey 5/6 é para dentes anteriores e pré-molares (todas as faces).\n- B) Gracey 7/8 é para faces vestibulares e linguais/palatinas de dentes posteriores.\n- D) Gracey 13/14 é para faces DISTAIS de dentes posteriores, conforme alertado no \"ERRO CLÁSSICO\".\n- E) McCall 13/14 é uma cureta universal, não uma Gracey área-específica, e é mais indicada para supra-gengival.\n\nDica relevante: O conhecimento das curetas Gracey e suas áreas de atuação é fundamental. O macete \"M de 11 = Mesial\" e \"D de 14 = Distal\" para posteriores é muito útil."}, {"enunciado": "No contexto da \"Classificação 2018: Estágios e Graus\", o que o \"Grau\" da periodontite descreve, conforme o texto?", "alternativas": {"A": "A gravidade da destruição já ocorrida e a complexidade do tratamento necessário.", "B": "A extensão do estrago na estrutura dentária e o risco de desabamento.", "C": "A velocidade de progressão da doença e os fatores de risco que podem modificar essa velocidade.", "D": "O número de dentes perdidos devido à doença periodontal.", "E": "A presença de disfunção mastigatória como critério principal."}, "gabarito": "C", "comentario": "A seção \"3.1 A Lógica da Classificação\" afirma que o \"GRAU (A, B, C)\" \"Descreve a velocidade de progressão e os fatores de risco que podem modificar essa velocidade (tabagismo, diabetes)\". A analogia \"O Velocímetro da Doença\" reforça essa ideia.\n\nAs outras alternativas estão incorretas porque:\n- A) Descreve o \"ESTÁGIO\", não o grau.\n- B) É uma analogia para o \"ESTÁGIO\" (\"A Extensão do Estrago\").\n- D) O número de dentes perdidos é um critério para o ESTÁGIO (especificamente Estágio III e IV).\n- E) A disfunção mastigatória é um critério para o ESTÁGIO IV.\n\nDica relevante: É crucial diferenciar os conceitos de \"Estágio\" e \"Grau\" na Nova Classificação (2018), pois eles avaliam aspectos distintos da doença periodontal."}, {"enunciado": "Durante a Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual o ângulo ideal da lâmina em relação à superfície radicular ao atingir o fundo da bolsa, conforme a seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\"?", "alternativas": {"A": "0° (fechado)", "B": "Entre 15° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "Acima de 90°"}, "gabarito": "D", "comentario": "A seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\", no item \"2. Posicionamento\", especifica: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\n\nAs outras alternativas estão incorretas porque:\n- A) 0° (fechado) é o ângulo para a Adaptação (inserção da cureta).\n- B) e C) Ângulos abaixo de 45° resultam em raspagem ineficaz.\n- E) Ângulos acima de 90° causam trauma tecidual.\n\nDica relevante: O controle do ângulo de trabalho é um dos pilares da instrumentação periodontal eficaz e segura. Conhecer os ângulos corretos para inserção, trabalho e remoção é fundamental."}, {"enunciado": "Conforme a \"Regra de ouro\" do \"Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", qual condição é indispensável para atribuir o diagnóstico de periodontite?", "alternativas": {"A": "Profundidade de sondagem (PS) aumentada em todos os sítios.", "B": "Presença de sangramento à sondagem (SS) em mais de 30% dos sítios.", "C": "Confirmação de Perda de Inserção Clínica (NIC) com suporte radiográfico.", "D": "Envolvimento de furca em molares.", "E": "Presença de biofilme visível em mais de 10% dos sítios."}, "gabarito": "C", "comentario": "A \"Regra de ouro\" na seção \"4. Fluxo do Exame Clínico\" é enfática: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\n\nAs outras alternativas estão incorretas porque:\n- A) PS aumentada pode ocorrer na gengivite (pseudobolsa) sem periodontite.\n- B) SS é um critério para gengivite e periodontite, mas não é o definidor de periodontite sem NIC.\n- D) Envolvimento de furca é um sinal de periodontite avançada, mas a confirmação da perda de inserção é o primeiro passo para o diagnóstico.\n- E) Biofilme visível está presente tanto na saúde, gengivite quanto periodontite e é a causa da inflamação, mas não o critério de diagnóstico para periodontite.\n\nDica relevante: A perda de inserção clínica (NIC) é o critério mais importante para diferenciar gengivite de periodontite. A confirmação radiográfica de perda óssea corrobora a NIC."}, {"enunciado": "Um paciente pergunta ao dentista por que sua gengiva sangra ao escovar. De acordo com as diretrizes de \"Comunicação com o Paciente\" da seção 6 do texto, qual a melhor explicação que o profissional pode oferecer?", "alternativas": {"A": "\"O sangramento é normal, indica que você está escovando com força suficiente para remover o biofilme.\"", "B": "\"Sua gengiva sangra porque você tem periodontite avançada e precisa de cirurgia imediatamente.\"", "C": "\"Gengiva saudável NÃO sangra ao escovar. O sangramento é um sinal de que as gengivas estão inflamadas e é o corpo pedindo socorro.\"", "D": "\"O sangramento significa que você está com deficiência de vitamina C e precisa de suplementos.\"", "E": "\"O sangramento é um efeito colateral comum da escovação e não indica nenhum problema grave.\""}, "gabarito": "C", "comentario": "A seção \"6. Comunicação com o Paciente\", sob o título \"Por que a gengiva sangra?\", oferece a seguinte explicação: \"Gengiva saudável NÃO sangra ao escovar. Pense assim: se sua mão sangrasse toda vez que você a lavasse, você se preocuparia, certo? O sangramento é um sinal de que as gengivas estão inflamadas — é o corpo pedindo socorro. A boa notícia é que, com higiene correta, isso melhora rapidamente.\"\n\nAs outras alternativas estão incorretas porque:\n- A) É uma informação falsa e perigosa, pois o sangramento não é normal.\n- B) É um diagnóstico precipitado e alarmista, sem base nas informações fornecidas.\n- D) Embora a deficiência de vitamina C possa causar sangramento, a causa mais comum e a primeira a ser considerada é a inflamação por biofilme, e a explicação do texto foca nisso.\n- E) Contraria diretamente a premissa de que gengiva saudável não sangra e minimiza um sinal importante de doença.\n\nDica relevante: A comunicação eficaz com o paciente é tão importante quanto o tratamento clínico. Usar linguagem simples e analogias (como a da mão sangrando) ajuda o paciente a compreender a condição e a importância da higiene."}, {"enunciado": "De acordo com a \"Apostila de Periodontia\", o periodonto é dividido em duas grandes unidades funcionais. Qual das alternativas apresenta corretamente os componentes do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular, ligamento periodontal e osso alveolar.", "B": "Gengiva livre, gengiva inserida e osso alveolar.", "C": "Gengiva livre, gengiva inserida e gengiva interdental.", "D": "Ligamento periodontal, gengiva interdental e cemento radicular.", "E": "Osso alveolar, gengiva livre e gengiva inserida."}, "gabarito": "C", "comentario": "O texto define o Periodonto de Proteção como sendo composto pela Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As outras alternativas misturam componentes do Periodonto de Proteção com o Periodonto de Sustentação (cemento radicular, ligamento periodontal, osso alveolar), ou apresentam combinações incorretas.\nDica: Memorize as duas divisões e seus respectivos componentes para evitar confusão. O periodonto de proteção atua como uma barreira, enquanto o de sustentação ancora o dente."}, {"enunciado": "Segundo a \"Apostila de Periodontia\", qual dos seguintes marcos anatômicos é crucial para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Junção Esmalte-Cemento (JEC)", "E": "Linha mucogengival"}, "gabarito": "D", "comentario": "O texto afirma claramente que a Junção Esmalte-Cemento (JEC) é o \"Ponto de referência para medir o NIC\". A crista alveolar e o fundo da bolsa são importantes para outras medidas periodontais (perda óssea e profundidade de sondagem, respectivamente), e a furca é avaliada para envolvimento multirradicular, mas não são o ponto de referência para o NIC. A linha mucogengival não é mencionada como referência para o NIC neste contexto.\nDica: Lembre-se da fórmula NIC = PS + Recessão Gengival (quando há recessão) ou NIC = PS − Hiperplasia Gengival (quando a gengiva migra coronalmente). A JEC é o ponto fixo a partir do qual essas medidas são calculadas."}, {"enunciado": "Conforme a \"Apostila de Periodontia\", qual é a principal característica que diferencia uma Gengivite Induzida por Biofilme de uma Periodontite (Estágios I-IV)?", "alternativas": {"A": "Presença de sangramento à sondagem em ≥ 10% dos sítios.", "B": "Edema e eritema gengival.", "C": "Ausência de perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Profundidade de sondagem aumentada (≥ 4 mm).", "E": "Reversibilidade total com remoção do biofilme."}, "gabarito": "C", "comentario": "O quadro \"Diferencial Crítico: Gengivite × Periodontite\" e a descrição de Gengivite Induzida por Biofilme enfatizam que a gengivite é caracterizada pela \"Ausência de perda de inserção (NIC) ou perda óssea radiográfica\". Todas as outras alternativas (sangramento, edema, eritema, profundidade de sondagem aumentada e reversibilidade) podem estar presentes em ambos os quadros ou são características da gengivite, mas não são o diferencial crítico que a distingue da periodontite, que invariavelmente apresenta perda de NIC e óssea.\nDica: O \"ERRO FREQUENTE\" mencionado no texto é justamente confundir profundidade de sondagem aumentada com perda de inserção. A ausência de perda de inserção clínica e óssea é o marcador fundamental da gengivite."}, {"enunciado": "Na Classificação 2018 da doença periodontal, um paciente que apresenta Nível de Inserção Clínica (NIC) de 3-4 mm, Profundidade de Sondagem (PS) de ≤ 5 mm e nenhuma perda dentária devido à periodontite, seria classificado em qual estágio?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 3-4 mm, Profundidade de Sondagem (PS) de ≤ 5 mm e nenhuma perda dentária devido à periodontite, seria classificado em qual estágio?", "D": "Estágio IV", "E": "Não é possível determinar sem a perda óssea radiográfica."}, "gabarito": "B", "comentario": "A tabela \"Tabela de Sinais Clínicos por Estágio\" no texto indica que o Estágio II é caracterizado por NIC de 3-4 mm, PS de ≤ 5 mm e nenhuma perda dentária. O Estágio I tem NIC de 1-2 mm e PS de ≤ 4 mm. Estágios III e IV apresentam NIC ≥ 5 mm e geralmente maior perda dentária ou disfunção mastigatória. Embora a perda óssea radiográfica seja um critério, os dados fornecidos já são suficientes para classificar o estágio com base nos critérios de NIC e PS.\nDica: Conheça os principais limites de NIC e PS para cada estágio da periodontite, pois são critérios chave para a classificação."}, {"enunciado": "Um paciente apresenta NIC ≥ 5 mm, perda de 6 dentes devido à doença periodontal, e disfunção mastigatória evidente. De acordo com a Classificação 2018, qual seria o estágio da periodontite?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Grau C"}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"3.3 Tabela de Sinais Clínicos por Estágio\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Além disso, a perda de ≥ 5 dentes é um critério para Estágio IV. Grau C refere-se à velocidade de progressão e não ao estágio da doença.\nDica: A presença de disfunção mastigatória é um critério mandatório e exclusivo para o diagnóstico de Periodontite Estágio IV, independentemente de outros parâmetros."}, {"enunciado": "Durante o exame clínico periodontal, qual é a pressão de sondagem recomendada para a coleta de dados no periograma completo?", "alternativas": {"A": "0,10 N (≈ 10 g)", "B": "0,25 N (≈ 25 g)", "C": "0,50 N (≈ 50 g)", "D": "1,00 N (≈ 100 g)", "E": "A pressão deve ser determinada pela sensibilidade do paciente."}, "gabarito": "B", "comentario": "Na seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\", item 4 (Periograma Completo), o texto especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g)\". Esta é uma padronização internacional para garantir a reprodutibilidade das medidas.\nDica: A pressão padronizada é fundamental para evitar subestimar ou superestimar a profundidade de sondagem e o NIC, garantindo um diagnóstico mais preciso e comparável."}, {"enunciado": "Um dentista está realizando a raspagem e alisamento radicular em um molar superior e precisa instrumentar a face distal. Qual cureta Gracey é a mais indicada para essa tarefa, de acordo com o texto?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "McCall 13/14"}, "gabarito": "D", "comentario": "O \"Mapa de Uso\" das Curetas Gracey e o \"ERRO CLÁSSICO\" na seção 5.2 especificam que as Gracey 13/14 são para \"Posteriores\" e \"Faces DISTAIS\". As Gracey 11/12 são para faces mesiais de posteriores. As outras curetas Gracey são para regiões anteriores/pré-molares ou faces vestibulares/linguais de posteriores. McCall 13/14 é uma cureta universal, não uma Gracey específica para distais de posteriores.\nDica: O macete \"13/14 → Distal\" (D de 14 = Distal) é uma excelente forma de memorizar a indicação correta para essas curetas."}, {"enunciado": "Qual é o ângulo de angulação da lâmina da cureta em relação à superfície radicular recomendado durante a técnica de raspagem e alisamento radicular (RAR) para ser eficaz e evitar trauma tecidual?", "alternativas": {"A": "0° (fechado)", "B": "Entre 30° e 45°", "C": "Entre 70° e 80°", "D": "90°", "E": "Acima de 90°"}, "gabarito": "C", "comentario": "Na seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\", item 2 (Posicionamento), o texto instrui: \"angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\" O ângulo de 0° é para adaptação inicial.\nDica: A angulação correta é crucial para a eficácia da raspagem e para evitar danos aos tecidos moles e duros. Lembre-se que um ângulo muito fechado não remove o cálculo, e um ângulo muito aberto pode cortar o tecido mole."}, {"enunciado": "Segundo o texto, a adesão do paciente ao tratamento periodontal depende diretamente da qualidade da comunicação. Qual analogia é utilizada para explicar a importância da manutenção periodontal?", "alternativas": {"A": "O biofilme como um filme esbranquiçado que irrita a gengiva.", "B": "A gengiva sangrando como uma mão que sangra ao lavar.", "C": "Os dentes presos no osso como postes fincados no chão.", "D": "O tratamento na clínica como arrumar o telhado da casa.", "E": "A doença periodontal como uma ferida que nunca cicatriza."}, "gabarito": "D", "comentario": "Na seção \"6. Comunicação com o Paciente\", a analogia para explicar a importância da manutenção é: \"O tratamento que fazemos aqui na clínica é como arrumar o telhado da casa. Mas se você não continuar limpando as calhas e cuidando do jardim, os problemas podem voltar.\" As outras alternativas são analogias utilizadas para explicar outros conceitos (causa da doença, sangramento, perda óssea, etc.).\nDica: As analogias são ferramentas poderosas na comunicação com o paciente. Conhecer as analogias específicas para cada conceito ajuda a reforçar a importância da educação do paciente."}, {"enunciado": "Qual dos seguintes instrumentos é descrito como ideal para remoção de cálculo supragengival volumoso antes da Raspagem e Alisamento Radicular (RAR)?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15)", "B": "Sonda Nabers", "C": "Cureta Gracey 11/12", "D": "McCall 13/14 ou 17/18", "E": "Ultrassom (Piezoelétrico/Magnetoestritivo)"}, "gabarito": "D", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", o texto menciona: \"McCall 13/14 e 17/18: Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\" As sondas são para diagnóstico, as curetas Gracey são para RAR subgengival, e o ultrassom é um complemento que também pode ser usado, mas as curetas McCall são especificamente destacadas para o cálculo supragengival volumoso.\nDica: Compreender a função específica de cada instrumento é fundamental para o planejamento e execução do tratamento periodontal. Curetas universais são geralmente mais robustas e eficazes para grandes depósitos supragengivais antes de refinar com as Gracey subgengivais."}, {"enunciado": "1. De acordo com o texto, qual é a principal diferença entre Gengivite e Periodontite?", "alternativas": {"A": "A gengivite é uma inflamação que afeta apenas a gengiva, enquanto a periodontite é uma inflamação que afeta apenas o osso alveolar.", "B": "A periodontite é reversível, enquanto a gengivite não é.", "C": "A periodontite é caracterizada pela presença de perda de inserção clínica (NIC) e perda óssea radiográfica, ausentes na gengivite.", "D": "A gengivite sempre causa dor intensa, enquanto a periodontite é assintomática.", "E": "A gengivite é uma condição crônica, enquanto a periodontite é aguda."}, "gabarito": "C", "comentario": "A resposta correta é a C. O texto afirma explicitamente que a principal diferença entre gengivite e periodontite é \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\"\nAs outras alternativas estão incorretas:\nA) A periodontite afeta tanto a gengiva quanto o osso alveolar e outras estruturas de suporte, não apenas o osso.\nB) A gengivite é reversível, enquanto a periodontite não é completamente reversível, mas controlável.\nD) Nem a gengivite nem a periodontite sempre causam dor intensa; ambas podem ser assintomáticas em estágios iniciais ou em alguns casos.\nE) Ambas são consideradas condições crônicas, embora a gengivite possa ser aguda em certas manifestações.\nDica: Entender a distinção entre perda de inserção clínica (NIC) e profundidade de sondagem (PS) é crucial para o diagnóstico diferencial entre gengivite e periodontite. O NIC é o parâmetro mais fidedigno para avaliar a perda de suporte periodontal."}, {"enunciado": "2. Qual das seguintes opções descreve corretamente o ângulo recomendado da cureta durante o movimento de raspagem para remoção eficaz do cálculo, conforme o texto?", "alternativas": {"A": "Menos de 45° entre a lâmina e a superfície radicular, para evitar trauma.", "B": "Exatamente 90° para máxima remoção.", "C": "70° a 80° entre a face interna da lâmina e a superfície radicular.", "D": "Mais de 90° para alcançar áreas subgengivais profundas.", "E": "Qualquer ângulo é aceitável, desde que o instrumento esteja afiado."}, "gabarito": "C", "comentario": "A resposta correta é a C. O texto afirma: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular.\"\nAs outras alternativas estão incorretas:\nA) O texto menciona que \"< 45° = raspagem ineficaz (desliza sem cortar)\".\nB) E) O texto não recomenda 90° nem \"qualquer ângulo\".\nD) O texto afirma que \"> 90° = trauma tecidual\".\nDica: O controle do ângulo de inserção da cureta é fundamental para a eficácia da raspagem e para evitar danos aos tecidos moles e duros. Um ângulo inadequado pode levar a polimento do cálculo ou trauma gengival."}, {"enunciado": "3. No Caso 2, o paciente é diagnosticado com Periodontite Estágio II, Grau B, Generalizada. Qual dos fatores abaixo contribuiu para a classificação do Grau B?", "alternativas": {"A": "A idade do paciente (40 anos).", "B": "A presença de gengiva edemaciada e sangramento à sondagem generalizado.", "C": "O histórico de tabagismo (5 cigarros/dia há 10 anos) e DM tipo 2 controlado.", "D": "A mobilidade Grau 1 em incisivos inferiores.", "E": "A perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário)."}, "gabarito": "C", "comentario": "A resposta correta é a C. O texto menciona que o Grau (A, B, C) descreve a velocidade de progressão da doença e a resposta esperada ao tratamento, baseando-se em evidência direta de progressão ou \"fatores de risco modificadores (tabagismo, DM)\". No Caso 2, o paciente é tabagista (5 cigarros/dia há 10 anos) e tem DM tipo 2 controlado. Embora o texto não especifique que 5 cigarros/dia resulta em Grau B, ele categoriza o tabagismo e o DM como fatores de risco modificadores do Grau. No Quiz, é mencionado que \"Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C\", o que implica que um tabagismo de menor intensidade (como 5 cigarros/dia) ou um DM controlado, por si só, podem ser fatores que elevam o grau para B ou C, dependendo da combinação e da ausência de outros fatores que o manteriam em A.\nAs outras alternativas estão incorretas:\nA) A idade não é um fator direto para o Grau, mas para o Estágio.\nB) Gengiva edemaciada e sangramento à sondagem são sinais de inflamação e estão presentes tanto na gengivite quanto na periodontite, não sendo específicos para o Grau.\nD) A mobilidade Grau 1 é um indicador de complexidade, contribuindo para o Estágio, não para o Grau.\nE) A perda óssea radiográfica é um critério para o Estágio da doença (gravidade), não para o Grau (velocidade de progressão).\nDica: A classificação da periodontite de 2018 separa Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco). Fatores como tabagismo e diabetes, mesmo que controlados, são modificadores importantes do Grau."}, {"enunciado": "4. Qual é o principal fator etiológico da gengivite e periodontite, de acordo com o glossário apresentado?", "alternativas": {"A": "Sangramento à Sondagem (SS).", "B": "Nível de Inserção Clínica (NIC).", "C": ".", "D": "Recessão Gengival.", "E": "Mobilidade Dental."}, "gabarito": "C", "comentario": "A resposta correta é a C. No Glossário Essencial de Periodontia, a definição de \"Biofilme (Placa Dental)\" é: \"Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\"\nAs outras alternativas estão incorretas:\nA) Sangramento à Sondagem (SS) é um sinal de inflamação, não a causa.\nB) Nível de Inserção Clínica (NIC) é uma medida da perda de suporte, não a causa.\nD) Recessão Gengival é uma condição clínica, não a causa primária da doença.\nE) Mobilidade Dental é um sinal de perda de suporte avançada, não a causa.\nDica: É fundamental diferenciar sinais/sintomas/consequências da doença do seu fator etiológico primário. O biofilme é a base para o desenvolvimento da inflamação periodontal."}, {"enunciado": "5. Um paciente apresenta NIC = 6 mm, perda óssea radiográfica avançada (além do 1/3 médio), mobilidade Grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio correto para este paciente, considerando a classificação de periodontite de 2018 e as informações do texto?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar com as informações fornecidas."}, "gabarito": "C", "comentario": "A resposta correta é a C. A questão Q6 do Quiz no texto aborda exatamente esta situação: \"Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\"\nAs outras alternativas estão incorretas, pois o Estágio IV é reservado para casos com disfunção mastigatória ou perda dentária significativa devido à periodontite.\nDica: A classificação de Estágio na periodontite é baseada na gravidade, complexidade e extensão da doença. O Estágio IV implica em disfunção mastigatória e reabilitação complexa, sendo importante diferenciar do Estágio III, que, embora grave, ainda não apresenta essas disfunções."}, {"enunciado": "6. Qual a finalidade da sonda Nabers, conforme descrito no texto?", "alternativas": {"A": "Avaliar a profundidade de sondagem em locais com recessão gengival.", "B": "Medir o nível de inserção clínica (NIC) em dentes anteriores.", "C": "em dentes anteriores.", "D": "Avaliar o sangramento à sondagem em todos os sítios.", "E": "Determinar a mobilidade dental em dentes com trauma oclusal."}, "gabarito": "C", "comentario": "A resposta correta é a C. A questão Q5 do Quiz no texto pergunta: \"Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\"\nAs outras alternativas estão incorretas:\nA) A sonda periodontal comum é usada para profundidade de sondagem.\nB) O NIC é medido com sonda periodontal comum, usando a JEC como referência.\nD) O sangramento à sondagem é avaliado com sonda periodontal comum após a sondagem.\nE) A mobilidade dental é avaliada manualmente ou com dois cabos de instrumentos.\nDica: A sonda Nabers é um instrumento especializado, projetado com uma ponta curva para acessar e avaliar as áreas de furca em dentes molares e pré-molares superiores, onde as raízes se dividem."}, {"enunciado": "7. No Caso 3 (Periodontite Estágio IV, Grau C, Generalizada), o prognóstico é considerado \"Reservado\" e exige manejo multidisciplinar e adesão máxima do paciente. Qual dos fatores abaixo é um dos principais contribuintes para a classificação de Grau C neste caso?", "alternativas": {"A": "A idade da paciente (60 anos).", "B": "A presença de gengiva retraída e sangramento à sondagem.", "C": "O diagnóstico de DM tipo 2 descompensado (HbA1c 9%).", "D": "A perda de 6 dentes por doença periodontal.", "E": "A disfunção mastigatória (colapso de mordida)."}, "gabarito": "C", "comentario": "A resposta correta é a C. O texto, na questão Q4 do Quiz, explica que o Grau descreve a velocidade de progressão e é baseado em fatores de risco modificadores como tabagismo e DM. No caso 3, a paciente apresenta \"DM tipo 2 descompensado (HbA1c 9%)\" e \"Tabagista (20 cigarros/dia há 40 anos)\". Ambos são fatores de risco que aceleram a progressão da doença, classificando-a como Grau C. O texto afirma na Q8 que \"O tabaco compromete a resposta imune... acelera a destruição periodontal... Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C\", e o diabetes descompensado também é um forte fator de risco para progressão rápida e resposta diminuída ao tratamento.\nAs outras alternativas estão incorretas:\nA) A idade é um fator para o Estágio, não para o Grau.\nB) Gengiva retraída e sangramento à sondagem são sinais clínicos, não determinantes do Grau.\nD) A perda de 6 dentes é um critério para o Estágio (gravidade e complexidade, Estágio IV).\nE) A disfunção mastigatória (colapso de mordida) é um critério para o Estágio IV, indicando complexidade.\nDica: Diabetes descompensado e tabagismo pesado são fatores de risco sistêmicos que impactam significativamente a resposta do hospedeiro à infecção periodontal, levando a uma progressão mais rápida e, consequentemente, a um Grau C."}, {"enunciado": "8. Qual a função principal da Terapia Periodontal Não Cirúrgica (TPNC) e qual o procedimento essencial que a compõe, de acordo com o texto?", "alternativas": {"A": "Reabilitação protética complexa, composta por cirurgias periodontais.", "B": "Controle da progressão da doença através de exodontias.", "C": "e qual o procedimento essencial que a compõe, de acordo com o texto?", "D": "Apenas instrução de higiene oral (IHO) e controle de fatores de risco.", "E": "Avaliação contínua da condição periodontal sem intervenções ativas."}, "gabarito": "C", "comentario": "A resposta correta é a C. No glossário, a definição de \"TPNC — Terapia Periodontal Não Cirúrgica\" é: \"Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\" E a definição de \"RAR — Raspagem e Alisamento Radicular\" é: \"Procedimento mecânico de remoção de cálculo e biofilme subgengival com alisamento da superfície radicular. Principal terapia da fase I (TPNC).\"\nAs outras alternativas estão incorretas:\nA) Reabilitação protética e cirurgias são parte do tratamento para casos mais avançados (Estágio IV), mas não a principal função da TPNC inicial.\nB) Exodontias são extrações dentárias, não a função principal da TPNC.\nD) A TPNC inclui IHO e controle de fatores de risco, mas também, e principalmente, a RAR.\nE) A TPNC envolve intervenções ativas, não apenas avaliação.\nDica: A TPNC é a base do tratamento periodontal, independentemente do estágio da doença, e a Raspagem e Alisamento Radicular (RAR) é o procedimento chave para remover o biofilme e cálculo subgengival, controlando a infecção."}, {"enunciado": "9. O que o Sangramento à Sondagem (SS) indica e qual é o melhor indicador de saúde gengival, segundo o glossário?", "alternativas": {"A": "Indica ausência de inflamação e o melhor indicador de saúde é a presença de SS.", "B": "Indica inflamação ativa e o melhor indicador de saúde é a ausência de SS.", "C": "Indica trauma tecidual e o melhor indicador de saúde é a presença de recessão gengival.", "D": "Indica perda óssea radiográfica e o melhor indicador de saúde é a mobilidade dental.", "E": "Indica biofilme mineralizado e o melhor indicador de saúde é a profundidade de sondagem reduzida."}, "gabarito": "B", "comentario": "A resposta correta é a B. No glossário, a definição de \"SS — Sangramento à Sondagem\" é: \"Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\"\nAs outras alternativas estão incorretas, pois contradizem diretamente a informação fornecida.\nDica: O sangramento à sondagem é um sinal clínico crucial de inflamação gengival. Sua ausência é um forte indicativo de estabilidade e saúde periodontal, especialmente após o tratamento."}, {"enunciado": "1. De acordo com o texto, qual é a principal diferença entre Gengivite e Periodontite?", "alternativas": {"A": "A gengivite apresenta perda óssea radiográfica, enquanto a periodontite não.", "B": "A periodontite é reversível com higiene oral adequada, enquanto a gengivite não.", "C": "A gengivite é uma inflamação restrita à gengiva sem perda de suporte, e a periodontite envolve perda de inserção clínica e perda óssea.", "D": "A periodontite é sempre localizada, e a gengivite é sempre generalizada.", "E": "A gengivite é caracterizada por sangramento à sondagem, enquanto a periodontite não."}, "gabarito": "C", "comentario": "A questão aborda um conceito fundamental na periodontia, a distinção entre gengivite e periodontite. O texto afirma claramente que a principal diferença é \"A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\"\n- A alternativa A está incorreta porque a perda óssea radiográfica é característica da periodontite, não da gengivite.\n- A alternativa B está incorreta porque a gengivite é reversível, enquanto a periodontite não é.\n- A alternativa D está incorreta, pois ambas as condições podem ser localizadas ou generalizadas.\n- A alternativa E está incorreta porque o sangramento à sondagem é um sinal comum de inflamação em ambas as condições, embora a sua ausência seja um melhor indicador de saúde gengival.\nDica: Sempre memorize as características distintivas das doenças periodontais, especialmente a presença de perda de inserção e perda óssea, que marcam a transição de gengivite para periodontite."}, {"enunciado": "2. Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e com DM tipo 2 controlado (HbA1c 6,5%), apresenta gengiva edemaciada, sangramento à sondagem generalizado, PS de 4-5 mm em vários sítios e NIC de 3-4 mm em 40% dos sítios. Há perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário) e mobilidade Grau 1 em incisivos inferiores. De acordo com o texto, qual o diagnóstico e o prognóstico esperados para este paciente?", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada; Prognóstico: Excelente.", "B": "Periodontite Estágio II, Grau B, Generalizada; Prognóstico: Bom.", "C": "Periodontite Estágio IV, Grau C, Generalizada; Prognóstico: Reservado.", "D": "Periodontite Estágio I, Grau A, Localizada; Prognóstico: Excelente.", "E": "Periodontite Estágio III, Grau B, Generalizada; Prognóstico: Reservado."}, "gabarito": "B", "comentario": "Esta questão exige a aplicação da classificação de periodontite de 2018 com base nos dados clínicos do caso 2.\n- O paciente tem 40 anos, PS 4-5 mm, NIC 3-4 mm, perda óssea em 20% dos dentes (1/3 coronário) e mobilidade Grau 1. Estes achados são consistentes com Estágio II (PS 4-5 mm, perda óssea no terço coronário).\n- Os fatores de risco são tabagismo (5 cigarros/dia, que o texto indica como modificador de Grau B) e DM tipo 2 controlado (HbA1c 6,5%, também consistente com Grau B).\n- A condição é generalizada, pois o sangramento e as bolsas são generalizados.\n- O prognóstico indicado no texto para este caso é \"Bom, com controle da progressão e adesão à manutenção\".\n- A alternativa A é incorreta porque o paciente apresenta perda de inserção e perda óssea, o que descarta gengivite.\n- A alternativa C é incorreta, pois Estágio IV e Grau C (tabagismo > 10 cigarros/dia ou DM descompensado) são para casos mais graves.\n- A alternativa D é incorreta, pois o Estágio I e Grau A são para casos menos avançados e sem fatores de risco como tabagismo e DM.\n- A alternativa E é incorreta, pois o Estágio III envolve NIC ≥ 5mm e perda óssea além do 1/3 médio.\nDica: Familiarize-se com os critérios de Estágio e Grau da classificação de periodontite de 2018, prestando atenção aos valores de NIC, PS, perda óssea e fatores de risco como tabagismo e DM."}, {"enunciado": "3. Qual o ângulo recomendado da cureta durante o movimento de raspagem para remover o cálculo de forma eficaz e sem causar trauma, conforme descrito no texto?", "alternativas": {"A": "Menor que 45°", "B": "45° a 60°", "C": "70° a 80°", "D": "80° a 90°", "E": "Maior que 90°"}, "gabarito": "C", "comentario": "O texto é explícito ao afirmar: \"Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\"\n- A alternativa A está incorreta porque um ângulo menor que 45° torna a raspagem ineficaz.\n- As alternativas B, D e E estão incorretas, pois o ângulo ótimo para raspagem eficaz e segura é de 70° a 80°. Um ângulo maior que 90° pode causar trauma tecidual.\nDica: O conhecimento sobre a angulação correta dos instrumentos é crucial para a prática clínica e frequentemente cobrado em concursos. Lembre-se que um ângulo inadequado pode comprometer a eficácia do procedimento e causar danos aos tecidos."}, {"enunciado": "4. Segundo o texto, o que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A gravidade da doença e a complexidade do tratamento.", "B": "A presença de perda óssea radiográfica e a profundidade de sondagem.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseada em evidência direta de progressão ou fatores de risco modificadores.", "D": "O número de dentes perdidos devido à periodontite e a necessidade de cirurgias periodontais.", "E": "A presença de sangramento à sondagem e a quantidade de biofilme acumulado."}, "gabarito": "C", "comentario": "O texto define claramente o Grau: \"O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\"\n- A alternativa A descreve o Estágio (gravidade e complexidade), não o Grau.\n- As alternativas B, D e E descrevem parâmetros clínicos e radiográficos que ajudam a determinar o Estágio e a presença da doença, mas não definem o Grau especificamente como a velocidade de progressão e a resposta ao tratamento.\nDica: Distinguir entre Estágio e Grau é fundamental na nova classificação. Lembre-se que o Estágio avalia a extensão e severidade do dano presente, enquanto o Grau avalia a taxa de progressão da doença e o risco futuro, influenciado por fatores sistêmicos e ambientais."}, {"enunciado": "5. Qual das seguintes opções NÃO é uma característica da Periodontite Estágio IV, Grau C, Generalizada, conforme o Caso 3 apresentado?", "alternativas": {"A": "Perda de 6 dentes por doença periodontal.", "B": "Disfunção mastigatória (colapso de mordida).", "C": "DM tipo 2 descompensado (HbA1c 9%).", "D": "Perda óssea radiográfica além do 1/3 médio.", "E": "Prognóstico excelente, com reversão completa se houver adesão à higiene."}, "gabarito": "E", "comentario": "A questão pede a característica que NÃO se aplica ao caso clínico 3.\n- O caso 3 descreve um paciente com Periodontite Estágio IV, Grau C, Generalizada.\n- As características clínicas incluem: perda de 6 dentes por doença periodontal (A), disfunção mastigatória (colapso de mordida) (B), DM tipo 2 descompensado (HbA1c 9%) (C), e perda óssea radiográfica avançada (além do 1/3 médio) (D). Todas essas são características presentes no caso.\n- O prognóstico para este caso é explicitamente descrito como \"Reservado, exige manejo multidisciplinar e adesão máxima do paciente.\" Portanto, a alternativa E, que sugere um \"Prognóstico excelente, com reversão completa\", está incorreta para este caso.\nDica: Ao analisar casos clínicos, é essencial correlacionar todos os dados fornecidos (idade, histórico, achados clínicos, radiográficos) com os critérios de classificação e prognóstico. A leitura atenta dos detalhes de cada caso é crucial."}, {"enunciado": "6. Um paciente com Nível de Inserção Clínica (NIC) = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. De acordo com o texto, qual o Estágio correto para este paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "= 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. De acordo com o texto, qual o Estágio correto para este paciente?", "D": "Estágio IV", "E": "Gengivite"}, "gabarito": "C", "comentario": "A questão remete diretamente a um exemplo dado no quiz de verificação: \"Q6. Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\"\n- As características (NIC = 6 mm, perda óssea além do terço médio) indicam uma gravidade que ultrapassa os Estágios I e II.\n- A ausência de perda dentária e, crucialmente, de disfunção mastigatória (colapso de mordida), impede o diagnóstico de Estágio IV.\n- Gengivite é descartada pela presença de NIC e perda óssea.\nDica: A distinção entre Estágio III e Estágio IV na classificação de periodontite é sutil, mas importante. Lembre-se que a presença de perda de dentes devido à periodontite e/ou disfunção mastigatória (como colapso de mordida) são critérios para o Estágio IV. Sem esses fatores, mesmo com alta severidade, o Estágio é III."}, {"enunciado": "7. Qual instrumento é especificamente utilizado para detectar envolvimento de furca, e como são classificadas as furcas conforme o texto?", "alternativas": {"A": "Sonda Carolina; Classe I (< 3 mm), Classe II (≥ 3 mm), Classe III (passante).", "B": "Sonda Periodontal Milimetrada; Classe I (até 1/3), Classe II (até 2/3), Classe III (total).", "C": "Sonda Nabers; Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante), Classe III (passante).", "D": "Sonda Excurvada; Classe I (apenas início), Classe II (parcial), Classe III (completa).", "E": "Sonda Exploradora; Classe I (superficial), Classe II (média), Classe III (profunda)."}, "gabarito": "C", "comentario": "O texto responde diretamente a esta questão no quiz de verificação: \"Q5. Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular. Furcas são classificadas em: Classe I (< 3 mm de profundidade horizontal), Classe II (≥ 3 mm mas não passante) e Classe III (passante, tunnel).\"\n- As alternativas A, B, D e E estão incorretas por citarem sondas inadequadas ou classificações de furca que não correspondem às descritas no texto.\nDica: A sonda Nabers é um instrumento essencial na prática periodontal para o diagnóstico de lesões de furca. Conhecer a classificação de Glickman (Classe I, II, III) é fundamental para descrever a extensão do envolvimento de furca."}, {"enunciado": "8. De acordo com o glossário essencial, o que é o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "A distância em mm da margem gengival até o fundo da bolsa/sulco.", "B": "O sangramento que ocorre até 30 segundos após a sondagem.", "C": "?", "D": "O aprofundamento patológico do sulco gengival (> 3 mm).", "E": "O deslocamento apical da margem gengival em relação à JEC."}, "gabarito": "C", "comentario": "O glossário define NIC como: \"Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\"\n- A alternativa A descreve a Profundidade de Sondagem (PS).\n- A alternativa B descreve o Sangramento à Sondagem (SS).\n- A alternativa D descreve a Bolsa Periodontal.\n- A alternativa E descreve a Recessão Gengival.\nDica: É crucial diferenciar NIC de PS. O NIC é a medida mais precisa da perda de suporte periodontal, pois utiliza a JEC como um ponto de referência fixo, independentemente da posição da margem gengival."}, {"enunciado": "9. Qual o principal fator etiológico da gengivite e periodontite, conforme o glossário do texto?", "alternativas": {"A": "Tabagismo", "B": "Diabetes Mellitus", "C": "Biofilme (Placa Dental)", "D": "Trauma oclusal", "E": "Fatores genéticos"}, "gabarito": "C", "comentario": "O glossário afirma: \"Biofilme (Placa Dental): Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\"\n- Tabagismo e Di
