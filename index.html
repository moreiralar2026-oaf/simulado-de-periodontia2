nvolvimento de furca Classe II/III.", "C": "Defeitos ósseos verticais.", "D": "Disfunção mastigatória.", "E": "Perda dentária de 5 ou mais dentes."}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"3.3 Tabela de Sinais Clínicos por Estágio\" afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\"\nDica: Disfunção mastigatória é um indicador crítico de uma condição avançada e complexa, elevando automaticamente o estágio para IV."}, {"enunciado": "8. Um paciente com periodontite apresenta tabagismo de 15 cigarros/dia. Com base nesse fator de risco, qual o Grau mais provável para a progressão da doença?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Grau D", "E": "Não é possível determinar o Grau apenas com tabagismo."}, "gabarito": "C", "comentario": "Na seção \"3.2 Analogias para Memorizar\", o \"Grau C\" é associado a \"Progressão rápida. Tabagismo ≥ 10 cig/dia...\". O tabagismo de 15 cigarros/dia se enquadra nesta categoria.\nDica: O Grau é o \"velocímetro da doença\". Fatores como tabagismo e diabetes descompensado aceleram a progressão."}, {"enunciado": "9. Qual é a pressão de sondagem recomendada para a coleta de dados no periograma completo, conforme o texto?", "alternativas": {"A": "0,5 N", "B": "1,0 N", "C": "0,25 N", "D": "2,0 N", "E": "A pressão varia de acordo com o sítio."}, "gabarito": "C", "comentario": "Na seção \"4. Periograma Completo (Sondagem Periodontal)\", é especificado: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\"\nDica: A pressão padronizada garante a reprodutibilidade e minimiza o trauma tecidual durante a sondagem."}, {"enunciado": "10. Qual tipo de radiografia é considerado o \"padrão ouro\" para avaliação do nível da crista alveolar em relação à JEC, segundo o texto?", "alternativas": {"A": "Panorâmica", "B": "Interproximal", "C": "Oclusal", "D": "Periapical", "E": "Tomografia Cone Beam"}, "gabarito": "D", "comentario": "Na seção \"5. Exame Radiográfico\", é mencionado: \"Rx periapicais (padrão ouro) ou panorâmico como triagem.\"\nDica: As radiografias periapicais fornecem a melhor visualização detalhada da relação osso-dente para o diagnóstico periodontal."}, {"enunciado": "11. Qual das sondas periodontais é a \"padrão clínico\" para medição de PS e NIC, sendo milimetrada a cada milímetro até 15 mm?", "alternativas": {"A": "Sonda OMS (WHO / CPITN)", "B": "Sonda Nabers", "C": "Sonda Carolina do Norte (UNC 15)", "D": "Sonda Goldman-Fox", "E": "Sonda Williams"}, "gabarito": "C", "comentario": "A tabela \"5.1 Sondas Periodontais: Quando Usar Cada Una?\" descreve a \"Carolina do Norte (UNC 15)\" como \"Milimetrada a cada mm, total 15 mm\" e sua indicação principal como \"Medição de PS e NIC — padrão clínico\".\nDica: Conhecer as características e indicações de cada sonda é fundamental para o exame periodontal correto."}, {"enunciado": "12. Uma cureta Gracey é caracterizada por ter o fio cortante em apenas um de seus lados. Qual é a posição correta desse fio cortante, conforme o texto?", "alternativas": {"A": "O fio cortante é a borda superior quando a lâmina é paralela ao chão.", "B": "O fio cortante é a borda lateral (superior) quando a lâmina é paralela ao chão.", "C": "O fio cortante é a borda lateral (inferior) quando a lâmina é paralela ao chão.", "D": "Ambos os lados da lâmina são fios cortantes.", "E": "O fio cortante é a extremidade da ponta da lâmina."}, "gabarito": "C", "comentario": "Na seção \"5.2 Curetas Gracey: Mapa de Uso\", está claro que \"O fio cortante é apenas o lateral (inferior) — a borda mais baixa quando a lâmina é paralela ao chão\".\nDica: A identificação correta do fio cortante é crucial para a angulação e eficácia da raspagem, evitando trauma tecidual."}, {"enunciado": "13. Qual par de Curetas Gracey é especificamente indicado para as faces DISTAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A tabela \"5.2 Curetas Gracey: Mapa de Uso\" indica que o par \"13/14\" é para \"Posteriores\" e \"Faces DISTAIS\", com o macete \"13/14 → Distal\". O \"ERRO CLÁSSICO\" também reforça essa informação.\nDica: memorize os macetes \"M de 11 = Mesial\" e \"D de 14 = Distal\" para Gracey 11/12 e 13/14, respectivamente."}, {"enunciado": "14. Durante a técnica de Raspagem e Alisamento Radicular (RAR), qual é a angulação ideal da lâmina da cureta em relação à superfície radicular ao atingir o fundo da bolsa?", "alternativas": {"A": "0° (fechado)", "B": "Entre 10° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90°"}, "gabarito": "D", "comentario": "A seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\" no item \"2. Posicionamento\" afirma: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular.\" Também alerta que \"Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: A angulação correta é um dos pilares para uma RAR eficaz e atraumática."}, {"enunciado": "15. Qual é a principal vantagem do uso do ultrassom (piezoelétrico/magnetoestritivo) em relação à instrumentação manual, conforme mencionado no texto?", "alternativas": {"A": "Melhor feedback tátil.", "B": "Menor fadiga do operador.", "C": "Maior eficácia em cálculos supragengivais.", "D": "Dispensa o uso de água.", "E": "Não requer afiação."}, "gabarito": "B", "comentario": "Na seção \"5.4 Outros Instrumentos Importantes\", o ultrassom é descrito como \"Complementar ao manual. Eficaz em bolsas profundas. Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\"\nDica: O ultrassom é um excelente complemento, mas a instrumentação manual é insubstituível em muitas situações, especialmente pela sensibilidade tátil."}, {"enunciado": "16. De acordo com o texto, qual é a porcentagem do sucesso do tratamento clínico que é atribuída à higiene oral domiciliar do paciente?", "alternativas": {"A": "10%", "B": "25%", "C": "50%", "D": "75%", "E": "100%"}, "gabarito": "C", "comentario": "A seção \"6. Comunicação com o Paciente\" inicia afirmando: \"Lembre-se: o tratamento clínico representa apenas 50% do sucesso — a outra metade é a higiene oral domiciliar do paciente\".\nDica: A comunicação eficaz e a motivação do paciente são tão importantes quanto a habilidade técnica do profissional."}, {"enunciado": "17. Qual é a analogia utilizada no texto para explicar a perda óssea periodontal ao paciente?", "alternativas": {"A": "Um filme esbranquiçado nos dentes (biofilme).", "B": "O sangramento da mão ao lavá-la (gengiva sangrando).", "C": "Postes fincados no chão, onde a infecção corrói o alicerce (osso alveolar).", "D": "Arrumar o telhado da casa, mas não limpar as calhas (manutenção).", "E": "Uma ferida que nunca cicatriza (inflamação gengival)."}, "gabarito": "C", "comentario": "Na seção \"6. Comunicação com o Paciente\", sob o título \"Explicando perda óssea\", a analogia é: \"Os seus dentes ficam presos no osso da mandíbula como se fossem postes fincados no chão. Esse osso é o alicerce do dente. Quando a infecção periodontal avança, ela começa a corroer esse alicerce...\"\nDica: O uso de analogias simples e claras é uma ferramenta poderosa na comunicação clínica."}, {"enunciado": "18. Qual das seguintes condições não é um fator de risco ou condição médica que deve ser investigada na anamnese, por sua relação com a doença periodontal ou com seu tratamento, conforme o texto?", "alternativas": {"A": "Diabetes Mellitus (DM)", "B": "Tabagismo", "C": "Gravidez", "D": "Hipertensão arterial (sem uso de nifedipina)", "E": "Uso de ciclosporina"}, "gabarito": "D", "comentario": "A seção \"4. Anamnese Médica e Odontológica\" lista: \"DM (HbA1c), tabagismo (cig/dia × anos), medicamentos (nifedipina → hiperplasia; fenitoína; ciclosporina), histórico familiar de periodontite, gravidez, HIV.\" A hipertensão arterial por si só não é citada como um fator de risco direto para periodontite ou como causadora de hiperplasia gengival, a menos que associada a medicamentos específicos como a nifedipina.\nDica: Conhecer os fatores de risco sistêmicos e medicamentos que interagem com a periodontite é essencial para um plano de tratamento integral."}, {"enunciado": "19. Qual é o objetivo principal da Raspagem e Alisamento Radicular (RAR), de acordo com o texto?", "alternativas": {"A": "Remover apenas o biofilme subgengival.", "B": "Alisar a superfície radicular para facilitar a adesão bacteriana.", "C": "Remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana.", "D": "Remover apenas o cálculo supragengival volumoso.", "E": "Estimular a formação de novo cemento radicular."}, "gabarito": "C", "comentario": "Na seção \"5.3 Técnica de Raspagem e Alisamento Radicular (RAR)\", é afirmado: \"A RAR tem dois objetivos complementares: remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\".\nDica: A RAR vai além da simples remoção de cálculo; o alisamento da superfície é crucial para a prevenção da recolonização bacteriana."}, {"enunciado": "20. Qual a \"Regra de ouro\" do diagnóstico periodontal, conforme destacado na seção \"4. Fluxo do Exame Clínico\"?", "alternativas": {"A": "Sempre realizar um exame radiográfico panorâmico.", "B": "Nunca atribuir o diagnóstico de periodontite sem confirmar perda de inserção clínica (NIC) com suporte radiográfico.", "C": "com suporte radiográfico.", "D": "Priorizar a comunicação com o paciente antes de qualquer exame clínico.", "E": "Realizar o periograma completo apenas em casos de sangramento intenso."}, "gabarito": "B", "comentario": "A \"Regra de ouro\" na seção \"4. Fluxo do Exame Clínico\" é: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\nDica: Essa é uma das informações mais críticas para evitar diagnósticos incorretos e sobretratamento. A confirmação radiográfica da perda óssea é indispensável para o diagnóstico de periodontite."}, {"enunciado": "A posição ideal do paciente para facilitar o acesso à boca durante procedimentos periodontais deve incluir:", "alternativas": {"A": "Cabeça inclinada para trás, ombros elevados e pés cruzados.", "B": "Posição supina, com a cabeça mais baixa que os pés.", "C": "Posição ereta, ombros relaxados e pés apoiados no chão.", "D": "Paciente sentado em uma cadeira comum, sem encosto adequado.", "E": "Posição lateral, com a cabeça virada para um dos lados."}, "gabarito": "C", "comentario": "A posição ereta com ombros relaxados e pés apoiados no chão é a mais recomendada, pois oferece conforto ao paciente e facilita o acesso do operador ao campo de trabalho, otimizando a ergonomia e a visualização. As outras opções descrevem posições que dificultariam o acesso ou seriam desconfortáveis.\nDica: Uma boa ergonomia é fundamental para a prevenção de lesões por esforço repetitivo no profissional e para a eficácia do tratamento."}, {"enunciado": "Em relação à manutenção dos instrumentos periodontais, qual a principal razão pela qual curetas e foices devem estar sempre afiadas?", "alternativas": {"A": "Para prolongar a vida útil do instrumento.", "B": "Para reduzir o tempo de esterilização.", "C": "Para remover o cálculo de forma eficaz e sem causar trauma.", "D": "Para evitar a necessidade de lubrificação.", "E": "Para melhorar a estética dos instrumentos."}, "gabarito": "C", "comentario": "O texto afirma explicitamente que \"Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" A afiação correta garante que a lâmina corte e desloque o cálculo de maneira eficiente, minimizando a força necessária e o risco de lesões aos tecidos moles e duros do paciente.\nDica: A afiação regular dos instrumentos é um pilar da periodontia clínica eficaz e segura."}, {"enunciado": "Um paciente de 25 anos apresenta sangramento gengival ao escovar, gengiva edemaciada e eritematosa, sangramento à sondagem generalizado (> 30% dos sítios), PS ≤ 3 mm em todos os dentes e NIC ausente. Ausência de perda óssea radiográfica. Qual o diagnóstico e o prognóstico mais prováveis?", "alternativas": {"A": "Periodontite Estágio I, Grau A, localizada; Prognóstico bom.", "B": "Gengivite induzida por biofilme, generalizada; Prognóstico excelente.", "C": "Periodontite Estágio II, Grau B, generalizada; Prognóstico reservado.", "D": "Gengivite crônica localizada; Prognóstico regular.", "E": "Periodontite agressiva; Prognóstico ruim."}, "gabarito": "B", "comentario": "As características descritas (sangramento, edema, eritema, PS ≤ 3mm, NIC ausente, sem perda óssea) são clássicas de gengivite induzida por biofilme. A generalização (>30% dos sítios) completa o diagnóstico. O texto indica que a gengivite é reversível, resultando em um prognóstico excelente com adesão à higiene.\nDica: A ausência de NIC e perda óssea radiográfica são cruciais para diferenciar gengivite de periodontite."}, {"enunciado": "Qual é a principal diferença entre gengivite e periodontite, de acordo com o texto?", "alternativas": {"A": "A cor da gengiva.", "B": "A presença de cálculo dental.", "C": "A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite.", "D": "A quantidade de sangramento à sondagem.", "E": "A idade do paciente."}, "gabarito": "C", "comentario": "O texto afirma: \"Q2. Qual a principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" Esta é a distinção fundamental.\nDica: Memorize os critérios diagnósticos para gengivite (inflamação sem perda de suporte) e periodontite (inflamação com perda de suporte)."}, {"enunciado": "Os dois eixos da classificação de periodontite de 2018 são:", "alternativas": {"A": "Localização e Gravidade.", "B": "Aguda e Crônica.", "C": "Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).", "D": "Induzida por biofilme e Não induzida por biofilme.", "E": "Gengivite e Periodontite."}, "gabarito": "C", "comentario": "O texto afirma: \"Q3. Quais são os dois eixos da classificação de periodontite de 2018? ✔ Estágio (gravidade e complexidade) e Grau (velocidade de progressão e fatores de risco).\" Esta é a base da nova classificação.\nDica: A classificação de 2018 é um tópico de grande relevância em concursos de Periodontia. Entender os critérios de Estágio e Grau é essencial."}, {"enunciado": "O que define o GRAU na classificação de periodontite de 2018?", "alternativas": {"A": "A quantidade de cálculo supragengival.", "B": "O número de dentes perdidos devido à doença periodontal.", "C": "A velocidade de progressão da doença e a resposta esperada ao tratamento, baseando-se em evidência direta de progressão ou fatores de risco modificadores.", "D": "A profundidade de sondagem e a presença de recessão gengival.", "E": "A presença de lesões de furca e mobilidade dental."}, "gabarito": "C", "comentario": "O texto explica: \"Q4. O que define o GRAU na classificação de periodontite de 2018? ✔ O grau descreve a velocidade de progressão da doença e a resposta esperada ao tratamento. Baseia-se em: (a) evidência direta de progressão (perda óssea/NIC ao longo do tempo) ou (b) fatores de risco modificadores (tabagismo, DM). Grau A = lenta; B = moderada; C = rápida.\"\nDica: É importante diferenciar os critérios de Estágio (gravidade e complexidade) dos critérios de Grau (velocidade de progressão e fatores de risco)."}, {"enunciado": "Qual sonda é utilizada especificamente para detectar envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte.", "B": "Sonda Williams.", "C": "Sonda Nabers.", "D": "Sonda OMS (WHO).", "E": "Sonda manual convencional."}, "gabarito": "C", "comentario": "O texto afirma: \"Q5. Qual sonda é utilizada especificamente para detectar envolvimento de furca? ✔ Sonda Nabers. Sua curvatura permite acesso ao espaço interradicular.\" As outras sondas são usadas para medir profundidade de sondagem e NIC em superfícies planas.\nDica: A sonda Nabers possui uma ponta curva que permite a exploração das áreas de furca em dentes multirradiculares."}, {"enunciado": "Um paciente apresenta NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade Grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio correto para este caso?", "alternativas": {"A": "Estágio I.", "B": "Estágio II.", "C": "Estágio III.", "D": "Estágio IV.", "E": "Gengivite."}, "gabarito": "C", "comentario": "O texto detalha: \"Q6. Um paciente com NIC = 6 mm, perda óssea radiográfica além do terço médio, mobilidade grau 2 em 3 dentes, mas SEM perda dentária e SEM colapso de mordida. Qual o Estágio? ✔ Estágio III. O Estágio IV exige disfunção mastigatória (colapso de mordida, migrações, perda de suporte em dentes pilares). Como não há disfunção aqui, mesmo com a gravidade, o diagnóstico é Estágio III.\" Embora haja critérios de gravidade que se aproximam do Estágio IV (NIC ≥ 5mm, perda óssea avançada), a ausência de disfunção mastigatória é o fator chave para classificá-lo como Estágio III.\nDica: Os critérios para Estágio IV incluem, além da severidade, a complexidade e a disfunção mastigatória. A ausência de perda dentária e colapso de mordida são determinantes para não ser Estágio IV."}, {"enunciado": "Qual o ângulo recomendado da cureta durante o movimento de raspagem para remover cálculo de forma eficaz e evitar trauma?", "alternativas": {"A": "Menor que 45° entre a lâmina e a superfície radicular.", "B": "70° a 80° entre a lâmina e a superfície radicular.", "C": "90° entre a lâmina e a superfície radicular.", "D": "Maior que 90° entre a lâmina e a superfície radicular.", "E": "Qualquer ângulo, desde que o instrumento esteja afiado."}, "gabarito": "B", "comentario": "O texto especifica: \"Q7. Qual o ângulo recomendado da cureta durante o movimento de raspagem? ✔ 70° a 80° entre a face interna da lâmina e a superfície radicular. < 45° = raspagem ineficaz (desliza sem cortar). > 90° = trauma tecidual.\" Este é o ângulo de trabalho ideal.\nDica: Um ângulo de trabalho incorreto pode resultar em raspagem ineficaz ou trauma aos tecidos, prejudicando o tratamento."}, {"enunciado": "Por que o tabagismo é considerado um modificador de Grau C na classificação de periodontite de 2018, especialmente em fumantes pesados?", "alternativas": {"A": "Porque o tabaco causa manchas nos dentes.", "B": "Porque o tabaco aumenta a produção de saliva.", "C": "Porque o tabaco compromete a resposta imune, acelera a destruição periodontal e diminui a resposta ao tratamento.", "D": "Porque o tabaco causa halitose.", "E": "Porque o tabaco leva à perda de dentes por cárie."}, "gabarito": "C", "comentario": "O texto explica: \"Q8. Por que o tabagismo é um modificador de Grau C? ✔ O tabaco compromete a resposta imune (reduz quimiotaxia de neutrófilos, altera a vascularização e retarda a cicatrização), acelera a destruição periodontal e diminui a resposta ao tratamento. Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" As outras opções não são razões diretas para a classificação do Grau de periodontite.\nDica: Fatores de risco como tabagismo e diabetes descompensado são cruciais para determinar o Grau da periodontite, refletindo a velocidade de progressão e a resposta ao tratamento."}, {"enunciado": "Qual é o principal fator etiológico da gengivite e periodontite, de acordo com o glossário?", "alternativas": {"A": "Cálculo dental.", "B": "Trauma oclusal.", "C": "Biofilme (Placa Dental).", "D": "Fatores genéticos.", "E": "Estresse."}, "gabarito": "C", "comentario": "O glossário define: \"Biofilme (Placa Dental): Comunidade estruturada de micro-organismos aderida à superfície dental, envoltos em matriz extracelular. Principal fator etiológico da gengivite e periodontite.\" Embora os outros fatores possam influenciar, o biofilme é o agente causal primário.\nDica: A remoção e o controle do biofilme são a base de todo tratamento periodontal."}, {"enunciado": "A medida de referência para quantificar a perda de suporte periodontal, que representa a distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco, é conhecida como:", "alternativas": {"A": "Profundidade de Sondagem (PS).", "B": "Sangramento à Sondagem (SS).", "C": "até o fundo da bolsa ou sulco, é conhecida como:", "D": "Recessão Gengival.", "E": "Mobilidade Dental."}, "gabarito": "C", "comentario": "O glossário define: \"NIC — Nível de Inserção Clínica: Distância em mm da Junção Esmalte-Cemento (JEC) até o fundo da bolsa ou sulco. Medida de referência para quantificar a perda de suporte periodontal.\" O NIC é a medida mais precisa da perda de suporte.\nDica: Diferencie NIC de PS. PS mede da margem gengival, enquanto NIC mede da JEC, um ponto fixo."}, {"enunciado": "Qual achado clínico é considerado o melhor indicador de saúde gengival, segundo o texto?", "alternativas": {"A": "Ausência de recessão gengival.", "B": "Ausência de mobilidade dental.", "C": "Ausência de sangramento à sondagem.", "D": "Gengiva de coloração rosa pálida.", "E": "Presença de gengiva inserida."}, "gabarito": "C", "comentario": "O glossário afirma: \"SS — Sangramento à Sondagem: Sangramento que ocorre até 30 segundos após a sondagem. Indica inflamação ativa. Ausência de SS é o melhor indicador de saúde gengival.\"\nDica: A ausência de sangramento à sondagem é um sinal crucial de estabilidade periodontal."}, {"enunciado": "Um aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção é definido como:", "alternativas": {"A": "Recessão Gengival.", "B": "Hiperplasia Gengival.", "C": "Gengivite.", "D": "Bolsa Periodontal.", "E": "Abscesso Periodontal."}, "gabarito": "D", "comentario": "O glossário define: \"Bolsa Periodontal: Aprofundamento patológico do sulco gengival (> 3 mm) com migração apical do epitélio juncional e perda de inserção.\" As outras opções são condições diferentes, embora relacionadas.\nDica: A bolsa periodontal é uma característica da periodontite, diferenciando-a da gengivite."}, {"enunciado": "De acordo com o texto, qual a classificação de uma furca que é passante (\"túnel\")?", "alternativas": {"A": "Classe I.", "B": "Classe II.", "C": "Classe III.", "D": "Classe IV.", "E": "Não classificável."}, "gabarito": "C", "comentario": "O glossário explica: \"Furca: Região de divisão das raízes em dentes multirradiculares. Classe I: < 3 mm. Classe II: ≥ 3 mm, não passante. Classe III: passante (\"túnel\").\"\nDica: Conhecer a classificação das furcas é importante para o planejamento do tratamento em dentes multirradiculares."}, {"enunciado": "Um paciente apresenta movimento horizontal do dente maior que 1 mm, mas sem movimento em todas as direções ou vertical. Qual o grau de mobilidade dental?", "alternativas": {"A": "Grau 0.", "B": "Grau 1.", "C": "Grau 2.", "D": "Grau 3.", "E": "Grau 4."}, "gabarito": "C", "comentario": "O glossário define: \"Mobilidade Dental: Grau 1: movimento horizontal até 1 mm. Grau 2: movimento horizontal > 1 mm. Grau 3: movimento em todas as direções incluindo vertical (axial).\" Portanto, um movimento horizontal > 1 mm corresponde ao Grau 2.\nDica: A avaliação da mobilidade dental é um indicador da perda de suporte periodontal e pode influenciar o prognóstico."}, {"enunciado": "A Terapia Periodontal Não Cirúrgica (TPNC) é indicada para todos os estágios da periodontite como primeira linha de tratamento e inclui:", "alternativas": {"A": "Cirurgias periodontais complexas e reabilitação protética.", "B": "Extrações dentárias e implantes.", "C": "é indicada para todos os estágios da periodontite como primeira linha de tratamento e inclui:", "D": "Uso de antibióticos sistêmicos como terapia única.", "E": "Terapia fotodinâmica."}, "gabarito": "C", "comentario": "O glossário define: \"TPNC — Terapia Periodontal Não Cirúrgica: Conjunto de procedimentos da fase I: IHO, controle de fatores de risco, RAR e reavaliação. Indicada para todos os estágios como primeira linha de tratamento.\" As outras opções descrevem procedimentos cirúrgicos ou terapias auxiliares, não o cerne da TPNC.\nDica: A TPNC é a base do tratamento periodontal e deve ser realizada antes de considerar intervenções cirúrgicas, salvo exceções."}, {"enunciado": "Um paciente de 40 anos, tabagista (5 cigarros/dia há 10 anos) e DM tipo 2 controlado (HbA1c 6,5%), apresenta PS 4–5 mm em vários sítios, NIC 3–4 mm em 40% dos sítios e perda óssea radiográfica horizontal em 20% dos dentes (1/3 coronário). Qual o diagnóstico de Estágio e Grau mais adequados?", "alternativas": {"A": "Gengivite induzida por biofilme, generalizada.", "B": "Periodontite Estágio I, Grau A, generalizada.", "C": "Periodontite Estágio II, Grau B, generalizada.", "D": "Periodontite Estágio III, Grau C, generalizada.", "E": "Periodontite Estágio IV, Grau B, localizada."}, "gabarito": "C", "comentario": "Com NIC 3-4 mm e perda óssea no 1/3 coronário, o Estágio é II. O paciente fuma 5 cigarros/dia, o que o classifica como Grau B (o texto menciona que tabagistas ≥ 10 cigarros/dia são Grau C, então 5 cigarros/dia se encaixa no Grau B). O sangramento generalizado indica a extensão da doença.\nDica: Atente-se aos detalhes dos fatores de risco (tabagismo, DM) para a determinação do Grau e aos valores de NIC e perda óssea para o Estágio."}, {"enunciado": "Qual dos seguintes fatores NÃO é um critério para definir o Estágio da periodontite na classificação de 2018?", "alternativas": {"A": "Nível de Inserção Clínica (NIC).", "B": "Perda óssea radiográfica.", "C": ".", "D": "Velocidade de progressão da doença.", "E": "Fatores de complexidade como envolvimento de furca e mobilidade dental."}, "gabarito": "D", "comentario": "O texto afirma que o Estágio descreve a \"gravidade e complexidade\", enquanto o Grau descreve a \"velocidade de progressão e fatores de risco\". Portanto, a velocidade de progressão é um critério para o Grau, não para o Estágio.\nDica: É fundamental não confundir os critérios que definem o Estágio com aqueles que definem o Grau."}, {"enunciado": "No contexto da Periodontite Estágio IV, Grau C, generalizada, como no Caso 3, qual seria um prognóstico típico e a razão para ele?", "alternativas": {"A": "Excelente, pois a doença é reversível com boa higiene.", "B": "Bom, com controle da progressão e adesão à manutenção.", "C": "Reservado, exigindo manejo multidisciplinar e adesão máxima do paciente, devido à gravidade e fatores de risco.", "D": "Regular, pois a perda de dentes é inevitável.", "E": "Ruim, sem possibilidade de tratamento eficaz."}, "gabarito": "C", "comentario": "O Caso 3 descreve uma Periodontite Estágio IV, Grau C, generalizada, com DM tipo 2 descompensado e tabagismo pesado. O texto aponta para este caso: \"Prognóstico: Reservado, exige manejo multidisciplinar e adesão máxima do paciente.\" A alta gravidade (Estágio IV) e os fatores de risco descompensados (Grau C) justificam o prognóstico reservado.\nDica: O prognóstico em casos de periodontite avançada é fortemente influenciado pela gravidade da doença, mas também pela presença e controle de fatores de risco sistêmicos e comportamentais."}, {"enunciado": "De acordo com a seção \"Anatomia do Periodonto\", qual das seguintes estruturas faz parte do Periodonto de Sustentação?", "alternativas": {"A": "Gengiva livre (marginal)", "B": "Gengiva interdental (papila)", "C": "Cemento radicular", "D": "Gengiva inserida (ceratinizada)", "E": "Osso cortical"}, "gabarito": "C", "comentario": "A questão aborda a divisão funcional do periodonto. O texto claramente separa o periodonto de proteção (gengiva livre, inserida, interdental) do periodonto de sustentação (cemento radicular, ligamento periodontal, osso alveolar). O cemento radicular é listado como componente do periodonto de sustentação. O osso cortical não é explicitamente mencionado como uma divisão funcional, mas o osso alveolar sim.\n\n**Dica de prova:** Memorize as duas grandes divisões do periodonto e seus componentes, pois é uma base anatômica fundamental e frequentemente cobrada. A função de cada parte também é importante."}, {"enunciado": "Em um paciente com saúde periodontal, qual a profundidade máxima esperada do sulco gengival e o percentual de sangramento à sondagem?", "alternativas": {"A": "Sulco gengival ≤ 5 mm e sangramento em < 30% dos sítios.", "B": "Sulco gengival ≤ 3 mm e sangramento em < 10% dos sítios.", "C": "Sulco gengival ≤ 3 mm e sangramento em ≥ 10% dos sítios.", "D": "Sulco gengival ≤ 4 mm e ausência total de sangramento.", "E": "Sulco gengival ≤ 2 mm e sangramento em < 5% dos sítios."}, "gabarito": "B", "comentario": "A seção \"Saúde Periodontal e Níveis de Doença\" descreve que na saúde periodontal, o sulco gengival é ≤ 3 mm e o sangramento à sondagem (SS) ocorre em < 10% dos sítios. As outras alternativas apresentam valores que indicam gengivite ou periodontite.\n\n**Dica de prova:** Os valores de profundidade de sondagem e sangramento à sondagem são cruciais para diferenciar saúde, gengivite e periodontite. Preste atenção aos sinais de \"saúde\" para estabelecer um ponto de comparação."}, {"enunciado": "Qual dos seguintes marcos anatômicos é o ponto de referência para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Fundo da Bolsa", "B": "Crista Alveolar", "C": "?", "D": "Furca", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "O texto, na seção \"Marcos Anatômicos Cruciais para o Diagnóstico\", afirma que a Junção Esmalte-Cemento (JEC) é o ponto de referência para medir o NIC. As outras estruturas têm outras importâncias clínicas específicas.\n\n**Dica de prova:** A JEC é um marco anatômico fundamental em periodontia. Entender sua função como referência para o NIC é essencial para o diagnóstico correto de perda de inserção. Lembre-se da fórmula NIC = PS + Recessão Gengival (ou NIC = PS - Hiperplasia Gengival)."}, {"enunciado": "De acordo com a apostila, qual é a principal característica que diferencia a Gengivite da Periodontite?", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Edema e eritema gengival.", "C": "Perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Reversibilidade total com remoção do biofilme.", "E": "Profundidade de sondagem aumentada."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" deixa claro que a Periodontite é caracterizada pela presença de Perda de Inserção (NIC) e Perda Óssea Radiográfica, enquanto na Gengivite estas estão ausentes. Embora o sangramento e o edema estejam presentes em ambas, e a profundidade de sondagem possa estar aumentada na gengivite (devido ao edema, formando um \"pseudobolsa\"), a perda de inserção é o divisor de águas.\n\n**Dica de prova:** O \"ERRO FREQUENTE\" destacado no texto é justamente confundir profundidade de sondagem aumentada com perda de inserção. A periodontite só é diagnosticada com NIC e perda óssea."}, {"enunciado": "Na Classificação 2018 da Periodontite, o Estágio (I, II, III, IV) descreve:", "alternativas": {"A": "A velocidade de progressão da doença e os fatores de risco.", "B": "A gravidade da destruição tecidual e a complexidade do tratamento.", "C": "A resposta individual do paciente ao tratamento.", "D": "A presença ou ausência de envolvimento de furca.", "E": "O tipo de bactéria predominante no biofilme."}, "gabarito": "B", "comentario": "A seção \"A Lógica da Classificação\" explica que o ESTÁGIO descreve \"a gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário\". O Grau, por sua vez, descreve a velocidade de progressão.\n\n**Dica de prova:** Entenda a diferença clara entre Estágio e Grau na nova classificação. Estágio = \"extensão do estrago\" (gravidade e complexidade), Grau = \"velocímetro da doença\" (velocidade de progressão e fatores de risco)."}, {"enunciado": "Um paciente apresenta NIC ≥ 5 mm, perda óssea além do 1/3 médio radicular, perda de 3 dentes devido à periodontite e envolvimento de furca Classe II. Qual o estágio da doença periodontal, de acordo com a Classificação 2018?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Não é possível determinar com os dados fornecidos."}, "gabarito": "C", "comentario": "A tabela \"Tabela de Sinais Clínicos por Estágio\" indica que o Estágio III é caracterizado por NIC ≥ 5 mm, perda óssea além do 1/3 médio e perda de até 4 dentes. O envolvimento de furca Classe II também se encaixa no Estágio III. O Estágio IV exige disfunção mastigatória ou perda de ≥ 5 dentes.\n\n**Dica de prova:** A tabela de sinais clínicos por estágio é um resumo importante. Preste atenção aos valores de NIC, perda óssea, perda dentária e envolvimento de furca para cada estágio. O macete da disfunção mastigatória para Estágio IV é crucial."}, {"enunciado": "Um paciente fumante de 15 cigarros por dia e com Diabetes Mellitus descompensado (HbA1c > 7%) é diagnosticado com periodontite. Qual Grau da doença, segundo a Classificação 2018, é mais provável para este paciente?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Grau D", "E": "Não é possível determinar apenas com esses dados."}, "gabarito": "C", "comentario": "A seção \"Grau = 'O Velocímetro da Doença'\" descreve o Grau C como \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano\". Os fatores de risco apresentados (tabagismo pesado e DM descompensado) indicam Grau C.\n\n**Dica de prova:** Os fatores de risco como tabagismo e diabetes são determinantes para a definição do Grau. Memorize os limiares para cada Grau (cigarros/dia, HbA1c, perda óssea/ano)."}, {"enunciado": "Qual a pressão de sondagem recomendada para a realização do periograma completo?", "alternativas": {"A": "0,5 N (≈ 50 g)", "B": "0,25 N (≈ 25 g)", "C": "1 N (≈ 100 g)", "D": "0,1 N (≈ 10 g)", "E": "A pressão varia de acordo com a inflamação do tecido."}, "gabarito": "B", "comentario": "A seção \"Periograma Completo (Sondagem Periodontal)\" especifica que a pressão de sondagem recomendada é de 0,25 N (≈ 25 g).\n\n**Dica de prova:** A padronização da pressão de sondagem é fundamental para a acurácia e reprodutibilidade do exame periodontal, evitando resultados falsos positivos ou negativos. Este valor é um dado técnico importante."}, {"enunciado": "Qual o tipo de cureta Gracey é a mais indicada para raspagem das faces DISTAIS de dentes posteriores?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "Gracey 1/2"}, "gabarito": "D", "comentario": "A seção \"Curetas Gracey: Mapa de Uso\" destaca que a Gracey 13/14 é para \"Posteriores - Faces DISTAIS\". O \"ERRO CLÁSSICO\" também reforça que a 13/14 é a correta para distais de posteriores.\n\n**Dica de prova:** As curetas Gracey são área-específicas. Memorizar qual par é para qual região e qual face é crucial para a prática clínica e para provas. O macete \"M de 11 = Mesial\" e \"D de 14 = Distal\" pode ser útil."}, {"enunciado": "Durante a Raspagem e Alisamento Radicular (RAR) com curetas Gracey, qual o ângulo ideal da lâmina em relação à superfície radicular para uma remoção eficaz do cálculo e mínimo trauma tecidual?", "alternativas": {"A": "0° (fechado)", "B": "Entre 10° e 20°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90° (perpendicular)"}, "gabarito": "D", "comentario": "A seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\", no item \"Posicionamento\", informa que a lâmina deve ser angulada entre 70° e 80° em relação à superfície radicular. Ângulos abaixo de 45° resultam em raspagem ineficaz, e acima de 90° em trauma.\n\n**Dica de prova:** A angulação da lâmina é um conceito técnico fundamental na instrumentação periodontal. É importante diferenciar a angulação de inserção (0°) da angulação de trabalho (70-80°)."}, {"enunciado": "Qual sonda periodontal é especificamente indicada para a avaliação de envolvimento de furca?", "alternativas": {"A": "Sonda Carolina do Norte (UNC 15)", "B": "Sonda OMS (WHO / CPITN)", "C": "Sonda Nabers", "D": "Sonda Williams", "E": "Sonda Goldman-Fox"}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" lista a Sonda Nabers como a indicada para \"Avaliação de furca (Classes I, II, III)\".\n\n**Dica de prova:** Cada sonda periodontal tem uma finalidade principal. A sonda Nabers, com sua curvatura específica, é inconfundível para a avaliação de furcas."}, {"enunciado": "A principal função do Periodonto de Proteção, de acordo com o texto, é:", "alternativas": {"A": "Ancorar o dente ao osso e absorver forças mastigatórias.", "B": "Prover inervação e vascularização aos tecidos periodontais.", "C": "Atuar como barreira física e imunológica contra micro-organismos.", "D": "Permitir a renovação constante das fibras colágenas.", "E": "Formar o cemento radicular para inserção do ligamento."}, "gabarito": "C", "comentario": "A seção \"1.1 Divisões Funcionais\" descreve a função do Periodonto de Proteção como \"barreira física e imunológica contra micro-organismos\". As outras opções descrevem funções do periodonto de sustentação ou de outros tecidos não focados nesta seção.\n\n**Dica de prova:** Entender a função de cada componente periodontal é tão importante quanto saber sua localização anatômica."}, {"enunciado": "Um dos \"macetes\" para identificar o Estágio IV da periodontite é a presença de:", "alternativas": {"A": "NIC de 1-2 mm.", "B": "Profundidade de Sondagem ≤ 5 mm.", "C": "Perda óssea de até 1/3 coronário.", "D": "Disfunção mastigatória.", "E": "Envolvimento de furca Classe I."}, "gabarito": "D", "comentario": "O \"Macete\" no final da seção da Classificação 2018 afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\"\n\n**Dica de prova:** Os \"macetes\" e \"regras de ouro\" são destaques importantes no texto, indicando pontos que os autores consideram cruciais e frequentemente mal interpretados."}, {"enunciado": "Qual das seguintes condições NÃO é considerada um sinal de gengivite induzida por biofilme?", "alternativas": {"A": "Inflamação restrita à gengiva marginal.", "B": "Sangramento à sondagem (≥ 10% dos sítios).", "C": "Edema e eritema.", "D": "Perda de inserção clínica (NIC).", "E": "Reversibilidade com remoção do biofilme."}, "gabarito": "D", "comentario": "A seção \"Gengivite Induzida por Biofilme\" descreve a ausência de perda de inserção (NIC) ou perda óssea radiográfica como característica da gengivite. A presença de NIC é um critério para periodontite.\n\n**Dica de prova:** Gengivite é inflamação sem perda de suporte. Periodontite é inflamação COM perda de suporte. Essa é a distinção fundamental."}, {"enunciado": "A \"Regra de ouro\" para o diagnóstico de periodontite enfatiza que:", "alternativas": {"A": "A profundidade de sondagem aumentada é suficiente para o diagnóstico.", "B": "É preciso confirmar perda de inserção clínica (NIC) com suporte radiográfico.", "C": "com suporte radiográfico.", "D": "A presença de cálculo subgengival é o fator determinante.", "E": "A idade do paciente é o principal fator para diferenciar gengivite de periodontite."}, "gabarito": "B", "comentario": "A \"Regra de ouro\" no final da seção \"Fluxo do Exame Clínico\" afirma: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\n\n**Dica de prova:** A combinação de achados clínicos (NIC) e radiográficos (perda óssea) é indispensável para o diagnóstico correto de periodontite."}, {"enunciado": "Na comunicação com o paciente, ao explicar a perda óssea, qual analogia o texto sugere?", "alternativas": {"A": "A gengiva como um telhado de casa.", "B": "O dente preso no osso como um poste fincado no chão.", "C": "O biofilme como um filme esbranquiçado nos dentes.", "D": "O sangramento como uma mão que sangra ao ser lavada.", "E": "A manutenção como a limpeza de calhas e o cuidado com o jardim."}, "gabarito": "B", "comentario": "A seção \"Comunicação com o Paciente\" no item \"Explicando perda óssea\" utiliza a analogia: \"Os seus dentes ficam presos no osso da mandíbula como se fossem postes fincados no chão. Esse osso é o alicerce do dente.\"\n\n**Dica de prova:** Questões sobre comunicação com o paciente avaliam a capacidade de aplicar conhecimentos de forma didática. As analogias são ferramentas poderosas para isso."}, {"enunciado": "Qual é o principal objetivo da Raspagem e Alisamento Radicular (RAR)?", "alternativas": {"A": "Estimular a formação de novo osso e ligamento periodontal.", "B": "Remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular.", "C": "Reduzir a mobilidade dental e promover a anquilose.", "D": "Aumentar a profundidade de sondagem para facilitar a limpeza.", "E": "Branquear a superfície radicular para fins estéticos."}, "gabarito": "B", "comentario": "A seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\" afirma que a RAR tem dois objetivos complementares: \"remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\".\n\n**Dica de prova:** Entender os objetivos do tratamento periodontal é fundamental. RAR visa a desinfecção da superfície radicular e a criação de uma superfície biologicamente compatível para a cicatrização."}, {"enunciado": "Qual tipo de radiografia é considerado o padrão ouro para a avaliação do nível da crista alveolar em relação à JEC e do padrão de perda óssea?", "alternativas": {"A": "Radiografia oclusal.", "B": "Radiografia panorâmica.", "C": "Radiografias periapicais.", "D": "Tomografia computadorizada.", "E": "Radiografia interproximal."}, "gabarito": "C", "comentario": "A seção \"Exame Radiográfico\" menciona: \"Rx periapicais (padrão ouro) ou panorâmico como triagem. Avalie: nível da crista alveolar em relação à JEC (normal: 1–2 mm), padrão da perda óssea (horizontal ou vertical)...\"\n\n**Dica de prova:** Embora a radiografia panorâmica seja útil para triagem, as periapicais oferecem maior detalhe e menor distorção para a avaliação específica do osso alveolar e da JEC."}, {"enunciado": "A cureta universal McCall 13/14 e 17/18 é mais indicada para qual finalidade, segundo o texto?", "alternativas": {"A": "Raspagem de faces distais de posteriores.", "B": "Avaliação de furcas.", "C": "Remoção de cálculo supragengival volumoso.", "D": "Medição de profundidade de sondagem.", "E": "Raspagem de faces mesiais de posteriores."}, "gabarito": "C", "comentario": "A seção \"Outros Instrumentos Importantes\" descreve a McCall 13/14 e 17/18 como \"Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\"\n\n**Dica de prova:** As curetas universais, como as McCall, são versáteis e geralmente usadas para cálculos supragengivais antes do uso das Gracey, que são mais específicas para o subgengival."}, {"enunciado": "Na Classificação 2018 da periodontite, a analogia \"Carro de corrida\" é utilizada para descrever qual Grau da doença?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Estágio I", "E": "Estágio IV"}, "gabarito": "C", "comentario": "A seção \"Grau = 'O Velocímetro da Doença'\" usa a analogia \"Carro de corrida\" para o Grau C, indicando \"Progressão rápida\".\n\n**Dica de prova:** As analogias são uma ferramenta didática para facilitar a memorização de conceitos complexos. Relacioná-las corretamente aos seus respectivos termos é um bom indicativo de compreensão."}, {"enunciado": "1. De acordo com o texto, o periodonto é dividido em duas grandes unidades funcionais. Qual das alternativas abaixo apresenta corretamente os componentes do Periodonto de Proteção?", "alternativas": {"A": "Cemento radicular, Ligamento Periodontal e Osso Alveolar.", "B": "Gengiva livre, Gengiva inserida e Gengiva interdental.", "C": "Gengiva marginal, Cemento radicular e Osso alveolar.", "D": "Gengiva inserida, Ligamento Periodontal e Gengiva interdental.", "E": "Gengiva livre, Gengiva interdental e Osso alveolar."}, "gabarito": "B", "comentario": "O texto afirma claramente na Seção 1.1 que o Periodonto de Proteção é composto pela Gengiva livre (marginal), Gengiva inserida (ceratinizada) e Gengiva interdental (papila). As outras alternativas misturam componentes do periodonto de proteção com os do periodonto de sustentação, tornando-as incorretas.\nDica: Memorize as divisões funcionais e seus componentes para evitar confusão. Periodonto de Proteção protege contra microrganismos, Periodonto de Sustentação ancora e absorve forças."}, {"enunciado": "2. Um paciente apresenta gengiva com a cor rosa-coral, consistência firme e contorno festonado. A sondagem revela sulco gengival de 2 mm e sangramento à sondagem em 5% dos sítios. Não há perda de inserção clínica nem perda óssea radiográfica. Com base nesses achados, qual o diagnóstico mais provável segundo o texto?", "alternativas": {"A": "Periodontite Estágio I", "B": "Gengivite induzida por biofilme", "C": "Saúde Periodontal", "D": "Doença Necrosante", "E": "Periodontite Estágio II"}, "gabarito": "C", "comentario": "O texto, na Seção 2.1, descreve a Saúde Periodontal como \"Gengiva cor rosa-coral, firme, contorno festonado. Sulco gengival ≤ 3 mm. Sangramento à sondagem (SS) em < 10% dos sítios. Sem perda de inserção nem perda óssea.\" Os achados do paciente (cor rosa-coral, firme, contorno festonado, sulco de 2 mm e SS em 5%) se enquadram perfeitamente nesta descrição. A gengivite exige SS em ≥ 10% dos sítios e periodontite exige perda de inserção e óssea.\nDica: Preste atenção aos critérios quantitativos (percentuais, milímetros) para diferenciar saúde de doença."}, {"enunciado": "3. Qual dos marcos anatômicos cruciais é utilizado como ponto distal para a medida da Profundidade de Sondagem (PS)?", "alternativas": {"A": "Junção Cemento-Esmalte (JEC)", "B": "Crista Alveolar", "C": "B) Crista Alveolar", "D": "Bifurcação/Trifurcação das raízes (Furca)", "E": "Margem Gengival Livre"}, "gabarito": "C", "comentario": "Na Seção 1.2, a tabela \"Marcos Anatômicos Cruciais para o Diagnóstico\" define o \"Fundo da Bolsa\" como o \"Ponto distal da medida de PS\". A JEC é referência para o NIC, e a Crista Alveolar indica reabsorção óssea.\nDica: Entender a função de cada marco anatômico é fundamental para a correta realização e interpretação do periograma."}, {"enunciado": "4. De acordo com a Seção 2.2, qual é o diferencial crítico que distingue a Gengivite da Periodontite?", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Profundidade de sondagem aumentada.", "C": "Presença de perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Edema e eritema gengival.", "E": "Reversibilidade total da condição."}, "gabarito": "C", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" na Seção 2.2 indica claramente que a Periodontite apresenta \"Perda de Inserção (NIC) Presente (≥ 1 mm)\" e \"Perda Óssea Radiográfica Presente\", enquanto a Gengivite as tem ausentes. Sangramento à sondagem, profundidade de sondagem aumentada (sem NIC ou perda óssea) e edema/eritema podem estar presentes na gengivite. A gengivite é totalmente reversível, enquanto a periodontite é apenas parcialmente controlável.\nDica: O \"ERRO FREQUENTE\" destacado no texto reforça que a perda de inserção e óssea são os pilares do diagnóstico de periodontite."}, {"enunciado": "5. A nova Classificação de Doenças Periodontais de 2018 abandona os termos \"crônica\" e \"agressiva\". Quais são os dois eixos independentes e complementares que organizam a periodontite nesta nova classificação?", "alternativas": {"A": "Extensão e Localização.", "B": "Recorrência e Estabilidade.", "C": "Gengivite e Periodontite.", "D": "Estágio e Grau.", "E": "Severidade e Progressão."}, "gabarito": "D", "comentario": "A Seção 3.1, intitulada \"A Lógica da Classificação\", afirma que a nova classificação \"organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) e GRAU (A, B, C)\". Os termos \"Severidade e Progressão\" são conceitos que os eixos de Estágio e Grau descrevem, respectivamente, mas não são os nomes dos eixos em si.\nDica: Entender que Estágio = \"Extensão do Estrago\" (gravidade e complexidade) e Grau = \"Velocímetro da Doença\" (velocidade de progressão e fatores de risco) ajuda a memorizar."}, {"enunciado": "6. Um paciente apresenta perda de inserção clínica (NIC) de 4 mm, profundidade de sondagem (PS) de 5 mm e perda óssea radiográfica de 20% do terço coronário. Há envolvimento de furca classe I. De acordo com a Classificação 2018, qual o Estágio da Periodontite deste paciente?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 4 mm, profundidade de sondagem (PS) de 5 mm e perda óssea radiográfica de 20% do terço coronário. Há envolvimento de furca classe I. De acordo com a Classificação 2018, qual o Estágio da Periodontite deste paciente?", "D": "Estágio IV", "E": "Não é possível determinar sem o Grau."}, "gabarito": "B", "comentario": "A tabela \"Tabela de Sinais Clínicos por Estágio\" na Seção 3.3 indica que o Estágio II possui NIC de 3–4 mm, PS ≤ 5 mm, perda óssea de 15–30% (1/3 coronário) e envolvimento de furca Classe I. Todos os critérios do caso clínico se encaixam no Estágio II.\nDica: A memorização ou consulta rápida da tabela de estágios é crucial para essas questões. Preste atenção aos intervalos numéricos."}, {"enunciado": "7. Para um paciente com periodontite, a presença de disfunção mastigatória (colapso de mordida, migrações patológicas, comprometimento estético grave) é um indicador mandatório para qual Estágio da doença, independentemente de outros parâmetros como NIC?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "Estágio III", "D": "Estágio IV", "E": "Estágio I ou II, dependendo da perda óssea."}, "gabarito": "D", "comentario": "O \"Macete\" na Seção 3.3 afirma: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Este é um critério decisivo para o Estágio IV.\nDica: Este é um \"macete\" importante que simplifica a classificação em casos complexos. A disfunção mastigatória é um critério de Estágio IV que \"sobrepõe\" outros."}, {"enunciado": "8. Qual das sondas periodontais é considerada o padrão clínico para medição de Profundidade de Sondagem (PS) e Nível de Inserção Clínica (NIC), sendo milimetrada a cada milímetro até 15 mm?", "alternativas": {"A": "Sonda OMS (WHO / CPITN)", "B": "Sonda Nabers", "C": ", sendo milimetrada a cada milímetro até 15 mm?", "D": "Sonda Williams", "E": "Sonda de exploração"}, "gabarito": "C", "comentario": "A tabela \"Sondas Periodontais: Quando Usar Cada Uma?\" na Seção 5.1 descreve a \"Carolina do Norte (UNC 15)\" como \"Milimetrada a cada mm, total 15 mm\" e sua indicação principal é \"Medição de PS e NIC — padrão clínico\". A OMS é para triagem e a Nabers para furca.\nDica: Conhecer as características e indicações de cada tipo de sonda é fundamental para a prática clínica e para concursos."}, {"enunciado": "9. Durante a realização do periograma completo, qual a pressão de sondagem recomendada para a coleta de dados?", "alternativas": {"A": "0,5 N (~50 g)", "B": "0,25 N (~25 g)", "C": "1,0 N (~100 g)", "D": "A pressão deve ser variável, dependendo da inflamação.", "E": "A pressão de sondagem não é padronizada."}, "gabarito": "B", "comentario": "Na Seção 4, item 4 (Periograma Completo), o texto especifica: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g)\". Uma pressão padronizada é essencial para a reprodutibilidade dos resultados.\nDica: A pressão de sondagem é um detalhe técnico importante que assegura a precisão e consistência das medições."}, {"enunciado": "11. Qual dos seguintes achados clínicos é reversível com a remoção do biofilme e caracteriza a Gengivite induzida por biofilme, sem perda de inserção clínica ou perda óssea radiográfica?", "alternativas": {"A": "Necrose de papilas e dor intensa.", "B": "Presença de bolsa periodontal com perda óssea.", "C": "Sangramento à sondagem (≥ 10% dos sítios), edema e eritema.", "D": "NIC ≥ 5 mm e disfunção mastigatória.", "E": "Perda dentária e envolvimento de furca Classe III."}, "gabarito": "C", "comentario": "Na Seção 2.1, a descrição da \"Gengivite Induzida por Biofilme\" inclui \"Inflamação restrita à gengiva marginal. Presença de SS (≥ 10% dos sítios), edema e eritema. Ausência de perda de inserção (NIC) ou perda óssea radiográfica. REVERSÍVEL com remoção do biofilme.\" Os outros achados caracterizam periodontite (B, D, E) ou doenças necrosantes (A).\nDica: A reversibilidade é a chave para diferenciar gengivite de periodontite."}, {"enunciado": "12. O texto descreve a analogia do Grau da periodontite como o \"Velocímetro da Doença\". Qual Grau corresponde a uma progressão rápida, com tabagismo ≥ 10 cigarros/dia, DM descompensado ou perda óssea > 2 mm/ano?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Grau D", "E": "Não é possível classificar apenas com estes dados."}, "gabarito": "C", "comentario": "A Seção 3.2, \"Grau = 'O Velocímetro da Doença'\", associa o \"Grau C\" com \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\"\nDica: Lembre-se das analogias: Grau A (Pedestre/lento), Grau B (Carro na cidade/moderado), Grau C (Carro de corrida/rápido)."}, {"enunciado": "13. Qual o principal objetivo da Raspagem e Alisamento Radicular (RAR) em relação à superfície radicular, além da remoção de depósitos duros e biofilme subgengival?", "alternativas": {"A": "Promover o crescimento gengival.", "B": "Estimular a formação de novo osso.", "C": "Alisar a superfície radicular para dificultar a re-adesão bacteriana.", "D": "Remover a camada de cemento exposta.", "E": "Diminuir a sensibilidade dentinária."}, "gabarito": "C", "comentario": "A Seção 5.3, \"Técnica de Raspagem e Alisamento Radicular (RAR)\", afirma que a RAR tem dois objetivos complementares: \"remover depósitos duros (cálculo) e biofilme subgengival, e alisar a superfície radicular para dificultar a re-adesão bacteriana\".\nDica: O alisamento radicular não visa remover cemento saudável, mas sim a camada contaminada e irregular para promover a saúde gengival."}, {"enunciado": "14. Na etapa de posicionamento da lâmina da cureta Gracey durante a RAR, qual a angulação correta em relação à superfície radicular para uma raspagem eficaz e sem trauma tecidual?", "alternativas": {"A": "Entre 0° e 15°", "B": "Entre 15° e 45°", "C": "Entre 70° e 80°", "D": "Exatamente 90°", "E": "Acima de 90°"}, "gabarito": "C", "comentario": "A Seção 5.3, item 2 (Posicionamento), instrui: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: Conhecer a angulação correta é fundamental para a eficácia e segurança da instrumentação periodontal."}, {"enunciado": "15. Segundo o fluxo de exame clínico, qual a etapa que envolve a palpação de linfonodos e a inspeção de lábios, mucosa, língua e palato, antes de focar no periodonto?", "alternativas": {"A": "Anamnese Médica e Odontológica", "B": "Exame Extraoral e Intraoral", "C": "Índices de Biofilme e Sangramento Gengival", "D": "Periograma Completo", "E": "Exame Radiográfico"}, "gabarito": "B", "comentario": "Na Seção 4, item 2, o \"Exame Extraoral e Intraoral\" é descrito como a etapa onde se realiza a \"Palpação de linfonodos, inspeção de lábios, mucosa, língua e palato. Identifique lesões suspeitas antes de focar no periodonto.\"\nDica: O exame completo do paciente vai além do periodonto, incluindo uma avaliação sistêmica e de tecidos moles."}, {"enunciado": "16. De acordo com o texto, qual é a \"Regra de ouro\" para o diagnóstico de periodontite?", "alternativas": {"A": "Confirmar sempre a presença de sangramento à sondagem.", "B": "Avaliar a mobilidade dental em todos os dentes.", "C": "NUNCA atribuir o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico.", "D": "Identificar a presença de biofilme em todos os sítios.", "E": "Realizar o exame radiográfico antes da sondagem periodontal."}, "gabarito": "C", "comentario": "No final da Seção 4, a \"Regra de ouro\" é destacada: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\nDica: Esta regra é um dos pontos mais importantes para evitar erros de diagnóstico, diferenciando periodontite de gengivite."}, {"enunciado": "17. Qual das curetas universais é indicada para remoção de cálculo supragengival volumoso, principalmente em espaços interproximais de posteriores, facilitando o acesso sem trauma às papilas?", "alternativas": {"A": "McCall 13/14", "B": "Gracey 5/6", "C": "Foice McCall 11/12", "D": "Gracey 13/14", "E": "Cureta de Langer"}, "gabarito": "C", "comentario": "Na Seção 5.4, \"Outros Instrumentos Importantes\", a \"Foice McCall 11/12\" é descrita como \"Indicada para espaços interproximais de posteriores. Formato facilita acesso sem trauma às papilas.\" As curetas Gracey são área-específicas subgengivais, e a McCall 13/14 é universal para cálculo supragengival em geral.\nDica: As curetas universais e as foices têm um papel complementar às Gracey, especialmente para o cálculo supragengival inicial."}, {"enunciado": "18. Qual analogia é utilizada no texto para explicar a perda óssea ao paciente?", "alternativas": {"A": "Um filme esbranquiçado que se forma nos dentes.", "B": "Gengiva que sangra toda vez que você a lava, como uma mão.", "C": "Dentes presos no osso da mandíbula como postes fincados no chão, e a infecção corrói esse alicerce.", "D": "Arrumar o telhado da casa, mas precisar limpar as calhas.", "E": "Uma rachadura na parede da casa."}, "gabarito": "C", "comentario": "Na Seção 6, \"Comunicação com o Paciente\", o item \"Explicando perda óssea\" utiliza a analogia: \"Os seus dentes ficam presos no osso da mandíbula como se fossem postes fincados no chão... Quando a infecção periodontal avança, ela começa a corroer esse alicerce...\"\nDica: As analogias facilitam a compreensão do paciente e são um bom exemplo de comunicação clínica eficaz."}, {"enunciado": "19. No contexto da nova Classificação 2018, o Estágio da periodontite descreve:", "alternativas": {"A": "A velocidade de progressão e os fatores de risco.", "B": "A extensão do biofilme e a resposta inflamatória.", "C": "A gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário.", "D": "A reversibilidade da doença e a capacidade de cicatrização óssea.", "E": "A presença ou ausência de sangramento à sondagem."}, "gabarito": "C", "comentario": "A Seção 3.1 explica que o \"ESTÁGIO (I, II, III, IV)\" \"Descreve a gravidade (quanto de destruição já ocorreu) e a complexidade do tratamento necessário.\" A velocidade de progressão e fatores de risco são descritos pelo Grau.\nDica: Estágio = gravidade + complexidade; Grau = velocidade + fatores de risco."}, {"enunciado": "20. Qual das seguintes estruturas NÃO faz parte do Periodonto de Sustentação, conforme descrito na Seção 1.1?", "alternativas": {"A": "Cemento radicular", "B": "Ligamento periodontal", "C": "Osso alveolar", "D": "Gengiva inserida", "E": "Todas as alternativas fazem parte do periodonto de sustentação."}, "gabarito": "D", "comentario": "A Seção 1.1, \"Divisões Funcionais\", lista o Periodonto de Sustentação como: \"Cemento radicular, Ligamento periodontal (LP) e Osso alveolar\". A \"Gengiva inserida\" é listada como componente do Periodonto de Proteção.\nDica: Revise a distinção clara entre os componentes do periodonto de proteção e do periodonto de sustentação."}, {"enunciado": "De acordo com a seção \"Anatomia do Periodonto\", qual das estruturas listadas abaixo faz parte do periodonto de proteção?", "alternativas": {"A": "Cemento radicular", "B": "Osso alveolar", "C": "Ligamento periodontal", "D": "Gengiva inserida", "E": "Fibras de Sharpey"}, "gabarito": "D", "comentario": "A questão aborda a divisão funcional do periodonto. O texto claramente categoriza o cemento radicular, o osso alveolar e o ligamento periodontal como componentes do periodonto de sustentação. A gengiva inserida, juntamente com a gengiva livre (marginal) e a gengiva interdental (papila), compõe o periodonto de proteção. As fibras de Sharpey são componentes do ligamento periodontal, portanto, fazem parte do periodonto de sustentação.\nDica: Memorize as duas grandes divisões (proteção e sustentação) e seus respectivos componentes para evitar confusão."}, {"enunciado": "Qual dos marcos anatômicos cruciais para o diagnóstico é o ponto de referência utilizado para medir o Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Crista Alveolar", "B": "Fundo da Bolsa", "C": "?", "D": "Bifurcação/Trifurcação das raízes", "E": "Margem Gengival"}, "gabarito": "C", "comentario": "O texto na seção \"Marcos Anatômicos Cruciais para o Diagnóstico\" define a Junção Esmalte-Cemento (JEC) como o \"Ponto de referência para medir o NIC\". A crista alveolar é importante para avaliar perda óssea, o fundo da bolsa para a profundidade de sondagem e a furca para seu envolvimento. A margem gengival é um ponto de partida, mas a JEC é a referência estável para o NIC.\nDica: Compreender a importância de cada marco anatômico é fundamental para o diagnóstico periodontal preciso. A JEC é a referência mais estável para avaliar a perda de inserção ao longo do tempo."}, {"enunciado": "Segundo o texto, qual é a principal característica que diferencia a gengivite da periodontite, sendo esta última irreversível em sua totalidade?", "alternativas": {"A": "Sangramento à sondagem", "B": "Edema e eritema", "C": "Presença de biofilme", "D": "Perda de inserção clínica (NIC)", "E": "Profundidade de sondagem aumentada"}, "gabarito": "D", "comentario": "A tabela \"Diferencial Crítico: Gengivite × Periodontite\" destaca que a \"Perda de Inserção (NIC)\" está ausente na gengivite e presente na periodontite (≥ 1 mm). O \"ERRO FREQUENTE\" mencionado no texto reforça que a periodontite exige a confirmação de perda de inserção clínica. Sangramento, edema e presença de biofilme são características comuns a ambas, embora a intensidade possa variar. A profundidade de sondagem aumentada pode ocorrer na gengivite devido à hiperplasia, mas sem perda de NIC, não é periodontite.\nDica: A perda de inserção clínica e radiográfica é o divisor de águas entre gengivite e periodontite. Memorize essa distinção crucial."}, {"enunciado": "Qual Estágio da periodontite, de acordo com a Classificação de 2018, é obrigatoriamente diagnosticado se o paciente apresenta disfunção mastigatória (colapso de mordida, migrações, comprometimento estético grave), independentemente do Nível de Inserção Clínica (NIC)?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "?", "D": "Estágio IV", "E": "Estágio I ou II, dependendo do NIC"}, "gabarito": "D", "comentario": "O \"Macete\" na seção \"Tabela de Sinais Clínicos por Estágio\" afirma categoricamente: \"Se o paciente tem DISFUNÇÃO mastigatória (colapso de mordida, migrações, comprometimento estético grave) → SEMPRE Estágio IV, independente do NIC.\" Esta é uma regra fundamental da nova classificação para o Estágio IV.\nDica: A disfunção mastigatória é um critério definidor para o Estágio IV, independentemente de outros parâmetros de perda de inserção ou óssea."}, {"enunciado": "A nova Classificação de Doenças Periodontais e Peri-implantares (2018) abandona quais termos anteriormente utilizados para classificar a periodontite?", "alternativas": {"A": "Gengivite e Periodontite", "B": "Localizada e Generalizada", "C": "Crônica e Agressiva", "D": "Estágios e Graus", "E": "Saúde e Doença"}, "gabarito": "C", "comentario": "O texto na seção \"A Lógica da Classificação\" afirma que \"A nova classificação (Tonetti, Greenwell & Kornman, 2018) abandona os termos \"crônica\" e \"agressiva\" e organiza a periodontite em dois eixos independentes e complementares: ESTÁGIO (I, II, III, IV) e GRAU (A, B, C)\".\nDica: Entender as mudanças na classificação é crucial. Os termos \"crônica\" e \"agressiva\" foram substituídos pelos conceitos de Estágios e Graus, que fornecem uma avaliação mais abrangente da doença."}, {"enunciado": "Um paciente apresenta Nível de Inserção Clínica (NIC) de 3–4 mm e uma profundidade de sondagem (PS) de 5 mm, sem perda dentária e com envolvimento de furca Classe I. De acordo com a Classificação de 2018, qual é o Estágio da periodontite?", "alternativas": {"A": "Estágio I", "B": "Estágio II", "C": "de 3–4 mm e uma profundidade de sondagem (PS) de 5 mm, sem perda dentária e com envolvimento de furca Classe I. De acordo com a Classificação de 2018, qual é o Estágio da periodontite?", "D": "Estágio IV", "E": "Não é possível determinar sem o exame radiográfico."}, "gabarito": "B", "comentario": "Consultando a \"Tabela de Sinais Clínicos por Estágio\", um NIC de 3–4 mm e PS ≤ 5 mm, com envolvimento de furca Classe I, se encaixam perfeitamente na descrição do Estágio II. O texto também menciona que o Estágio I tem NIC 1-2mm e PS ≤4mm. Estágios III e IV apresentam NIC ≥ 5mm e PS ≥ 6mm.\nDica: Familiarize-se com os critérios da tabela de Estágios. Praticar a identificação de Estágios com diferentes cenários clínicos ajuda na memorização."}, {"enunciado": "Qual o Grau da periodontite que indica uma progressão rápida da doença, com fatores de risco como tabagismo ≥ 10 cigarros/dia ou diabetes mellitus descompensado?", "alternativas": {"A": "Grau A", "B": "Grau B", "C": "Grau C", "D": "Grau D", "E": "Grau E"}, "gabarito": "C", "comentario": "A seção \"Grau = 'O Velocímetro da Doença'\" descreve o Grau C como indicativo de \"Progressão rápida. Tabagismo ≥ 10 cig/dia, DM descompensado, perda óssea > 2 mm/ano.\" O Grau A é de progressão lenta e o Grau B de progressão moderada.\nDica: Os Graus (A, B, C) relacionam-se diretamente com a velocidade de progressão da doença e a presença de fatores de risco modificadores."}, {"enunciado": "Durante um exame clínico, o dentista observa que a gengiva do paciente apresenta cor rosa-coral, consistência firme, contorno festonado, sulco gengival ≤ 3 mm e sangramento à sondagem em menos de 10% dos sítios. Não há perda de inserção nem perda óssea. Qual é o diagnóstico?", "alternativas": {"A": "Periodontite Estágio I", "B": "Gengivite Induzida por Biofilme", "C": "Doença Necrosante", "D": "Saúde Periodontal", "E": "Periodontite Grau A"}, "gabarito": "D", "comentario": "A descrição fornecida corresponde exatamente aos critérios para \"Saúde Periodontal\" na seção \"2.1 Sequência Lógica de Progressão\". A gengivite induzida por biofilme teria sangramento em ≥ 10% dos sítios, e a periodontite envolveria perda de inserção e perda óssea. Doenças necrosantes têm características muito mais severas.\nDica: Conheça os critérios para cada nível de doença, começando pela saúde, para um diagnóstico diferencial preciso."}, {"enunciado": "Qual sonda periodontal é especificamente indicada para a avaliação de envolvimento de furca?", "alternativas": {"A": "Carolina do Norte (UNC 15)", "B": "OMS (WHO / CPITN)", "C": "Nabers", "D": "Michigan \"O\"", "E": "Goldman-Fox"}, "gabarito": "C", "comentario": "Na seção \"Sondas Periodontais: Quando Usar Cada Uma?\", a sonda Nabers é descrita como \"Curva, sem marcações agudas\" e sua indicação principal é \"Avaliação de furca (Classes I, II, III)\". As outras sondas têm funções diferentes, como medição de PS/NIC (UNC 15) e triagem epidemiológica (OMS).\nDica: Cada sonda periodontal tem uma finalidade específica. A sonda Nabers, com seu formato curvo, é ideal para acessar as furcas."}, {"enunciado": "Para a instrumentação das faces MESIAIS de dentes posteriores, qual par de curetas Gracey é o mais indicado, conforme o texto?", "alternativas": {"A": "Gracey 5/6", "B": "Gracey 7/8", "C": "Gracey 11/12", "D": "Gracey 13/14", "E": "McCall 13/14"}, "gabarito": "C", "comentario": "A seção \"Curetas Gracey: Mapa de Uso\" detalha que o par Gracey 11/12 é para \"Posteriores\" e especificamente para \"Faces MESIAIS\". O macete \"11/12 → Mesial (M de 11 = Mesial)\" reforça essa indicação. O erro clássico mencionado alerta contra o uso inadequado de outras curetas para essa região.\nDica: Memorize o \"mapa de uso\" das curetas Gracey. A correta seleção da cureta é fundamental para uma raspagem eficaz e atraumática."}, {"enunciado": "Qual o ângulo correto de angulação da lâmina da cureta em relação à superfície radicular durante a Raspagem e Alisamento Radicular (RAR), uma vez que a ponta ativa atingiu o fundo da bolsa?", "alternativas": {"A": "0° (fechado)", "B": "Entre 10° e 30°", "C": "Entre 45° e 60°", "D": "Entre 70° e 80°", "E": "90°"}, "gabarito": "D", "comentario": "Na seção \"Técnica de Raspagem e Alisamento Radicular (RAR)\", o item \"2. Posicionamento\" especifica: \"Ao atingir o fundo da bolsa, angule a lâmina entre 70° e 80° em relação à superfície radicular. Abaixo de 45° = raspagem ineficaz; acima de 90° = trauma tecidual.\"\nDica: A angulação correta é crucial para a eficácia da raspagem e para evitar danos aos tecidos. Um ângulo muito fechado ou muito aberto compromete o sucesso do procedimento."}, {"enunciado": "Qual dos seguintes instrumentos é descrito como complementar ao manual, eficaz em bolsas profundas, com a vantagem de menos fadiga do operador e limitação de feedback tátil reduzido?", "alternativas": {"A": "McCall 13/14", "B": "Foice McCall 11/12", "C": "Curetas Gracey", "D": "Ultrassom (Piezoelétrico/Magnetoestritivo)", "E": "Sonda Nabers"}, "gabarito": "D", "comentario": "A seção \"Outros Instrumentos Importantes\" descreve o \"Ultrassom (Piezoelétrico/Magnetoestritivo)\" exatamente com essas características: \"Complementar ao manual. Eficaz em bolsas profundas. Vantagem: menos fadiga do operador. Limitação: feedback tátil reduzido.\" Os outros instrumentos são manuais e não possuem essas características específicas.\nDica: Conhecer as vantagens e limitações de cada instrumento é importante para a prática clínica e para questões de concurso."}, {"enunciado": "De acordo com o fluxo de exame clínico, qual etapa envolve a coleta de dados como Profundidade de Sondagem (PS), Nível de Inserção Clínica (NIC) e sangramento à sondagem em 6 sítios por dente?", "alternativas": {"A": "Anamnese Médica e Odontológica", "B": "Exame Extraoral e Intraoral", "C": "e sangramento à sondagem em 6 sítios por dente?", "D": "Periograma Completo (Sondagem Periodontal)", "E": "Exame Radiográfico"}, "gabarito": "D", "comentario": "A seção \"4. Fluxo do Exame Clínico (Diagnóstico Passo a Passo)\" detalha que o \"4. Periograma Completo (Sondagem Periodontal)\" é a etapa onde se \"Coleta em 6 sítios por dente (MV, V, DV, DP, P, MP): PS – Profundidade de Sondagem, NIC – Nível de Inserção Clínica, Recessão gengival, Sangramento à Sondagem (SS), Envolvimento de Furca (sonda Nabers), Mobilidade dental (Graus 1, 2, 3)\".\nDica: O periograma é o coração do diagnóstico periodontal. Compreender todos os dados coletados e sua importância é fundamental."}, {"enunciado": "O texto menciona que a pressão de sondagem recomendada durante o periograma completo é de aproximadamente:", "alternativas": {"A": "0,10 N", "B": "0,25 N", "C": "0,50 N", "D": "1,00 N", "E": "2,00 N"}, "gabarito": "B", "comentario": "Na seção \"Periograma Completo (Sondagem Periodontal)\", é especificado: \"Pressão de sondagem recomendada: 0,25 N (≈ 25 g).\"\nDica: A pressão de sondagem é um detalhe técnico importante que afeta a precisão das medições e pode ser cobrado em provas."}, {"enunciado": "Qual é a função do ligamento periodontal, conforme descrito na Anatomia do Periodonto?", "alternativas": {"A": "Formar uma barreira física e imunológica contra microrganismos.", "B": "Produzir cemento radicular.", "C": "Ancorar o dente ao osso e absorver forças mastigatórias.", "D": "Fornecer nutrição ao esmalte dentário.", "E": "Promover a formação de pontilhado em \"casca de laranja\"."}, "gabarito": "C", "comentario": "Na seção \"1.1 Divisões Funcionais\", o texto afirma que a função do \"Periodonto de Sustentação\" (que inclui o ligamento periodontal) é \"ancorar o dente ao osso e absorver forças mastigatórias.\" As outras opções descrevem funções da gengiva (periodonto de proteção) ou não são funções do ligamento periodontal.\nDica: Diferenciar as funções do periodonto de proteção e de sustentação é fundamental para entender a patologia periodontal."}, {"enunciado": "O que o texto sugere como a \"regra de ouro\" para o diagnóstico de periodontite?", "alternativas": {"A": "Apenas a presença de sangramento à sondagem.", "B": "Profundidade de sondagem aumentada em pelo menos 4 mm.", "C": "Confirmar perda de inserção clínica (NIC) com suporte radiográfico.", "D": "Apenas o relato do paciente sobre sangramento gengival.", "E": "Observação de edema e eritema gengival."}, "gabarito": "C", "comentario": "A \"Regra de ouro\" na seção \"Diagnóstico e Plano de Tratamento\" é clara: \"NUNCA atribua o diagnóstico de periodontite sem confirmar PERDA DE INSERÇÃO CLÍNICA (NIC) com suporte radiográfico. A sondagem isolada pode ser enganosa.\"\nDica: Esta regra é um ponto chave para um diagnóstico correto e evita erros comuns na clínica."}, {"enunciado": "Um paciente com gengivite induzida por biofilme apresenta sangramento à sondagem em qual porcentagem de sítios?", "alternativas": {"A": "Menos de 10%", "B": "≥ 10%", "C": "≥ 30%", "D": "≥ 50%", "E": "100%"}, "gabarito": "B", "comentario": "A descrição de \"Gengivite Induzida por Biofilme\" na seção \"2.1 Sequência Lógica de Progressão\" indica: \"Presença de SS (≥ 10% dos sítios), edema e eritema.\" A saúde periodontal tem sangramento em < 10% dos sítios.\nDica: O percentual de sítios com sangramento à sondagem é um critério importante para diferenciar saúde periodontal de gengivite."}, {"enunciado": "Qual das alternativas abaixo representa uma característica da gengiva saudável, conforme descrito na seção \"Anatomia do Periodonto\"?", "alternativas": {"A": "Cor avermelhada intensa.", "B": "Consistência mole e edematosa.", "C": "Superfície com pontilhado (\"casca de laranja\").", "D": "Sangramento espontâneo.", "E": "Perda de inserção clínica de 1-2 mm."}, "gabarito": "C", "comentario": "Na seção \"1.1 Divisões Funcionais\", ao descrever o periodonto de proteção, o texto menciona: \"Cor rosa-coral, consistência firme, superfície com pontilhado (\"casca de laranja\") em pacientes saudáveis.\" As outras opções são características de gengivite ou periodontite.\nDica: Conhecer as características clínicas da saúde periodontal é a base para identificar a doença."}, {"enunciado": "A comunicação com o paciente é destacada como crucial para a adesão ao tratamento. De acordo com o texto, qual a porcentagem do sucesso do tratamento que a higiene oral domiciliar do paciente representa?", "alternativas": {"A": "10%", "B": "25%", "C": "50%", "D": "75%", "E": "100%"}, "gabarito": "C", "comentario": "A introdução da seção \"6. Comunicação com o Paciente\" afirma: \"Lembre-se: o tratamento clínico representa apenas 50% do sucesso — a outra metade é a higiene oral domiciliar do paciente\".\nDica: Esta é uma informação crucial sobre a filosofia de tratamento periodontal, que enfatiza a participação ativa do paciente."}, {"enunciado": "Qual é a principal função da cureta universal McCall 13/14, conforme descrito no texto?", "alternativas": {"A": "Avaliação de furca.", "B": "Medição de profundidade de sondagem.", "C": "Remoção de cálculo subgengival em bolsas profundas.", "D": "Remoção de cálculo supragengival volumoso antes da RAR.", "E": "Raspagem das faces distais de dentes posteriores."}, "gabarito": "D", "comentario": "Na seção \"Outros Instrumentos Importantes\", a McCall 13/14 é descrita como uma \"Cureta universal: atua em todas as faces, principalmente supra-gengival. Ideal para remoção de cálculo supragengival volumoso antes da RAR.\"\nDica: As curetas universais são geralmente usadas para um desbridamento inicial de cálculo supragengival, enquanto as Gracey são mais específicas para o subgengival."}, {"enunciado": "A principal diferença entre gengivite e periodontite, de acordo com o texto, reside na:", "alternativas": {"A": "Presença de sangramento à sondagem.", "B": "Coloração e consistência da gengiva.", "C": "Presença de perda de inserção clínica (NIC) e perda óssea radiográfica.", "D": "Intensidade da dor relatada pelo paciente.", "E": "Reversibilidade da condição com a higiene oral."}, "gabarito": "C", "comentario": "O texto afirma explicitamente que \"A principal diferença entre gengivite e periodontite? ✔ A presença de perda de inserção clínica (NIC) e perda óssea radiográfica na periodontite. A gengivite é uma inflamação restrita à gengiva, sem perda de suporte, e é reversível.\" As outras opções são características que podem estar presentes em ambas as condições ou são menos definidoras da diferença fundamental entre elas. A perda de inserção e óssea é o marco da periodontite."}, {"enunciado": "Para um paciente diagnosticado com Gengivite induzida por biofilme, generalizada, qual o plano de tratamento inicial recomendado no Caso 1?", "alternativas": {"A": "Raspagem subgengival e cirurgia periodontal.", "B": "Controle do tabagismo e DM, seguido de TPNC.", "C": "IHO (instrução de higiene oral), raspagem supragengival e profilaxia.", "D": "Reabilitação protética complexa.", "E": "Extrações de dentes com mobilidade."}, "gabarito": "C", "comentario": "O \"Caso 1: Gengivite Induzida por Biofilme\" descreve o plano de tratamento como \"IHO (instrução de higiene oral), raspagem supragengival, profilaxia. Reavaliação em 15 dias.\" As outras opções são tratamentos para condições mais avançadas ou não são o tratamento inicial para gengivite."}, {"enunciado": "Qual dos seguintes fatores é um modificador de Grau C para periodontite, segundo o texto?", "alternativas": {"A": "DM tipo 2 controlado (HbA1c 6,5%).", "B": "Tabagismo (5 cigarros/dia há 10 anos).", "C": "Tabagismo (20 cigarros/dia há 40 anos).", "D": "Ausência de perda dentária.", "E": "Perda óssea radiográfica horizontal em 20% dos dentes."}, "gabarito": "C", "comentario": "O texto, no item Q8, afirma que \"Tabagistas ≥ 10 cigarros/dia classificam a doença como Grau C.\" O Caso 3 descreve um paciente com \"Tabagista (20 cigarros/dia há 40 anos)\", o que se encaixa perfeitamente na definição de Grau C. O DM tipo 2 controlado (HbA1c 6,5%) é um fator de risco, mas não necessariamente Grau C se não for descompensado. O tabagismo de 5 cigarros/dia por 10 anos, embora seja um fator de risco, não atinge o limiar para Grau C conforme a definição do texto."}, {"enunciado": "Em relação à afiação de instrumentos periodontais, como curetas e foices, o texto alerta que instrumentos cegos:", "alternativas": {"A": "Causam menos trauma aos tecidos moles.", "B": "Escorregam e polêm o cálculo, não o removem.", "C": "São ideais para raspagem subgengival delicada.", "D": "Aumentam a eficácia da remoção de cálculo.", "E": "Podem ser usados por períodos mais longos sem necessidade de afiação."}, "gabarito": "B", "comentario": "O texto é claro ao afirmar: \"Afiação: Curetas e foices devem estar sempre afiadas para remover o cálculo de forma eficaz e sem causar trauma. Instrumentos cegos escorregam e polêm o cálculo, não o removem.\" A manutenção da afiação é c
